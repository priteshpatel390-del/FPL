steps:
  - name: Apply accepted source and documentation correction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          app_path=Path('app.html')
          app=app_path.read_text(encoding='utf-8')
          rule="html{-webkit-text-size-adjust:100%;text-size-adjust:100%}"
          if rule not in app:
              needle="*{box-sizing:border-box}\n"
              if needle not in app:
                  raise SystemExit('CSS insertion point missing')
              app=app.replace(needle,needle+rule+'\n',1)
              app_path.write_text(app,encoding='utf-8')

          test_path=Path('tests/player-detail-scroll-rotation.test.mjs')
          tests=test_path.read_text(encoding='utf-8')
          marker='iOS automatic text inflation is fixed at 100% across rotation'
          if marker not in tests:
              tests += """\n\ntest('iOS automatic text inflation is fixed at 100% across rotation',()=>{\n  const root = ruleBody(app,'html');\n  assert.match(root,/-webkit-text-size-adjust:100%/);\n  assert.match(root,/(?:^|;)text-size-adjust:100%/);\n});\n"""
              test_path.write_text(tests,encoding='utf-8')

          def append_once(path,marker,text):
              p=Path(path)
              value=p.read_text(encoding='utf-8')
              if marker not in value:
                  p.write_text(value.rstrip()+"\n\n"+dedent(text).strip()+"\n",encoding='utf-8')

          append_once('docs/UX-A2-SCOPE.md','UX-A2-OWNER-ACCEPTANCE-2026-08-06','''
          ## Owner acceptance — 6 August 2026

          <!-- UX-A2-OWNER-ACCEPTANCE-2026-08-06 -->

          Pritesh completed the populated physical iPhone Safari review. Background locking, internal scrolling, final-section and close-button reachability, exact background-position restoration, repeat opening at the top, backdrop closing and portrait/landscape rotation passed.

          The first orientation cycle exposed Safari text enlargement after portrait → landscape → portrait. The production correction sets `-webkit-text-size-adjust:100%` and `text-size-adjust:100%` on the root. Pritesh retested and confirmed it worked perfectly, with scrolling and closing still intact.

          A more concise Player Detail hierarchy is a separate future proposal and is excluded from UX-A2.
          ''')

          append_once('docs/TESTING.md','UX-A2-ACCEPTANCE-PASSED-2026-08-06','''
          ## UX-A2 physical iPhone Safari acceptance

          <!-- UX-A2-ACCEPTANCE-PASSED-2026-08-06 -->

          **Passed by Pritesh on 6 August 2026.** The accepted device review covered background lock, modal-only scrolling, final-content and close-control reachability, rotation, stable portrait text scale after the correction, exact background-position restoration, reopen-at-top and backdrop close. VoiceOver is not a project acceptance requirement.
          ''')

          append_once('docs/KNOWN_LIMITATIONS.md','UX-A2-UI13-CLOSED-2026-08-06','''
          ## UX-A2 limitation disposition

          <!-- UX-A2-UI13-CLOSED-2026-08-06 -->

          `UI-13` is **CLOSED — owner accepted 6 August 2026**. The observed orientation-driven text inflation was corrected and passed physical iPhone Safari retest. A possible future reduction in Player Detail information density is a separate product-design proposal, not an unresolved UX-A2 defect.
          ''')

          append_once('docs/ROADMAP.md','UX-A2-ACCEPTED-2026-08-06','''
          ## UX-A2 acceptance update — 6 August 2026

          <!-- UX-A2-ACCEPTED-2026-08-06 -->

          UX-A2 passed populated physical iPhone Safari review after the observed text-inflation defect was corrected and retested. Merge remains subject to Pritesh's explicit approval. Concise Player Detail information hierarchy is a separate future proposal.
          ''')

          append_once('docs/PROJECT_CONTEXT.md','UX-A2-ACCEPTED-CONTEXT-2026-08-06','''
          ## UX-A2 accepted review state — 6 August 2026

          <!-- UX-A2-ACCEPTED-CONTEXT-2026-08-06 -->

          Player Detail has accepted iPhone Safari behaviour for internal scrolling, background lock, exact normal-close restoration, compact landscape, safe areas and stable text scale across rotation. PR #76 remains draft and unmerged pending explicit owner approval. No concise-detail redesign is included.
          ''')

          claude_path=Path('CLAUDE.md')
          claude=claude_path.read_text(encoding='utf-8')
          old="Automated verification is **643 passed, 0 failed, 0 skipped** with deterministic exact-identity builds and root/deployable equality. Populated physical iPhone Safari acceptance is **pending**;"
          new="Automated verification is **644 passed, 0 failed, 0 skipped** with deterministic exact-identity builds and root/deployable equality. Populated physical iPhone Safari acceptance passed on 6 August 2026 after an observed orientation-driven text-inflation defect was corrected and retested;"
          if old in claude:
              claude=claude.replace(old,new,1)
          boundary='UX-A2-CONCISE-DETAIL-BOUNDARY-2026-08-06'
          if boundary not in claude:
              claude += "\n\n<!-- UX-A2-CONCISE-DETAIL-BOUNDARY-2026-08-06 -->\n> **Boundary:** making Player Detail more concise is a separate future information-density and hierarchy item. It is not implemented in UX-A2 and requires investigation and explicit approval.\n"
          claude_path.write_text(claude,encoding='utf-8')
          PY

          rm -f review/ux-a2-player-detail-preview.html review/ux-a2-player-detail-preview-v2.html
          rmdir review 2>/dev/null || true
          rm .github/workflows/ux-a2-apply.yml
          git config user.name "Teamsheet UX-A2 Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Complete UX-A2 iPhone acceptance correction"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

  - name: Run complete repository tests
        run: |
          set -euo pipefail
          ./run-tests.sh | tee /tmp/ux-a2-tests.log
          grep -q '^# pass 644$' /tmp/ux-a2-tests.log
          grep -q '^# fail 0$' /tmp/ux-a2-tests.log
          grep -q '^# skipped 0$' /tmp/ux-a2-tests.log

  - name: Build first exact-identity output
        run: |
          set -euo pipefail
          rm -rf /tmp/ux-a2-build-a /tmp/ux-a2-build-b
          mkdir -p /tmp/ux-a2-build-a /tmp/ux-a2-build-b
          BUILD_COMMIT="$SOURCE_SHA" node build.mjs
          cp dist/app.bundle.js /tmp/ux-a2-build-a/app.bundle.js
          cp dist/index.html /tmp/ux-a2-build-a/dist-index.html
          cp dist/manifest.json /tmp/ux-a2-build-a/manifest.json
          cp index.html /tmp/ux-a2-build-a/root-index.html

  - name: Build second exact-identity output
        run: |
          set -euo pipefail
          BUILD_COMMIT="$SOURCE_SHA" node build.mjs
          cp dist/app.bundle.js /tmp/ux-a2-build-b/app.bundle.js
          cp dist/index.html /tmp/ux-a2-build-b/dist-index.html
          cp dist/manifest.json /tmp/ux-a2-build-b/manifest.json
          cp index.html /tmp/ux-a2-build-b/root-index.html

  - name: Compare deterministic outputs
        run: |
          set -euo pipefail
          cmp /tmp/ux-a2-build-a/app.bundle.js /tmp/ux-a2-build-b/app.bundle.js
          cmp /tmp/ux-a2-build-a/dist-index.html /tmp/ux-a2-build-b/dist-index.html
          cmp /tmp/ux-a2-build-a/manifest.json /tmp/ux-a2-build-b/manifest.json
          cmp /tmp/ux-a2-build-a/root-index.html /tmp/ux-a2-build-b/root-index.html
          cmp dist/index.html index.html
          sha256sum dist/app.bundle.js dist/index.html dist/manifest.json index.html | tee /tmp/ux-a2-sha256.txt

  - name: Commit generated production output
        run: |
          set -euo pipefail
          git add dist/app.bundle.js dist/index.html dist/manifest.json index.html
          git commit -m "Build accepted UX-A2 correction"
          echo "GENERATED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

  - name: Verify final branch shape
        run: |
          set -euo pipefail
          test ! -e .github/workflows/ux-a2-apply.yml
          test ! -e .github/ux-a2-payload.yml
          test ! -d review
          grep -q 'text-size-adjust:100%' app.html
          grep -q 'iOS automatic text inflation is fixed at 100% across rotation' tests/player-detail-scroll-rotation.test.mjs
          grep -q "$SOURCE_SHA" dist/manifest.json

  - name: Push verified commits
        run: |
          set -euo pipefail
          git push origin HEAD:agent/ux-a2-player-detail-scroll-rotation
