          detail_doc=f"""# UX-A2 — Player Detail Scroll and Rotation Correction

Status: **implemented for draft review; physical populated iPhone Safari acceptance pending.**
Approval: Pritesh approved the exact investigation proposal on 6 August 2026.
Base `main`: `2738a0500b9be20a723f0940df0a93766b29c05d`.
Branch: `{branch}`.
Reviewed source commit: `{source}`.
Automated verification: **{tests} passed, 0 failed, 0 skipped**.

## Practical outcome

Player Detail now opens at the top for every player, scrolls within its own body, keeps the page behind it fixed and restores the exact underlying position when normally closed. Rotation and short landscape viewports retain a reachable close control, scrollable content and four-sided iPhone safe-area protection.

## Implemented behaviour

- preserves the existing non-route `role=dialog` surface and all current Player Detail information;
- records background X/Y coordinates on first open;
- applies the open lock to both `html` and `body` through stylesheet classes;
- resets the internal detail scroller to zero for every opening;
- restores exact background coordinates on close-button, backdrop or Escape closure;
- restores focus to the originating player button with `preventScroll`;
- releases locks without restoring stale coordinates or focus before an app route change, leaving route focus and scroll restoration to `app-shell.mjs`;
- contains backdrop and detail overscroll;
- adds `vh` fallback followed by `dvh`, explicit flex shrink, four-sided safe-area padding and compact landscape rules;
- preserves browser Back and deep-link behaviour: Player Detail remains a dialog and does not add URL or history identity.

## Automated evidence

`./run-tests.sh` completed **{tests} passed, 0 failed, 0 skipped** against source `{source}`. Two exact-identity production builds were byte-identical for `dist/app.bundle.js`, `dist/index.html`, `dist/manifest.json` and root `index.html`; root `index.html` equals `dist/index.html`.

Generated SHA-256 evidence:

- `dist/app.bundle.js`: `{bundle}`
- `dist/index.html`: `{html}`
- `dist/manifest.json`: `{manifest}`
- root `index.html`: `{html}`

Automated tests protect state transitions, lock classes, saved coordinates, fresh-open position, focus restoration, route closure, no modal history and static responsive CSS contracts. They do not prove real Safari toolbar animation, momentum scrolling, touch transfer, rotation rendering or notch clearance.

## Physical iPhone Safari acceptance

1. Scroll Team until a player card is mid-screen, open and close Player Detail, and confirm the card returns to the same position.
2. Scroll from the player identity to the final projection section in portrait; the close button must remain reachable.
3. Close after scrolling to the bottom, open the same and a different player, and confirm both start at the top.
4. Expand and collapse Safari chrome while open; content and close control must remain reachable.
5. Rotate portrait to landscape and back while open; content must remain scrollable and clear of every safe area.
6. Close after rotation and confirm the background is unlocked at its original position.
7. Open Player Detail and use browser Back; the previous route must appear with no remaining modal or scroll lock.
8. Repeat from direct Team and Player Explorer deep links.

VoiceOver testing is not required. Standard labels, keyboard focus containment, Escape, focus restoration, reduced motion, semantic buttons and 44-pixel controls remain preserved.

## Exact exclusions

No Player Detail data redesign; no new statistics; no projection, expected-minutes, scoring, fixture, simulation, captaincy, squad, bench, transfer, rank or Mini-League change; no provider, Cloudflare, authentication or persistence change; no Player Detail URL route; no UX-A3, Track B or unrelated visual redesign.

## Merge gate

Do not merge until Pritesh completes the physical iPhone Safari script, explicitly approves the result and confirms the draft PR may merge.
"""
