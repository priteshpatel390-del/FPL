name: Stage 10.5 final verification
on:
  push:
    branches: [agent/stage10-5-hardening-documentation]
    paths: [.github/workflows/stage10-5-verify.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage10-5-hardening-documentation
          fetch-depth: 0
      - name: Resolve immutable source identity
        id: source
        run: |
          SOURCE_SHA=$(git log -1 --format=%H -- src)
          test -n "$SOURCE_SHA"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Run full suite and deterministic builds
        id: checks
        shell: bash
        run: |
          set -o pipefail
          SOURCE_SHA="${{ steps.source.outputs.sha }}"
          rm -rf /tmp/stage10-5-a /tmp/stage10-5-b
          mkdir -p /tmp/stage10-5-a /tmp/stage10-5-b
          BUILD_COMMIT="$SOURCE_SHA" ./run-tests.sh 2>&1 | tee /tmp/stage10-5-tests.log
          cp dist/index.html dist/app.bundle.js dist/manifest.json /tmp/stage10-5-a/
          BUILD_COMMIT="$SOURCE_SHA" node build.mjs 2>&1 | tee /tmp/stage10-5-build.log
          cp dist/index.html dist/app.bundle.js dist/manifest.json /tmp/stage10-5-b/
          cmp /tmp/stage10-5-a/index.html /tmp/stage10-5-b/index.html
          cmp /tmp/stage10-5-a/app.bundle.js /tmp/stage10-5-b/app.bundle.js
          cmp /tmp/stage10-5-a/manifest.json /tmp/stage10-5-b/manifest.json
          cmp index.html dist/index.html
          TESTS=$(sed -n 's/^# tests //p' /tmp/stage10-5-tests.log | tail -1)
          PASS=$(sed -n 's/^# pass //p' /tmp/stage10-5-tests.log | tail -1)
          FAIL=$(sed -n 's/^# fail //p' /tmp/stage10-5-tests.log | tail -1)
          SKIP=$(sed -n 's/^# skipped //p' /tmp/stage10-5-tests.log | tail -1)
          test -n "$TESTS" && test "$TESTS" = "$PASS"
          test "${FAIL:-0}" = "0" && test "${SKIP:-0}" = "0"
          SOURCE_HASH=$(node -e "const m=JSON.parse(require('fs').readFileSync('dist/manifest.json'));process.stdout.write(m.sourceHash)")
          MANIFEST_COMMIT=$(node -e "const m=JSON.parse(require('fs').readFileSync('dist/manifest.json'));process.stdout.write(m.commit)")
          test "$MANIFEST_COMMIT" = "$SOURCE_SHA"
          HTML_BYTES=$(wc -c < dist/index.html | tr -d ' ')
          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"
          echo "source_hash=$SOURCE_HASH" >> "$GITHUB_OUTPUT"
          echo "html_bytes=$HTML_BYTES" >> "$GITHUB_OUTPUT"
      - name: Finalise documentation and remove temporary machinery
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          TESTS: ${{ steps.checks.outputs.tests }}
          SOURCE_HASH: ${{ steps.checks.outputs.source_hash }}
          HTML_BYTES: ${{ steps.checks.outputs.html_bytes }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          values={'__SOURCE_COMMIT__':os.environ['SOURCE_SHA'],'__TEST_COUNT__':os.environ['TESTS'],'__SOURCE_HASH__':os.environ['SOURCE_HASH'],'__HTML_BYTES__':os.environ['HTML_BYTES']}
          for name in ['CLAUDE.md','docs/PROJECT_CONTEXT.md','docs/ROADMAP.md','docs/TESTING.md','docs/STAGE10-DESIGN.md','docs/STAGE10-ITEM5.md']:
              p=Path(name);text=p.read_text()
              for old,new in values.items(): text=text.replace(old,new)
              p.write_text(text)
          PY
          rm -f .github/workflows/stage10-5-implement.yml .github/workflows/stage10-5-fix.yml .github/workflows/stage10-5-verify.yml
          rm -rf .stage10-5
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Verify Stage 10.5 hardening"
          export GENERATED_SHA=$(git rev-parse HEAD)
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path('docs/STAGE10-ITEM5.md')
          p.write_text(p.read_text().replace('__GENERATED_COMMIT__',os.environ['GENERATED_SHA']))
          PY
          git add docs/STAGE10-ITEM5.md
          git commit -m "Document Stage 10.5 verification"
          git push origin HEAD:agent/stage10-5-hardening-documentation
