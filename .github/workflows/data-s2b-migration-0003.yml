# DATA-S2B migration 0003 — dedicated, manual-only production application.
#
# This workflow can apply exactly one repository-owned migration: the reviewed
# `0003_production_query_plan_indexes.sql`. It is not a generic migration executor. It accepts no
# SQL, no migration path, no migration version and no table or index name. It never invokes
# production collection or the first-run resume, never changes a schedule, Cron trigger, Worker
# version, deployment, route, domain, Access policy or secret, and never runs a live
# `EXPLAIN QUERY PLAN`. Every repository and CI gate completes in a job that has no protected
# environment and no Cloudflare credentials, before the credentialled job can start.
name: DATA-S2B Migration 0003

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact current main commit approved for DATA-S2B migration 0003 only
        required: true
        type: string

permissions:
  contents: read
  checks: read

# Shares the production collection group so a migration can never run beside a collection or a
# first-run resume.
concurrency:
  group: data-s2-production-collection
  cancel-in-progress: false

jobs:
  repository-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      approved_sha: ${{ steps.identity.outputs.approved_sha }}
    steps:
      - name: Validate approved SHA before checkout
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = workflow_dispatch
          test "$EVENT_REF" = refs/heads/main
          test "$EVENT_REPOSITORY" = priteshpatel390-del/FPL
          printf '%s' "$APPROVED_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - name: Check out exact approved revision
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Gate exact current main and clean tree
        id: identity
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          remote_main="$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)"
          test -n "$remote_main"
          test "$remote_main" = "$APPROVED_SHA"
          test -z "$(git status --porcelain)"
          echo "approved_sha=$APPROVED_SHA" >> "$GITHUB_OUTPUT"

      - name: Require exact-head Verify Teamsheet success
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/check-runs.json"
          http="$(curl --silent --output "$response" --write-out '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/priteshpatel390-del/FPL/commits/$APPROVED_SHA/check-runs")"
          test "$http" = 200
          node --input-type=module - "$response" <<'EOF'
          import fs from 'node:fs';
          const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const matches=(body.check_runs??[]).filter(row=>row.name==='Tests and deterministic build'&&row.status==='completed'&&row.conclusion==='success'&&row.head_sha===process.env.APPROVED_SHA&&row.app?.slug==='github-actions'&&row.details_url?.startsWith('https://github.com/priteshpatel390-del/FPL/actions/runs/'));
          if(matches.length<1)throw new Error('exact-head Verify Teamsheet success is absent');
          EOF
          rm -f "$response"
          test -z "$(git status --porcelain)"

  migration-0003:
    needs: repository-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: data-s2-production-collection
    env:
      APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
      CLOUDFLARE_PRODUCTION_ACCOUNT_FINGERPRINT: ${{ vars.CLOUDFLARE_PRODUCTION_ACCOUNT_FINGERPRINT }}
      CLOUDFLARE_PRODUCTION_D1_ID: ${{ vars.CLOUDFLARE_PRODUCTION_D1_ID }}
    steps:
      - name: Check out gated approved revision
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.repository-gate.outputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.19.0

      - name: Reconfirm identity and apply migration 0003 only
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test -z "$(git status --porcelain)"
          rm -f node_modules/.bin/wrangler
          rm -rf node_modules/wrangler node_modules/.wrangler-*
          node workers/data-platform/run-migration-0003.mjs
