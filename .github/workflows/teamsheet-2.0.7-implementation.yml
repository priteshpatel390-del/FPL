name: Finalise Teamsheet 2.0.7

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply approved scope
        run: |
          base64 -d scripts/apply-teamsheet-2.0.7.mjs.gz.b64 | gunzip > /tmp/apply-teamsheet-2.0.7.mjs
          node /tmp/apply-teamsheet-2.0.7.mjs

      - name: Commit reviewed source and tests
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html \
            src/main.mjs \
            src/ui/app-shell.mjs \
            src/ui/player-detail.mjs \
            src/ui/views.mjs \
            src/ui/mini-leagues-view.mjs \
            src/ui/transfer-optimiser-view.mjs \
            tests/final-mobile-polish.test.mjs
          git diff --cached --check
          git commit -m 'Implement Teamsheet 2.0.7 mobile polish'
          SOURCE_SHA=$(git rev-parse HEAD)
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Run complete test suite
        id: tests
        shell: bash
        env:
          BUILD_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          chmod +x ./run-tests.sh
          ./run-tests.sh 2>&1 | tee /tmp/teamsheet-tests.log
          TEST_COUNT=$(awk '/^# pass /{print $3}' /tmp/teamsheet-tests.log | tail -1)
          if [ -z "$TEST_COUNT" ]; then
            echo 'Could not determine passing test count' >&2
            exit 1
          fi
          echo "count=$TEST_COUNT" >> "$GITHUB_OUTPUT"

      - name: Verify deterministic exact-identity production builds
        shell: bash
        env:
          BUILD_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          rm -rf /tmp/teamsheet-build-one /tmp/teamsheet-build-two
          mkdir -p /tmp/teamsheet-build-one /tmp/teamsheet-build-two

          node build.mjs
          cp index.html /tmp/teamsheet-build-one/index.html
          cp dist/index.html /tmp/teamsheet-build-one/dist-index.html
          cp dist/app.bundle.js /tmp/teamsheet-build-one/app.bundle.js
          cp dist/manifest.json /tmp/teamsheet-build-one/manifest.json

          node build.mjs
          cp index.html /tmp/teamsheet-build-two/index.html
          cp dist/index.html /tmp/teamsheet-build-two/dist-index.html
          cp dist/app.bundle.js /tmp/teamsheet-build-two/app.bundle.js
          cp dist/manifest.json /tmp/teamsheet-build-two/manifest.json

          cmp /tmp/teamsheet-build-one/index.html /tmp/teamsheet-build-two/index.html
          cmp /tmp/teamsheet-build-one/dist-index.html /tmp/teamsheet-build-two/dist-index.html
          cmp /tmp/teamsheet-build-one/app.bundle.js /tmp/teamsheet-build-two/app.bundle.js
          cmp /tmp/teamsheet-build-one/manifest.json /tmp/teamsheet-build-two/manifest.json
          cmp index.html dist/index.html
          node - <<'NODE'
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync('dist/manifest.json','utf8'));
          const expected=process.env.BUILD_COMMIT;
          if(manifest.commit!==expected) throw new Error(`manifest commit ${manifest.commit} != ${expected}`);
          if(manifest.modelVersion!=='2.4.0') throw new Error('model version changed');
          if(manifest.rulesVersion!=='2026-27.3') throw new Error('rules version changed');
          if(!/^[0-9a-f]{64}$/.test(manifest.sourceHash)) throw new Error('source hash missing');
          NODE

      - name: Commit reviewed generated artefacts
        id: generated
        shell: bash
        run: |
          set -euo pipefail
          git add app.js dist/app.bundle.js dist/index.html dist/manifest.json index.html
          git diff --cached --check
          git commit -m 'Build Teamsheet 2.0.7 deployable'
          GENERATED_SHA=$(git rev-parse HEAD)
          echo "sha=$GENERATED_SHA" >> "$GITHUB_OUTPUT"

      - name: Finalise canonical documentation and remove temporary workflow
        shell: bash
        env:
          TEST_COUNT: ${{ steps.tests.outputs.count }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          GENERATED_SHA: ${{ steps.generated.outputs.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          for path in [
              'CLAUDE.md','docs/PROJECT_CONTEXT.md','docs/ARCHITECTURE.md','docs/DECISIONS.md',
              'docs/ROADMAP.md','docs/KNOWN_LIMITATIONS.md','docs/SECURITY.md','docs/TESTING.md',
              'docs/CHANGELOG.md','docs/STAGE_HISTORY.md','docs/TEAMSHEET2-ITEM7.md']:
              p=Path(path)
              text=p.read_text()
              text=text.replace('__TEST_COUNT__',os.environ['TEST_COUNT'])
              text=text.replace('__SOURCE_COMMIT__',os.environ['SOURCE_SHA'])
              text=text.replace('__GENERATED_COMMIT__',os.environ['GENERATED_SHA'])
              p.write_text(text)
          PY
          rm -f scripts/apply-teamsheet-2.0.7.mjs.gz.b64 .github/workflows/teamsheet-2.0.7-implementation.yml
          git add CLAUDE.md docs scripts .github/workflows
          git diff --cached --check
          git commit -m 'Document Teamsheet 2.0.7 verification'

      - name: Push finalised implementation branch
        run: git push origin HEAD:${GITHUB_HEAD_REF}
