name: Finalise Teamsheet 2.0.7

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve reviewed source identity
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-list -1 HEAD -- app.html src tests)
          test -n "$SOURCE_SHA"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Run complete test suite
        id: tests
        continue-on-error: true
        shell: bash
        env:
          BUILD_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          set +e
          chmod +x ./run-tests.sh
          ./run-tests.sh > /tmp/teamsheet-tests.txt 2>&1
          STATUS=$?
          cat /tmp/teamsheet-tests.txt
          COUNT=$(awk '/^# pass /{print $3}' /tmp/teamsheet-tests.txt | tail -1)
          echo "count=${COUNT:-0}" >> "$GITHUB_OUTPUT"
          exit "$STATUS"

      - name: Record exact test failure
        if: always() && steps.tests.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp /tmp/teamsheet-tests.txt docs/TEAMSHEET2-ITEM7-TEST-FAILURE.txt
          git add -f docs/TEAMSHEET2-ITEM7-TEST-FAILURE.txt
          git commit -m 'Record Teamsheet 2.0.7 test failure'
          git push origin HEAD:${GITHUB_HEAD_REF}
          exit 1

      - name: Require verified pass count
        if: steps.tests.outcome == 'success'
        run: test "${{ steps.tests.outputs.count }}" != '0'

      - name: Verify deterministic exact-identity builds
        if: steps.tests.outcome == 'success'
        shell: bash
        env:
          BUILD_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          rm -rf /tmp/build-one /tmp/build-two
          mkdir -p /tmp/build-one /tmp/build-two
          node build.mjs
          cp index.html /tmp/build-one/index.html
          cp dist/index.html /tmp/build-one/dist-index.html
          cp dist/app.bundle.js /tmp/build-one/app.bundle.js
          cp dist/manifest.json /tmp/build-one/manifest.json
          node build.mjs
          cp index.html /tmp/build-two/index.html
          cp dist/index.html /tmp/build-two/dist-index.html
          cp dist/app.bundle.js /tmp/build-two/app.bundle.js
          cp dist/manifest.json /tmp/build-two/manifest.json
          cmp /tmp/build-one/index.html /tmp/build-two/index.html
          cmp /tmp/build-one/dist-index.html /tmp/build-two/dist-index.html
          cmp /tmp/build-one/app.bundle.js /tmp/build-two/app.bundle.js
          cmp /tmp/build-one/manifest.json /tmp/build-two/manifest.json
          cmp index.html dist/index.html
          node - <<'NODE'
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync('dist/manifest.json','utf8'));
          if(manifest.commit!==process.env.BUILD_COMMIT) throw new Error('manifest commit mismatch');
          if(manifest.modelVersion!=='2.4.0') throw new Error('model version changed');
          if(manifest.rulesVersion!=='2026-27.3') throw new Error('rules version changed');
          if(!/^[0-9a-f]{64}$/.test(manifest.sourceHash)) throw new Error('source hash missing');
          NODE

      - name: Commit generated deployable
        if: steps.tests.outcome == 'success'
        id: generated
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js dist/app.bundle.js dist/index.html dist/manifest.json index.html
          git diff --cached --check
          git commit -m 'Build Teamsheet 2.0.7 deployable'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Finalise canonical documentation
        if: steps.tests.outcome == 'success'
        shell: bash
        env:
          TEST_COUNT: ${{ steps.tests.outputs.count }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          GENERATED_SHA: ${{ steps.generated.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import os
          from pathlib import Path
          paths=['CLAUDE.md','docs/PROJECT_CONTEXT.md','docs/ARCHITECTURE.md','docs/DECISIONS.md','docs/ROADMAP.md','docs/KNOWN_LIMITATIONS.md','docs/SECURITY.md','docs/TESTING.md','docs/CHANGELOG.md','docs/STAGE_HISTORY.md','docs/TEAMSHEET2-ITEM7.md']
          for path in paths:
              p=Path(path)
              text=p.read_text()
              text=text.replace('__TEST_COUNT__',os.environ['TEST_COUNT'])
              text=text.replace('__SOURCE_COMMIT__',os.environ['SOURCE_SHA'])
              text=text.replace('__GENERATED_COMMIT__',os.environ['GENERATED_SHA'])
              p.write_text(text)
          PY
          rm -f scripts/apply-teamsheet-2.0.7.mjs.gz.b64 scripts/teamsheet-2.0.7-run-trigger.txt .github/workflows/teamsheet-2.0.7-implementation.yml docs/TEAMSHEET2-ITEM7-TEST-FAILURE.txt
          git add CLAUDE.md docs scripts .github/workflows
          git diff --cached --check
          git commit -m 'Document Teamsheet 2.0.7 verification'

      - name: Push finalised branch
        if: steps.tests.outcome == 'success'
        run: git push origin HEAD:${GITHUB_HEAD_REF}
