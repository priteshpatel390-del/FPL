name: Stage 10.2 final verification

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: stage10-2-final-verification
  cancel-in-progress: false

jobs:
  verify-and-finalise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/stage10-2-official-outcomes

      - name: Apply focused integrity corrections
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          outcome=Path('src/evidence/outcome.mjs')
          text=outcome.read_text()
          old="""  const outcomeDataHash=await sha256Hex(stableStringify(outcomeDataMaterial(payload)),cryptoImpl);
            if(previousRecord?.identity?.outcomeDataHash===outcomeDataHash&&previousRecord.status===payload.status) return {unchanged:true,record:previousRecord};
            let status=payload.status;
            if([OUTCOME_STATUSES.COMPLETE,OUTCOME_STATUSES.CORRECTED].includes(previousRecord?.status)&&payload.status===OUTCOME_STATUSES.COMPLETE&&previousRecord.identity?.outcomeDataHash!==outcomeDataHash) status=OUTCOME_STATUSES.CORRECTED;
            const revision=Math.max(0,Number(previousRecord?.identity?.revision)||0)+1;
          """.replace('            ','  ')
          new="""  const candidateDataHash=await sha256Hex(stableStringify(outcomeDataMaterial(payload)),cryptoImpl);
            if(previousRecord?.identity?.outcomeDataHash===candidateDataHash&&previousRecord.status===payload.status) return {unchanged:true,record:previousRecord};
            let status=payload.status;
            if([OUTCOME_STATUSES.COMPLETE,OUTCOME_STATUSES.CORRECTED].includes(previousRecord?.status)&&payload.status===OUTCOME_STATUSES.COMPLETE&&previousRecord.identity?.outcomeDataHash!==candidateDataHash) status=OUTCOME_STATUSES.CORRECTED;
            const outcomeDataHash=status===payload.status?candidateDataHash:await sha256Hex(stableStringify(outcomeDataMaterial({...payload,status})),cryptoImpl);
            const revision=Math.max(0,Number(previousRecord?.identity?.revision)||0)+1;
          """.replace('            ','  ')
          if old not in text:
              raise SystemExit('Outcome correction anchor not found')
          outcome.write_text(text.replace(old,new,1))

          test_path=Path('tests/outcome-collection.test.mjs')
          test_text=test_path.read_text()
          old_test="setup(1); S.teamId='1234567';"
          if old_test not in test_text:
              raise SystemExit('Privacy sentinel anchor not found')
          test_path.write_text(test_text.replace(old_test,"setup(1); S.teamId='9988776655';",1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/evidence/outcome.mjs tests/outcome-collection.test.mjs
          git diff --cached --check
          git commit -m "Fix Stage 10.2 outcome integrity checks"

      - name: Full Stage 10.2 verification
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse HEAD)
          BUILD_COMMIT="$SOURCE_SHA" ./run-tests.sh | tee /tmp/stage10-2-first.log
          TEST_COUNT=$(awk '/^# tests /{print $3}' /tmp/stage10-2-first.log | tail -1)
          test -n "$TEST_COUNT"
          test "$TEST_COUNT" -gt 349
          echo "TEST_COUNT=$TEST_COUNT" >> "$GITHUB_ENV"

      - name: Record verified baseline and remove temporary runner
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          count=os.environ['TEST_COUNT']
          changed=[]
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.parts[0]=='dist':
                  continue
              try:
                  text=path.read_text()
              except UnicodeDecodeError:
                  continue
              if '__TEST_COUNT__' in text:
                  path.write_text(text.replace('__TEST_COUNT__',count))
                  changed.append(str(path))
          if not changed:
              raise SystemExit('No Stage 10.2 test-count placeholders were found')
          print('\n'.join(changed))
          PY
          rm -f .github/workflows/stage10-2-finalise.yml
          git add -A
          git diff --cached --check
          git commit -m "Record Stage 10.2 verification baseline"

      - name: Final exact-identity verification
        run: |
          set -euo pipefail
          FINAL_SOURCE_SHA=$(git rev-parse HEAD)
          echo "FINAL_SOURCE_SHA=$FINAL_SOURCE_SHA" >> "$GITHUB_ENV"
          BUILD_COMMIT="$FINAL_SOURCE_SHA" ./run-tests.sh | tee /tmp/stage10-2-final.log
          FINAL_TEST_COUNT=$(awk '/^# tests /{print $3}' /tmp/stage10-2-final.log | tail -1)
          test "$FINAL_TEST_COUNT" = "$TEST_COUNT"
          mkdir -p /tmp/stage10-2-build-a
          cp dist/index.html /tmp/stage10-2-build-a/index.html
          cp dist/app.bundle.js /tmp/stage10-2-build-a/app.bundle.js
          cp dist/manifest.json /tmp/stage10-2-build-a/manifest.json
          cp index.html /tmp/stage10-2-build-a/root-index.html
          BUILD_COMMIT="$FINAL_SOURCE_SHA" node build.mjs
          cmp /tmp/stage10-2-build-a/index.html dist/index.html
          cmp /tmp/stage10-2-build-a/app.bundle.js dist/app.bundle.js
          cmp /tmp/stage10-2-build-a/manifest.json dist/manifest.json
          cmp /tmp/stage10-2-build-a/root-index.html index.html
          cmp index.html dist/index.html
          node --check dist/app.bundle.js
          grep -Fq "\"commit\": \"$FINAL_SOURCE_SHA\"" dist/manifest.json
          git diff --check

      - name: Commit and publish verified generated artefacts
        run: |
          set -euo pipefail
          git add dist/index.html dist/app.bundle.js dist/manifest.json index.html
          git diff --cached --check
          git commit -m "Commit verified Stage 10.2 artefacts"
          git push origin HEAD
          echo "Verified source: $FINAL_SOURCE_SHA"
          echo "Tests: $TEST_COUNT/$TEST_COUNT"
          echo "Generated artefact commit: $(git rev-parse HEAD)"
