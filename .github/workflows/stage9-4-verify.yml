name: Stage 9.4 verifier

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage9-4-decision-previews
          fetch-depth: 0
      - name: Implement and verify Stage 9.4
        run: bash tools/stage9-4-run.sh
