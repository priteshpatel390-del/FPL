name: Finalize PR 80

on:
  push:
    branches:
      - agent/team-ux-startup-availability

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor == 'priteshpatel390-del'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/team-ux-startup-availability
          fetch-depth: 0

      - name: Record final testing and implementation evidence
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path

          testing = Path('docs/TESTING.md')
          text = testing.read_text()
          marker = '<!-- PR80-REPOSITORY-VERIFICATION-2026-08-07 -->'
          block = '''<!-- PR80-REPOSITORY-VERIFICATION-2026-08-07 -->
> **Repository PR verification — introduced with Team UX PR #80:** `.github/workflows/verify.yml` runs the existing completion gate automatically for pull requests and supports manual `workflow_dispatch`. It checks out the exact PR revision, runs `./run-tests.sh`, performs two production builds with that revision as `BUILD_COMMIT`, compares `dist/app.bundle.js`, `dist/index.html`, `dist/manifest.json` and root `index.html` byte-for-byte, verifies root/deployable equality and manifest build identity, and retains the verified production outputs as a short-lived review artifact. The workflow has read-only repository permission, performs no deployment and adds no project dependency. For PR #80, the corrected T-01/T-02 source reached **649 passed, 0 failed, 0 skipped, 0 cancelled** with deterministic builds and exact identity. A 390×844 first-paint mobile rendering with script execution disabled confirmed that the startup gate alone is visible while header, main and the fixed dock are hidden. This is browser-rendered mobile evidence, not a claim of physical iPhone Safari testing.

'''
          if marker not in text:
              anchor = '# TESTING.md\n\n'
              if anchor not in text:
                  raise SystemExit('TESTING heading anchor not found')
              text = text.replace(anchor, anchor + block, 1)
          testing.write_text(text)

          record = Path('docs/TEAM-UX-T01-T02-IMPLEMENTATION.md')
          text = record.read_text()
          text = text.replace(
              'Status: **Draft implementation; final verification and visual acceptance in progress. Not merged.**',
              'Status: **Implementation and verification complete. Approved to merge after final repository hygiene. Not yet merged.**'
          )
          old = '''An iPhone-sized first-paint rendering then exposed a genuine residual T-01 issue: the fixed dock could still be painted before JavaScript established shell ownership. That result was treated as a failed visual acceptance check, not as a pass. The static CSS correction above was added in response, together with the fourth regression. The exact corrected source revision must pass the repository workflow before merge.'''
          new = '''An iPhone-sized first-paint rendering then exposed a genuine residual T-01 issue: the fixed dock could still be painted before JavaScript established shell ownership. That result was treated as a failed visual acceptance check, not as a pass. The static CSS correction above was added in response, together with the fourth regression.

The corrected source revision `17ddfa6250ad9039317c159459a63ded30b893a6` then passed the permanent repository workflow with **649 passed, 0 failed, 0 skipped, 0 cancelled**, two byte-identical production builds, root/deployable equality and exact manifest build identity.'''
          if old in text:
              text = text.replace(old, new, 1)
          old_visual = '''The required visual condition is that an iPhone-sized first paint shows only the startup/loading experience with no header, application content or fixed navigation dock visible above or through it. The corrected static CSS is specifically designed to make this true before application JavaScript executes. Final visual evidence is recorded only after the corrected production build is rendered.'''
          new_visual = '''The required visual condition is that an iPhone-sized first paint shows only the startup/loading experience with no header, application content or fixed navigation dock visible above or through it. The corrected production build passed a 390×844 first-paint browser rendering with script execution disabled: the startup gate remained visible while header, main and `nav.tabs` computed to `visibility:hidden`, and the screenshot showed no fixed dock or application content. This is an iPhone-sized browser simulation, not a claim of physical iPhone Safari testing.'''
          if old_visual in text:
              text = text.replace(old_visual, new_visual, 1)
          old_gate = '''Pritesh has approved merge after documentation updates and successful visual acceptance. Keep PR #80 Draft and unmerged until the corrected exact revision passes automated verification, generated deployables are current, and the final visual check succeeds.'''
          new_gate = '''Pritesh approved merge after documentation updates and successful visual acceptance. Automated verification and the corrected mobile first-paint visual check have passed. This finalisation step updates canonical testing documentation and commits the generated deployables; PR #80 may then be merged under that conditional approval.'''
          if old_gate in text:
              text = text.replace(old_gate, new_gate, 1)
          record.write_text(text)
          PY

      - name: Run complete verification and deterministic production build
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$BUILD_COMMIT"
          ./run-tests.sh
          node build.mjs
          rm -rf /tmp/pr80-final-build
          mkdir -p /tmp/pr80-final-build/dist
          cp dist/app.bundle.js /tmp/pr80-final-build/dist/app.bundle.js
          cp dist/index.html /tmp/pr80-final-build/dist/index.html
          cp dist/manifest.json /tmp/pr80-final-build/dist/manifest.json
          cp index.html /tmp/pr80-final-build/index.html
          node build.mjs
          cmp /tmp/pr80-final-build/dist/app.bundle.js dist/app.bundle.js
          cmp /tmp/pr80-final-build/dist/index.html dist/index.html
          cmp /tmp/pr80-final-build/dist/manifest.json dist/manifest.json
          cmp /tmp/pr80-final-build/index.html index.html
          cmp dist/index.html index.html

      - name: Commit final verified artefacts and remove this one-time workflow
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html src/ui/team-decision-home.mjs tests/team-ux-startup-availability.test.mjs docs/TEAM-UX-T01-T02-IMPLEMENTATION.md docs/TESTING.md .github/workflows/verify.yml dist/app.bundle.js dist/index.html dist/manifest.json index.html
          git rm .github/workflows/finalize-pr80.yml
          git commit -m "Finalize verified PR 80 deployable [skip ci]"
          git push origin HEAD:agent/team-ux-startup-availability
