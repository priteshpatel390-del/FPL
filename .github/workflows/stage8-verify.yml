name: Stage 8 verification
on:
  push:
    branches: [agent/stage8-uncertainty-simulation]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Full test suite
        shell: bash
        run: |
          set +e
          ./run-tests.sh > stage8-tests.log 2>&1
          echo $? > stage8-tests.status
          tail -n 40 stage8-tests.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage8-test-diagnostics
          path: |
            stage8-tests.log
            stage8-tests.status
      - name: Enforce test result
        shell: bash
        run: |
          status=$(cat stage8-tests.status)
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      - name: Deterministic build comparison
        shell: bash
        run: |
          set -euo pipefail
          COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
          BUILD_COMMIT="$COMMIT" node build.mjs
          mkdir -p /tmp/build-one
          cp dist/index.html dist/app.bundle.js dist/manifest.json /tmp/build-one/
          BUILD_COMMIT="$COMMIT" node build.mjs
          cmp /tmp/build-one/index.html dist/index.html
          cmp /tmp/build-one/app.bundle.js dist/app.bundle.js
          cmp /tmp/build-one/manifest.json dist/manifest.json
          grep -q "$COMMIT" dist/manifest.json
      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: stage8-verified-dist
          path: |
            dist/index.html
            dist/app.bundle.js
            dist/manifest.json
