name: Stage 10.4 post-merge documentation

on:
  pull_request:
    branches: [agent/stage10-4-post-merge-closeout]

permissions:
  contents: write

jobs:
  closeout:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage10-4-post-merge-closeout
          fetch-depth: 0
      - name: Record merged Stage 10.4 status
        run: |
          python - <<'PY'
          from pathlib import Path

          MERGE = '6a96096cfa59fd3476aa89c191cc8ca6400d358b'
          SOURCE = '1eca9a8817da41597d0632c819142237d31627fb'
          GENERATED = '1af7dac5383c91e915587218e7551c2f619cec8f'

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match, found {text.count(old)}')
              p.write_text(text.replace(old, new))

          replace('CLAUDE.md',
            "Stage 10.4 — Operating review/export is implemented and verified on draft PR #35 after explicit owner approval. It remains a downstream-only consumer of exact Stage 10.1–10.3 evidence and does not alter production formulas or providers. Verified source `1eca9a8817da41597d0632c819142237d31627fb` passes **413/413 tests** with byte-identical exact-identity builds; generated artefacts are committed at `1af7dac5383c91e915587218e7551c2f619cec8f` with source hash `d1773a1ae9e36ae28adef232148a3f7e315f21baf989e03e0158c9beefe729ed`. `main` remains at the merged Stage 10.3 baseline until Pritesh explicitly approves the Stage 10.4 merge. After merge, the next checkpoint is **Stage 10.5**, investigation and exact-scope approval only.",
            f"Stage 10.4 — Operating review/export is complete and merged through PR #35 at `{MERGE}` after explicit owner approval. It remains a downstream-only consumer of exact Stage 10.1–10.3 evidence and does not alter production formulas or providers. Verified source `{SOURCE}` passes **413/413 tests** with byte-identical exact-identity builds; generated artefacts are committed at `{GENERATED}` with source hash `d1773a1ae9e36ae28adef232148a3f7e315f21baf989e03e0158c9beefe729ed`. The next checkpoint is **Stage 10.5 — Hardening and documentation**, investigation and exact-scope approval only; no Stage 10.5 implementation has begun.")

          roadmap_old = """## Current
          - **Stage 10.4 — Operating review/export** · IMPLEMENTED AND VERIFIED on draft PR #35; owner review and merge approval remain pending.
          - Verified source `1eca9a8817da41597d0632c819142237d31627fb`: **413/413 tests passed**, zero failures/skips, deterministic exact-identity builds; generated artefacts `1af7dac5383c91e915587218e7551c2f619cec8f`.
          - Weekly/cumulative reviews, hash-verifiable JSON, deterministic Markdown and eight individual CSV exports are downstream-only and descriptive.
          - Google Sheets remains manual import into the live 2026/27 workbook; no OAuth, backend or automatic sync was introduced.

          ## Upcoming
          1. Complete owner review and physical iPhone acceptance of draft PR #35.
          2. Merge only after Pritesh's explicit approval.
          3. After merge, investigate and design Stage 10.5 separately; do not begin implementation without exact-scope approval.

          ## Current blockers
          1. Stage 10.4 is not merged until owner review, physical iPhone acceptance and explicit merge approval are complete.
          2. A persistent screenshot-regression suite is absent; visual changes still require human device checks.
          3. Free historical odds and other missing pre-deadline provider snapshots require prospective 2026/27 logging.
          4. Prospective sample size begins at zero; Stage 10.4 reporting does not establish model accuracy or calibration.""".replace('          ','')
          roadmap_new = f"""## Current
          - **Stage 10.5 — Hardening and documentation** · investigation and exact-scope approval only; no implementation has begun.
          - Stage 10.4 is complete and merged through PR #35 at `{MERGE}` after owner approval.
          - Production formulas, providers and automatic Google Sheets integration remain unchanged.

          ## Upcoming
          1. Inspect the merged Stage 10.1–10.4 operational and recovery boundaries.
          2. Present the exact Stage 10.5 failure-recovery, migration, security-review and operational-guidance scope and exclusions.
          3. Obtain explicit owner approval before implementation.

          ## Current blockers
          1. Stage 10.5 exact scope and approval are not yet recorded.
          2. A persistent screenshot-regression suite is absent; visual changes still require human device checks.
          3. Free historical odds and other missing pre-deadline provider snapshots require prospective 2026/27 logging.
          4. Prospective sample size begins at zero; Stage 10 infrastructure does not establish model accuracy or calibration.""".replace('          ','')
          replace('docs/ROADMAP.md', roadmap_old, roadmap_new)
          marker = "- **Stage 10.3 — Metrics** · DONE and merged through PR #32 at `2c703be2ccebc9bd0c4d782ad07b5324b1ed0997` after owner approval.\n  - Immutable player, fixture-minutes, uncertainty, frozen-squad, captaincy, bench and frozen-transfer evaluations remain descriptive only.\n  - Verified source `3eaae862b8a8277e450af062ff4bcecd15b12f3f`: **397/397 tests passed** with byte-identical exact-identity builds; generated artefacts `8c4b60a367b9858146b42ff8710d888856462c21`."
          replace('docs/ROADMAP.md', marker, marker + f"\n- **Stage 10.4 — Operating review/export** · DONE and merged through PR #35 at `{MERGE}` after owner approval.\n  - Downstream weekly/cumulative review with deterministic JSON, Markdown and eight CSV exports.\n  - Verified source `{SOURCE}`: **413/413 tests passed** with exact-identity builds; generated artefacts `{GENERATED}`.")

          replace('docs/PROJECT_CONTEXT.md',
            '- Stages 1–9 and Stage 10.1–10.3 are complete and merged. Stage 10.4 is implemented and verified on draft PR #35 after explicit owner approval, but is not merged. The complete Stage 10 design is owner-approved.',
            f'- Stages 1–9 and Stage 10.1–10.4 are complete and merged. Stage 10.4 merged through PR #35 at `{MERGE}` after explicit owner approval. The complete Stage 10 design is owner-approved.')
          replace('docs/PROJECT_CONTEXT.md',
            '- Stage 10.4 is implemented and verified on draft PR #35. It provides downstream-only weekly/cumulative operating review plus deterministic JSON, Markdown and eight CSV exports from exact Stage 10.1–10.3 evidence. Verified source `1eca9a8817da41597d0632c819142237d31627fb` passes **413/413 tests** with exact-identity builds; generated artefacts `1af7dac5383c91e915587218e7551c2f619cec8f` embed source hash `d1773a1ae9e36ae28adef232148a3f7e315f21baf989e03e0158c9beefe729ed`. No formula, provider or automatic Google Sheets integration changed.',
            f'- Stage 10.4 merged through PR #35 at `{MERGE}`. It provides downstream-only weekly/cumulative operating review plus deterministic JSON, Markdown and eight CSV exports from exact Stage 10.1–10.3 evidence. Verified source `{SOURCE}` passes **413/413 tests** with exact-identity builds; generated artefacts `{GENERATED}` embed source hash `d1773a1ae9e36ae28adef232148a3f7e315f21baf989e03e0158c9beefe729ed`. No formula, provider or automatic Google Sheets integration changed.')
          replace('docs/PROJECT_CONTEXT.md',
            'Completed and merged: Stage 1 characterisation/audit, SEC-1, Stage 2 modularisation, repository handover, Stage 3 security/provider hardening, Stage 4 expected minutes, Stage 5 scoring corrections, Stage 6 transfer optimiser, Stage 7 walk-forward backtest, Stage 8 uncertainty/squad simulation, all six Stage 9 UI-integration checkpoints, Stage 10.1 deadline-safe snapshot foundation, Stage 10.2 official outcome collection and Stage 10.3 metrics.\n\nCurrent: Stage 10.4 — Operating review/export is implemented and verified on draft PR #35 at source `1eca9a8817da41597d0632c819142237d31627fb` and generated commit `1af7dac5383c91e915587218e7551c2f619cec8f`. Owner review, physical iPhone acceptance and explicit merge approval remain outstanding.\n\nNext after merge: investigate Stage 10.5 and present its exact scope, exclusions and approval gate. Production formulas, thresholds and validation claims remain outside scope unless separately evidenced and approved.',
            f'Completed and merged: Stage 1 characterisation/audit, SEC-1, Stage 2 modularisation, repository handover, Stage 3 security/provider hardening, Stage 4 expected minutes, Stage 5 scoring corrections, Stage 6 transfer optimiser, Stage 7 walk-forward backtest, Stage 8 uncertainty/squad simulation, all six Stage 9 UI-integration checkpoints, Stage 10.1 deadline-safe snapshot foundation, Stage 10.2 official outcome collection, Stage 10.3 metrics and Stage 10.4 operating review/export.\n\nCurrent: Stage 10.5 — Hardening and documentation is the next investigation and exact-scope approval checkpoint. No Stage 10.5 implementation has begun.\n\nNext: define failure recovery, migration discipline, security review and final operational guidance. Production formulas, thresholds and validation claims remain outside scope unless separately evidenced and approved.')

          replace('docs/STAGE10-DESIGN.md',
            'Status: owner-approved on 2026-07-29. Stage 10.1 is complete and merged through PR #27 at `da76c81f552fd9da5c518e73ccc0fbe966c74444`; Stage 10.2 is complete and merged through PR #29 at `4b1b2acf9bda81afb63414dd41b509e80b3945c7`; Stage 10.3 is complete and merged through PR #32 at `2c703be2ccebc9bd0c4d782ad07b5324b1ed0997`. Stage 10.4 has not begun.',
            f'Status: owner-approved on 2026-07-29. Stage 10.1 merged through PR #27; Stage 10.2 through PR #29; Stage 10.3 through PR #32; Stage 10.4 through PR #35 at `{MERGE}` after owner approval. Stage 10.5 is the next investigation and exact-scope approval checkpoint.')
          replace('docs/STAGE10-DESIGN.md',
            'The owner approved the exact operating-review/export scope on 30 July 2026. Draft PR #35 implements it without changing projection, expected-minutes, scoring, fixture, uncertainty, squad, captaincy, transfer-optimiser or provider behaviour. Source `1eca9a8817da41597d0632c819142237d31627fb` passes 413/413 tests with deterministic exact-identity builds; generated artefacts are `1af7dac5383c91e915587218e7551c2f619cec8f`. Physical iPhone acceptance and explicit merge approval remain outstanding. Stage 10.5 remains a separate investigation/design checkpoint.',
            f'The owner approved the exact operating-review/export scope on 30 July 2026. PR #35 merged at `{MERGE}` without changing projection, expected-minutes, scoring, fixture, uncertainty, squad, captaincy, transfer-optimiser or provider behaviour. Source `{SOURCE}` passes 413/413 tests with deterministic exact-identity builds; generated artefacts are `{GENERATED}`. Physical iPhone acceptance was not independently recorded. Stage 10.5 remains a separate investigation/design checkpoint.')

          replace('docs/STAGE10-ITEM4.md',
            '**Implemented and verified on draft PR #35; not merged.** Exact scope was approved by Pritesh before implementation. Physical iPhone acceptance and explicit merge approval remain required.',
            f'**Complete and merged through PR #35 at `{MERGE}` after explicit owner approval.** Exact scope was approved by Pritesh before implementation. Physical iPhone acceptance was not independently recorded.')
          replace('docs/STAGE10-ITEM4.md',
            '- Generated artefacts: `1af7dac5383c91e915587218e7551c2f619cec8f`',
            f'- Generated artefacts: `{GENERATED}`\n- Merge commit: `{MERGE}`')
          replace('docs/STAGE10-ITEM4.md',
            '## Remaining limitations and review gate\nLocal evidence retention can make a season bundle partial. CSVs are individual downloads; no XLSX/ZIP/direct Sheets sync exists. Provider comparisons remain observational. Prospective sample size begins at zero. Static phone-first checks pass, but physical iPhone acceptance has not yet been recorded.\n\nPR #35 must remain draft and unmerged until Pritesh reviews the UI/exports, completes physical iPhone acceptance and explicitly approves merge.',
            f'## Remaining limitations\nLocal evidence retention can make a season bundle partial. CSVs are individual downloads; no XLSX/ZIP/direct Sheets sync exists. Provider comparisons remain observational. Prospective sample size begins at zero. Static phone-first checks pass, but physical iPhone acceptance was not independently recorded. PR #35 merged at `{MERGE}` after explicit owner approval.')

          replace('docs/CHANGELOG.md',
            '- Verified source `1eca9a8817da41597d0632c819142237d31627fb` and generated artefacts `1af7dac5383c91e915587218e7551c2f619cec8f` with byte-identical rebuilds. Draft PR #35 awaits owner review and explicit merge approval.',
            f'- Verified source `{SOURCE}` and generated artefacts `{GENERATED}` with byte-identical rebuilds. Merged through PR #35 at `{MERGE}` after owner approval.')

          history = Path('docs/STAGE_HISTORY.md')
          text = history.read_text()
          heading = '## Stage 10.4 — Operating review/export (MERGED 2026-07-30)'
          if heading not in text:
              block = f'''{heading}\nPritesh approved the exact downstream operating-review/export scope before implementation. The item adds weekly and cumulative review over immutable Stage 10.1–10.3 evidence, deterministic hash-verifiable JSON and Markdown, and eight individual RFC 4180 CSV exports. It does not change production projection, expected-minutes, scoring, fixture, uncertainty, squad, captaincy, transfer-optimiser or provider behaviour. Google Sheets remains manual import only.\n\nVerified source `{SOURCE}` passes **413/413 tests**, zero failures and zero skipped, with byte-identical exact-identity builds. Generated artefacts are `{GENERATED}`. PR #35 merged at `{MERGE}` after explicit owner approval. Physical iPhone acceptance was not independently recorded; prospective validation remains in progress.\n\n'''
              text = text.replace('## Stage 10.3 — Metrics (MERGED 2026-07-30)', block + '## Stage 10.3 — Metrics (MERGED 2026-07-30)', 1)
              history.write_text(text)
          PY
      - name: Verify unchanged application and full suite
        run: |
          BUILD_COMMIT=1eca9a8817da41597d0632c819142237d31627fb ./run-tests.sh
          git diff --exit-code -- app.html build.mjs src tests dist index.html
      - name: Commit docs and remove temporary workflow
        run: |
          rm .github/workflows/stage10-4-postmerge-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CLAUDE.md docs .github/workflows/stage10-4-postmerge-docs.yml
          git commit -m "Record merged Stage 10.4 status"
          git push origin HEAD:agent/stage10-4-post-merge-closeout
