name: Stage 7 verification

on:
  push:
    branches:
      - agent/stage7-walk-forward-backtest
    paths-ignore:
      - 'dist/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Full test suite
        id: tests
        shell: bash
        run: |
          set -o pipefail
          ./run-tests.sh 2>&1 | tee stage7-test-output.log
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-test-output
          path: stage7-test-output.log
      - name: Capture first deterministic build
        run: |
          rm -rf /tmp/stage7-build-a /tmp/stage7-build-b
          BUILD_COMMIT="$GITHUB_SHA" node build.mjs
          mkdir -p /tmp/stage7-build-a
          cp dist/index.html dist/app.bundle.js dist/manifest.json /tmp/stage7-build-a/
      - name: Capture second deterministic build
        run: |
          BUILD_COMMIT="$GITHUB_SHA" node build.mjs
          mkdir -p /tmp/stage7-build-b
          cp dist/index.html dist/app.bundle.js dist/manifest.json /tmp/stage7-build-b/
      - name: Compare deterministic artefacts
        run: |
          cmp /tmp/stage7-build-a/index.html /tmp/stage7-build-b/index.html
          cmp /tmp/stage7-build-a/app.bundle.js /tmp/stage7-build-b/app.bundle.js
          cmp /tmp/stage7-build-a/manifest.json /tmp/stage7-build-b/manifest.json
      - name: Verify build identity
        run: |
          grep -F "$GITHUB_SHA" dist/manifest.json
          grep -F "$GITHUB_SHA" dist/app.bundle.js
          grep -F "$GITHUB_SHA" dist/index.html
      - name: Upload verified dist
        uses: actions/upload-artifact@v4
        with:
          name: stage7-verified-dist
          path: |
            dist/index.html
            dist/app.bundle.js
            dist/manifest.json
      - name: Commit verified dist
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/index.html dist/app.bundle.js dist/manifest.json
          if git diff --cached --quiet; then
            echo "Verified dist is already current."
          else
            git commit -m "Commit verified Stage 7 build artifacts"
            git push origin HEAD:agent/stage7-walk-forward-backtest
          fi
      # Diagnostic-only workflow; remove before Stage 7 is marked complete.
