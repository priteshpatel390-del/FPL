name: Teamsheet 2.0.2 corrections test

on:
  push:
    branches:
      - agent/teamsheet-2.0.2-team-decision-home
    paths:
      - .github/teamsheet-2.0.2-corrections-trigger

permissions:
  contents: write

jobs:
  verify-corrections:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/teamsheet-2.0.2-team-decision-home
          fetch-depth: 0
      - name: Use repository baseline Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run complete test suite and deterministic build
        shell: bash
        env:
          BUILD_COMMIT: 50d5aff2650398560b17a4c80487e273ca3d3be7
        run: |
          set -euo pipefail
          ./run-tests.sh | tee /tmp/teamsheet-corrections.log
          TEST_COUNT="$(awk '/^# tests /{value=$3} END{print value}' /tmp/teamsheet-corrections.log)"
          PASS_COUNT="$(awk '/^# pass /{value=$3} END{print value}' /tmp/teamsheet-corrections.log)"
          FAIL_COUNT="$(awk '/^# fail /{value=$3} END{print value}' /tmp/teamsheet-corrections.log)"
          SKIP_COUNT="$(awk '/^# skipped /{value=$3} END{print value}' /tmp/teamsheet-corrections.log)"
          test -n "$TEST_COUNT"
          test "$PASS_COUNT" = "$TEST_COUNT"
          test "$FAIL_COUNT" = "0"
          test "$SKIP_COUNT" = "0"
          mkdir -p /tmp/teamsheet-build-one
          cp dist/index.html dist/app.bundle.js dist/manifest.json /tmp/teamsheet-build-one/
          node build.mjs
          cmp /tmp/teamsheet-build-one/index.html dist/index.html
          cmp /tmp/teamsheet-build-one/app.bundle.js dist/app.bundle.js
          cmp /tmp/teamsheet-build-one/manifest.json dist/manifest.json
          cmp dist/index.html index.html
          mkdir -p .verification
          node - <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const log=fs.readFileSync('/tmp/teamsheet-corrections.log','utf8');
          const value=name=>Number((new RegExp(`^# ${name} (\\d+)$`,'m').exec(log)||[])[1]||0);
          const sha=path=>crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex');
          const manifest=JSON.parse(fs.readFileSync('dist/manifest.json','utf8'));
          fs.writeFileSync('.verification/teamsheet-2.0.2-corrections.json',JSON.stringify({
            sourceCommit:process.env.BUILD_COMMIT,
            tests:value('tests'),pass:value('pass'),fail:value('fail'),skipped:value('skipped'),
            modelVersion:manifest.modelVersion,rulesVersion:manifest.rulesVersion,sourceHash:manifest.sourceHash,
            deterministic:true,rootMatchesDist:true,
            indexSha256:sha('dist/index.html'),bundleSha256:sha('dist/app.bundle.js'),manifestSha256:sha('dist/manifest.json')
          },null,2)+'\n');
          NODE
      - name: Publish verification evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .verification/teamsheet-2.0.2-corrections.json
          git commit -m "Record Teamsheet 2.0.2 correction verification"
          git push origin HEAD:agent/teamsheet-2.0.2-team-decision-home
