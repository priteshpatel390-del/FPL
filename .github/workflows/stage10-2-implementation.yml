# verification trigger: corrected build-order anchor
name: Stage 10.2 implementation runner

on:
  push:
    branches:
      - agent/stage10-2-official-outcomes
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: stage10-2-official-outcomes
  cancel-in-progress: false

jobs:
  implement-and-verify:
    if: github.event_name == 'pull_request' || github.event.head_commit.message == 'Install Stage 10.2 implementation runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/stage10-2-official-outcomes

      - name: Apply approved Stage 10.2 scope
        run: |
          set -euo pipefail
          cat .stage10-2-payload.part* > .stage10-2-payload.b64
          base64 -d .stage10-2-payload.b64 | gzip -d > .stage10-2-apply.py
          python - <<'PY'
          from pathlib import Path
          path=Path('.stage10-2-apply.py')
          text=path.read_text()
          text=text.replace("\\n    'src/evidence/snapshot.mjs'","\\n  'src/evidence/snapshot.mjs'")
          path.write_text(text)
          PY
          python .stage10-2-apply.py
          rm -f .stage10-2-payload.part* .stage10-2-payload.b64 .stage10-2-apply.py .github/workflows/stage10-2-implementation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement Stage 10.2 official outcome collection"
          git push origin HEAD

      - name: First full verification and test-count capture
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse HEAD)
          BUILD_COMMIT="$SOURCE_SHA" ./run-tests.sh | tee /tmp/stage10-2-first.log
          TEST_COUNT=$(awk '/^# tests /{print $3}' /tmp/stage10-2-first.log | tail -1)
          test -n "$TEST_COUNT"
          test "$TEST_COUNT" -gt 349
          echo "TEST_COUNT=$TEST_COUNT" >> "$GITHUB_ENV"

      - name: Record verified baseline in documentation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          count=os.environ['TEST_COUNT']
          changed=[]
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.parts[0]=='dist':
                  continue
              try:
                  text=path.read_text()
              except UnicodeDecodeError:
                  continue
              if '__TEST_COUNT__' in text:
                  path.write_text(text.replace('__TEST_COUNT__',count))
                  changed.append(str(path))
          if not changed:
              raise SystemExit('No Stage 10.2 test-count placeholders were found')
          print('\n'.join(changed))
          PY
          git add docs CLAUDE.md
          git diff --cached --check
          git commit -m "Record Stage 10.2 verification baseline"
          git push origin HEAD

      - name: Final exact-identity full verification
        run: |
          set -euo pipefail
          FINAL_SOURCE_SHA=$(git rev-parse HEAD)
          echo "FINAL_SOURCE_SHA=$FINAL_SOURCE_SHA" >> "$GITHUB_ENV"
          BUILD_COMMIT="$FINAL_SOURCE_SHA" ./run-tests.sh | tee /tmp/stage10-2-final.log
          FINAL_TEST_COUNT=$(awk '/^# tests /{print $3}' /tmp/stage10-2-final.log | tail -1)
          test "$FINAL_TEST_COUNT" = "$TEST_COUNT"
          mkdir -p /tmp/stage10-2-build-a
          cp dist/index.html /tmp/stage10-2-build-a/index.html
          cp dist/app.bundle.js /tmp/stage10-2-build-a/app.bundle.js
          cp dist/manifest.json /tmp/stage10-2-build-a/manifest.json
          cp index.html /tmp/stage10-2-build-a/root-index.html
          BUILD_COMMIT="$FINAL_SOURCE_SHA" node build.mjs
          cmp /tmp/stage10-2-build-a/index.html dist/index.html
          cmp /tmp/stage10-2-build-a/app.bundle.js dist/app.bundle.js
          cmp /tmp/stage10-2-build-a/manifest.json dist/manifest.json
          cmp /tmp/stage10-2-build-a/root-index.html index.html
          cmp index.html dist/index.html
          node --check dist/app.bundle.js
          grep -Fq "\"commit\": \"$FINAL_SOURCE_SHA\"" dist/manifest.json
          git diff --check

      - name: Commit verified generated artefacts
        run: |
          set -euo pipefail
          git add dist/index.html dist/app.bundle.js dist/manifest.json index.html
          git diff --cached --check
          git commit -m "Commit verified Stage 10.2 artefacts"
          git push origin HEAD
          echo "Verified source: $FINAL_SOURCE_SHA"
          echo "Tests: $TEST_COUNT/$TEST_COUNT"
          echo "Generated artefact commit: $(git rev-parse HEAD)"
