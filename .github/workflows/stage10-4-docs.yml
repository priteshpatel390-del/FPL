name: Stage 10.4 documentation closeout

on:
  pull_request:
    branches: [agent/stage10-4-operating-review]

permissions:
  contents: write

jobs:
  closeout:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage10-4-operating-review
          fetch-depth: 0
      - name: Update canonical Stage 10.4 records
