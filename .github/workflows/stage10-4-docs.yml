          SOURCE_HASH = 'd1773a1ae9e36ae28adef232148a3f7e315f21baf989e03e0158c9beefe729ed'

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text.rstrip() + '\n')

          def replace_exact(path, old, new):
              text = read(path)
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one exact replacement, found {text.count(old)}')
              write(path, text.replace(old, new))

          def append_once(path, marker, block):
              text = read(path)
              if marker not in text:
                  write(path, text + '\n' + block.strip() + '\n')

          replace_exact('CLAUDE.md',
