          stage103 = '- Stage 10.3 merged through PR #32 at `2c703be2ccebc9bd0c4d782ad07b5324b1ed0997` after owner approval. It derives immutable correction-aware player, fixture-minutes, uncertainty, frozen-squad, captaincy, bench and frozen-transfer evaluations only from exact Stage 10.1/10.2 records. Verified source `3eaae862b8a8277e450af062ff4bcecd15b12f3f` passes **397/397 tests** with deterministic exact-identity builds; generated artefacts are committed at `8c4b60a367b9858146b42ff8710d888856462c21`.'
          replace_exact('docs/PROJECT_CONTEXT.md', stage103, stage103 + f"\n- Stage 10.4 is implemented and verified on draft PR #35. It provides downstream-only weekly/cumulative operating review plus deterministic JSON, Markdown and eight CSV exports from exact Stage 10.1–10.3 evidence. Verified source `{SOURCE}` passes **413/413 tests** with exact-identity builds; generated artefacts `{GENERATED}` embed source hash `{SOURCE_HASH}`. No formula, provider or automatic Google Sheets integration changed.")
          replace_exact('docs/PROJECT_CONTEXT.md',
          'Completed and merged: Stage 1 characterisation/audit, SEC-1, Stage 2 modularisation, repository handover, Stage 3 security/provider hardening, Stage 4 expected minutes, Stage 5 scoring corrections, Stage 6 transfer optimiser, Stage 7 walk-forward backtest, Stage 8 uncertainty/squad simulation, all six Stage 9 UI-integration checkpoints, Stage 10.1 deadline-safe snapshot foundation, Stage 10.2 official outcome collection and Stage 10.3 metrics.\n\nCurrent: Stage 10.4 — Operating review/export is the next investigation and exact-scope approval checkpoint. No Stage 10.4 implementation has begun.\n\nNext: define the exact weekly/cumulative review surfaces, completeness checks, export schemas, retention rules and phone-first workflow. Production formulas, thresholds and validation claims remain outside scope unless separately evidenced and approved.',
          f'Completed and merged: Stage 1 characterisation/audit, SEC-1, Stage 2 modularisation, repository handover, Stage 3 security/provider hardening, Stage 4 expected minutes, Stage 5 scoring corrections, Stage 6 transfer optimiser, Stage 7 walk-forward backtest, Stage 8 uncertainty/squad simulation, all six Stage 9 UI-integration checkpoints, Stage 10.1 deadline-safe snapshot foundation, Stage 10.2 official outcome collection and Stage 10.3 metrics.\n\nCurrent: Stage 10.4 — Operating review/export is implemented and verified on draft PR #35 at source `{SOURCE}` and generated commit `{GENERATED}`. Owner review, physical iPhone acceptance and explicit merge approval remain outstanding.\n\nNext after merge: investigate Stage 10.5 and present its exact scope, exclusions and approval gate. Production formulas, thresholds and validation claims remain outside scope unless separately evidenced and approved.')

          replace_exact('docs/ARCHITECTURE.md',
