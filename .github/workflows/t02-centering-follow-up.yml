name: T-02 availability centering follow-up

on:
  push:
    branches:
      - agent/t02-availability-badge-centering

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/t02-availability-badge-centering
          fetch-depth: 0

      - name: Configure commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add focused regression first
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='tests/team-ux-startup-availability.test.mjs';
          let s=fs.readFileSync(path,'utf8');
          const title="availability badges cancel generic flag horizontal offset for centred Team cards";
          if(!s.includes(title)){
            const marker="\ntest('startup gate owns the application shell until the existing ready event',()=>{";
            if(!s.includes(marker)) throw new Error('startup test marker not found');
            const block=`\ntest('${title}',()=>{\n  assert.match(APP_SOURCE,/\\.pitch-availability\\{margin-left:0\\}/);\n});\n`;
            s=s.replace(marker,block+marker);
            fs.writeFileSync(path,s);
          }
          NODE

      - name: Prove regression fails before CSS correction
        run: |
          set +e
          node --test tests/team-ux-startup-availability.test.mjs > /tmp/pre-fix.log 2>&1
          code=$?
          set -e
          cat /tmp/pre-fix.log
          if [ "$code" -eq 0 ]; then
            echo "Expected the new centering regression to fail before the CSS correction."
            exit 1
          fi
          grep -q "not ok .*availability badges cancel generic flag horizontal offset" /tmp/pre-fix.log

      - name: Apply narrow centering correction and document it
        run: |
          node <<'NODE'
          const fs=require('node:fs');

          const appPath='app.html';
          let app=fs.readFileSync(appPath,'utf8');
          if(!app.includes('.pitch-availability{margin-left:0}')){
            const match=app.match(/\.flag\{[^}]*\}\n/);
            if(!match) throw new Error('generic .flag rule not found');
            app=app.replace(match[0],match[0]+'.pitch-availability{margin-left:0}\n');
            fs.writeFileSync(appPath,app);
          }

          const implPath='docs/TEAM-UX-T01-T02-IMPLEMENTATION.md';
          let impl=fs.readFileSync(implPath,'utf8');
          const implHeading='## T-02 physical visual follow-up — availability badge centring';
          if(!impl.includes(implHeading)){
            impl += `\n\n${implHeading}\n\nOn 7 August 2026, physical iPhone Safari review of an unavailable bench player found the availability badge visually shifted to the right. The cause was the generic \`.flag\` rule's \`margin-left:5px\`, inherited by the standalone \`.pitch-availability\` badge. The approved presentation-only correction adds \`.pitch-availability{margin-left:0}\`, preserving all availability data, selection, ordering, projection, captaincy, transfer and provider behaviour. A focused regression protects the centring override.\n`;
            fs.writeFileSync(implPath,impl);
          }

          const testingPath='docs/TESTING.md';
          let testing=fs.readFileSync(testingPath,'utf8');
          const testingHeading='## T-02 availability-badge centring follow-up — 7 August 2026';
          if(!testing.includes(testingHeading)){
            testing += `\n\n${testingHeading}\n\nPhysical iPhone Safari review exposed a right-shifted standalone availability badge caused by the generic \`.flag\` horizontal margin. The follow-up regression is required to fail before the centring override and pass after \`.pitch-availability{margin-left:0}\` is applied. Full-suite and deterministic-build evidence is recorded on the follow-up pull request.\n`;
            fs.writeFileSync(testingPath,testing);
          }
          NODE

      - name: Commit source, regression and docs
        run: |
          git add app.html tests/team-ux-startup-availability.test.mjs docs/TEAM-UX-T01-T02-IMPLEMENTATION.md docs/TESTING.md
          git commit -m "Center Team availability badges"

      - name: Run complete test suite
        run: |
          ./run-tests.sh | tee /tmp/full-tests.log

      - name: Build twice and verify deterministic outputs
        run: |
          set -eu
          export BUILD_COMMIT="$(git rev-parse HEAD)"
          echo "$BUILD_COMMIT" > /tmp/source-commit
          node build.mjs
          rm -rf /tmp/teamsheet-build-a
          mkdir -p /tmp/teamsheet-build-a/dist
          cp dist/app.bundle.js /tmp/teamsheet-build-a/dist/app.bundle.js
          cp dist/index.html /tmp/teamsheet-build-a/dist/index.html
          cp dist/manifest.json /tmp/teamsheet-build-a/dist/manifest.json
          cp index.html /tmp/teamsheet-build-a/index.html
          node build.mjs
          cmp /tmp/teamsheet-build-a/dist/app.bundle.js dist/app.bundle.js
          cmp /tmp/teamsheet-build-a/dist/index.html dist/index.html
          cmp /tmp/teamsheet-build-a/dist/manifest.json dist/manifest.json
          cmp /tmp/teamsheet-build-a/index.html index.html
          cmp dist/index.html index.html
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const m=JSON.parse(readFileSync('dist/manifest.json','utf8')); if(m.commit!==process.env.BUILD_COMMIT) throw new Error('manifest commit mismatch'); console.log('Manifest commit verified:',m.commit);"

      - name: Commit generated outputs and remove temporary workflow
        run: |
          git add dist/app.bundle.js dist/index.html dist/manifest.json index.html
          git rm .github/workflows/t02-centering-follow-up.yml
          git commit -m "Build T-02 centering follow-up"
          git push origin HEAD:agent/t02-availability-badge-centering

      - name: Summary
        run: |
          echo '### T-02 centering follow-up verified' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Focused regression: failed before fix as expected' >> "$GITHUB_STEP_SUMMARY"
          echo '- Complete test suite: passed' >> "$GITHUB_STEP_SUMMARY"
          echo '- Deterministic production builds: byte-identical' >> "$GITHUB_STEP_SUMMARY"
          echo '- Root index.html equals dist/index.html' >> "$GITHUB_STEP_SUMMARY"
          echo '- Temporary workflow removed from branch' >> "$GITHUB_STEP_SUMMARY"
