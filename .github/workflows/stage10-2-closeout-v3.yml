name: Stage 10.2 post-merge closeout v3

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  closeout-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/stage10-2-post-merge-closeout

      - name: Apply closeout
        run: |
          set -euo pipefail
          python .stage10-2-closeout.py
          rm -f .stage10-2-closeout.py .github/workflows/stage10-2-closeout-v3.yml
          git diff --check

      - name: Verify unchanged application baseline
        run: |
          set -euo pipefail
          BUILD_COMMIT=e84e7f1bf05ed1f3e574f78101e4a6e413273306 ./run-tests.sh | tee /tmp/stage10-2-closeout.log
          test "$(awk '/^# tests /{print $3}' /tmp/stage10-2-closeout.log | tail -1)" = "376"
          test "$(awk '/^# fail /{print $3}' /tmp/stage10-2-closeout.log | tail -1)" = "0"
          git diff --exit-code -- app.html build.mjs src tests dist index.html
          git diff --check

      - name: Commit verified closeout
        run: |
          set -euo pipefail
          EXPECTED=$(printf '%s\n' .github/workflows/stage10-2-closeout-v3.yml .stage10-2-closeout.py CLAUDE.md docs/CHANGELOG.md docs/PROJECT_CONTEXT.md docs/ROADMAP.md docs/STAGE10-DESIGN.md docs/STAGE10-ITEM2.md docs/STAGE_HISTORY.md docs/TESTING.md | sort)
          ACTUAL=$(git diff --name-only | sort)
          test "$ACTUAL" = "$EXPECTED"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Record Stage 10.2 post-merge closeout"
          git push origin HEAD
          echo "Closeout commit: $(git rev-parse HEAD)"
          echo "Tests: 376/376"
