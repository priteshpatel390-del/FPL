name: Verify Stage 3.6

on:
  push:
    branches:
      - stage3-6-ai-markdown-sanitisation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Full test suite
        run: ./run-tests.sh
      - name: Deterministic build
        shell: bash
        run: |
          rm -rf /tmp/fpl-build-a /tmp/fpl-build-b
          mkdir -p /tmp/fpl-build-a /tmp/fpl-build-b
          BUILD_COMMIT=verification node build.mjs
          cp -R dist/. /tmp/fpl-build-a/
          BUILD_COMMIT=verification node build.mjs
          cp -R dist/. /tmp/fpl-build-b/
          diff -ru /tmp/fpl-build-a /tmp/fpl-build-b
