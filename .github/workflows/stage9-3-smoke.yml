name: Stage 9.3 implementation verifier

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage9-3-player-detail-uncertainty
          fetch-depth: 0
      - name: Implement and verify Stage 9.3
        run: bash tools/stage9-3-run.sh
