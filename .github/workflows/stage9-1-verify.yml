name: Stage 9.1 verification

on:
  push:
    branches:
      - agent/stage9-1-app-shell
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Full test suite
        run: ./run-tests.sh
      - name: Deterministic build comparison
        shell: bash
        env:
          BUILD_ID: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          rm -rf /tmp/stage9-build-a /tmp/stage9-build-b
          BUILD_COMMIT="$BUILD_ID" node build.mjs
          mkdir -p /tmp/stage9-build-a
          cp dist/index.html dist/app.bundle.js dist/manifest.json /tmp/stage9-build-a/
          BUILD_COMMIT="$BUILD_ID" node build.mjs
          mkdir -p /tmp/stage9-build-b
          cp dist/index.html dist/app.bundle.js dist/manifest.json /tmp/stage9-build-b/
          cmp /tmp/stage9-build-a/index.html /tmp/stage9-build-b/index.html
          cmp /tmp/stage9-build-a/app.bundle.js /tmp/stage9-build-b/app.bundle.js
          cmp /tmp/stage9-build-a/manifest.json /tmp/stage9-build-b/manifest.json
          node -e "const m=require('./dist/manifest.json'); if(m.commit!==process.env.BUILD_ID) throw new Error('build identity mismatch')"
      - name: Commit verified deployables
        if: github.event_name == 'pull_request'
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git checkout -B "$HEAD_BRANCH"
          git add dist/index.html dist/app.bundle.js dist/manifest.json
          if git diff --cached --quiet; then
            echo "Verified deployables already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Commit verified Stage 9.1 build artefacts"
          git push origin "HEAD:$HEAD_BRANCH"
