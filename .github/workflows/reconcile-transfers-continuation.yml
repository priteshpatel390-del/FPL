name: Reconcile Transfers continuation

on:
  push:
    branches:
      - agent/transfers-exact-continuation

permissions:
  contents: write

jobs:
  verify-and-finalise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out reconciled continuation
        uses: actions/checkout@v4
        with:
          ref: agent/transfers-exact-continuation
          fetch-depth: 0

      - name: Apply complementary lifecycle and exact-tie hardening
        shell: bash
        run: |
          python -m py_compile .github/scripts/reconcile_transfers_continuation.py
          python .github/scripts/reconcile_transfers_continuation.py source
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/model/transfers.mjs src/ui/transfer-performance.mjs tests/transfer-exact-correction.test.mjs tests/transfer-performance-runtime.test.mjs
          git commit -m 'Reconcile Transfers lifecycle and exact tie bounds'
          git push origin HEAD:agent/transfers-exact-continuation
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build and run focused reconciliation tests
        shell: bash
        run: |
          BUILD_COMMIT="$SOURCE_COMMIT" node build.mjs
          node --test tests/transfer-exact-correction.test.mjs tests/transfer-exact-performance.test.mjs tests/transfer-performance-runtime.test.mjs

      - name: Record deterministic Official-scale profile
        shell: bash
        run: |
          node --input-type=module <<'NODE' > /tmp/reconciled-profile.json
          import { optimiseTransfers } from './src/model/transfers.mjs';
          import { buildOfficialScaleCase } from './tests/fixtures/transfer-scale-fixture.mjs';
          const result=optimiseTransfers(buildOfficialScaleCase({seed:7}));
          if(result.status!=='ok') throw new Error(`Official-scale profile failed: ${result.status}`);
          console.log(JSON.stringify({
            status:result.status,
            evaluations:result.evaluations,
            outgoingBranches:result.profile.outgoingBranches,
            boundPruned:result.profile.boundPruned,
            materialisedPlans:result.profile.materialisedPlans
          }));
          NODE
          cat /tmp/reconciled-profile.json

      - name: Run complete source gate
        shell: bash
        run: |
          BUILD_COMMIT="$SOURCE_COMMIT" ./run-tests.sh 2>&1 | tee /tmp/source-gate.log
          TEST_COUNT=$(awk '/^# tests /{value=$3} END{print value}' /tmp/source-gate.log)
          test -n "$TEST_COUNT"
          echo "TEST_COUNT=$TEST_COUNT" >> "$GITHUB_ENV"

      - name: Update canonical records
        shell: bash
        run: |
          python .github/scripts/reconcile_transfers_continuation.py docs "$TEST_COUNT" /tmp/reconciled-profile.json
          git add CLAUDE.md docs
          git commit -m 'Document reconciled Transfers continuation'
          git push origin HEAD:agent/transfers-exact-continuation
          echo "REVIEW_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run final complete repository gate
        shell: bash
        run: |
          BUILD_COMMIT="$REVIEW_COMMIT" ./run-tests.sh 2>&1 | tee /tmp/final-gate.log
          FINAL_COUNT=$(awk '/^# tests /{value=$3} END{print value}' /tmp/final-gate.log)
          test "$FINAL_COUNT" = "$TEST_COUNT"

      - name: Verify deterministic production builds
        shell: bash
        run: |
          mkdir -p /tmp/build-one/dist
          cp dist/index.html dist/app.bundle.js dist/manifest.json /tmp/build-one/dist/
          cp index.html /tmp/build-one/index.html
          BUILD_COMMIT="$REVIEW_COMMIT" node build.mjs
          cmp /tmp/build-one/dist/index.html dist/index.html
          cmp /tmp/build-one/dist/app.bundle.js dist/app.bundle.js
          cmp /tmp/build-one/dist/manifest.json dist/manifest.json
          cmp /tmp/build-one/index.html index.html
          cmp dist/index.html index.html

      - name: Commit verified build and remove temporary tooling
        shell: bash
        run: |
          rm .github/workflows/reconcile-transfers-continuation.yml .github/scripts/reconcile_transfers_continuation.py
          git add dist/index.html dist/app.bundle.js dist/manifest.json index.html .github/workflows/reconcile-transfers-continuation.yml .github/scripts/reconcile_transfers_continuation.py
          git commit -m 'Build verified reconciled Transfers continuation'
          git push origin HEAD:agent/transfers-exact-continuation
