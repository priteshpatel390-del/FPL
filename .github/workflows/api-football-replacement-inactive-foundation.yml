# Owner-gated replacement inactive collector foundation. Repository presence and merge do not authorize dispatch.
name: API-Football Replacement Inactive Collector Foundation

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact current main SHA approved for replacement foundation execution
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: api-football-replacement-inactive-foundation
  cancel-in-progress: false

jobs:
  repository-gate:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      approved_sha: ${{ steps.identity.outputs.approved_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = workflow_dispatch
          test "$EVENT_RUN_ATTEMPT" = 1
          test "$EVENT_REF" = refs/heads/main
          test "$EVENT_REPOSITORY" = priteshpatel390-del/FPL
          printf '%s' "$APPROVED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$EVENT_SHA" = "$APPROVED_SHA"
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)" = "$APPROVED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "approved_sha=$APPROVED_SHA" >> "$GITHUB_OUTPUT"
      - name: Require exact-head Verify Teamsheet success
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ steps.identity.outputs.approved_sha }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/commits/$APPROVED_SHA/check-runs" > "$RUNNER_TEMP/check-runs.json"
          node --input-type=module - "$RUNNER_TEMP/check-runs.json" <<'NODE'
          import fs from 'node:fs';
          const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!(body.check_runs??[]).some(row=>row.name==='Tests and deterministic build'&&row.status==='completed'&&row.conclusion==='success'&&row.head_sha===process.env.APPROVED_SHA&&row.app?.slug==='github-actions'&&row.details_url?.startsWith('https://github.com/priteshpatel390-del/FPL/actions/runs/')))throw new Error('exact-head Verify Teamsheet success is absent');
          NODE
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
      - name: Run focused replacement foundation tests
        run: |
          node --test tests/api-football-replacement-foundation.test.mjs tests/api-football-version-url-creation-experiment.test.mjs tests/api-football-version-url-lifecycle-observation.test.mjs tests/api-football-collector-activation-live-preflight.test.mjs
          test -z "$(git status --porcelain --untracked-files=all)"

  fresh-readonly-admission:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    needs: repository-gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: data-steward-readonly
      deployment: false
    outputs:
      artifact_sha256: ${{ steps.handoff.outputs.artifact_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.repository-gate.outputs.approved_sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
      - name: Prove original collector exact three-Version pristine state
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
          API_FOOTBALL_PREFLIGHT_STAGE: VERSION_URL_CREATION_EXPERIMENT_CLOSEOUT
          API_FOOTBALL_ATTENDED_VERSION_ID: 04d79556-3070-429f-9944-b5b53d799842
          API_FOOTBALL_ATTENDED_VERSION_APPROVED_SHA: 69bb84fadbcce94e9fece3ff438d985866cce183
          API_FOOTBALL_LIFECYCLE_CLONE_VERSION_ID: 7405abc0-8358-4156-8226-b6cc7bcf244f
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID }}
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
          DATA_STEWARD_CLOUDFLARE_READ_TOKEN: ${{ secrets.DATA_STEWARD_CLOUDFLARE_READ_TOKEN }}
          API_FOOTBALL_ACTIVATION_PREFLIGHT_REPORT_PATH: ${{ runner.temp }}/replacement-admission.json
        run: node workers/api-football-collector/activation-live-preflight.mjs
      - id: handoff
        env:
          REPORT: ${{ runner.temp }}/replacement-admission.json
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';import {createHash} from 'node:crypto';
          const bytes=fs.readFileSync(process.env.REPORT),r=JSON.parse(bytes),i=r.inventory??{};
          if(r.ok!==true||r.approvedSha!==process.env.APPROVED_SHA||r.stage!=='VERSION_URL_CREATION_EXPERIMENT_CLOSEOUT'||i.versionInventoryExact!==true||i.cloneVersionIdentityExact!==true||i.workersDev!==false||i.previewUrls!==false||i.deploymentCount!==0||i.cronCount!==0||i.routeCount!==0||i.customDomainCount!==0||r.runtime?.collectionEnabled!==0||r.runtime?.credentialState!=='AVAILABLE'||r.runtime?.activeLease!==false||r.priorState?.requestAttempts!==0||r.priorState?.generations!==0||r.priorState?.fixtureRevisions!==0||r.evidence?.productionMutations!==0||r.evidence?.apiFootballRequests!==0||r.evidence?.secretValuesRead!==0)throw new Error('replacement admission invalid');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`artifact_sha256=${createHash('sha256').update(bytes).digest('hex')}\n`);
          NODE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: api-football-replacement-admission
          path: ${{ runner.temp }}/replacement-admission.json
          retention-days: 7

  protected-replacement-foundation:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    needs: [repository-gate, fresh-readonly-admission]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: api-football-replacement-foundation
      deployment: false
    outputs:
      artifact_sha256: ${{ steps.handoff.outputs.artifact_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.repository-gate.outputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          name: api-football-replacement-admission
          path: ${{ runner.temp }}/replacement-admission
      - name: Reconfirm exact main and admission handoff
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
          REPORT: ${{ runner.temp }}/replacement-admission/replacement-admission.json
          EXPECTED_ARTIFACT_SHA256: ${{ needs.fresh-readonly-admission.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)" = "$APPROVED_SHA"
          test "$(sha256sum "$REPORT" | cut -d' ' -f1)" = "$EXPECTED_ARTIFACT_SHA256"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Create replacement shell and one inactive reviewed Version, probe routing, restore Preview disabled on every path
        id: execute
        continue-on-error: true
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.CLOUDFLARE_ACCOUNT_FINGERPRINT }}
          CLOUDFLARE_REPLACEMENT_READ_TOKEN: ${{ secrets.CLOUDFLARE_REPLACEMENT_READ_TOKEN }}
          CLOUDFLARE_REPLACEMENT_MUTATION_TOKEN: ${{ secrets.CLOUDFLARE_REPLACEMENT_MUTATION_TOKEN }}
          API_FOOTBALL_API_KEY: ${{ secrets.API_FOOTBALL_API_KEY }}
          API_FOOTBALL_ATTENDED_TRIGGER_SECRET: ${{ secrets.API_FOOTBALL_ATTENDED_TRIGGER_SECRET }}
          API_FOOTBALL_REPLACEMENT_REPORT_PATH: ${{ runner.temp }}/replacement-execution.json
        run: node workers/api-football-collector/replacement-foundation.mjs
      - id: handoff
        if: always()
        env:
          REPORT: ${{ runner.temp }}/replacement-execution.json
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
        run: |
          set -euo pipefail
          test -f "$REPORT"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';import {createHash} from 'node:crypto';
          const bytes=fs.readFileSync(process.env.REPORT),r=JSON.parse(bytes);
          const classes=['REPLACEMENT_INACTIVE_COLLECTOR_FOUNDATION_RECONCILIATION_REQUIRED','REPLACEMENT_INACTIVE_COLLECTOR_CLEAN_SAFE_STOP','REPLACEMENT_INACTIVE_COLLECTOR_OWNER_ATTENTION_REQUIRED'];
          if(!classes.includes(r.classification)||(r.complete===true&&r.safeStop===true)||(r.safeStop===true&&r.replacementState!=='ABSENT'&&r.previewDisabled!==true))throw new Error('replacement execution classification invalid');
          if(r.approvedSha!==process.env.APPROVED_SHA||r.retryAuthorized!==false||r.mutationCounts?.createShell>1||r.mutationCounts?.uploadVersion>1||r.mutationCounts?.disablePreview>1||r.deploymentsCreated!==0||r.workersDevEnabled!==0||r.cronRouteDomainMutations!==0||r.accessMutations!==0||r.d1Mutations!==0||r.providerRequests!==0||r.triggerHeaderRequests!==0)throw new Error('replacement execution evidence invalid');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`artifact_sha256=${createHash('sha256').update(bytes).digest('hex')}\n`);
          NODE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: api-football-replacement-execution
          path: ${{ runner.temp }}/replacement-execution.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve protected execution outcome
        if: steps.execute.outcome != 'success'
        run: exit 1

  final-readonly-reconciliation:
    if: always() && needs.repository-gate.result == 'success' && needs.fresh-readonly-admission.result == 'success' && needs.protected-replacement-foundation.result != 'skipped'
    needs: [repository-gate, fresh-readonly-admission, protected-replacement-foundation]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: data-steward-readonly
      deployment: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.repository-gate.outputs.approved_sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          name: api-football-replacement-execution
          path: ${{ runner.temp }}/replacement-execution
      - name: Independently re-prove original collector and D1/runtime state
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
          API_FOOTBALL_PREFLIGHT_STAGE: VERSION_URL_CREATION_EXPERIMENT_CLOSEOUT
          API_FOOTBALL_ATTENDED_VERSION_ID: 04d79556-3070-429f-9944-b5b53d799842
          API_FOOTBALL_ATTENDED_VERSION_APPROVED_SHA: 69bb84fadbcce94e9fece3ff438d985866cce183
          API_FOOTBALL_LIFECYCLE_CLONE_VERSION_ID: 7405abc0-8358-4156-8226-b6cc7bcf244f
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID }}
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
          DATA_STEWARD_CLOUDFLARE_READ_TOKEN: ${{ secrets.DATA_STEWARD_CLOUDFLARE_READ_TOKEN }}
          API_FOOTBALL_ACTIVATION_PREFLIGHT_REPORT_PATH: ${{ runner.temp }}/replacement-original-final.json
        run: node workers/api-football-collector/activation-live-preflight.mjs
      - name: Independently reconcile success, clean safe stop or unresolved owner attention
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_REPLACEMENT_READ_TOKEN: ${{ secrets.DATA_STEWARD_CLOUDFLARE_READ_TOKEN }}
          API_FOOTBALL_REPLACEMENT_EXECUTION_PATH: ${{ runner.temp }}/replacement-execution/replacement-execution.json
          API_FOOTBALL_REPLACEMENT_ORIGINAL_REPORT_PATH: ${{ runner.temp }}/replacement-original-final.json
          API_FOOTBALL_REPLACEMENT_RECONCILIATION_PATH: ${{ runner.temp }}/replacement-reconciliation.json
        run: node workers/api-football-collector/replacement-reconciliation.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: api-football-replacement-reconciliation
          path: ${{ runner.temp }}/replacement-reconciliation.json
          retention-days: 7
