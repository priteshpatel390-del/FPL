name: Teamsheet 2.0.2 implementation and verification

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: teamsheet-2.0.2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out approved branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure verification identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node --version
          python3 --version

      - name: Implement, test, build and publish verified commits
        env:
          GITHUB_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: python3 tools/implement-team-decision-home.py
