name: Teamsheet 2.0.3 implementation

on:
  push:
    branches:
      - agent/teamsheet-2.0.3-transfers-decision-workspace
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Use repository Node baseline
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct and apply approved patch
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/teamsheet-2.0.3-bootstrap/apply.part-* > /tmp/apply-teamsheet-2.0.3.mjs
          node --check /tmp/apply-teamsheet-2.0.3.mjs
          node /tmp/apply-teamsheet-2.0.3.mjs
          # Correct a bootstrap transcription typo before verification.
          sed -i 's/assert\.catch/assert.match/g' tests/transfer-optimiser-view.test.mjs

      - name: Run pre-commit test baseline
        id: precommit_tests
        shell: bash
        run: |
          set -o pipefail
          ./run-tests.sh 2>&1 | tee /tmp/teamsheet-precommit-tests.log
          TEST_STATUS=${PIPESTATUS[0]}
          TEST_COUNT="$(awk '/^# tests /{n=$3} END{print n}' /tmp/teamsheet-precommit-tests.log)"
          echo "TEST_COUNT=$TEST_COUNT" >> "$GITHUB_ENV"
          exit "$TEST_STATUS"

      - name: Publish failure diagnostic only
        if: failure() && steps.precommit_tests.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts/teamsheet-2.0.3-diagnostics
          cp /tmp/teamsheet-precommit-tests.log scripts/teamsheet-2.0.3-diagnostics/precommit-tests.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/teamsheet-2.0.3-diagnostics/precommit-tests.log
          git commit -m "Record Teamsheet 2.0.3 verifier failure"
          TARGET_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Finalise test-count documentation
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TEST_COUNT:-}" ]]; then
            echo "Could not determine test count" >&2
            exit 1
          fi
          grep -RIl '{{TEST_COUNT}}' CLAUDE.md docs | xargs sed -i "s/{{TEST_COUNT}}/$TEST_COUNT/g"

      - name: Commit verified source boundary
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- index.html dist/index.html dist/app.bundle.js dist/manifest.json
          rm .github/workflows/teamsheet-2.0.3-implementation.yml
          rm -rf scripts/teamsheet-2.0.3-bootstrap scripts/teamsheet-2.0.3-payload scripts/teamsheet-2.0.3-diagnostics
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Teamsheet 2.0.3 transfer decision workspace"
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          sed -i "s/{{SOURCE_SHA}}/$SOURCE_SHA/g" docs/TEAMSHEET2-ITEM3.md

      - name: Run final tests and first identity build
        shell: bash
        run: |
          set -euo pipefail
          BUILD_COMMIT="$SOURCE_SHA" ./run-tests.sh | tee /tmp/teamsheet-final-tests.log
          FINAL_TEST_COUNT="$(awk '/^# tests /{n=$3} END{print n}' /tmp/teamsheet-final-tests.log)"
          test "$FINAL_TEST_COUNT" = "$TEST_COUNT"
          grep -q '2.4.0' dist/manifest.json
          grep -q '2026-27.3' dist/manifest.json
          mkdir -p /tmp/teamsheet-build-a
          cp index.html /tmp/teamsheet-build-a/index.html
          cp dist/index.html /tmp/teamsheet-build-a/dist-index.html
          cp dist/app.bundle.js /tmp/teamsheet-build-a/app.bundle.js
          cp dist/manifest.json /tmp/teamsheet-build-a/manifest.json

      - name: Verify deterministic second build
        shell: bash
        run: |
          set -euo pipefail
          BUILD_COMMIT="$SOURCE_SHA" node build.mjs
          cmp /tmp/teamsheet-build-a/index.html index.html
          cmp /tmp/teamsheet-build-a/dist-index.html dist/index.html
          cmp /tmp/teamsheet-build-a/app.bundle.js dist/app.bundle.js
          cmp /tmp/teamsheet-build-a/manifest.json dist/manifest.json
          cmp index.html dist/index.html
          git diff --check

      - name: Commit deployables and verification record
        shell: bash
        run: |
          set -euo pipefail
          git add docs/TEAMSHEET2-ITEM3.md index.html dist/index.html dist/app.bundle.js dist/manifest.json
          git commit -m "Finalise Teamsheet 2.0.3 deployables"
          TARGET_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Verification summary
        shell: bash
        run: |
          {
            echo "## Teamsheet 2.0.3 verification"
            echo "- Tests: ${TEST_COUNT}/${TEST_COUNT}"
            echo "- Source commit: ${SOURCE_SHA}"
            echo "- Final commit: $(git rev-parse HEAD)"
            echo "- Two byte-identical builds"
            echo "- Root index.html equals dist/index.html"
            echo "- Model/rules unchanged: 2.4.0 / 2026-27.3"
          } >> "$GITHUB_STEP_SUMMARY"
