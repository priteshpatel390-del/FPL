name: Stage 9.2 mobile polish

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage9-2-pitch-shirts
          fetch-depth: 0
      - name: Refine narrow mobile summary and verify
        run: |
          if grep -q "grid-template-areas:\"label value\"" app.html; then
            echo 'Mobile summary polish already applied; no mutation required.'
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path('app.html')
          text = path.read_text()
          old = """@media(max-width:380px){
            .team-summary{grid-template-columns:106px 1fr}.team-score{padding:11px}.team-score .value{font-size:27px}
            .team-fact{padding:8px 5px}.team-fact .label{font-size:8px}.team-fact .value{font-size:14px}
            .team-pitch{height:500px;padding-left:5px;padding-right:5px}.pitch-player{max-width:66px}.club-shirt{width:31px;height:36px}
            .shirt-wrap{height:40px}.pitch-name{font-size:9px}.pitch-meta{font-size:7.5px}.pitch-xp{font-size:8.5px}
          }
          """
          new = """@media(max-width:420px){
            .team-summary{grid-template-columns:1fr;gap:8px}
            .team-score{min-height:82px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;grid-template-areas:\"label value\" \"unit value\";column-gap:14px;align-items:center}
            .team-score .label{grid-area:label;align-self:end}.team-score .value{grid-area:value;font-size:32px;margin:0}.team-score .unit{grid-area:unit;align-self:start;margin:1px 0 0}
            .team-fact{padding:9px 7px;text-align:center}.team-fact .label{min-height:24px;display:flex;align-items:center;justify-content:center;white-space:normal;line-height:1.2;overflow:visible}.team-fact .value{font-size:16px}
          }
          @media(max-width:380px){
            .team-pitch{height:500px;padding-left:5px;padding-right:5px}.pitch-player{max-width:66px}.club-shirt{width:31px;height:36px}
            .shirt-wrap{height:40px}.pitch-name{font-size:9px}.pitch-meta{font-size:7.5px}.pitch-xp{font-size:8.5px}
          }
          """
          if old not in text:
            raise SystemExit('Expected narrow-screen CSS block was not found')
          path.write_text(text.replace(old, new))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          git commit -m 'Polish Stage 9.2 narrow mobile summary'
          SOURCE_SHA=$(git rev-parse HEAD)

          BUILD_COMMIT="$SOURCE_SHA" ./run-tests.sh
          mkdir -p /tmp/stage9-2-polish-first
          cp dist/index.html dist/app.bundle.js dist/manifest.json /tmp/stage9-2-polish-first/
          BUILD_COMMIT="$SOURCE_SHA" node build.mjs
          cmp /tmp/stage9-2-polish-first/index.html dist/index.html
          cmp /tmp/stage9-2-polish-first/app.bundle.js dist/app.bundle.js
          cmp /tmp/stage9-2-polish-first/manifest.json dist/manifest.json
          node -e "const m=require('./dist/manifest.json');if(m.commit!=='$SOURCE_SHA')throw new Error('build identity mismatch: '+m.commit)"

          git add dist/index.html dist/app.bundle.js dist/manifest.json
          git commit -m 'Refresh verified Stage 9.2 deployables'
          git push origin HEAD:agent/stage9-2-pitch-shirts
