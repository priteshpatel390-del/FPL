name: GW1-P2C2 Source Export

on:
  pull_request:
    paths:
      - '.github/workflows/gw1-p2c2-source-export.yml'

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Confirm exact branch revision
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - uses: actions/upload-artifact@v6
        with:
          name: gw1-p2c2-source-${{ github.event.pull_request.head.sha }}
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
