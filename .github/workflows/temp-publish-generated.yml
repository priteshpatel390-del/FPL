name: Temporary generated publication

on:
  push:
    branches:
      - agent/a3-cache-persistence-resilience
    paths:
      - .github/workflows/temp-publish-generated.yml

permissions:
  contents: write

concurrency:
  group: temp-generated-publication
  cancel-in-progress: false

jobs:
  publish-generated:
    if: github.event.head_commit.message == 'Add temporary generated publisher'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUILD_COMMIT: 3b6dc0f12ed239381f94f320644621560bd38047
      TARGET_BRANCH: agent/a3-cache-persistence-resilience

    steps:
      - name: Check out candidate branch exactly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard branch and build inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          git merge-base --is-ancestor "$BUILD_COMMIT" HEAD
          git diff --quiet "$BUILD_COMMIT"..HEAD -- app.html build.mjs build-utils.mjs src
          echo "Build inputs remain identical to $BUILD_COMMIT"

      - name: Generate production outputs
        shell: bash
        run: |
          set -euo pipefail
          node build.mjs
          cmp dist/index.html index.html
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import {hashBuildInputs} from './build-utils.mjs'; const m=JSON.parse(readFileSync('dist/manifest.json','utf8')); if(m.commit!==process.env.BUILD_COMMIT) throw new Error('manifest commit mismatch'); if(m.buildInputHash!==hashBuildInputs(m.moduleOrder)) throw new Error('manifest build-input mismatch'); console.log('Manifest identity verified:',m.commit,m.buildInputHash);"

      - name: Enforce generated-only diff
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git status --porcelain=v1 | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' dist/app.bundle.js dist/index.html dist/manifest.json index.html | sort)"
          printf 'Changed files:\n%s\n' "$actual"
          test "$actual" = "$expected"
          git add -- dist/app.bundle.js dist/index.html dist/manifest.json index.html
          staged="$(git diff --cached --name-only | sort)"
          test "$staged" = "$expected"

      - name: Commit generated outputs to candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate production bundle'
          git push origin "HEAD:$TARGET_BRANCH"
