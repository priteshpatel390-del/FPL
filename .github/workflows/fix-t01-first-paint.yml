name: Fix PR 80 first-paint ownership

on:
  push:
    branches:
      - agent/team-ux-startup-availability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'priteshpatel390-del'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/team-ux-startup-availability
          fetch-depth: 0

      - name: Apply first-paint startup ownership and regression
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path

          app = Path('app.html')
          text = app.read_text()
          old = 'body.startup-pending{overflow:hidden}\n'
          new = '''body.startup-pending{overflow:hidden}\nbody.startup-pending > header,\nbody.startup-pending > main,\nbody.startup-pending > nav.tabs{visibility:hidden}\n'''
          if old not in text:
              raise SystemExit('startup-pending CSS anchor not found')
          if 'body.startup-pending > nav.tabs{visibility:hidden}' not in text:
              text = text.replace(old, new, 1)
          app.write_text(text)

          test = Path('tests/team-ux-startup-availability.test.mjs')
          text = test.read_text()
          anchor = "const TEAM_SOURCE=readFileSync(new URL('../src/ui/team-decision-home.mjs',import.meta.url),'utf8');\n"
          if anchor not in text:
              raise SystemExit('test source anchor not found')
          app_const = "const APP_SOURCE=readFileSync(new URL('../app.html',import.meta.url),'utf8');\n"
          if app_const not in text:
              text = text.replace(anchor, anchor + app_const, 1)
          new_test = '''\ntest('startup ownership exists in static CSS before application JavaScript runs',()=>{\n  assert.match(APP_SOURCE,/body\\.startup-pending\\s*>\\s*header,\\s*body\\.startup-pending\\s*>\\s*main,\\s*body\\.startup-pending\\s*>\\s*nav\\.tabs\\s*\\{\\s*visibility:hidden\\s*\\}/s);\n});\n'''
          if "startup ownership exists in static CSS before application JavaScript runs" not in text:
              text += new_test
          test.write_text(text)
          PY

      - name: Commit source fix and remove this one-time workflow
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html tests/team-ux-startup-availability.test.mjs
          git rm .github/workflows/fix-t01-first-paint.yml
          git commit -m "Fix T-01 first-paint startup ownership"
          git push origin HEAD:agent/team-ux-startup-availability
