name: Apply Teamsheet 2.0.4 source

on:
  push:
    branches:
      - agent/teamsheet-2.0.4-mini-leagues

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Run Teamsheet 2.0.4 source patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/teamsheet-2.0.4-mini-leagues
          fetch-depth: 0
      - name: Apply approved source patch
        run: |
          cat .github/agent-patch.part-* | base64 -d | gzip -d > /tmp/teamsheet.patch
          git apply --check /tmp/teamsheet.patch
          git apply /tmp/teamsheet.patch
          rm -f .github/agent-patch.part-* .github/workflows/agent-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Teamsheet 2.0.4 Mini Leagues"
          git push origin HEAD:agent/teamsheet-2.0.4-mini-leagues
