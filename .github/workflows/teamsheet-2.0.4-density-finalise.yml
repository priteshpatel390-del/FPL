name: Finalise Teamsheet 2.0.4 density refinement

on:
  push:
    branches:
      - agent/teamsheet-2.0.4-mini-leagues
    paths:
      - .github/workflows/teamsheet-2.0.4-density-finalise.yml

permissions:
  contents: write

concurrency:
  group: teamsheet-2.0.4-density-finalise
  cancel-in-progress: false

jobs:
  finalise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved branch
        uses: actions/checkout@v4
        with:
          ref: agent/teamsheet-2.0.4-mini-leagues
          fetch-depth: 0

      - name: Apply owner-approved density refinement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('app.html')
          app = app_path.read_text()
          marker = '/* Teamsheet 2.0.4 — Mini Leagues official decision foundation */'
          start = app.index(marker)
          end = app.index('\n\n</style>', start)
          compact_css = r'''/* Teamsheet 2.0.4 — Mini Leagues official decision foundation */
          .league-view{display:grid;gap:10px}.league-route{display:grid;gap:10px}.league-route[hidden]{display:none}
          .league-topbar{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:9px}.league-picker{min-height:44px;max-width:240px;overflow-wrap:anywhere;text-align:left;padding:8px 11px}
          .league-hero{display:grid;gap:6px;padding:12px 13px;border-radius:13px;background:linear-gradient(145deg,#173B28,#10251A);color:#fff;box-shadow:var(--shadow)}
          .league-hero .eyebrow{color:#B9C9BF}.league-hero-head{display:flex;align-items:flex-start;justify-content:space-between;gap:9px}.league-hero h3{font-size:17px;line-height:1.15;overflow-wrap:anywhere}.league-hero .btn.ghost{color:#fff;border-color:rgba(255,255,255,.56)}.league-hero .btn.ghost:hover{background:rgba(255,255,255,.12)}
          .league-position-line{display:flex;align-items:center;justify-content:space-between;gap:9px}.league-position{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}.league-position strong{font-family:'Bricolage Grotesque',sans-serif;font-size:30px;line-height:1}.league-position span{color:#D8E2DB;font-size:12px}.league-position-line>.flag{flex:0 0 auto;margin-left:0}
          .league-status-row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#D8E2DB;font-size:11px}.league-status-copy{margin:0;color:#D8E2DB;font-size:11px}.league-hero .note{margin:2px 0 0;padding:8px 10px;font-size:11px}
          .league-gap-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:12px}.league-gap{display:grid;gap:1px;padding:8px 7px;border:1px solid var(--line);border-radius:10px;background:#fff;min-width:0;text-align:center}.league-gap.current{border-color:var(--pitch);background:#F5FAF6}.league-gap span,.league-gap small{font-size:10px;color:var(--ink-soft);overflow-wrap:anywhere;line-height:1.2}.league-gap strong{font-family:'IBM Plex Mono',monospace;font-size:14px}
          #leagueLandingOut>.league-section,#leagueLandingOut>.league-actions{margin-top:9px}.league-section{display:grid;gap:7px}.league-section-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.league-section-head h3{font-size:14px}.league-text-link{font-size:12px;font-weight:700}.league-rival-list,.league-manage-list,.league-standings-list{display:grid;gap:6px}
          .league-rival-card,.league-manage-row,.league-standing-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;min-width:0}.league-rival-copy,.league-manage-row>div:first-child,.league-standing-name{display:grid;gap:1px;min-width:0}.league-rival-copy strong,.league-manage-row strong,.league-standing-name strong{font-size:13px;line-height:1.2;overflow-wrap:anywhere}.league-rival-copy span,.league-rival-copy small,.league-standing-name small{font-size:10.5px;color:var(--ink-soft)}
          .league-rival-actions,.league-manage-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.league-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.league-actions .btn{text-align:center;min-height:44px;display:grid;place-items:center;text-decoration:none}
          .league-standing-row{grid-template-columns:42px minmax(0,1fr) 52px 56px;min-height:52px;padding:8px 9px}.league-standing-row.mine{border:2px solid var(--info);background:#F4F8FB}.league-standing-row.interactive{cursor:pointer}.league-standing-row.interactive:hover{background:#F7F9F5}.league-standing-row.interactive:focus-visible{outline:2.5px solid var(--info);outline-offset:2px}.league-standing-rank,.league-standing-points{font-family:'IBM Plex Mono',monospace;font-weight:600}.league-standing-points{text-align:right}.league-standing-action{justify-self:end;display:inline-flex;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--ink-soft);white-space:nowrap}.league-standing-action .chev{font-size:17px;line-height:1;color:var(--claret)}
          .league-rival-summary{display:grid;gap:9px}.league-comparison-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.league-comparison-facts>div{display:grid;gap:1px;padding:8px;border:1px solid var(--line);border-radius:9px}.league-comparison-facts span{font-size:10px;color:var(--ink-soft)}.league-comparison-facts strong{overflow-wrap:anywhere}
          .league-difference-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.league-player-differences{padding:9px;border:1px solid var(--line);border-radius:10px;min-width:0}.league-player-differences ul{margin:6px 0 0;padding-left:18px}.league-player-differences li{overflow-wrap:anywhere}
          .league-manage-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}.league-manage-form input{width:100%;min-height:44px}.league-manage-row.selected{border-color:var(--pitch);background:#F5FAF6}
          #leagueLandingOut[aria-busy=true],#leagueRivalOut[aria-busy=true]{opacity:.72}
          @media(max-width:520px){.league-topbar{grid-template-columns:1fr;align-items:stretch}.league-picker{max-width:none;width:100%}.league-rival-card,.league-manage-row{grid-template-columns:1fr}.league-rival-actions,.league-manage-actions{justify-content:flex-start}.league-standing-row{grid-template-columns:38px minmax(0,1fr) 44px 52px}.league-difference-grid{grid-template-columns:1fr}.league-manage-form{grid-template-columns:1fr}.league-manage-form .btn{min-height:44px}.league-actions{grid-template-columns:1fr 1fr}}
          @media(max-width:350px){.league-gap-grid,.league-actions,.league-comparison-facts{grid-template-columns:1fr}.league-standing-row{grid-template-columns:34px minmax(0,1fr) 42px 30px}.league-standing-action{font-size:0}.league-standing-action .chev{font-size:18px}}
          @media(prefers-reduced-motion:reduce){.league-view *{scroll-behavior:auto;transition:none}}'''
          app = app[:start] + compact_css + app[end:]
          app_path.write_text(app)

          view_path = Path('src/ui/mini-leagues-view.mjs')
          view = view_path.read_text()

          hero_pattern = re.compile(r"  const hero=el\('section',\{class:'league-hero'.*?\);\n  const gaps=", re.S)
          hero_replacement = r'''  const statusSummary=!S.seasonLive?'No completed Gameweek yet':status.provisional?'Scores and positions may still change':'Confirmed after official FPL checks';
          const position=rank!==null?el('div',{class:'league-position'},el('strong',{},miniLeagueOrdinal(rank)),el('span',{},total!==null?`${total} points`:'Official points unavailable')):el('div',{class:'league-position'},el('strong',{},'Position unavailable'),el('span',{},'Your connected team was not found on the loaded standings pages.'));
          const movementFlag=el('span',{class:`flag ${movement.direction==='up'?'rise':movement.direction==='down'?'fall':'dark'}`},movement.label);
          const hero=el('section',{class:'league-hero','aria-label':`${data.league.name} official position`},
            el('div',{class:'league-hero-head'},el('div',{},el('span',{class:'eyebrow'},status.label),el('h3',{},data.league.name)),miniLeagueButton('Refresh',{onclick:()=>loadMiniLeagueStandings({force:true})})),
            el('div',{class:'league-position-line'},position,movementFlag),
            el('div',{class:'league-status-row'},el('span',{},statusSummary),el('span',{},miniLeagueAgeLabel(data.updatedAt))),
            data.stale?el('div',{class:'note plain'},'Refresh failed. Showing the last standings loaded in this session; this view may be out of date.'):null);
          const gaps='''
          view, hero_count = hero_pattern.subn(hero_replacement, view, count=1)
          if hero_count != 1:
              raise SystemExit(f'Expected one League hero replacement, found {hero_count}')

          old_actions = "  const actions=el('div',{class:'league-actions'},miniLeagueLink('View standings','#/leagues/standings','btn'),miniLeagueLink('Manage leagues','#/leagues/manage','btn ghost'),miniLeagueLink('Review Team','#/team','btn ghost'),miniLeagueLink('Review Transfers','#/transfers','btn ghost'));"
          new_actions = "  const actions=el('div',{class:'league-actions'},miniLeagueLink('View standings','#/leagues/standings','btn'),miniLeagueLink('Manage leagues','#/leagues/manage','btn ghost'));"
          if old_actions not in view:
              raise SystemExit('League landing action block did not match expected source')
          view = view.replace(old_actions, new_actions, 1)

          standings_pattern = re.compile(r"function renderMiniLeagueStandings\(\)\{.*?\n\}\nfunction renderMiniLeagueRival\(\)\{", re.S)
          standings_replacement = r'''function renderMiniLeagueStandings(){
            const out=$('leagueStandingsOut'),data=miniLeagueSelectedData(); if(!out) return;
            if(!data){ setChildren(out,miniLeagueEmpty('No standings loaded','Return to the League overview and load the selected league.',miniLeagueLink('Back to League','#/leagues','btn'))); return; }
            const rows=data.rows.slice().sort((a,b)=>Number(a.rank)-Number(b.rank));
            setChildren(out,el('div',{class:'league-standings-list'},rows.map(row=>{
              const mine=String(row.entry)===String(S.teamId); const movement=miniLeagueMovement(row.rank,row.last_rank);
              const open=async()=>{await selectMiniLeagueRival(data.league.id,{id:row.entry,name:miniLeagueManagerName(row)});miniLeagueNavigate('#/leagues/rival');};
              const attrs={class:`league-standing-row${mine?' mine':' interactive'}`,'aria-label':`${mine?'Your team, ':'Open rival comparison, '}${miniLeagueOrdinal(row.rank)}, ${miniLeagueManagerName(row)}, ${row.total??'points unavailable'} points, ${movement.label}`};
              if(!mine) Object.assign(attrs,{role:'button',tabindex:'0',onclick:open,onkeydown:event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();open();}}});
              return el('article',attrs,
                el('span',{class:'league-standing-rank'},miniLeagueOrdinal(row.rank)),el('span',{class:'league-standing-name'},el('strong',{},miniLeagueManagerName(row)),el('small',{},row.player_name&&row.player_name!==row.entry_name?row.player_name:movement.label)),el('span',{class:'league-standing-points'},row.total??'—'),
                mine?el('span',{class:'flag info'},'Your team'):el('span',{class:'league-standing-action','aria-hidden':'true'},'Open',el('span',{class:'chev'},'›')));
            })),data.browseHasNext?el('div',{class:'mt-12'},miniLeagueButton('Load more standings',{onclick:()=>loadNextMiniLeagueStandingsPage()})):null,
              data.hasNext?el('p',{class:'status mt-12'},'More standings exist. Teamsheet loads them only when requested and does not scan every rival squad.'):null);
          }
          function renderMiniLeagueRival(){'''
          view, standings_count = standings_pattern.subn(standings_replacement, view, count=1)
          if standings_count != 1:
              raise SystemExit(f'Expected one standings replacement, found {standings_count}')
          view_path.write_text(view)

          test_path = Path('tests/mini-leagues-ui.test.mjs')
          tests = test_path.read_text()
          old_narrow = "  includesAll(app,['.league-topbar{align-items:stretch;flex-direction:column}', '.league-picker{max-width:none;width:100%}', '.league-hero .btn.ghost{color:#fff', '.league-hero>.flag{justify-self:start}']);"
          new_narrow = "  includesAll(app,['@media(max-width:520px){.league-topbar{grid-template-columns:1fr;align-items:stretch}', '.league-picker{max-width:none;width:100%}', '.league-hero .btn.ghost{color:#fff', '.league-position-line{display:flex']);"
          if old_narrow not in tests:
              raise SystemExit('Narrow-header test did not match expected source')
          tests = tests.replace(old_narrow, new_narrow, 1)
          old_accessibility = "  includesAll(view,[\"'aria-label':`${mine?'Your team, ':''}\",'Your team','Loading ${league.name||\\'selected league\\'} standings']);"
          new_accessibility = "  includesAll(view,[\"'aria-label':`${mine?'Your team, ':'Open rival comparison, '}\",\"role:'button'\",\"tabindex:'0'\",\"event.key==='Enter'||event.key===' '\",'Your team','Loading ${league.name||\\'selected league\\'} standings']);"
          if old_accessibility not in tests:
              raise SystemExit('Accessibility test did not match expected source')
          tests = tests.replace(old_accessibility, new_accessibility, 1)

          insertion = r'''

          test('owner-approved compact League hierarchy keeps primary context visible without duplicate landing actions',()=>{
            const landing=view.slice(view.indexOf('function renderMiniLeagueLanding'),view.indexOf('function renderMiniLeagueRivalCard'));
            includesAll(app,['.league-position-line{display:flex','.league-status-row{display:flex','.league-gap-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:12px','#leagueLandingOut>.league-section,#leagueLandingOut>.league-actions{margin-top:9px']);
            includesAll(landing,['league-position-line','league-status-row',"miniLeagueLink('View standings','#/leagues/standings','btn')","miniLeagueLink('Manage leagues','#/leagues/manage','btn ghost')"]);
            excludesAll(landing,["miniLeagueLink('Review Team'","miniLeagueLink('Review Transfers'"]);
          });

          test('standings use full-row touch and keyboard actions with a quiet trailing affordance',()=>{
            const standingsStart=view.indexOf('function renderMiniLeagueStandings');
            const standings=view.slice(standingsStart,view.indexOf('function renderMiniLeagueRival(){',standingsStart));
            includesAll(app,['.league-standing-row.interactive{cursor:pointer','.league-standing-row.interactive:focus-visible','.league-standing-action{justify-self:end']);
            includesAll(standings,["class:`league-standing-row${mine?' mine':' interactive'}`","role:'button'","tabindex:'0'","event.key==='Enter'||event.key===' '","class:'league-standing-action'","class:'chev'",'Open']);
            excludesAll(standings,["miniLeagueButton('Compare'"]);
          });
          '''
          marker_test = "\ntest('new modules are in the deterministic bundle before the startup view',()=>{"
          if marker_test not in tests:
              raise SystemExit('Test insertion marker not found')
          tests = tests.replace(marker_test, insertion + marker_test, 1)
          test_path.write_text(tests)

          item_path = Path('docs/TEAMSHEET2-ITEM4.md')
          item = item_path.read_text()
          item = item.replace(
              'The first screen does not present a dense full table. It leads with league identity, Official FPL status, current position/points, supplied movement, nearest gaps, up to three rival cards and direct links to standings, Team and Transfers.',
              'The first screen does not present a dense full table. It leads with a compact league identity and status card, current position/points, supplied movement, deliberately separated nearest-gap cards, up to three nearby rival rows and direct links to standings and league management.'
          )
          mobile_marker = '- no horizontally scrolling technical table on the landing or rival screen;\n'
          mobile_addition = (
              '- no horizontally scrolling technical table on the landing or rival screen;\n'
              '- owner-approved compact hierarchy keeps rank, points and movement together while giving the supporting Above / You / Below cards deliberate breathing room;\n'
              '- standings managers are full-row touch and keyboard targets with a quiet trailing `Open ›` affordance instead of repeated Compare buttons;\n'
          )
          if mobile_marker not in item:
              raise SystemExit('Item 4 mobile marker not found')
          item = item.replace(mobile_marker, mobile_addition, 1)
          item_path.write_text(item)

          changelog_path = Path('docs/CHANGELOG.md')
          changelog = changelog_path.read_text()
          changelog_marker = '- Added strict displayed-field validation, stale/incomplete states and mobile/accessibility contracts.\n'
          changelog_addition = (
              '- Added strict displayed-field validation, stale/incomplete states and mobile/accessibility contracts.\n'
              '- Applied the owner-approved compact mobile hierarchy, added breathing room below the position card and made standings rows full-row touch/keyboard actions with a quiet `Open ›` affordance.\n'
          )
          if changelog_marker not in changelog:
              raise SystemExit('Changelog 2.0.4 marker not found')
          changelog_path.write_text(changelog.replace(changelog_marker, changelog_addition, 1))
          PY

      - name: Commit refined source and tests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html src/ui/mini-leagues-view.mjs tests/mini-leagues-ui.test.mjs docs/TEAMSHEET2-ITEM4.md docs/CHANGELOG.md
          git diff --cached --check
          git commit -m "Refine Mini Leagues mobile density"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run full test suite
        shell: bash
        run: |
          ./run-tests.sh | tee /tmp/teamsheet-tests.log
          grep -Eq '(^|[^0-9])493([^0-9]|$)' /tmp/teamsheet-tests.log

      - name: Build twice and verify reproducibility
        shell: bash
        run: |
          node build.mjs
          mkdir -p /tmp/teamsheet-build-one/dist
          cp index.html /tmp/teamsheet-build-one/index.html
          cp dist/index.html /tmp/teamsheet-build-one/dist/index.html
          cp dist/app.bundle.js /tmp/teamsheet-build-one/dist/app.bundle.js
          cp dist/manifest.json /tmp/teamsheet-build-one/dist/manifest.json
          node build.mjs
          cmp /tmp/teamsheet-build-one/index.html index.html
          cmp /tmp/teamsheet-build-one/dist/index.html dist/index.html
          cmp /tmp/teamsheet-build-one/dist/app.bundle.js dist/app.bundle.js
          cmp /tmp/teamsheet-build-one/dist/manifest.json dist/manifest.json
          cmp index.html dist/index.html
          git diff --check
          sha256sum index.html dist/index.html dist/app.bundle.js dist/manifest.json | tee /tmp/teamsheet-hashes.txt

      - name: Refresh canonical verification records
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          source_commit = os.environ['SOURCE_COMMIT']
          paths = [
              Path('CLAUDE.md'),
              Path('docs/PROJECT_CONTEXT.md'),
              Path('docs/ROADMAP.md'),
              Path('docs/TESTING.md'),
              Path('docs/CHANGELOG.md'),
              Path('docs/TEAMSHEET2-ITEM4.md'),
          ]
          for path in paths:
              if not path.exists():
                  continue
              text = path.read_text()
              text = text.replace('491/491', '493/493')
              text = text.replace('491 tests, 491 passed', '493 tests, 493 passed')
              text = text.replace('491 tests', '493 tests')
              text = text.replace('491 passed', '493 passed')
              path.write_text(text)

          item_path = Path('docs/TEAMSHEET2-ITEM4.md')
          item = item_path.read_text()
          item = re.sub(
              r'- Verified source `[^`]+` completed 493/493 tests\. Two exact-identity builds were byte-identical and root `index\.html` equalled `dist/index\.html`\.',
              f'- Verified source `{source_commit}` completed 493/493 tests. Two exact-identity builds were byte-identical and root `index.html` equalled `dist/index.html`.',
              item,
          )
          item_path.write_text(item)
          PY

      - name: Commit generated files and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/teamsheet-2.0.4-density-finalise.yml
          git add -A
          git diff --cached --check
          git commit -m "Finalise Mini Leagues density refinement [density-finalised]"
          git push origin HEAD:agent/teamsheet-2.0.4-mini-leagues
