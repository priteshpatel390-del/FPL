name: Stage 9.3 trigger

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage9-3-player-detail-uncertainty
          fetch-depth: 0
      - name: Run embedded Stage 9.3 implementation
        run: |
          if [ -f src/ui/player-detail.mjs ]; then
            echo "Stage 9.3 implementation already present."
            exit 0
          fi
          awk '/python - <<'"'"'PY'"'"'/{capture=1;next} /^          PY$/{capture=0} capture{sub(/^          /,"");print}' .github/workflows/stage9-3-implement.yml > /tmp/stage9-3-implement.py
          python /tmp/stage9-3-implement.py || true

          python - <<'PY'
          from pathlib import Path
          path=Path('src/ui/views.mjs')
          text=path.read_text()
          old="    return elNode('div',{class:`pitch-player${benchIndex==null?'':' bench-player'}${bad?' warn':''}`,"
          new="    return elNode('button',{type:'button',class:`pitch-player${benchIndex==null?'':' bench-player'}${bad?' warn':''}`,"
          if old in text:
              text=text.replace(old,new,1)
              aria="      'aria-label':`${label}, ${fixture}, ${projected} expected points${role==='captain'?', captain':role==='vice'?', vice-captain':''}`},"
              if aria not in text:
                  raise SystemExit('Pitch aria-label marker not found')
              text=text.replace(aria,"      onclick:event=>openPlayerDetailView(p,gw,1,event.currentTarget),\n"+aria,1)
          elif "return elNode('button',{type:'button',class:`pitch-player" not in text:
              raise SystemExit('Pitch player interaction could not be applied')

          old_all="forEach(s=>tbody.appendChild(elNode('tr',{},"
          new_all="forEach(s=>tbody.appendChild(elNode('tr',{class:'clickable',onclick:event=>openPlayerDetailView(s.p,gw,6,event.currentTarget)},"
          if old_all in text:
              text=text.replace(old_all,new_all,1)
          elif new_all not in text:
              raise SystemExit('All-15 player interaction marker not found')
          path.write_text(text)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html build.mjs src/ui/player-detail.mjs src/ui/views.mjs tests/player-detail.test.mjs
          git commit -m 'Implement Stage 9.3 player detail uncertainty'
          SOURCE_SHA=$(git rev-parse HEAD)

          BUILD_COMMIT="$SOURCE_SHA" ./run-tests.sh
          mkdir -p /tmp/stage9-3-first
          cp dist/index.html dist/app.bundle.js dist/manifest.json /tmp/stage9-3-first/
          BUILD_COMMIT="$SOURCE_SHA" node build.mjs
          cmp /tmp/stage9-3-first/index.html dist/index.html
          cmp /tmp/stage9-3-first/app.bundle.js dist/app.bundle.js
          cmp /tmp/stage9-3-first/manifest.json dist/manifest.json
          node -e "const m=require('./dist/manifest.json');if(m.commit!=='$SOURCE_SHA')throw new Error('build identity mismatch: '+m.commit)"

          git add dist/index.html dist/app.bundle.js dist/manifest.json
          git commit -m 'Commit verified Stage 9.3 deployables'
          git push origin HEAD:agent/stage9-3-player-detail-uncertainty
