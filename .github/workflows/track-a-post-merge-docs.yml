name: Track A post-merge documentation

on:
  push:
    branches:
      - agent/track-a-post-merge-docs
    paths:
      - .github/workflows/track-a-post-merge-docs.yml

permissions:
  contents: write

jobs:
  reconcile-status:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: agent/track-a-post-merge-docs
          fetch-depth: 0

      - name: Apply final merged checkpoint records
        shell: bash
        run: |
          python -m py_compile .github/scripts/track_a_post_merge_docs.py
          python .github/scripts/track_a_post_merge_docs.py

      - name: Verify documentation-only scope
        shell: bash
        run: |
          git diff --check
          CHANGED="$(git diff --name-only)"
          printf '%s\n' "$CHANGED"
          test -n "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -Ev '^(CLAUDE\.md|docs/(PROJECT_CONTEXT|ROADMAP|KNOWN_LIMITATIONS|TESTING|CHANGELOG|TRANSFERS-EXACT-PERFORMANCE)\.md)$'; then
            echo 'Unexpected non-documentation change detected.' >&2
            exit 1
          fi
          git diff --quiet -- src dist index.html build.mjs tests
          grep -F 'be742e1eb707b3892f6405adf5d8769e084eee65' CLAUDE.md docs/PROJECT_CONTEXT.md docs/ROADMAP.md docs/KNOWN_LIMITATIONS.md docs/TESTING.md docs/CHANGELOG.md docs/TRANSFERS-EXACT-PERFORMANCE.md
          grep -F '613 passed, 0 failed, 0 skipped' CLAUDE.md docs/PROJECT_CONTEXT.md docs/TESTING.md
          ! grep -F 'A further physical retest remains required' CLAUDE.md docs/PROJECT_CONTEXT.md docs/ROADMAP.md

      - name: Commit canonical status reconciliation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CLAUDE.md docs/PROJECT_CONTEXT.md docs/ROADMAP.md docs/KNOWN_LIMITATIONS.md docs/TESTING.md docs/CHANGELOG.md docs/TRANSFERS-EXACT-PERFORMANCE.md
          git diff --cached --check
          git commit -m 'Document merged FPL-T1 and Track A checkpoint'
          git push origin HEAD:agent/track-a-post-merge-docs
