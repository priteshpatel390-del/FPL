name: Verify exact Transfers architecture

on:
  push:
    branches:
      - agent/transfers-exact-performance

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved Track A source and tests
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/model.00 .tmp/model.01 .tmp/model.02 .tmp/model.03 .tmp/model.04 .tmp/model.05 .tmp/model.06 > /tmp/transfer-model.gz.b64
          cat .tmp/patch.00 .tmp/patch.01 .tmp/patch.02 > /tmp/patch-transfer-tests.py.gz.b64
          echo "fd27f4570c2d63078f55754ee14e4d49a5db499f52f908b9a42999724047f67d  /tmp/transfer-model.gz.b64" | sha256sum -c -
          echo "66a4a4d3bc687b1106ea2f177dd295bda354e5d3381a647cdf6a0eb8f288c5ab  .tmp/transfer-ui.gz.b64" | sha256sum -c -
          echo "6da7748623d02cf59399e4189240ee985e9191151d3168715703216aa2d8396d  .tmp/transfer-exact-test.gz.b64" | sha256sum -c -
          echo "2c4717a675fbf48466307ac0b1ee4c8b0270d0f39337b8d840a1015b32b56094  /tmp/patch-transfer-tests.py.gz.b64" | sha256sum -c -
          base64 -d /tmp/transfer-model.gz.b64 | gzip -d > src/model/transfers.mjs
          base64 -d .tmp/transfer-ui.gz.b64 | gzip -d > src/ui/transfer-performance.mjs
          base64 -d .tmp/transfer-exact-test.gz.b64 | gzip -d > tests/transfer-exact-performance.test.mjs
          base64 -d /tmp/patch-transfer-tests.py.gz.b64 | gzip -d > /tmp/patch-transfer-tests.py
          python /tmp/patch-transfer-tests.py
          python - <<'PY'
          from pathlib import Path
          for name in [
              'tests/transfer-performance-runtime.test.mjs',
              'tests/transfer-performance.test.mjs',
              'tests/transfer-exact-performance.test.mjs',
              'src/model/transfers.mjs',
              'src/ui/transfer-performance.mjs',
          ]:
              path = Path(name)
              path.write_text(path.read_text().rstrip() + '\n')
          PY
          rm -rf .tmp
          rm -f .github/workflows/verify-transfers-exact.yml
          node --check src/model/transfers.mjs
          node --check src/ui/transfer-performance.mjs
          node --check tests/transfer-exact-performance.test.mjs
          git diff --check

      - name: Commit reviewed source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement exact persistent transfer search"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run full tests
        id: tests
        env:
          BUILD_COMMIT: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -o pipefail
          ./run-tests.sh 2>&1 | tee /tmp/teamsheet-tests.log

      - name: Publish exact failure diagnostics
        if: failure() && steps.source.conclusion == 'success'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Track A verification failures"
            echo "Source: ${{ steps.source.outputs.sha }}"
            echo
            awk '/^not ok /{remaining=36} remaining>0{print;remaining--}' /tmp/teamsheet-tests.log
            echo
            tail -n 24 /tmp/teamsheet-tests.log
          } > TRANSFER_VERIFICATION_FAILURES.txt
          git add TRANSFER_VERIFICATION_FAILURES.txt
          git commit -m "Record exact Transfers verification failures"
          git push origin HEAD:agent/transfers-exact-performance

      - name: Verify deterministic builds
        if: success()
        env:
          BUILD_COMMIT: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/first-build
          cp dist/index.html dist/app.bundle.js dist/manifest.json /tmp/first-build/
          node build.mjs
          cmp /tmp/first-build/index.html dist/index.html
          cmp /tmp/first-build/app.bundle.js dist/app.bundle.js
          cmp /tmp/first-build/manifest.json dist/manifest.json
          cmp index.html dist/index.html
          git diff --check

      - name: Commit generated artefacts and push
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git add dist/index.html dist/app.bundle.js dist/manifest.json index.html
          if ! git diff --cached --quiet; then
            git commit -m "Build exact persistent transfer search"
          fi
          git push origin HEAD:agent/transfers-exact-performance
