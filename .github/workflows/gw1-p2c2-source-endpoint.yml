name: Finalise GW1-P2C2 source endpoint

on:
  pull_request:
    paths:
      - '.github/workflows/gw1-p2c2-source-endpoint.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Commit exact custom-domain source endpoint
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          text=p.read_text()
          old='https://teamsheet-evidence-archive.fpltsheet.workers.dev/v1/evidence/predeadline'
          new='https://archive.fpltsheet.co.uk/v1/evidence/predeadline'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy source endpoint, found {text.count(old)}')
          if new in text:
              raise SystemExit('custom source endpoint already present unexpectedly')
          p.write_text(text.replace(old,new))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.html
          git diff --cached --check
          git commit -m 'config: set GW1-P2C2 archive custom-domain endpoint'
          echo "BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Run normal build and complete test suite from exact source commit
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$BUILD_COMMIT"
          ./run-tests.sh
      - name: Rebuild and verify exact outputs
        run: |
          set -eu
          node build.mjs
          cmp dist/index.html index.html
      - name: Commit generated deployables from exact source commit
        run: |
          set -eu
          git add dist/app.bundle.js dist/index.html dist/manifest.json index.html
          git diff --cached --check
          git diff --cached --quiet && { echo 'Expected generated outputs to change'; exit 1; }
          git commit -m 'build: regenerate GW1-P2C2 deployables from custom-domain source'
          git push origin "HEAD:${{ github.head_ref }}"
