name: Apply approved Leagues hub layout

on:
  push:
    branches:
      - agent/leagues-hub-first

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/leagues-hub-first
          fetch-depth: 0

      - name: Apply accepted full-width intro layout
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app.html')
          text = path.read_text()
          old = '''      <div class="league-hub-head">
        <div><span class="eyebrow">Competitive context</span><h2 tabindex="-1">Leagues</h2><p class="hint">Your current position across every connected classic league. Tap a league for its table, nearby rivals and deeper context.</p></div>
        <a class="btn ghost sm" href="#/leagues/manage">Manage leagues</a>
      </div>'''
          new = '''      <div class="league-hub-head">
        <div><span class="eyebrow">Competitive context</span><h2 tabindex="-1">Leagues</h2></div>
        <a class="btn ghost sm" href="#/leagues/manage">Manage leagues</a>
      </div>
      <p class="hint">Your current position across every connected classic league. Tap a league for its table, nearby rivals and deeper context.</p>'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one Leagues hub intro block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY

      - name: Commit accepted source layout
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html
          git commit -m "Let Leagues intro use full card width"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Test complete suite
        run: |
          set -eu
          ./run-tests.sh

      - name: Build and verify deterministic production bytes
        run: |
          set -eu
          BUILD_COMMIT="$SOURCE_SHA" node build.mjs
          rm -rf /tmp/teamsheet-build-a
          mkdir -p /tmp/teamsheet-build-a/dist
          cp dist/app.bundle.js /tmp/teamsheet-build-a/dist/app.bundle.js
          cp dist/index.html /tmp/teamsheet-build-a/dist/index.html
          cp dist/manifest.json /tmp/teamsheet-build-a/dist/manifest.json
          cp index.html /tmp/teamsheet-build-a/index.html
          BUILD_COMMIT="$SOURCE_SHA" node build.mjs
          cmp /tmp/teamsheet-build-a/dist/app.bundle.js dist/app.bundle.js
          cmp /tmp/teamsheet-build-a/dist/index.html dist/index.html
          cmp /tmp/teamsheet-build-a/dist/manifest.json dist/manifest.json
          cmp /tmp/teamsheet-build-a/index.html index.html
          cmp dist/index.html index.html

      - name: Restore permanent verifier and commit generated files
        run: |
          set -eu
          git fetch origin main
          git checkout origin/main -- .github/workflows/verify.yml
          git add .github/workflows/verify.yml dist/app.bundle.js dist/index.html dist/manifest.json index.html
          git commit -m "Regenerate deployable for accepted Leagues hub layout"
          git push origin HEAD:agent/leagues-hub-first
