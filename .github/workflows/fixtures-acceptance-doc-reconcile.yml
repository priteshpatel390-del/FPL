name: Fixtures acceptance documentation reconciliation

on:
  push:
    branches:
      - agent/fixtures-acceptance-doc-reconciliation

permissions:
  contents: write

concurrency:
  group: fixtures-acceptance-doc-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_COMMIT: e49599a75bbb77618292fdb6100fcffd81685c44
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fixtures-acceptance-doc-reconciliation
          fetch-depth: 0

      - name: Confirm exact baseline and branch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "agent/fixtures-acceptance-doc-reconciliation"
          git merge-base --is-ancestor "$BASE_COMMIT" HEAD
          test "$(git merge-base "$BASE_COMMIT" HEAD)" = "$BASE_COMMIT"

      - name: Apply approved documentation reconciliation
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('.github/fixtures-acceptance-doc-reconcile.py'); s=p.read_text(); old=\"    replace_all_required(\\n        'docs/PROJECT_CONTEXT.md',\\n        'Remaining feature-specific populated live acceptance is **Fixtures, then Leagues**.',\\n        'Remaining feature-specific populated live acceptance is **Leagues**.'\\n    )\\n\"; assert old in s; p.write_text(s.replace(old, '', 1))"
          python3 .github/fixtures-acceptance-doc-reconcile.py apply
          git checkout -- .github/fixtures-acceptance-doc-reconcile.py
          git diff --check
          python3 .github/fixtures-acceptance-doc-reconcile.py guard-worktree

      - name: Run complete test suite
        run: |
          set -euo pipefail
          export BUILD_COMMIT="$(git rev-parse HEAD)"
          ./run-tests.sh 2>&1 | tee /tmp/fixtures-acceptance-doc-tests.txt
          grep -E '^# fail 0$' /tmp/fixtures-acceptance-doc-tests.txt
          grep -E '^# cancelled 0$' /tmp/fixtures-acceptance-doc-tests.txt
          grep -E '^# skipped 0$' /tmp/fixtures-acceptance-doc-tests.txt

      - name: Verify deterministic exact-identity production builds
        run: |
          set -euo pipefail
          export BUILD_COMMIT="$(git rev-parse HEAD)"
          node build.mjs
          rm -rf /tmp/fixtures-doc-build-a
          mkdir -p /tmp/fixtures-doc-build-a/dist
          cp dist/app.bundle.js /tmp/fixtures-doc-build-a/dist/app.bundle.js
          cp dist/index.html /tmp/fixtures-doc-build-a/dist/index.html
          cp dist/manifest.json /tmp/fixtures-doc-build-a/dist/manifest.json
          cp index.html /tmp/fixtures-doc-build-a/index.html
          node build.mjs
          cmp /tmp/fixtures-doc-build-a/dist/app.bundle.js dist/app.bundle.js
          cmp /tmp/fixtures-doc-build-a/dist/index.html dist/index.html
          cmp /tmp/fixtures-doc-build-a/dist/manifest.json dist/manifest.json
          cmp /tmp/fixtures-doc-build-a/index.html index.html
          cmp dist/index.html index.html
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const m=JSON.parse(readFileSync('dist/manifest.json','utf8')); if(m.commit!==process.env.BUILD_COMMIT) throw new Error('manifest commit mismatch'); console.log('Manifest commit verified:',m.commit);"

      - name: Restore generated deployables and verify docs-only scope
        run: |
          set -euo pipefail
          git checkout -- dist/app.bundle.js dist/index.html dist/manifest.json index.html
          git diff --check
          python3 .github/fixtures-acceptance-doc-reconcile.py guard-worktree

      - name: Commit clean documentation-only reconciliation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/fixtures-acceptance-doc-reconcile.py
          rm .github/workflows/fixtures-acceptance-doc-reconcile.yml
          git add -A
          printf '%s\n' \
            'CLAUDE.md' \
            'docs/FIXTURES-ACCEPTANCE-MERGE-RECORD.md' \
            'docs/FIXTURES-MOBILE-SCROLL-FOLLOW-UP.md' \
            'docs/KNOWN_LIMITATIONS.md' \
            'docs/PROJECT_CONTEXT.md' \
            'docs/ROADMAP.md' \
            'docs/TESTING.md' > /tmp/expected-doc-paths.txt
          git diff --cached --name-only "$BASE_COMMIT" | sort > /tmp/actual-doc-paths.txt
          diff -u /tmp/expected-doc-paths.txt /tmp/actual-doc-paths.txt
          git diff --cached --check
          git commit -m 'Reconcile Fixtures acceptance status'
          git diff --name-only "$BASE_COMMIT"..HEAD | sort > /tmp/final-doc-paths.txt
          diff -u /tmp/expected-doc-paths.txt /tmp/final-doc-paths.txt
          git push origin HEAD:agent/fixtures-acceptance-doc-reconciliation

      - name: Summary
        run: |
          set -euo pipefail
          TESTS="$(awk '/^# tests /{v=$3} END{print v}' /tmp/fixtures-acceptance-doc-tests.txt)"
          PASS="$(awk '/^# pass /{v=$3} END{print v}' /tmp/fixtures-acceptance-doc-tests.txt)"
          echo "Documentation reconciliation complete: ${PASS}/${TESTS} tests passed; deterministic build verified; final diff documentation-only."
