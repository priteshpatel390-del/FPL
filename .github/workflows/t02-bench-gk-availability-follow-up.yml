name: T-02 bench and availability follow-up

on:
  push:
    branches:
      - agent/t02-bench-gk-availability-row

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/t02-bench-gk-availability-row
          fetch-depth: 0

      - name: Apply approved narrow corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match in {path}: {old[:80]!r}; got {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          team = 'src/ui/team-decision-home.mjs'
          replace_once(team,
          """function teamDecisionBenchLabel(index){
            return TEAM_DECISION_BENCH_LABELS[Number(index)]||`Sub ${Number(index)+1}`;
          }

          function teamDecisionRelabelBench(stage){""",
          """function teamDecisionBenchLabel(index){
            return TEAM_DECISION_BENCH_LABELS[Number(index)]||`Sub ${Number(index)+1}`;
          }

          function teamDecisionBenchDisplayOrder(bench=[]){
            const source=Array.isArray(bench)?bench:[];
            const reserveGoalkeeper=source.find(slot=>Number(slot?.p?.element_type)===1)||null;
            if(!reserveGoalkeeper) return source.slice();
            return [reserveGoalkeeper,...source.filter(slot=>slot!==reserveGoalkeeper)];
          }

          function teamDecisionOrderBenchDisplay(stage,xi){
            if(!stage?.querySelector||!xi) return;
            const grid=stage.querySelector('.team-bench .bench-grid');
            if(!grid) return;
            const source=Array.isArray(xi.bench)?xi.bench:[];
            const nodes=Array.from(grid.querySelectorAll('.bench-player'));
            if(nodes.length!==source.length) return;
            const nodeBySlot=new Map(source.map((slot,index)=>[slot,nodes[index]]));
            for(const slot of teamDecisionBenchDisplayOrder(source)){
              const node=nodeBySlot.get(slot);
              if(node) grid.appendChild(node);
            }
          }

          function teamDecisionRelabelBench(stage){""")

          replace_once(team,
            "const benchSlots=Array.isArray(xi.bench)?xi.bench:[];",
            "const benchSlots=teamDecisionBenchDisplayOrder(xi.bench);")

          replace_once(team,
          """  const stage=children.find(node=>node.classList?.contains('team-stage'))||null;
            teamDecisionRelabelBench(stage);
            teamDecisionAnnotateAvailability(stage,xi);""",
          """  const stage=children.find(node=>node.classList?.contains('team-stage'))||null;
            teamDecisionOrderBenchDisplay(stage,xi);
            teamDecisionRelabelBench(stage);
            teamDecisionAnnotateAvailability(stage,xi);""")

          replace_once(team,
          """  teamDecisionCloseCaptainCopy,
            teamDecisionBenchLabel,
            teamDecisionAvailabilityPresentation,""",
          """  teamDecisionCloseCaptainCopy,
            teamDecisionBenchLabel,
            teamDecisionBenchDisplayOrder,
            teamDecisionOrderBenchDisplay,
            teamDecisionAvailabilityPresentation,""")

          replace_once('app.html',
            ".pitch-availability{margin-left:0}",
            ".pitch-availability{display:block;width:fit-content;max-width:calc(100% - 4px);margin:3px auto 0;line-height:1.15;white-space:normal;overflow-wrap:anywhere}")

          resource_test='tests/team-resources-bench-clarity.test.mjs'
          replace_once(resource_test,
          """import { readFileSync } from 'node:fs';

          const teamSource""",
          """import { readFileSync } from 'node:fs';
          import { teamDecisionBenchDisplayOrder } from '../src/ui/team-decision-home.mjs';

          const teamSource""")

          marker="""test('bench names receive a two-line treatment before truncation',()=>{"""
          addition="""test('bench display puts reserve goalkeeper in GK slot without mutating calculated bench order',()=>{
            const gk={p:{id:1,element_type:1}};
            const defender={p:{id:2,element_type:2}};
            const midfielder={p:{id:3,element_type:3}};
            const forward={p:{id:4,element_type:4}};
            const bench=[defender,midfielder,forward,gk];
            const ordered=teamDecisionBenchDisplayOrder(bench);
            assert.deepEqual(ordered.map(slot=>slot.p.id),[1,2,3,4]);
            assert.deepEqual(bench.map(slot=>slot.p.id),[2,3,4,1]);
            assert.notStrictEqual(ordered,bench);
            const reorder=functionSource('teamDecisionOrderBenchDisplay');
            assert.match(reorder,/teamDecisionBenchDisplayOrder\(source\)/);
            assert.match(reorder,/grid\.appendChild\(node\)/);
            assert.doesNotMatch(reorder,/bestXI\(|xpOf\(|\.sort\(|\.splice\(|\.reverse\(/);
            assert.match(teamSource,/teamDecisionOrderBenchDisplay\(stage,xi\);\s*teamDecisionRelabelBench\(stage\);\s*teamDecisionAnnotateAvailability\(stage,xi\);/);
          });

          """ + marker
          replace_once(resource_test, marker, addition)

          availability_test='tests/team-ux-startup-availability.test.mjs'
          replace_once(availability_test,
            "assert.match(TEAM_SOURCE,/\\.team-bench \\.bench-grid \\.bench-player/);",
            "assert.match(TEAM_SOURCE,/\\.team-bench \\.bench-grid \\.bench-player/);\n  assert.match(TEAM_SOURCE,/const benchSlots=teamDecisionBenchDisplayOrder\\(xi\\.bench\\)/);")
          replace_once(availability_test,
            "assert.match(APP_SOURCE,/\\.pitch-availability\\{margin-left:0\\}/);",
            "assert.match(APP_SOURCE,/\\.pitch-availability\\{[^}]*display:block[^}]*width:fit-content[^}]*margin:3px auto 0[^}]*overflow-wrap:anywhere[^}]*\\}/);")
          PY

      - name: Run complete test suite
        run: |
          set -o pipefail
          ./run-tests.sh | tee /tmp/team-tests.log
          extract_count() {
            grep -E "^(#|ℹ) $1 " /tmp/team-tests.log | tail -1 | awk '{print $NF}'
          }
          PASS_COUNT="$(extract_count pass)"
          FAIL_COUNT="$(extract_count fail)"
          SKIP_COUNT="$(extract_count skipped)"
          CANCEL_COUNT="$(extract_count cancelled)"
          test -n "$PASS_COUNT"
          test "${FAIL_COUNT:-0}" = "0"
          export PASS_COUNT FAIL_COUNT SKIP_COUNT CANCEL_COUNT
          printf 'PASS_COUNT=%s\nFAIL_COUNT=%s\nSKIP_COUNT=%s\nCANCEL_COUNT=%s\n' "$PASS_COUNT" "${FAIL_COUNT:-0}" "${SKIP_COUNT:-0}" "${CANCEL_COUNT:-0}" >> "$GITHUB_ENV"

      - name: Record verification evidence
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          p=os.environ['PASS_COUNT']; f=os.environ.get('FAIL_COUNT') or '0'; s=os.environ.get('SKIP_COUNT') or '0'; c=os.environ.get('CANCEL_COUNT') or '0'
          marker='<!-- T02-BENCH-GK-AVAILABILITY-FOLLOW-UP-2026-08-07 -->'
          implementation=Path('docs/TEAM-UX-T01-T02-IMPLEMENTATION.md')
          text=implementation.read_text()
          if marker not in text:
              text += f'''\n\n{marker}\n## 7 August 2026 — physical T-02 follow-up\n\nA populated physical iPhone Safari review after PR #81 exposed two remaining presentation defects: the calculated bench array placed the reserve goalkeeper after outfield substitutes while UX-A1 labelled visual slot zero as `GK`, and the availability pill still did not own a reliably centred row. The approved correction is presentation-only: the reserve goalkeeper is moved to the first **displayed** bench slot while the three outfield substitutes retain their existing relative order; `bestXI()` and its calculated `bench` array are not changed or mutated. Availability now owns a block, intrinsic-width centred row for `Unavailable`, `Suspended` and `Doubtful`.\n\nAutomated verification on the approved follow-up branch: **{p} passed, {f} failed, {s} skipped, {c} cancelled**. Focused regressions prove the display-order helper returns a new array, leaves the calculated bench order intact, moves only the reserve goalkeeper to the visual `GK` slot, keeps availability annotation aligned with displayed order, and requires the availability pill's centred-row CSS contract. No projection, expected-minutes, scoring, fixture, captaincy, transfer, optimiser, simulation, provider or data-source formula is changed. Physical iPhone confirmation remains required before merge.\n'''
              implementation.write_text(text)

          testing=Path('docs/TESTING.md')
          text=testing.read_text()
          if marker not in text:
              insert=f'''\n{marker}\n> **T-02 bench/availability follow-up review:** physical iPhone evidence after PR #81 exposed a visual bench-role mismatch and incomplete availability centring. The approved review branch changes display ordering only: reserve GK first, then the pre-existing outfield bench order; `bestXI().bench` remains unchanged. Availability becomes its own centred intrinsic-width row. Verification is **{p} passed, {f} failed, {s} skipped, {c} cancelled** before deterministic production-build verification. Final physical iPhone acceptance is pending.\n\n'''
              text=text.replace('# TESTING.md\n', '# TESTING.md\n'+insert, 1)
              testing.write_text(text)
          PY

      - name: Commit reviewed source and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/t02-bench-gk-availability-follow-up.yml
          git add app.html src/ui/team-decision-home.mjs tests/team-resources-bench-clarity.test.mjs tests/team-ux-startup-availability.test.mjs docs/TEAM-UX-T01-T02-IMPLEMENTATION.md docs/TESTING.md
          git commit -m "Fix Team bench display and availability centering"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify deterministic production builds
        run: |
          mkdir -p /tmp/build-one
          BUILD_COMMIT="$SOURCE_COMMIT" node build.mjs
          cp dist/app.bundle.js /tmp/build-one/app.bundle.js
          cp dist/index.html /tmp/build-one/index.html
          cp dist/manifest.json /tmp/build-one/manifest.json
          cp index.html /tmp/build-one/root-index.html
          BUILD_COMMIT="$SOURCE_COMMIT" node build.mjs
          cmp /tmp/build-one/app.bundle.js dist/app.bundle.js
          cmp /tmp/build-one/index.html dist/index.html
          cmp /tmp/build-one/manifest.json dist/manifest.json
          cmp /tmp/build-one/root-index.html index.html
          cmp index.html dist/index.html
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('dist/manifest.json','utf8'));if(m.commit!==process.env.SOURCE_COMMIT){throw new Error('manifest commit mismatch: '+m.commit+' != '+process.env.SOURCE_COMMIT)}"

      - name: Commit verified deployables and push once
        run: |
          git add dist/app.bundle.js dist/index.html dist/manifest.json index.html
          git commit -m "Commit verified Team UX deployables"
          git push origin HEAD:agent/t02-bench-gk-availability-row
