# Dormant owner-gated TRANSPORT-REMEDIATED DEPLOYMENT PROMOTION on the ORIGINAL collector (Gate B only).
# Repository presence and merge authorize nothing live. Dispatch requires a separate explicit owner approval after merge and
# exact-main verification, plus a protected environment api-football-remediated-deployment-promotion provisioned by the owner.
# It submits at most ONE new Deployment POST selecting the corrected Gate A Version 4171f3cf-953e-452e-9e5f-068df9a3ca47
# (immutable creation SHA f01ccff5b13a4bbc98d7927cf620f69f46c4c54c) at exactly 100%, never resent. It never uploads a Version,
# never edits or deletes the historical Deployment, never enables workers.dev or Preview, never mutates D1, never touches
# Cron/routes/domains, never invokes the Worker, never calls API-Football and never rolls back automatically.
# The new-day collection (Gate C) is a separate later gate.
name: API-Football Transport-Remediated Deployment Promotion

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact current main SHA separately approved for the one-time transport-remediated Deployment promotion
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: api-football-collector-attended-acceptance
  cancel-in-progress: false

jobs:
  repository-gate:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      approved_sha: ${{ steps.identity.outputs.approved_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = workflow_dispatch
          test "$EVENT_RUN_ATTEMPT" = 1
          test "$EVENT_REF" = refs/heads/main
          test "$EVENT_REPOSITORY" = priteshpatel390-del/FPL
          printf '%s' "$APPROVED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$EVENT_SHA" = "$APPROVED_SHA"
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)" = "$APPROVED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "approved_sha=$APPROVED_SHA" >> "$GITHUB_OUTPUT"
      - name: Require exact-head Verify Teamsheet success
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ steps.identity.outputs.approved_sha }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/check-runs.json"
          gh api "repos/${{ github.repository }}/commits/$APPROVED_SHA/check-runs" > "$response"
          node --input-type=module - "$response" <<'NODE'
          import fs from 'node:fs';
          const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!(body.check_runs??[]).some(row=>row.name==='Tests and deterministic build'&&row.status==='completed'&&row.conclusion==='success'&&row.head_sha===process.env.APPROVED_SHA&&row.app?.slug==='github-actions'&&row.details_url?.startsWith('https://github.com/priteshpatel390-del/FPL/actions/runs/')))throw new Error('exact-head Verify Teamsheet success is absent');
          NODE
          rm -f "$response"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
      - name: Run focused Deployment-promotion tests
        run: |
          node --test tests/api-football-transport-remediated-deployment-promotion.test.mjs tests/api-football-transport-remediated-version.test.mjs tests/api-football-collector-activation-live-preflight.test.mjs
          test -z "$(git status --porcelain --untracked-files=all)"

  fresh-readonly-admission:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    needs: repository-gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: data-steward-readonly
      deployment: false
    outputs:
      classification: ${{ steps.handoff.outputs.classification }}
      artifact_sha256: ${{ steps.handoff.outputs.artifact_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.repository-gate.outputs.approved_sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
      - name: Reconfirm exact protected main after read-only environment admission
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)" = "$APPROVED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Prove exact four-Version inventory, retained single active Deployment, inert topology and exact consumed history
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
          API_FOOTBALL_DEPLOYMENT_PROMOTION_MODE: ADMISSION
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID }}
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
          DATA_STEWARD_CLOUDFLARE_READ_TOKEN: ${{ secrets.DATA_STEWARD_CLOUDFLARE_READ_TOKEN }}
          CLOUDFLARE_TOPOLOGY_READ_TOKEN: ${{ secrets.CLOUDFLARE_REPLACEMENT_TOPOLOGY_READ_TOKEN }}
          API_FOOTBALL_DEPLOYMENT_PROMOTION_REPORT_PATH: ${{ runner.temp }}/deployment-promotion-admission.json
        run: node workers/api-football-collector/transport-remediated-deployment-promotion-readonly.mjs
      - name: Bind sanitized admission handoff
        id: handoff
        env:
          REPORT: ${{ runner.temp }}/deployment-promotion-admission.json
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const bytes=fs.readFileSync(process.env.REPORT),report=JSON.parse(bytes);
          if(report.version!=='api-football-transport-remediated-deployment-promotion-admission-v1'||report.ok!==true||report.approvedSha!==process.env.APPROVED_SHA||report.classification!=='READY_FOR_TRANSPORT_REMEDIATED_DEPLOYMENT_PROMOTION'||report.retryAuthorized!==false)throw new Error('deployment-promotion admission handoff invalid');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`classification=${report.classification}\nartifact_sha256=${createHash('sha256').update(bytes).digest('hex')}\n`);
          NODE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: api-football-deployment-promotion-admission
          path: ${{ runner.temp }}/deployment-promotion-admission.json
          if-no-files-found: error
          retention-days: 7

  protected-deployment-promotion:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && needs.fresh-readonly-admission.outputs.classification == 'READY_FOR_TRANSPORT_REMEDIATED_DEPLOYMENT_PROMOTION'
    needs: [repository-gate, fresh-readonly-admission]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: api-football-remediated-deployment-promotion
      deployment: false
    outputs:
      execution_artifact_sha256: ${{ steps.execution-handoff.outputs.execution_artifact_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.repository-gate.outputs.approved_sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
      - name: Reconfirm exact protected main after mutation environment admission
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)" = "$APPROVED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          name: api-football-deployment-promotion-admission
          path: ${{ runner.temp }}/deployment-promotion-admission
      - name: Recheck Versions, active Deployment, inert topology and zone routes, then submit at most one Deployment POST
        id: execute
        continue-on-error: true
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
          API_FOOTBALL_DEPLOYMENT_PROMOTION_ADMISSION_PATH: ${{ runner.temp }}/deployment-promotion-admission/deployment-promotion-admission.json
          API_FOOTBALL_DEPLOYMENT_PROMOTION_EXECUTION_REPORT_PATH: ${{ runner.temp }}/deployment-promotion-execution.json
          EXPECTED_ARTIFACT_SHA256: ${{ needs.fresh-readonly-admission.outputs.artifact_sha256 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.CLOUDFLARE_ACCOUNT_FINGERPRINT }}
          CLOUDFLARE_ATTENDED_READ_TOKEN: ${{ secrets.CLOUDFLARE_ATTENDED_READ_TOKEN }}
          # Dedicated Deployment-creation credential. Cloudflare's Deployment API lists Workers Scripts Write as the accepted
          # permission; where the dashboard uses Workers roles, use Editor scoped to this existing Worker only. The token is
          # usable only for the single Deployment POST and refused for every read.
          CLOUDFLARE_REMEDIATED_DEPLOYMENT_PROMOTION_TOKEN: ${{ secrets.CLOUDFLARE_REMEDIATED_DEPLOYMENT_PROMOTION_TOKEN }}
          # Read-only Zone Read + Workers Routes Read; used only for the final pre-mutation route scan.
          CLOUDFLARE_TOPOLOGY_READ_TOKEN: ${{ secrets.CLOUDFLARE_REPLACEMENT_TOPOLOGY_READ_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)" = "$APPROVED_SHA"
          test "$(sha256sum "$API_FOOTBALL_DEPLOYMENT_PROMOTION_ADMISSION_PATH" | cut -d' ' -f1)" = "$EXPECTED_ARTIFACT_SHA256"
          test -z "$(git status --porcelain --untracked-files=all)"
          node workers/api-football-collector/run-transport-remediated-deployment-promotion.mjs
      - name: Bind sanitized execution evidence
        id: execution-handoff
        if: always()
        env:
          REPORT: ${{ runner.temp }}/deployment-promotion-execution.json
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
        run: |
          set -euo pipefail
          test -f "$REPORT"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const bytes=fs.readFileSync(process.env.REPORT),report=JSON.parse(bytes);
          if(report.version!=='api-football-transport-remediated-deployment-promotion-execution-v1'||report.approvedSha!==process.env.APPROVED_SHA||report.retryAuthorized!==false||![0,1].includes(report.deploymentPostAttempts)||report.deploymentMutations!==report.deploymentPostAttempts||report.versionUploads!==0||report.d1Mutations!==0||report.workersDevMutations!==0||report.previewMutations!==0||report.scheduleMutations!==0||report.routeMutations!==0||report.domainMutations!==0||report.workerInvocations!==0||report.apiFootballRequests!==0||report.secretValuesSerialized!==0)throw new Error('deployment-promotion execution evidence invalid');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`execution_artifact_sha256=${createHash('sha256').update(bytes).digest('hex')}\n`);
          NODE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: api-football-deployment-promotion-execution
          path: ${{ runner.temp }}/deployment-promotion-execution.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve protected execution outcome
        if: steps.execute.outcome != 'success'
        run: exit 1

  final-readonly-reconciliation:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && needs.repository-gate.result == 'success' }}
    needs: [repository-gate, fresh-readonly-admission, protected-deployment-promotion]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: data-steward-readonly
      deployment: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.repository-gate.outputs.approved_sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
      - name: Reconfirm exact protected main before independent closeout
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)" = "$APPROVED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        if: needs.protected-deployment-promotion.outputs.execution_artifact_sha256 != ''
        with:
          name: api-football-deployment-promotion-execution
          path: ${{ runner.temp }}/deployment-promotion-execution
      - name: Verify sanitized execution handoff
        if: needs.protected-deployment-promotion.outputs.execution_artifact_sha256 != ''
        env:
          REPORT: ${{ runner.temp }}/deployment-promotion-execution/deployment-promotion-execution.json
          EXPECTED_SHA256: ${{ needs.protected-deployment-promotion.outputs.execution_artifact_sha256 }}
        run: |
          set -euo pipefail
          test "$(sha256sum "$REPORT" | cut -d' ' -f1)" = "$EXPECTED_SHA256"
      - name: Independently reconcile the promoted Deployment, retained historical Deployment, four Versions, inert topology and consumed history
        id: reconcile
        continue-on-error: true
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
          API_FOOTBALL_DEPLOYMENT_PROMOTION_MODE: RECONCILIATION
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID }}
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
          DATA_STEWARD_CLOUDFLARE_READ_TOKEN: ${{ secrets.DATA_STEWARD_CLOUDFLARE_READ_TOKEN }}
          CLOUDFLARE_TOPOLOGY_READ_TOKEN: ${{ secrets.CLOUDFLARE_REPLACEMENT_TOPOLOGY_READ_TOKEN }}
          API_FOOTBALL_DEPLOYMENT_PROMOTION_REPORT_PATH: ${{ runner.temp }}/deployment-promotion-reconciliation.json
          API_FOOTBALL_DEPLOYMENT_PROMOTION_EXECUTION_PATH: ${{ needs.protected-deployment-promotion.outputs.execution_artifact_sha256 != '' && format('{0}/deployment-promotion-execution/deployment-promotion-execution.json', runner.temp) || '' }}
        run: node workers/api-football-collector/transport-remediated-deployment-promotion-readonly.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: api-football-deployment-promotion-reconciliation
          path: ${{ runner.temp }}/deployment-promotion-reconciliation.json
          if-no-files-found: error
          retention-days: 7
      - name: Require independently reconciled promoted-but-inert Deployment
        if: steps.reconcile.outcome != 'success'
        run: exit 1
