name: Stage 10.4 verification

on:
  pull_request:
    branches: [agent/stage10-4-operating-review]

permissions:
  contents: write

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage10-4-operating-review
          fetch-depth: 0
      - name: Materialise approved source
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          review_parts = [
            '.stage10-4-payload/review-mjs.part-01',
            '.stage10-4-payload/review-mjs.part-02',
            '.stage10-4-payload/review-mjs.part-03',
            '.stage10-4-payload/review-mjs.part-04-01',
            '.stage10-4-payload/review-mjs.part-04-02',
            '.stage10-4-payload/review-mjs.part-04-03',
            '.stage10-4-payload/review-mjs.part-05-01',
            '.stage10-4-payload/review-mjs.part-05-02',
          ]
          review_encoded = ''.join(Path(path).read_text().strip() for path in review_parts)
          ui_encoded = Path('.stage10-4-payload/review-ui-mjs.b64').read_text().strip()
          assert hashlib.sha256(review_encoded.encode()).hexdigest() == 'a92ae37a514f977374522587b759849998f3973be35f83649bc592bfb66094a3'
          assert hashlib.sha256(ui_encoded.encode()).hexdigest() == '781eaea5bff62ee410bb58c81253e98a119c00cfad6a3b9b525bcd5072f66c60'
          sources = {
            'src/evidence/review.mjs': gzip.decompress(base64.b64decode(review_encoded)),
            'src/ui/review.mjs': gzip.decompress(base64.b64decode(ui_encoded)),
          }
          assert hashlib.sha256(sources['src/evidence/review.mjs']).hexdigest() == '644db0e09fd2c70cf6d058cbce19904a4de68c7b234b641b073a77246e986742'
          assert hashlib.sha256(sources['src/ui/review.mjs']).hexdigest() == '58ea57d93f14d36e78560b6e0673c28a6cb4e1dec34d0455d8aa4069bb83c6d8'
          for target, data in sources.items():
              path = Path(target)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/evidence/review.mjs src/ui/review.mjs build.mjs tests/review-fixtures.mjs tests/operating-review.test.mjs tests/cumulative-review.test.mjs tests/review-export.test.mjs tests/review-ui.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Implement Stage 10.4 operating review and exports"
          fi
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Run complete test suite
        run: BUILD_COMMIT="$SOURCE_COMMIT" ./run-tests.sh
      - name: Verify deterministic exact-identity builds
        run: |
          mkdir -p /tmp/stage10-4-build-one
          cp dist/index.html dist/app.bundle.js dist/manifest.json /tmp/stage10-4-build-one/
          BUILD_COMMIT="$SOURCE_COMMIT" node build.mjs
          cmp /tmp/stage10-4-build-one/index.html dist/index.html
          cmp /tmp/stage10-4-build-one/app.bundle.js dist/app.bundle.js
          cmp /tmp/stage10-4-build-one/manifest.json dist/manifest.json
          cmp dist/index.html index.html
          node -e "const m=require('./dist/manifest.json');if(m.commit!==process.env.SOURCE_COMMIT)process.exit(1)"
      - name: Commit verified deployable and remove temporary bridge
        run: |
          rm -rf .stage10-4-payload .github/workflows/stage10-4-verify.yml
          git add -A dist/index.html dist/app.bundle.js dist/manifest.json index.html .stage10-4-payload .github/workflows/stage10-4-verify.yml
          if ! git diff --cached --quiet; then
            git commit -m "Build Stage 10.4 deployable"
          fi
          git push origin HEAD:agent/stage10-4-operating-review
