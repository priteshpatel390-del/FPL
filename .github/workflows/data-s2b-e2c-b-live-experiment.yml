name: DATA-S2B E2C-B Disposable Live Experiment

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact commit explicitly approved for this one disposable live experiment
        required: true
        type: string
      approved_ref:
        description: Exact main or candidate branch containing the approved commit
        required: true
        type: string
      mode:
        description: Run the contract or the fixed read-only INITIAL isolation matrix
        required: true
        default: contract
        type: choice
        options:
          - contract
          - initial-isolation
          - w01-reconciliation
          - w01-syntax-isolation

permissions:
  contents: read
  checks: read

concurrency:
  group: data-s2b-e2c-b-disposable-live-experiment
  cancel-in-progress: false

jobs:
  repository-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      approved_sha: ${{ steps.identity.outputs.approved_sha }}
    steps:
      - name: Reject every non-original or non-main dispatch
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          APPROVED_REF: ${{ inputs.approved_ref }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = workflow_dispatch
          printf '%s' "$APPROVED_REF" | grep -Eq '^(main|fix/data-s2b-e2-disposable-d1-live)$'
          test "$EVENT_REF" = "refs/heads/$APPROVED_REF"
          test "$EVENT_REPOSITORY" = priteshpatel390-del/FPL
          test "$RUN_ATTEMPT" = 1
          printf '%s' "$APPROVED_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - name: Check out exact approved revision
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0

      - name: Require exact current main and clean checkout
        id: identity
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          APPROVED_REF: ${{ inputs.approved_ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          remote_ref="$(git ls-remote https://github.com/priteshpatel390-del/FPL.git "refs/heads/$APPROVED_REF" | cut -f1)"
          test -n "$remote_ref"
          test "$remote_ref" = "$APPROVED_SHA"
          test -z "$(git status --porcelain)"
          echo "approved_sha=$APPROVED_SHA" >> "$GITHUB_OUTPUT"

      - name: Require exact-head Verify Teamsheet success
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/check-runs.json"
          http="$(curl --silent --output "$response" --write-out '%{http_code}' --max-time 20 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/priteshpatel390-del/FPL/commits/$APPROVED_SHA/check-runs")"
          test "$http" = 200
          node --input-type=module - "$response" <<'NODE'
          import fs from 'node:fs';
          const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const matches=(body.check_runs??[]).filter(row=>row.name==='Tests and deterministic build'&&row.status==='completed'&&row.conclusion==='success'&&row.head_sha===process.env.APPROVED_SHA&&row.app?.slug==='github-actions'&&row.details_url?.startsWith('https://github.com/priteshpatel390-del/FPL/actions/runs/'));
          if(matches.length<1)throw new Error('exact-head Verify Teamsheet success is absent');
          NODE
          rm -f "$response"

  disposable-live-experiment:
    needs: repository-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: data-s2b-e2c-b-live-experiment
    env:
      APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_E2C_DISPOSABLE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_E2C_ACCOUNT_ID }}
      E2C_DATABASE_ID: ${{ secrets.CLOUDFLARE_E2C_DATABASE_ID }}
      E2C_DATABASE_NAME: ${{ vars.CLOUDFLARE_E2C_DATABASE_NAME }}
      CLOUDFLARE_E2C_APPROVED_ACCOUNT_FINGERPRINT: ${{ vars.CLOUDFLARE_E2C_APPROVED_ACCOUNT_FINGERPRINT }}
      CLOUDFLARE_E2C_APPROVED_DATABASE_FINGERPRINT: ${{ vars.CLOUDFLARE_E2C_APPROVED_DATABASE_FINGERPRINT }}
      PRODUCTION_ACCOUNT_FINGERPRINT: ${{ vars.CLOUDFLARE_PRODUCTION_ACCOUNT_FINGERPRINT }}
      E2C_MODE: ${{ inputs.mode }}
    steps:
      - name: Check out gated approved revision
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.repository-gate.outputs.approved_sha }}
          fetch-depth: 0
      - name: Set up exact Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
      - name: Reconfirm identity and run once without retry or cleanup
        env:
          E2C_EVIDENCE_PATH: ${{ runner.temp }}/e2c-b-sanitized-evidence.json
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = 1
          test "$(node --version)" = v24.19.0
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test -z "$(git status --porcelain)"
          if test "$E2C_MODE" = initial-isolation; then
            node workers/data-platform/e2c-b/run-initial-isolation.mjs
          elif test "$E2C_MODE" = w01-reconciliation; then
            node workers/data-platform/e2c-b/run-w01-reconciliation.mjs
          elif test "$E2C_MODE" = w01-syntax-isolation; then
            node workers/data-platform/e2c-b/run-w01-syntax-isolation.mjs
          else
            test "$E2C_MODE" = contract
            node workers/data-platform/e2c-b/run-live-experiment.mjs
          fi
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-s2b-e2c-b-sanitized-evidence
          path: ${{ runner.temp }}/e2c-b-sanitized-evidence.json
          if-no-files-found: error
          retention-days: 14
