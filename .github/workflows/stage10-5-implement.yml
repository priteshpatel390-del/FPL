name: Stage 10.5 compatibility fix and verification
on:
  push:
    branches:
      - agent/stage10-5-hardening-documentation
    paths:
      - .github/workflows/stage10-5-implement.yml
permissions:
  contents: write
jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage10-5-hardening-documentation
          fetch-depth: 0
      - name: Apply compatibility fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path);text=p.read_text()
              if text.count(old)!=1:
                  raise SystemExit(f'{path}: expected one anchor, found {text.count(old)}')
              p.write_text(text.replace(old,new,1))

          replace_once('src/evidence/metrics.mjs',
            "const keys=['completeness','createdAt','deadlineTime','decisions','gameweek','identity','managerRef','metricVersion','observations','recordType','reports','rules','schemaVersion','season','segmentationVersion','sources'].sort();",
            "const keys=['completeness','coverage','createdAt','deadlineTime','decisions','gameweek','identity','managerRef','metricVersion','observations','recordType','reports','rules','schemaVersion','season','segmentationVersion','sources'].sort();")

          replace_once('src/ui/outcomes.mjs',
            "  let index=await loadOutcomeIndex();\n  const same=index.find(row=>row.origin===origin&&row.logicalKey===checked.record.identity.logicalKey&&row.outcomeDataHash===checked.record.identity.outcomeDataHash&&row.status===checked.record.status);\n  if(same) return {index,stored:false,metadata:same};\n  if(origin===OUTCOME_ORIGINS.LOCAL){",
            "  let index=await loadOutcomeIndex();\n  const same=index.find(row=>row.origin===origin&&row.logicalKey===checked.record.identity.logicalKey&&row.outcomeDataHash===checked.record.identity.outcomeDataHash&&row.status===checked.record.status);\n  if(same) return {index,stored:false,metadata:same};\n  const priorCurrent=index.find(row=>row.origin===OUTCOME_ORIGINS.LOCAL&&row.logicalKey===checked.record.identity.logicalKey&&row.current)?.outcomeId||null;\n  if(origin===OUTCOME_ORIGINS.LOCAL){")
          replace_once('src/ui/outcomes.mjs',
            "  const encoded=await encodeEvidenceRecord(checked.record);\n  const priorCurrent=index.find(row=>row.origin===OUTCOME_ORIGINS.LOCAL&&row.logicalKey===metadata.logicalKey&&row.current)?.outcomeId||null;",
            "  const encoded=await encodeEvidenceRecord(checked.record);")

          old_outcome="""async function recoverOutcomeJournal(){
  const raw=await rawEvidenceGet(K_OUTCOME_JOURNAL);if(!raw)return false;const journal=parseStage10Journal(raw);
  if(!journal||journal.recordType!=='gameweekOutcome'){recordStage10Diagnostic('journal_corrupt',{recordType:'gameweekOutcome',severity:'error'});await rawEvidenceDelete(K_OUTCOME_JOURNAL).catch(()=>{});return true;}
  const record=await loadOutcomeRecord(journal.recordId),index=await loadOutcomeIndex();
  if(record&&record.identity.contentHash===journal.contentHash){
    const origin=journal.origin===OUTCOME_ORIGINS.LOCAL?OUTCOME_ORIGINS.LOCAL:OUTCOME_ORIGINS.RECOVERY;
    const metadata=compactOutcomeMetadata(record,{origin,current:origin===OUTCOME_ORIGINS.LOCAL});
    let next=normaliseOutcomeIndex([metadata,...index.filter(row=>row.outcomeId!==metadata.outcomeId)]);
    next=reconcileLocalCurrentRows(next,{logicalKey:metadata.logicalKey,recordId:metadata.outcomeId,idKey:'outcomeId',origin:OUTCOME_ORIGINS.LOCAL});
    await enforceOutcomeBounds(next);recordStage10Diagnostic('recovery_completed',{recordType:'gameweekOutcome',recordId:journal.recordId,severity:'info'});
  }else{
    if(!index.some(row=>row.outcomeId===journal.recordId))await removeOutcomePayload(journal.recordId).catch(()=>{});
    recordStage10Diagnostic('payload_corrupt',{recordType:'gameweekOutcome',recordId:journal.recordId,severity:'error'});
  }
  await rawEvidenceDelete(K_OUTCOME_JOURNAL).catch(()=>{});return true;
}"""
          new_outcome="""async function recoverOutcomeJournal(){
  const raw=await rawEvidenceGet(K_OUTCOME_JOURNAL);if(!raw)return false;let journal=parseStage10Journal(raw);
  if(!journal){
    try{
      const legacy=JSON.parse(raw),keys=['contentHash','outcomeId','startedAt'].sort();
      if(legacy&&typeof legacy==='object'&&!Array.isArray(legacy)&&stableStringify(Object.keys(legacy).sort())===stableStringify(keys)&&/^outcome-\\d{4}-\\d{2}-gw\\d+-r\\d+-[0-9a-f]{16}$/.test(legacy.outcomeId||'')&&/^[0-9a-f]{64}$/.test(legacy.contentHash||'')){
        const candidate=await loadOutcomeRecord(legacy.outcomeId);
        if(candidate)journal=stage10Journal({recordType:'gameweekOutcome',recordId:legacy.outcomeId,contentHash:legacy.contentHash,logicalKey:candidate.identity.logicalKey,origin:OUTCOME_ORIGINS.LOCAL,priorCurrentId:null,phase:'payload_verified',startedAt:legacy.startedAt});
      }
    }catch(error){}
  }
  if(!journal||journal.recordType!=='gameweekOutcome'){recordStage10Diagnostic('journal_corrupt',{recordType:'gameweekOutcome',severity:'error'});await rawEvidenceDelete(K_OUTCOME_JOURNAL).catch(()=>{});return true;}
  const record=await loadOutcomeRecord(journal.recordId),index=await loadOutcomeIndex();
  if(record&&record.identity.contentHash===journal.contentHash){
    const origin=journal.origin===OUTCOME_ORIGINS.LOCAL?OUTCOME_ORIGINS.LOCAL:OUTCOME_ORIGINS.RECOVERY;
    const metadata=compactOutcomeMetadata(record,{origin,current:origin===OUTCOME_ORIGINS.LOCAL});
    let next=normaliseOutcomeIndex([metadata,...index.filter(row=>row.outcomeId!==metadata.outcomeId)]);
    next=reconcileLocalCurrentRows(next,{logicalKey:metadata.logicalKey,recordId:metadata.outcomeId,idKey:'outcomeId',origin:OUTCOME_ORIGINS.LOCAL});
    await enforceOutcomeBounds(next);recordStage10Diagnostic('recovery_completed',{recordType:'gameweekOutcome',recordId:journal.recordId,severity:'info'});
  }else{
    if(!index.some(row=>row.outcomeId===journal.recordId))await removeOutcomePayload(journal.recordId).catch(()=>{});
    recordStage10Diagnostic('payload_corrupt',{recordType:'gameweekOutcome',recordId:journal.recordId,severity:'error'});
  }
  await rawEvidenceDelete(K_OUTCOME_JOURNAL).catch(()=>{});return true;
}"""
          replace_once('src/ui/outcomes.mjs',old_outcome,new_outcome)

          replace_once('src/ui/metrics.mjs',
            "  const same=index.find(row=>row.logicalKey===logicalKey&&row.contentHash===checked.record.identity.contentHash);if(same) return {stored:false,index,metadata:same};\n  index=index.map(row=>row.logicalKey===logicalKey?{...row,current:false}:row);",
            "  const same=index.find(row=>row.logicalKey===logicalKey&&row.contentHash===checked.record.identity.contentHash);if(same) return {stored:false,index,metadata:same};\n  const priorCurrent=index.find(row=>row.logicalKey===logicalKey&&row.current)?.recordId||null;\n  index=index.map(row=>row.logicalKey===logicalKey?{...row,current:false}:row);")
          replace_once('src/ui/metrics.mjs',
            "  index=normaliseMetricIndex([metadata,...index.filter(row=>row.recordId!==id)]);\n  const priorCurrent=index.find(row=>row.logicalKey===logicalKey&&row.current)?.recordId||null;",
            "  index=normaliseMetricIndex([metadata,...index.filter(row=>row.recordId!==id)]);")

          old_metric="""async function recoverMetricJournal(){
  const raw=await rawEvidenceGet(K_METRIC_JOURNAL);if(!raw)return false;const journal=parseStage10Journal(raw);
  if(!journal||!['gameweekEvaluation','transferHorizonEvaluation'].includes(journal.recordType)){recordStage10Diagnostic('journal_corrupt',{recordType:'gameweekEvaluation',severity:'error'});await rawEvidenceDelete(K_METRIC_JOURNAL).catch(()=>{});return true;}
  const record=await loadMetricRecord(journal.recordId),index=await loadMetricIndex();
  if(record&&record.identity.contentHash===journal.contentHash){
    const metadata=compactMetricMetadata(record),logicalKey=metricLogicalKey(record);let next=normaliseMetricIndex([metadata,...index.filter(row=>row.recordId!==metadata.recordId)]);
    next=reconcileLocalCurrentRows(next.map(row=>({...row,origin:'local_derivation'})),{logicalKey,recordId:metadata.recordId,idKey:'recordId',origin:'local_derivation'}).map(({origin,...row})=>row);
    await enforceMetricBounds(next);recordStage10Diagnostic('recovery_completed',{recordType:record.recordType,recordId:journal.recordId,severity:'info'});
  }else{
    if(!index.some(row=>row.recordId===journal.recordId))await removeMetricPayload(journal.recordId).catch(()=>{});
    recordStage10Diagnostic('payload_corrupt',{recordType:journal.recordType,recordId:journal.recordId,severity:'error'});
  }
  await rawEvidenceDelete(K_METRIC_JOURNAL).catch(()=>{});return true;
}"""
          new_metric="""async function recoverMetricJournal(){
  const raw=await rawEvidenceGet(K_METRIC_JOURNAL);if(!raw)return false;let journal=parseStage10Journal(raw);
  if(!journal){
    try{
      const legacy=JSON.parse(raw),keys=['contentHash','recordId','startedAt'].sort();
      if(legacy&&typeof legacy==='object'&&!Array.isArray(legacy)&&stableStringify(Object.keys(legacy).sort())===stableStringify(keys)&&typeof legacy.recordId==='string'&&/^[0-9a-f]{64}$/.test(legacy.contentHash||'')){
        const candidate=await loadMetricRecord(legacy.recordId);
        if(candidate)journal=stage10Journal({recordType:candidate.recordType,recordId:legacy.recordId,contentHash:legacy.contentHash,logicalKey:metricLogicalKey(candidate),origin:'local_derivation',priorCurrentId:null,phase:'payload_verified',startedAt:legacy.startedAt});
      }
    }catch(error){}
  }
  if(!journal||!['gameweekEvaluation','transferHorizonEvaluation'].includes(journal.recordType)){recordStage10Diagnostic('journal_corrupt',{recordType:'gameweekEvaluation',severity:'error'});await rawEvidenceDelete(K_METRIC_JOURNAL).catch(()=>{});return true;}
  const record=await loadMetricRecord(journal.recordId),index=await loadMetricIndex();
  if(record&&record.identity.contentHash===journal.contentHash){
    const metadata=compactMetricMetadata(record),logicalKey=metricLogicalKey(record);let next=normaliseMetricIndex([metadata,...index.filter(row=>row.recordId!==metadata.recordId)]);
    next=reconcileLocalCurrentRows(next.map(row=>({...row,origin:'local_derivation'})),{logicalKey,recordId:metadata.recordId,idKey:'recordId',origin:'local_derivation'}).map(({origin,...row})=>row);
    await enforceMetricBounds(next);recordStage10Diagnostic('recovery_completed',{recordType:record.recordType,recordId:journal.recordId,severity:'info'});
  }else{
    if(!index.some(row=>row.recordId===journal.recordId))await removeMetricPayload(journal.recordId).catch(()=>{});
    recordStage10Diagnostic('payload_corrupt',{recordType:journal.recordType,recordId:journal.recordId,severity:'error'});
  }
  await rawEvidenceDelete(K_METRIC_JOURNAL).catch(()=>{});return true;
}"""
          replace_once('src/ui/metrics.mjs',old_metric,new_metric)
          PY
      - name: Commit corrected source
        id: source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Fix Stage 10.5 recovery compatibility"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Full suite and deterministic builds
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          SOURCE_SHA="${{ steps.source.outputs.sha }}"
          rm -rf /tmp/stage10-5-build-a /tmp/stage10-5-build-b
          mkdir -p /tmp/stage10-5-build-a /tmp/stage10-5-build-b
          BUILD_COMMIT="$SOURCE_SHA" ./run-tests.sh 2>&1 | tee /tmp/stage10-5-tests.log
          cp dist/index.html dist/app.bundle.js dist/manifest.json /tmp/stage10-5-build-a/
          BUILD_COMMIT="$SOURCE_SHA" node build.mjs 2>&1 | tee /tmp/stage10-5-build-b.log
          cp dist/index.html dist/app.bundle.js dist/manifest.json /tmp/stage10-5-build-b/
          cmp /tmp/stage10-5-build-a/index.html /tmp/stage10-5-build-b/index.html
          cmp /tmp/stage10-5-build-a/app.bundle.js /tmp/stage10-5-build-b/app.bundle.js
          cmp /tmp/stage10-5-build-a/manifest.json /tmp/stage10-5-build-b/manifest.json
          cmp index.html dist/index.html
          TESTS=$(sed -n 's/^# tests //p' /tmp/stage10-5-tests.log | tail -1)
          PASS=$(sed -n 's/^# pass //p' /tmp/stage10-5-tests.log | tail -1)
          FAIL=$(sed -n 's/^# fail //p' /tmp/stage10-5-tests.log | tail -1)
          SKIP=$(sed -n 's/^# skipped //p' /tmp/stage10-5-tests.log | tail -1)
          test -n "$TESTS" && test "$TESTS" = "$PASS" && test "${FAIL:-0}" = "0" && test "${SKIP:-0}" = "0"
          SOURCE_HASH=$(node -e "const m=JSON.parse(require('fs').readFileSync('dist/manifest.json'));process.stdout.write(m.sourceHash)")
          MANIFEST_COMMIT=$(node -e "const m=JSON.parse(require('fs').readFileSync('dist/manifest.json'));process.stdout.write(m.commit)")
          test "$MANIFEST_COMMIT" = "$SOURCE_SHA"
          HTML_BYTES=$(wc -c < dist/index.html | tr -d ' ')
          echo "tests=$TESTS" >> "$GITHUB_OUTPUT"
          echo "source_hash=$SOURCE_HASH" >> "$GITHUB_OUTPUT"
          echo "html_bytes=$HTML_BYTES" >> "$GITHUB_OUTPUT"
      - name: Publish verified candidate
        if: steps.verify.outcome == 'success'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          TESTS: ${{ steps.verify.outputs.tests }}
          SOURCE_HASH: ${{ steps.verify.outputs.source_hash }}
          HTML_BYTES: ${{ steps.verify.outputs.html_bytes }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          replacements={'__SOURCE_COMMIT__':os.environ['SOURCE_SHA'],'__TEST_COUNT__':os.environ['TESTS'],'__SOURCE_HASH__':os.environ['SOURCE_HASH'],'__HTML_BYTES__':os.environ['HTML_BYTES']}
          for name in ['CLAUDE.md','docs/PROJECT_CONTEXT.md','docs/ROADMAP.md','docs/TESTING.md','docs/STAGE10-DESIGN.md','docs/STAGE10-ITEM5.md']:
            p=Path(name);text=p.read_text()
            for old,new in replacements.items():text=text.replace(old,new)
            p.write_text(text)
          PY
          rm .github/workflows/stage10-5-implement.yml
          rm -rf .stage10-5
          git add -A
          git commit -m "Verify Stage 10.5 hardening"
          export GENERATED_SHA=$(git rev-parse HEAD)
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path('docs/STAGE10-ITEM5.md');p.write_text(p.read_text().replace('__GENERATED_COMMIT__',os.environ['GENERATED_SHA']))
          PY
          git add docs/STAGE10-ITEM5.md
          git commit -m "Document Stage 10.5 verification"
          git push origin HEAD:agent/stage10-5-hardening-documentation
      - name: Publish focused failure evidence
        if: steps.verify.outcome != 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "Stage 10.5 verification failed after compatibility fixes."
            tail -12 /tmp/stage10-5-tests.log
            echo
            grep -n '^not ok ' /tmp/stage10-5-tests.log || true
            echo
            awk '/^not ok /{capture=1} capture{print} capture&&/^  \.\.\.$/{print "";capture=0}' /tmp/stage10-5-tests.log
          } > .stage10-5/failure.txt
          git add .stage10-5/failure.txt
          git commit -m "Record Stage 10.5 compatibility failures"
          git push origin HEAD:agent/stage10-5-hardening-documentation
          exit 1
