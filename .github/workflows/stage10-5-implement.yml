name: Stage 10.5 diagnostic test capture
on:
  push:
    branches:
      - agent/stage10-5-hardening-documentation
    paths:
      - .github/workflows/stage10-5-implement.yml
permissions:
  contents: write
jobs:
  capture-failures:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage10-5-hardening-documentation
          fetch-depth: 0
      - name: Capture complete failing output
        shell: bash
        run: |
          set +e
          BUILD_COMMIT=stage10-5-diagnostic ./run-tests.sh > /tmp/stage10-5-tests.log 2>&1
          STATUS=$?
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "Stage 10.5 diagnostic test capture."
            echo "Exit status: $STATUS"
            echo
            cat /tmp/stage10-5-tests.log
          } > .stage10-5/failure.txt
          git add .stage10-5/failure.txt
          git commit -m "Capture Stage 10.5 failing assertions"
          git push origin HEAD:agent/stage10-5-hardening-documentation
          exit $STATUS
