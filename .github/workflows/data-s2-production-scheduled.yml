# DATA-S2 — dedicated, schedule-only normal Official FPL production collection via direct D1 REST.
#
# This is the forward production collection scheduler: GitHub Actions -> fixed Official FPL public
# endpoints -> validation, normalisation, diff and hashing on the runner -> bounded direct
# Cloudflare D1 REST. Cloudflare Worker collection and Cloudflare Cron are superseded and must not
# be restored; `workers/data-platform/wrangler.jsonc` is historical repository configuration only.
#
# TEMPORARY OWNER-APPROVED ACCEPTANCE WINDOW (4 September 2026). The permanent intended cadence is
# `17 1 * * *` (01:17 UTC). For this one acceptance opportunity the owner approved moving the single
# trigger to `30 11 * * *` (11:30 UTC / 12:30 BST) so the first natural scheduled production run can
# be observed within the working day. A separate, explicitly reviewed restoration pull request must
# return the trigger to `17 1 * * *` after that run has been evaluated. There is still exactly one
# trigger: 01:17 UTC is not retained beside it, and no manual trigger is added.
#
# It offers exactly one best-effort full collection opportunity each UTC day at 11:30 UTC and can
# do exactly one thing when it fires: perform one normal collection cycle for the single
# deterministic collection identity that firing fixes. It accepts no input at all — no SHA,
# timestamp, season, database, endpoint, SQL or statement — because a schedule event carries none;
# the endpoints, season, database id, schema and every resource ceiling are repository constants.
# It never applies a migration, never resumes an unresolved run, never repairs state, never
# retries a mutation and never changes a schedule, Cron trigger, Worker version, deployment,
# route, domain, Access policy or secret.
#
# The manual workflow `data-s2-production-collection.yml` stays the separate, owner-approved
# manual and recovery boundary and is unchanged: this workflow is additive.
name: DATA-S2 Scheduled Production Collection via D1 REST

on:
  schedule:
    - cron: '30 11 * * *'

permissions:
  contents: read
  checks: read

# Shares the production collection group so a scheduled collection can never run beside a manual
# collection, a resume, a reconciliation read, a migration, a live acceptance read or another
# scheduled collection. Nothing in this group may cancel anything else in it.
concurrency:
  group: data-s2-production-collection
  cancel-in-progress: false

jobs:
  # Credential-free. No protected environment, no Cloudflare secret, no account id, no account
  # fingerprint variable and no D1 identifier exist anywhere in this job.
  repository-gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      scheduled_sha: ${{ steps.identity.outputs.scheduled_sha }}
    steps:
      # A scheduled run has no owner-supplied approved SHA, so its immutable candidate source is
      # the SHA the scheduled event itself carries — the default-branch head at event creation.
      # It is never replaced by a floating ref, a newer commit or a "latest successful build".
      - name: Validate scheduled event before checkout
        env:
          SCHEDULED_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = schedule
          test "$EVENT_SCHEDULE" = '30 11 * * *'
          test "$EVENT_REF" = refs/heads/main
          test "$EVENT_REPOSITORY" = priteshpatel390-del/FPL
          printf '%s' "$SCHEDULED_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - name: Check out exact scheduled revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Gate exact current main and clean tree
        id: identity
        env:
          SCHEDULED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SCHEDULED_SHA"
          remote_main="$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)"
          test -n "$remote_main"
          test "$remote_main" = "$SCHEDULED_SHA"
          test -z "$(git status --porcelain)"
          echo "scheduled_sha=$SCHEDULED_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up exact Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.19.0

      # A scheduled event can fire while the exact-head Verify run for the same commit is still in
      # progress. The gate therefore waits, read-only and inside a fixed bound, for that exact
      # head's `Tests and deterministic build` result. It never dispatches, re-runs or re-requests
      # anything, never accepts a success on another commit, and stops on a completed non-success,
      # an absent check or an exhausted bound.
      - name: Require exact-head Verify Teamsheet success within a bounded wait
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          node workers/data-platform/scheduled/run-exact-head-verify.mjs
          test -z "$(git status --porcelain)"

  collect:
    needs: repository-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The dedicated unattended daily production boundary. The manual and recovery boundary
    # `data-s2-production-collection` stays human-approved and is deliberately not reused here.
    environment:
      name: data-s2-production-scheduled
    env:
      SCHEDULED_SHA: ${{ needs.repository-gate.outputs.scheduled_sha }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
      DATA_S2_SEASON: '2026-27'
    steps:
      # GitHub echoes each step's resolved environment in that step's log header, and only
      # `secrets.*` values are masked automatically. The account fingerprint is a `vars.*` value,
      # so its mask is registered here — derived from the already-masked account credential —
      # before any step materialises the variable itself. The production database id is a
      # reviewed repository constant and is not carried in the environment at all.
      #
      # This step also fails closed when the environment supplies no account credential, which is
      # what an unconfigured or wrongly configured environment looks like from inside the run.
      - name: Register production identifier masks before any other step
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          printf '::add-mask::%s\n' "$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | sha256sum | cut -d' ' -f1)"

      - name: Check out gated scheduled revision
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.repository-gate.outputs.scheduled_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.19.0

      # The repository gate proved remote main before this job existed, but environment admission
      # and the bounded Verify wait both take time, and main may advance in that window. This step
      # therefore resolves remote main again, from the remote and not from any value carried out of
      # the gate job, in the same shell and immediately before the production entry point. No
      # Cloudflare request is made before it. If main has moved the run stops: a later scheduled
      # event is the next collection opportunity for the newer revision.
      #
      # This one attempt's collection identity is also fixed here, once, from the runner clock and
      # never from a workflow input or the nominal cron minute, so no earlier or later mutable
      # stage can establish production identity. It is derived before the remote-main recheck so
      # that recheck stays the last thing to happen before the runner.
      - name: Reconfirm identity and remote main, then collect Official FPL to D1 REST
        env:
          CLOUDFLARE_PRODUCTION_ACCOUNT_FINGERPRINT: ${{ vars.CLOUDFLARE_PRODUCTION_ACCOUNT_FINGERPRINT }}
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          test "$(git rev-parse HEAD)" = "$SCHEDULED_SHA"
          test -z "$(git status --porcelain)"
          rm -f node_modules/.bin/wrangler
          rm -rf node_modules/wrangler node_modules/.wrangler-*
          COLLECTION_SCHEDULED_AT="$(date -u +%Y-%m-%dT%H:%M:00.000Z)"
          export COLLECTION_SCHEDULED_AT
          test -n "$COLLECTION_SCHEDULED_AT"
          remote_main="$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)"
          test -n "$remote_main"
          test "$remote_main" = "$SCHEDULED_SHA"
          node workers/data-platform/run-production-collection.mjs
