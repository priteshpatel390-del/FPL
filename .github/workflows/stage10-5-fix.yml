name: Stage 10.5 source compatibility fixes
on:
  push:
    branches: [agent/stage10-5-hardening-documentation]
    paths: [.github/workflows/stage10-5-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage10-5-hardening-documentation
          fetch-depth: 0
      - name: Patch confirmed failures
        run: |
          python - <<'PY'
          from pathlib import Path
          def one(path,old,new):
              p=Path(path);s=p.read_text()
              if s.count(old)!=1: raise SystemExit(f'{path}: anchor count {s.count(old)}')
              p.write_text(s.replace(old,new,1))
          one('src/evidence/metrics.mjs',"const keys=['completeness','createdAt','deadlineTime','decisions','gameweek','identity','managerRef','metricVersion','observations','recordType','reports','rules','schemaVersion','season','segmentationVersion','sources'].sort();","const keys=['completeness','coverage','createdAt','deadlineTime','decisions','gameweek','identity','managerRef','metricVersion','observations','recordType','reports','rules','schemaVersion','season','segmentationVersion','sources'].sort();")
          one('src/ui/outcomes.mjs',"  let index=await loadOutcomeIndex();\n  const same=index.find(row=>row.origin===origin&&row.logicalKey===checked.record.identity.logicalKey&&row.outcomeDataHash===checked.record.identity.outcomeDataHash&&row.status===checked.record.status);\n  if(same) return {index,stored:false,metadata:same};\n  if(origin===OUTCOME_ORIGINS.LOCAL){","  let index=await loadOutcomeIndex();\n  const same=index.find(row=>row.origin===origin&&row.logicalKey===checked.record.identity.logicalKey&&row.outcomeDataHash===checked.record.identity.outcomeDataHash&&row.status===checked.record.status);\n  if(same) return {index,stored:false,metadata:same};\n  const priorCurrent=index.find(row=>row.origin===OUTCOME_ORIGINS.LOCAL&&row.logicalKey===checked.record.identity.logicalKey&&row.current)?.outcomeId||null;\n  if(origin===OUTCOME_ORIGINS.LOCAL){")
          one('src/ui/outcomes.mjs',"  const encoded=await encodeEvidenceRecord(checked.record);\n  const priorCurrent=index.find(row=>row.origin===OUTCOME_ORIGINS.LOCAL&&row.logicalKey===metadata.logicalKey&&row.current)?.outcomeId||null;","  const encoded=await encodeEvidenceRecord(checked.record);")
          one('src/ui/metrics.mjs',"  const same=index.find(row=>row.logicalKey===logicalKey&&row.contentHash===checked.record.identity.contentHash);if(same) return {stored:false,index,metadata:same};\n  index=index.map(row=>row.logicalKey===logicalKey?{...row,current:false}:row);","  const same=index.find(row=>row.logicalKey===logicalKey&&row.contentHash===checked.record.identity.contentHash);if(same) return {stored:false,index,metadata:same};\n  const priorCurrent=index.find(row=>row.logicalKey===logicalKey&&row.current)?.recordId||null;\n  index=index.map(row=>row.logicalKey===logicalKey?{...row,current:false}:row);")
          one('src/ui/metrics.mjs',"  index=normaliseMetricIndex([metadata,...index.filter(row=>row.recordId!==id)]);\n  const priorCurrent=index.find(row=>row.logicalKey===logicalKey&&row.current)?.recordId||null;","  index=normaliseMetricIndex([metadata,...index.filter(row=>row.recordId!==id)]);")
          PY
      - name: Add explicit legacy journal compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/ui/outcomes.mjs');s=p.read_text()
          old="const raw=await rawEvidenceGet(K_OUTCOME_JOURNAL);if(!raw)return false;const journal=parseStage10Journal(raw);"
          new="""const raw=await rawEvidenceGet(K_OUTCOME_JOURNAL);if(!raw)return false;let journal=parseStage10Journal(raw);\n  if(!journal){\n    try{const legacy=JSON.parse(raw),keys=['contentHash','outcomeId','startedAt'].sort();if(legacy&&typeof legacy==='object'&&!Array.isArray(legacy)&&stableStringify(Object.keys(legacy).sort())===stableStringify(keys)&&/^outcome-\\d{4}-\\d{2}-gw\\d+-r\\d+-[0-9a-f]{16}$/.test(legacy.outcomeId||'')&&/^[0-9a-f]{64}$/.test(legacy.contentHash||'')){const candidate=await loadOutcomeRecord(legacy.outcomeId);if(candidate)journal=stage10Journal({recordType:'gameweekOutcome',recordId:legacy.outcomeId,contentHash:legacy.contentHash,logicalKey:candidate.identity.logicalKey,origin:OUTCOME_ORIGINS.LOCAL,priorCurrentId:null,phase:'payload_verified',startedAt:legacy.startedAt});}}catch(error){}\n  }"""
          if s.count(old)!=1: raise SystemExit('outcome journal anchor mismatch')
          p.write_text(s.replace(old,new,1))
          p=Path('src/ui/metrics.mjs');s=p.read_text()
          old="const raw=await rawEvidenceGet(K_METRIC_JOURNAL);if(!raw)return false;const journal=parseStage10Journal(raw);"
          new="""const raw=await rawEvidenceGet(K_METRIC_JOURNAL);if(!raw)return false;let journal=parseStage10Journal(raw);\n  if(!journal){\n    try{const legacy=JSON.parse(raw),keys=['contentHash','recordId','startedAt'].sort();if(legacy&&typeof legacy==='object'&&!Array.isArray(legacy)&&stableStringify(Object.keys(legacy).sort())===stableStringify(keys)&&typeof legacy.recordId==='string'&&/^[0-9a-f]{64}$/.test(legacy.contentHash||'')){const candidate=await loadMetricRecord(legacy.recordId);if(candidate)journal=stage10Journal({recordType:candidate.recordType,recordId:legacy.recordId,contentHash:legacy.contentHash,logicalKey:metricLogicalKey(candidate),origin:'local_derivation',priorCurrentId:null,phase:'payload_verified',startedAt:legacy.startedAt});}}catch(error){}\n  }"""
          if s.count(old)!=1: raise SystemExit('metric journal anchor mismatch')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Fix Stage 10.5 recovery compatibility"
          git push origin HEAD:agent/stage10-5-hardening-documentation
