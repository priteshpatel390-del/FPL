name: Teamsheet 2.0.1 final verification

on:
  push:
    branches:
      - teamsheet-2.0.1-navigation-settings
    paths:
      - .github/workflows/teamsheet-2-0-1-implementation.yml
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    concurrency:
      group: teamsheet-2-0-1-final-verification
      cancel-in-progress: true
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: teamsheet-2.0.1-navigation-settings
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Confirm implementation boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e scripts/apply-teamsheet-2.0.1.py
          grep -F "Object.freeze({route:'#/fixtures',key:'fixtures'" src/ui/app-shell.mjs
          grep -F "Object.freeze({route:'#/leagues',key:'leagues'" src/ui/app-shell.mjs
          grep -F "Free transfers and bank stay visible on Team" src/ui/app-shell.mjs
          grep -F "Ask Teamsheet" src/ui/app-shell.mjs
          grep -F "440/440 tests" docs/TESTING.md

      - name: Remove temporary workflow and commit final source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/teamsheet-2-0-1-implementation.yml
          git config user.name 'Teamsheet Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary Teamsheet 2.0.1 verification workflow'
          git rev-parse HEAD > /tmp/teamsheet-source-commit

      - name: Run full suite and deterministic exact-identity builds
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(cat /tmp/teamsheet-source-commit)"
          chmod +x ./run-tests.sh
          BUILD_COMMIT="$SOURCE_COMMIT" ./run-tests.sh | tee final-test.log
          TEST_COUNT="$(awk '/^# tests /{print $3}' final-test.log | tail -1)"
          PASS_COUNT="$(awk '/^# pass /{print $3}' final-test.log | tail -1)"
          FAIL_COUNT="$(awk '/^# fail /{print $3}' final-test.log | tail -1)"
          test "$TEST_COUNT" = '440'
          test "$PASS_COUNT" = '440'
          test "$FAIL_COUNT" = '0'
          mkdir -p /tmp/teamsheet-build-one
          cp dist/index.html /tmp/teamsheet-build-one/index.html
          cp dist/app.bundle.js /tmp/teamsheet-build-one/app.bundle.js
          cp dist/manifest.json /tmp/teamsheet-build-one/manifest.json
          BUILD_COMMIT="$SOURCE_COMMIT" node build.mjs
          cmp /tmp/teamsheet-build-one/index.html dist/index.html
          cmp /tmp/teamsheet-build-one/app.bundle.js dist/app.bundle.js
          cmp /tmp/teamsheet-build-one/manifest.json dist/manifest.json
          cmp dist/index.html index.html
          grep -F "\"commit\": \"$SOURCE_COMMIT\"" dist/manifest.json
          git diff --check
          rm -f final-test.log

      - name: Commit generated deployables and push
        shell: bash
        run: |
          set -euo pipefail
          git add dist index.html
          git diff --cached --quiet || git commit -m 'Build verified Teamsheet 2.0.1 deployables'
          test -z "$(git status --short)"
          git push origin HEAD:teamsheet-2.0.1-navigation-settings
