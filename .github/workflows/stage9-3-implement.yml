name: Stage 9.3 implementation

on:
  push:
    branches:
      - agent/stage9-3-player-detail-uncertainty

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage9-3-player-detail-uncertainty
          fetch-depth: 0
      - name: Implement and verify Stage 9.3
        run: |
          if [ -f src/ui/player-detail.mjs ]; then
            echo "Stage 9.3 implementation already present."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import re
          
          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Expected {label} marker not found")
              return text.replace(old,new,1)
          
          player_detail = 'import { $, num, clamp, setChildren } from \'../util.mjs\';\n\nconst PLAYER_DETAIL_SPREAD_THRESHOLDS = Object.freeze({tightMax:2, moderateMax:5});\nlet playerDetailPreviousFocus = null;\nlet playerDetailSetupDone = false;\n\nfunction playerDetailSpread(summary = {}){\n  if(!summary || summary.available !== true)\n    return {available:false,label:null,width:null,quality:summary?.quality || null};\n  const p25 = num(summary.p25), p75 = num(summary.p75);\n  const width = Math.max(0,p75-p25);\n  const quality = summary.quality || \'full\';\n  const label = quality === \'reduced\' ? null\n    : width <= PLAYER_DETAIL_SPREAD_THRESHOLDS.tightMax ? \'Tight\'\n    : width <= PLAYER_DETAIL_SPREAD_THRESHOLDS.moderateMax ? \'Moderate\'\n    : \'Wide\';\n  return {available:true,label,width,quality,p25,p75};\n}\n\nfunction playerDetailRangePosition(value,min,max){\n  const low = num(min), high = num(max);\n  if(high <= low) return 50;\n  return clamp((num(value)-low)/(high-low)*100,0,100);\n}\n\nfunction playerDetailClose(){\n  if(typeof document === \'undefined\') return false;\n  const panel = $(\'playerDetailPanel\'), backdrop = $(\'playerDetailBackdrop\');\n  if(!panel || !backdrop) return false;\n  panel.hidden = true;\n  backdrop.hidden = true;\n  panel.setAttribute(\'aria-hidden\',\'true\');\n  if(document.body?.classList) document.body.classList.remove(\'player-detail-open\');\n  const restore = playerDetailPreviousFocus;\n  playerDetailPreviousFocus = null;\n  if(restore && typeof restore.focus === \'function\') restore.focus();\n  return true;\n}\n\nfunction playerDetailSetup(){\n  if(typeof document === \'undefined\') return false;\n  if(playerDetailSetupDone) return true;\n  const panel = $(\'playerDetailPanel\'), backdrop = $(\'playerDetailBackdrop\'), close = $(\'playerDetailClose\');\n  if(!panel || !backdrop || !close) return false;\n  close.addEventListener(\'click\',playerDetailClose);\n  backdrop.addEventListener(\'click\',playerDetailClose);\n  document.addEventListener(\'keydown\',event => {\n    if(panel.hidden) return;\n    if(event.key === \'Escape\'){\n      if(typeof event.preventDefault === \'function\') event.preventDefault();\n      playerDetailClose();\n      return;\n    }\n    if(event.key !== \'Tab\') return;\n    const focusable = Array.from(panel.querySelectorAll(\n      \'button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])\'\n    )).filter(node => !node.disabled && node.getAttribute?.(\'aria-hidden\') !== \'true\');\n    if(!focusable.length) return;\n    const first = focusable[0], last = focusable[focusable.length-1];\n    if(event.shiftKey && document.activeElement === first){\n      if(typeof event.preventDefault === \'function\') event.preventDefault();\n      last.focus();\n    } else if(!event.shiftKey && document.activeElement === last){\n      if(typeof event.preventDefault === \'function\') event.preventDefault();\n      first.focus();\n    }\n  });\n  playerDetailSetupDone = true;\n  return true;\n}\n\nfunction playerDetailOpen({title = \'\', body = [], trigger = null} = {}){\n  if(!playerDetailSetup()) return false;\n  const panel = $(\'playerDetailPanel\'), backdrop = $(\'playerDetailBackdrop\');\n  const titleNode = $(\'playerDetailTitle\'), bodyNode = $(\'playerDetailBody\'), close = $(\'playerDetailClose\');\n  playerDetailPreviousFocus = trigger || document.activeElement || null;\n  titleNode.textContent = String(title);\n  setChildren(bodyNode,body);\n  backdrop.hidden = false;\n  panel.hidden = false;\n  panel.setAttribute(\'aria-hidden\',\'false\');\n  if(document.body?.classList) document.body.classList.add(\'player-detail-open\');\n  if(close && typeof close.focus === \'function\') close.focus();\n  return true;\n}\n\nif(typeof document !== \'undefined\') playerDetailSetup();\n\nexport {\n  PLAYER_DETAIL_SPREAD_THRESHOLDS,\n  playerDetailSpread,\n  playerDetailRangePosition,\n  playerDetailSetup,\n  playerDetailOpen,\n  playerDetailClose\n};\n'
          tests_content = 'import test from \'node:test\';\nimport assert from \'node:assert/strict\';\nimport { readFileSync } from \'node:fs\';\nimport {\n  PLAYER_DETAIL_SPREAD_THRESHOLDS,\n  playerDetailSpread,\n  playerDetailRangePosition,\n  playerDetailSetup,\n  playerDetailOpen\n} from \'../src/ui/player-detail.mjs\';\n\ntest(\'approved uncertainty labels use exact 2.0 and 5.0 point boundaries\',()=>{\n  assert.deepEqual(PLAYER_DETAIL_SPREAD_THRESHOLDS,{tightMax:2,moderateMax:5});\n  assert.equal(playerDetailSpread({available:true,p25:1,p75:3,quality:\'full\'}).label,\'Tight\');\n  assert.equal(playerDetailSpread({available:true,p25:1,p75:3.01,quality:\'full\'}).label,\'Moderate\');\n  assert.equal(playerDetailSpread({available:true,p25:1,p75:6,quality:\'full\'}).label,\'Moderate\');\n  assert.equal(playerDetailSpread({available:true,p25:1,p75:6.01,quality:\'full\'}).label,\'Wide\');\n});\n\ntest(\'unavailable and reduced-quality simulations suppress descriptive labels\',()=>{\n  assert.deepEqual(playerDetailSpread({available:false,quality:\'baseline-only\'}),{\n    available:false,label:null,width:null,quality:\'baseline-only\'\n  });\n  const reduced=playerDetailSpread({available:true,p25:2,p75:8,quality:\'reduced\'});\n  assert.equal(reduced.width,6);\n  assert.equal(reduced.label,null);\n  assert.equal(reduced.quality,\'reduced\');\n});\n\ntest(\'range marker positions are deterministic and bounded\',()=>{\n  assert.equal(playerDetailRangePosition(5,0,10),50);\n  assert.equal(playerDetailRangePosition(-5,0,10),0);\n  assert.equal(playerDetailRangePosition(15,0,10),100);\n  assert.equal(playerDetailRangePosition(4,4,4),50);\n});\n\ntest(\'dialog controller opens accessibly, closes on Escape and restores focus\',()=>{\n  const listeners={};\n  const makeNode=id=>({\n    id,nodeType:1,hidden:true,attrs:{},children:[],disabled:false,textContent:\'\',\n    classList:{values:new Set(),add(v){this.values.add(v);},remove(v){this.values.delete(v);}},\n    addEventListener(type,fn){listeners[`${id}:${type}`]=fn;},\n    setAttribute(key,value){this.attrs[key]=String(value);},\n    getAttribute(key){return this.attrs[key];},\n    appendChild(child){this.children.push(child);child.parentNode=this;return child;},\n    removeChild(child){this.children.splice(this.children.indexOf(child),1);},\n    get firstChild(){return this.children[0]||null;},\n    querySelectorAll(){return [nodes.playerDetailClose];},\n    focus(){document.activeElement=this;this.focused=true;}\n  });\n  const nodes={\n    playerDetailPanel:makeNode(\'playerDetailPanel\'),\n    playerDetailBackdrop:makeNode(\'playerDetailBackdrop\'),\n    playerDetailClose:makeNode(\'playerDetailClose\'),\n    playerDetailTitle:makeNode(\'playerDetailTitle\'),\n    playerDetailBody:makeNode(\'playerDetailBody\')\n  };\n  const trigger=makeNode(\'trigger\');\n  globalThis.document={\n    activeElement:trigger,\n    body:{classList:{values:new Set(),add(v){this.values.add(v);},remove(v){this.values.delete(v);}}},\n    getElementById:id=>nodes[id],\n    addEventListener(type,fn){listeners[`document:${type}`]=fn;},\n    createTextNode:text=>({nodeType:3,textContent:String(text)})\n  };\n\n  assert.equal(playerDetailSetup(),true);\n  assert.equal(playerDetailOpen({title:\'Saka details\',body:[\'content\'],trigger}),true);\n  assert.equal(nodes.playerDetailPanel.hidden,false);\n  assert.equal(nodes.playerDetailBackdrop.hidden,false);\n  assert.equal(nodes.playerDetailPanel.attrs[\'aria-hidden\'],\'false\');\n  assert.equal(nodes.playerDetailTitle.textContent,\'Saka details\');\n  assert.equal(nodes.playerDetailClose.focused,true);\n\n  let prevented=false;\n  listeners[\'document:keydown\']({key:\'Escape\',preventDefault(){prevented=true;}});\n  assert.equal(prevented,true);\n  assert.equal(nodes.playerDetailPanel.hidden,true);\n  assert.equal(nodes.playerDetailBackdrop.hidden,true);\n  assert.equal(nodes.playerDetailPanel.attrs[\'aria-hidden\'],\'true\');\n  assert.equal(trigger.focused,true);\n  delete globalThis.document;\n});\n\ntest(\'template provides mobile bottom sheet and desktop side panel semantics\',()=>{\n  const html=readFileSync(new URL(\'../app.html\',import.meta.url),\'utf8\');\n  assert.match(html,/id="playerDetailPanel"[^>]*role="dialog"[^>]*aria-modal="true"/);\n  assert.match(html,/aria-labelledby="playerDetailTitle"/);\n  assert.match(html,/id="playerDetailClose"[^>]*aria-label="Close player details"/);\n  assert.match(html,/@media\\(min-width:760px\\)\\{[\\s\\S]*\\.player-detail-panel\\{top:0;bottom:0;left:auto;right:0/);\n});\n\ntest(\'player surfaces open the new detail view without the legacy inline drawer\',()=>{\n  const views=readFileSync(new URL(\'../src/ui/views.mjs\',import.meta.url),\'utf8\');\n  assert.match(views,/simulatePlayerGameweek\\(p,S\\.nextGW\\)/);\n  assert.match(views,/minutesEstimate\\(p\\)/);\n  assert.match(views,/playerDetailOpen\\(\\{title:/);\n  assert.match(views,/onclick:event=>openPlayerDetailView/);\n  assert.doesNotMatch(views,/tr\\.bd|class:\'bd\'/);\n});\n'
          detail_css = "/* player detail sheet / panel */\nbody.player-detail-open{overflow:hidden}\n.player-detail-backdrop{position:fixed;inset:0;z-index:38;background:rgba(8,20,13,.46);backdrop-filter:blur(2px)}\n.player-detail-panel{position:fixed;z-index:39;left:0;right:0;bottom:0;max-height:min(88dvh,780px);overflow:hidden;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;box-shadow:0 -20px 55px rgba(8,20,13,.28);display:flex;flex-direction:column}\n.player-detail-panel[hidden],.player-detail-backdrop[hidden]{display:none}\n.player-detail-grip{width:42px;height:4px;border-radius:999px;background:var(--line);margin:9px auto 2px}\n.player-detail-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:10px 16px 12px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96)}\n.player-detail-top h2{font-size:20px}\n.player-detail-close{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#F7F9F5;color:var(--ink);font-size:24px;line-height:1;display:grid;place-items:center;flex:0 0 auto}\n.player-detail-close:hover{background:#EEF1EB}\n.player-detail-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(22px + env(safe-area-inset-bottom,0))}\n.player-detail-identity{display:flex;align-items:center;gap:14px;padding:2px 0 14px}\n.detail-shirt{width:46px;height:53px;flex:0 0 auto}\n.detail-shirt:before,.detail-shirt:after{width:14px;height:21px}\n.player-detail-identity-copy{min-width:0}\n.player-detail-name{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:800;line-height:1.05}\n.player-detail-meta{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);margin-top:5px}\n.player-detail-news{font-size:12px;color:var(--claret);margin-top:6px}\n.player-detail-section{padding:15px 0;border-top:1px solid var(--line)}\n.player-detail-section h3{font-size:15px;margin-bottom:9px}\n.player-detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}\n.player-detail-metric{background:#F7F9F5;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}\n.player-detail-metric .label{display:block;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}\n.player-detail-metric strong{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:18px;margin-top:3px}\n.player-detail-metric .meta{display:block;font-size:10.5px;color:var(--ink-soft);margin-top:2px;line-height:1.25}\n.player-detail-help{font-size:11px;color:var(--ink-soft);margin:8px 0 0}\n.player-detail-range{background:#F4F8F4;border:1px solid #C9D8CD;border-radius:14px;padding:12px}\n.player-detail-range-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}\n.player-detail-range-head strong{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:22px;line-height:1.05;margin-top:3px}\n.range-label{font-family:'IBM Plex Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.08em;border-radius:999px;padding:5px 7px;white-space:nowrap}\n.range-label.tight{background:#DDEFE4;color:#17643D}\n.range-label.moderate{background:#F5E9C9;color:#7B5A13}\n.range-label.wide{background:#F4DDE2;color:#842841}\n.player-detail-range-track{position:relative;height:12px;border-radius:999px;background:#DCE4DD;margin-top:13px}\n.player-detail-range-core{position:absolute;top:0;bottom:0;border-radius:999px;background:var(--pitch)}\n.player-detail-range-median{position:absolute;top:-4px;width:3px;height:20px;border-radius:3px;background:var(--ink);transform:translateX(-1px)}\n.player-detail-range-scale{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--ink-soft);margin-top:5px}\n.player-detail-expand{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff}\n.player-detail-expand summary{color:var(--ink)}\n.player-detail-expand[open] summary{margin-bottom:9px}\n.detail-percentiles{grid-template-columns:repeat(3,minmax(0,1fr))}\n.probability-grid{margin-top:8px}\n.player-detail-breakdown{background:#F7F9F5;border-left:3px solid var(--pitch);padding:12px 14px;border-radius:0 10px 10px 0;font-size:12.5px}\n.bars{display:grid;gap:5px;margin-top:8px}\n.bar{display:grid;grid-template-columns:118px 1fr 46px;gap:8px;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:11px}\n.bar .track{height:9px;background:#E4E8DF;border-radius:5px;overflow:hidden}\n.bar .fill{height:100%;background:var(--pitch);border-radius:5px}\n.bar .fill.neg{background:var(--claret)}\n.bar .v{text-align:right;color:var(--ink-soft)}\n.pitch-player{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}\n.pitch-player:focus-visible .pitch-copy{outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 5px var(--info),0 4px 10px rgba(7,27,17,.18)}\n@media(min-width:760px){\n  .player-detail-panel{top:0;bottom:0;left:auto;right:0;width:min(460px,44vw);max-height:none;border-radius:0;border-width:0 0 0 1px}\n  .player-detail-grip{display:none}\n  .player-detail-top{padding-top:calc(18px + env(safe-area-inset-top,0))}\n  .player-detail-body{padding-bottom:24px}\n}\n@media(max-width:390px){\n  .player-detail-grid{gap:6px}\n  .player-detail-metric{padding:9px 8px}\n  .player-detail-metric strong{font-size:16px}\n  .detail-percentiles{grid-template-columns:repeat(3,minmax(0,1fr))}\n}\n@media(prefers-reduced-motion:no-preference){\n  .player-detail-panel{animation:playerDetailIn .2s ease both}\n  @keyframes playerDetailIn{from{transform:translateY(22px);opacity:.7}to{transform:none;opacity:1}}\n}\n@media(prefers-reduced-motion:no-preference) and (min-width:760px){\n  .player-detail-panel{animation-name:playerDetailInSide}\n  @keyframes playerDetailInSide{from{transform:translateX(24px);opacity:.7}to{transform:none;opacity:1}}\n}\n"
          overlay_html = '<div id="playerDetailBackdrop" class="player-detail-backdrop" hidden></div>\n<aside id="playerDetailPanel" class="player-detail-panel" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="playerDetailTitle" hidden>\n  <div class="player-detail-grip" aria-hidden="true"></div>\n  <div class="player-detail-top">\n    <div>\n      <span class="eyebrow">Player detail</span>\n      <h2 id="playerDetailTitle">Player details</h2>\n    </div>\n    <button type="button" class="player-detail-close" id="playerDetailClose" aria-label="Close player details">×</button>\n  </div>\n  <div class="player-detail-body" id="playerDetailBody"></div>\n</aside>'
          views_helpers = "function playerDetailSection(title,...children){\n  return elNode('section',{class:'player-detail-section'},elNode('h3',{},title),children);\n}\nfunction playerDetailMetric(label,value,meta=''){\n  return elNode('div',{class:'player-detail-metric'},\n    elNode('span',{class:'label'},label),\n    elNode('strong',{},value),\n    meta ? elNode('span',{class:'meta'},meta) : null);\n}\nfunction playerDetailPercent(value){ return `${Math.round(clamp(num(value),0,1)*100)}%`; }\n\nfunction openPlayerDetailView(p,from,span,trigger){\n  const team=S.teams[p.team], x=xpOf(p,from,span), next=xpOf(p,S.nextGW,1);\n  const mins=minutesEstimate(p), simulation=simulatePlayerGameweek(p,S.nextGW);\n  const palette=teamPitchPalette(team), detail=[];\n  const fixtures=teamFixtures(p.team,S.nextGW,1)[0]||[];\n  const fixtureLabel=fixtures.length?fixtures.map(g=>`${g.opp.short_name} ${g.home?'H':'A'}`).join(' + '):'Blank';\n  const paletteStyle=`--shirt-primary:${palette.primary};--shirt-secondary:${palette.secondary};--shirt-accent:${palette.accent};--shirt-ink:${palette.ink}`;\n  const identity=elNode('div',{class:'player-detail-identity'},\n    elNode('span',{class:`club-shirt detail-shirt pattern-${palette.pattern}`,style:paletteStyle,'aria-hidden':'true'},\n      elNode('span',{class:'club-shirt-code'},palette.code)),\n    elNode('div',{class:'player-detail-identity-copy'},\n      elNode('div',{class:'player-detail-name'},p.web_name,flagNodes(p)),\n      elNode('div',{class:'player-detail-meta'},\n        [S.posName[p.element_type]||'Player',team?.name,`£${(p.now_cost/10).toFixed(1)}m`,fixtureLabel].filter(Boolean).join(' · ')),\n      p.news?elNode('div',{class:'player-detail-news'},p.news,' ',elNode('span',{class:'flag dark'},newsAge(p))):null));\n  detail.push(identity);\n\n  detail.push(playerDetailSection('Decision summary',\n    elNode('div',{class:'player-detail-grid'},\n      playerDetailMetric(`GW${S.nextGW} xP`,fmt1(next.total),fixtureLabel),\n      playerDetailMetric(`${span} GW xP`,fmt1(x.total),`${x.games} fixture${x.games===1?'':'s'}`),\n      playerDetailMetric('Form',fmt1(num(p.form)),`${p.selected_by_percent}% owned`),\n      playerDetailMetric('Availability',availability(p)>=1?'Available':availability(p)>=.75?'Doubtful':'Unavailable',p.status==='a'?'Official status clear':p.news||'Check latest team news'))));\n\n  detail.push(playerDetailSection('Expected minutes',\n    elNode('div',{class:'player-detail-grid minutes-grid'},\n      playerDetailMetric('Expected',`${fmt1(mins.expMin)} min`,`${mins.confidenceLabel} confidence · ${mins.source}`),\n      playerDetailMetric('Starts',playerDetailPercent(mins.pStart)),\n      playerDetailMetric('Appears',playerDetailPercent(mins.pAppear)),\n      playerDetailMetric('Reaches 60',playerDetailPercent(mins.p60))),\n    elNode('p',{class:'player-detail-help'},'Expected minutes are model estimates, not confirmed team news.')));\n\n  const uncertaintyNodes=[];\n  if(!simulation.available){\n    uncertaintyNodes.push(noteNode('plain',elNode('b',{},'Unavailable in pre-season.'),' Detailed ranges switch on once live Gameweek event data exists; Teamsheet will not invent precise distributions from the price baseline.'));\n  } else {\n    const spread=playerDetailSpread(simulation);\n    const low=num(simulation.p10), high=num(simulation.p90);\n    const left=playerDetailRangePosition(simulation.p25,low,high);\n    const right=playerDetailRangePosition(simulation.p75,low,high);\n    const middle=playerDetailRangePosition(simulation.median,low,high);\n    uncertaintyNodes.push(elNode('div',{class:'player-detail-range'},\n      elNode('div',{class:'player-detail-range-head'},\n        elNode('div',{},elNode('span',{class:'eyebrow'},'Likely middle range'),elNode('strong',{},`${fmt1(simulation.p25)}–${fmt1(simulation.p75)} pts`)),\n        spread.label?elNode('span',{class:`range-label ${spread.label.toLowerCase()}`},`${spread.label} range`):null),\n      elNode('div',{class:'player-detail-range-track','aria-label':`P10 ${fmt1(low)}, P25 ${fmt1(simulation.p25)}, median ${fmt1(simulation.median)}, P75 ${fmt1(simulation.p75)}, P90 ${fmt1(high)}`},\n        elNode('span',{class:'player-detail-range-core',style:{left:`${left}%`,right:`${100-right}%`}}),\n        elNode('span',{class:'player-detail-range-median',style:{left:`${middle}%`}})),\n      elNode('div',{class:'player-detail-range-scale'},elNode('span',{},`P10 ${fmt1(low)}`),elNode('span',{},`P90 ${fmt1(high)}`))));\n    if(spread.quality==='reduced')\n      uncertaintyNodes.push(noteNode('bad',elNode('b',{},'Reduced input quality.'),' The numeric range is shown, but the Tight/Moderate/Wide label is suppressed because the minutes inputs required bounding.'));\n    uncertaintyNodes.push(elNode('details',{class:'player-detail-expand'},\n      elNode('summary',{},'Full range and outcome probabilities'),\n      elNode('div',{class:'player-detail-grid detail-percentiles'},\n        playerDetailMetric('P10',fmt1(simulation.p10),'lower-tail outcome'),\n        playerDetailMetric('Median',fmt1(simulation.median),'middle outcome'),\n        playerDetailMetric('P90',fmt1(simulation.p90),'upside outcome')),\n      elNode('div',{class:'player-detail-grid probability-grid'},\n        playerDetailMetric('Blank',playerDetailPercent(simulation.blankProbability),'2 points or fewer'),\n        playerDetailMetric('Return',playerDetailPercent(simulation.returnProbability),'5+ points'),\n        playerDetailMetric('Haul',playerDetailPercent(simulation.haulProbability),'10+ points'),\n        playerDetailMetric('Mega-haul',playerDetailPercent(simulation.megaHaulProbability),'15+ points')),\n      elNode('p',{class:'player-detail-help'},'These are model-conditional simulations, not externally calibrated probabilities.')));\n  }\n  detail.push(playerDetailSection('Uncertainty',uncertaintyNodes));\n\n  detail.push(playerDetailSection('How the projection is built',\n    elNode('div',{class:'player-detail-breakdown'},breakdownNode(p,x,span))));\n\n  playerDetailOpen({title:`${p.web_name} details`,body:detail,trigger});\n}\n"
          new_player_block = "  const playerBody = elNode('tbody');\n  ranked.forEach(({p,x}) => {\n    const t = S.teams[p.team];\n    playerBody.appendChild(elNode('tr',{class:'clickable',dataset:{pid:p.id},onclick:event=>openPlayerDetailView(p,from,span,event.currentTarget)},\n      elNode('td',{},elNode('span',{class:'pname'},p.web_name,flagNodes(p)),\n        elNode('span',{class:'pmeta'},elNode('span',{class:'pos'},S.posName[p.element_type]||'?'),` ${t?t.short_name:'—'}${x.games!==span?` · ${x.games} games`:''}`)),\n      cell((p.now_cost/10).toFixed(1),'num'),cell(p.selected_by_percent,'num'),cell(fmt1(num(p.form)),'num'),\n      elNode('td',{class:'num'},elNode('span',{class:`xp ${x.perGW >= maxPer*0.82 ? 'hot':''}`},fmt1(x.perGW))),\n      cell(fmt1(x.total),'num'),cell(fmt1(x.total/(p.now_cost/10)),'num')));\n  });\n  setChildren($('playerTable'),elNode('table',{class:'data'},elNode('thead',{},elNode('tr',{},head('Player'),head('£','num'),head('Own%','num'),head('Form','num'),head('xP/GW','num'),head(`xP ${span}GW`,'num'),head('per £m','num'))),playerBody));\n}"
          
          Path('src/ui/player-detail.mjs').write_text(player_detail)
          Path('tests/player-detail.test.mjs').write_text(tests_content)
          
          build=Path('build.mjs')
          text=build.read_text()
          text=replace_once(text,
