name: Temporary Stage 10.1 startup amendment verifier

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage10-1-deadline-snapshot
          fetch-depth: 0

      - name: Apply approved startup amendment
        shell: bash
        run: |
          set -euo pipefail
          test -f .stage10-patch.ready
          cat .stage10-patch.part-* | base64 --decode > /tmp/stage10-amend.patch.xz
          xz -t /tmp/stage10-amend.patch.xz
          xz -dc /tmp/stage10-amend.patch.xz > /tmp/stage10-amend.patch

          BASE_SOURCE=09dc35a5aa71e493233e7b6d8cacca92b60abb48
          git checkout "$BASE_SOURCE" -- \
            CLAUDE.md \
            app.html \
            docs/ARCHITECTURE.md \
            docs/CHANGELOG.md \
            docs/DATA_SOURCES.md \
            docs/DECISIONS.md \
            docs/KNOWN_LIMITATIONS.md \
            docs/PROJECTION_MODEL.md \
            docs/PROJECT_CONTEXT.md \
            docs/ROADMAP.md \
            docs/SECURITY.md \
            docs/STAGE10-DESIGN.md \
            docs/STAGE10-ITEM1.md \
            docs/STAGE_HISTORY.md \
            docs/TESTING.md \
            src/evidence/snapshot.mjs \
            src/main.mjs \
            src/providers/registry.mjs \
            src/ui/app-shell.mjs \
            src/ui/evidence.mjs \
            src/ui/views.mjs \
            tests/evidence-snapshot.test.mjs \
            tests/evidence-storage.test.mjs \
            tests/provider-health.test.mjs

          git apply --check /tmp/stage10-amend.patch
          git apply /tmp/stage10-amend.patch
          rm -f .stage10-patch.part-* .stage10-patch.ready
          rm -f .stage10-amend.part-* .stage10-amend.ready
          rm -f .github/workflows/stage10-startup-amend-verify.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add -A
          git commit -m "Amend Stage 10.1 verified startup flow"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Record exact source identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          source = os.environ['SOURCE_SHA']
          paths = [Path('CLAUDE.md'), *Path('docs').glob('*.md')]
          for path in paths:
              text = path.read_text()
              if '__SOURCE_SHA__' in text:
                  path.write_text(text.replace('__SOURCE_SHA__', source))
          remaining = [str(path) for path in paths if '__SOURCE_SHA__' in path.read_text()]
          if remaining:
              raise SystemExit(f'unresolved source identity placeholders: {remaining}')
          PY

      - name: Run full verification
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          BUILD_COMMIT="$SOURCE_SHA" ./run-tests.sh | tee /tmp/stage10-tests.log
          cp -a dist /tmp/stage10-dist-first
          cp index.html /tmp/stage10-root-first.html
          BUILD_COMMIT="$SOURCE_SHA" node build.mjs
          cmp -s /tmp/stage10-dist-first/app.bundle.js dist/app.bundle.js
          cmp -s /tmp/stage10-dist-first/index.html dist/index.html
          cmp -s /tmp/stage10-dist-first/manifest.json dist/manifest.json
          cmp -s /tmp/stage10-root-first.html index.html
          cmp -s index.html dist/index.html
          node --check dist/app.bundle.js
          node -e "const m=require('./dist/manifest.json'); if(m.commit!==process.env.SOURCE_SHA) throw new Error('build identity mismatch')"
          grep -q '# tests 349' /tmp/stage10-tests.log
          grep -q '# pass 349' /tmp/stage10-tests.log
          grep -q '# fail 0' /tmp/stage10-tests.log
          git diff --check

      - name: Commit verified artefacts
        shell: bash
        run: |
          set -euo pipefail
          git add CLAUDE.md docs dist index.html
          git commit -m "Verify Stage 10.1 automatic startup artefacts"
          git push origin HEAD:agent/stage10-1-deadline-snapshot
