name: Temporary Stage 10 root deployment verifier

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage10-1-deadline-snapshot
          fetch-depth: 0
      - name: Apply reviewed deployment-copy fix
        shell: bash
        run: |
          git apply --check .stage10-rootcopy.patch
          git apply .stage10-rootcopy.patch
          rm -f .stage10-rootcopy.patch
          rm -f .github/workflows/stage10-rootcopy-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Stage 10.1 deployment-copy verification"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Record exact source identity
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          source = os.environ['SOURCE_SHA']
          old = '09dc35a5aa71e493233e7b6d8cacca92b60abb48'
          paths = [
              Path('CLAUDE.md'),
              Path('docs/STAGE_HISTORY.md'),
              Path('docs/TESTING.md'),
              Path('docs/STAGE10-ITEM1.md'),
              Path('docs/CHANGELOG.md'),
              Path('docs/PROJECT_CONTEXT.md'),
              Path('docs/ROADMAP.md'),
          ]
          for path in paths:
              text = path.read_text()
              text = text.replace(old, source)
              text = text.replace('337/337', '338/338')
              text = text.replace('337 tests', '338 tests')
              path.write_text(text)

          testing = Path('docs/TESTING.md')
          text = testing.read_text()
          text = text.replace(
              '3. Compare `dist/index.html`, `dist/app.bundle.js` and `dist/manifest.json` byte-for-byte.',
              '3. Compare `dist/index.html`, `dist/app.bundle.js` and `dist/manifest.json` byte-for-byte, then verify the generated root `index.html` deployment copy is identical to `dist/index.html`.'
          )
          testing.write_text(text)

          item = Path('docs/STAGE10-ITEM1.md')
          text = item.read_text()
          text = text.replace(
              '- Successful production build and byte-identical two-build comparison.',
              '- Successful production build and byte-identical two-build comparison. The generated root `index.html` deployment copy is also byte-identical to `dist/index.html`.'
          )
          item.write_text(text)

          changelog = Path('docs/CHANGELOG.md')
          text = changelog.read_text()
          marker = f'- Verified source `{source}`: **338/338 passing**, successful production build, byte-identical two-build output and exact build identity.'
          if marker in text and 'generated root `index.html` deployment copy' not in text.split(marker,1)[1][:180]:
              text = text.replace(marker, marker + ' The generated root `index.html` deployment copy is byte-identical to `dist/index.html`.')
          changelog.write_text(text)
          PY
      - name: Run full verification
        shell: bash
        run: |
          set -o pipefail
          BUILD_COMMIT="$SOURCE_SHA" ./run-tests.sh | tee /tmp/stage10-tests.log
          cp -a dist /tmp/stage10-dist-first
          cp index.html /tmp/stage10-root-first.html
          BUILD_COMMIT="$SOURCE_SHA" node build.mjs
          cmp -s /tmp/stage10-dist-first/app.bundle.js dist/app.bundle.js
          cmp -s /tmp/stage10-dist-first/index.html dist/index.html
          cmp -s /tmp/stage10-dist-first/manifest.json dist/manifest.json
          cmp -s /tmp/stage10-root-first.html index.html
          cmp -s index.html dist/index.html
          node --check dist/app.bundle.js
          node -e "const m=require('./dist/manifest.json'); if(m.commit!==process.env.SOURCE_SHA) throw new Error('build identity mismatch')"
          grep -q '# tests 338' /tmp/stage10-tests.log
          grep -q '# pass 338' /tmp/stage10-tests.log
          grep -q '# fail 0' /tmp/stage10-tests.log
      - name: Commit verified artefacts
        shell: bash
        run: |
          git add CLAUDE.md docs dist index.html
          git commit -m "Verify Stage 10.1 deployment artefacts"
          git push origin HEAD:agent/stage10-1-deadline-snapshot
