name: Stage 10.5 closeout verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'agent/stage10-5-post-merge-closeout'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Enforce documentation-only scope
        run: |
          git fetch origin main
          expected=$(printf '%s\n' \
            .github/workflows/stage10-5-closeout-verify.yml \
            CLAUDE.md \
            docs/CHANGELOG.md \
            docs/PROJECT_CONTEXT.md \
            docs/ROADMAP.md \
            docs/STAGE10-DESIGN.md \
            docs/STAGE10-ITEM5.md \
            docs/STAGE_HISTORY.md | sort)
          actual=$(git diff --name-only origin/main...HEAD | sort)
          test "$actual" = "$expected" || { echo "Unexpected changed files:"; printf '%s\n' "$actual"; exit 1; }
          git diff --check origin/main...HEAD
          ! grep -q "Stage 10.5 exact scope and approval are not yet recorded" docs/ROADMAP.md
          ! grep -q "Draft PR review and physical iPhone acceptance remain required before merge" docs/PROJECT_CONTEXT.md
          ! grep -q "The draft PR and physical iPhone acceptance remain the merge gate" CLAUDE.md

      - name: Run complete test suite
        run: ./run-tests.sh

      - name: Verify deterministic exact-identity build
        run: |
          mkdir -p /tmp/stage10-closeout/build1
          BUILD_COMMIT=0302c54e3eb1d77657b3d892bebb33c90438fa92 node build.mjs
          git diff --exit-code -- index.html dist/index.html dist/app.bundle.js dist/manifest.json
          cp index.html dist/index.html dist/app.bundle.js dist/manifest.json /tmp/stage10-closeout/build1/
          BUILD_COMMIT=0302c54e3eb1d77657b3d892bebb33c90438fa92 node build.mjs
          cmp index.html /tmp/stage10-closeout/build1/index.html
          cmp dist/index.html /tmp/stage10-closeout/build1/index.html
          cmp dist/app.bundle.js /tmp/stage10-closeout/build1/app.bundle.js
          cmp dist/manifest.json /tmp/stage10-closeout/build1/manifest.json
          git diff --exit-code -- index.html dist/index.html dist/app.bundle.js dist/manifest.json

      - name: Remove temporary verification workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage10-5-closeout-verify.yml
          git commit -m "Remove temporary closeout verification workflow"
          git push origin HEAD:agent/stage10-5-post-merge-closeout
