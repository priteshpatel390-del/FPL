name: PR72 baseline contract verification

on:
  push:
    branches:
      - agent/transfers-exact-continuation

permissions:
  contents: write

jobs:
  verify-and-finalise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/transfers-exact-continuation
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply approved presentation-contract correction
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          source_path=Path('src/ui/transfer-performance.mjs')
          source=source_path.read_text()
          function_needle="function transferPerformanceRenderResult(result,context,{cached=false}={}){"
          helper="""function transferPerformanceResultBaseline(result={}){
            const baseline=result?.baseline;
            if(!baseline||Number(baseline.transferCount)!==0) return null;
            if(!Array.isArray(baseline.transfers)||baseline.transfers.length!==0) return null;
            return baseline;
          }

          """
          if helper not in source:
            assert function_needle in source, 'render-result function not found'
            source=source.replace(function_needle,helper+function_needle,1)

          old="""  const plans=result.plans||[];
            const state=transferPlannerPresentationState(plans);
            const baseline=plans.find(plan=>Number(plan.transferCount)===0);
            if(!baseline){
              transferPerformanceRenderError('No zero-transfer baseline was returned.','Teamsheet will not present a transfer decision without its required comparison.');
              return;
            }

            const alternatives=plans.filter(plan=>Number(plan.transferCount)>0);
          """
          new="""  const rankedPlans=Array.isArray(result.plans)?result.plans:[];
            const baseline=transferPerformanceResultBaseline(result);
            if(!baseline){
              transferPerformanceRenderError('No zero-transfer baseline was returned.','Teamsheet will not present a transfer decision without its required comparison.');
              return;
            }
            const plans=rankedPlans.some(plan=>Number(plan?.transferCount)===0)
              ? rankedPlans.map(plan=>Number(plan?.transferCount)===0?baseline:plan)
              : [...rankedPlans,baseline];
            const state=transferPlannerPresentationState(plans);
            const alternatives=rankedPlans.filter(plan=>Number(plan?.transferCount)>0);
          """
          assert old in source, 'old baseline presentation block not found'
          source=source.replace(old,new,1)
          source_path.write_text(source)

          test_path=Path('tests/transfer-baseline-presentation.test.mjs')
          test_path.write_text(r"""// Regression coverage for the result contract between the exact optimiser and the
          // Transfers presentation. The optimiser owns a separately returned mandatory
          // zero-transfer baseline while result.plans remains the unchanged ranked Top K.
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { loadApp, syntheticWorld } from './harness.mjs';

          const walk=root=>{ const nodes=[]; const visit=node=>{ if(!node) return; nodes.push(node); (node.children||[]).forEach(visit); }; visit(root); return nodes; };
          const visibleText=root=>walk(root).filter(node=>node.nodeType===3).map(node=>node.textContent).join('');
          const classCount=(root,name)=>walk(root).filter(node=>String(node.attrs?.class||'').split(/\s+/).includes(name)).length;
          const settle=async(turns=8)=>{ for(let index=0;index<turns;index++) await new Promise(resolve=>setTimeout(resolve,0)); };

          function completeSquad(T){
            const need={1:2,2:5,3:5,4:3};
            const manual=[];
            let id=900;
            for(const [position,count] of Object.entries(need)){
              for(let index=0;index<count;index++){
                const player={id:id++,web_name:`S${id}`,element_type:Number(position),team:(index%3)+1,now_cost:45,
                  status:'a',chance_of_playing_next_round:100,minutes:900,starts:10,total_points:40,form:'4.0',
                  selected_by_percent:'10',goals_scored:2,assists:2,clean_sheets:2,saves:0,bonus:4,bps:200,
                  expected_goals_per_90:0.2,expected_assists_per_90:0.2,defensive_contribution_per_90:0,
                  news:'',cost_change_event:0,transfers_in_event:0,transfers_out_event:0,yellow_cards:0,penalties_order:null};
                T.S.boot.elements.push(player);
                T.S.byId[player.id]=player;
                manual.push({id:player.id,bought:45});
              }
            }
            T.S.manual=manual;
          }

          function openTransfers(fields={}){
            const app=loadApp({trHorizon:'1',trTop:'8',trFtCount:'1',trBankIn:'0',useManual:true,...fields},{interactive:true});
            syntheticWorld(app.T);
            completeSquad(app.T);
            app.doc.useManual.checked=true;
            app.T.S.nextGW=11;
            return app;
          }

          function baselinePlan(){
            return {transferCount:0,transfers:[],finalSquadIds:[],netGain:0,grossGain:0,grossBestXIPoints:10,
              hitCost:0,paidTransfers:0,bankBefore:0,bankAfter:0,freeTransfersBefore:1,freeTransfersNextGW:2,
              rollDifference:0,signature:'',warnings:[],doubtfulIncoming:0,perGameweekBestXI:[],pricingMode:'exact'};
          }

          function strongerTransferPlan(T){
            const incoming=T.S.boot.elements.find(player=>Number(player.id)<900&&Number(player.element_type)===1);
            assert.ok(incoming,'fixture requires an unowned goalkeeper');
            return {transferCount:1,transfers:[{outPlayerId:900,inPlayerId:Number(incoming.id),position:1,sellPrice:45,buyPrice:Number(incoming.now_cost)}],
              finalSquadIds:[],netGain:2,grossGain:2,grossBestXIPoints:12,hitCost:0,paidTransfers:0,
              bankBefore:0,bankAfter:0,freeTransfersBefore:1,freeTransfersNextGW:1,rollDifference:-1,
              signature:`900>${incoming.id}`,warnings:[],doubtfulIncoming:0,perGameweekBestXI:[],pricingMode:'exact'};
          }

          function sendResult(worker,result){
            const request=worker.messages.find(message=>message.type==='calculate');
            assert.ok(request,'worker calculate request missing');
            worker.onmessage({data:{type:'result',requestId:request.requestId,result}});
          }

          test('an evicted zero-transfer baseline renders from result.baseline without changing the ranked Top K',async()=>{
            const {T,doc,workers}=openTransfers({trTop:'1'});
            T.renderTransfers();
            await settle();
            const baseline=baselinePlan();
            const plan=strongerTransferPlan(T);
            sendResult(workers[0],{status:'ok',issues:[],plans:[plan],evaluations:12,pruned:3,baseline,pricingMode:'exact'});
            await settle();

            const text=visibleText(doc.transferOut);
            assert.match(text,/Make no transfer/,'the mandatory comparison must remain visible');
            assert.match(text,/Highest-ranked decision/,'the stronger ranked transfer must remain the decision');
            assert.doesNotMatch(text,/No zero-transfer baseline was returned/);
            assert.equal(classCount(doc.transferOut,'transfer-baseline-card'),1);
            assert.equal(T.S.lastOptimiser.result.plans.length,1,'presentation must not insert the baseline into the optimiser Top K');
            assert.equal(T.S.lastOptimiser.result.plans[0].transferCount,1);
          });

          test('the evicted-baseline result is reused from cache without recalculation or a duplicate baseline card',async()=>{
            const {T,doc,workers}=openTransfers({trTop:'1'});
            T.renderTransfers();
            await settle();
            const baseline=baselinePlan();
            sendResult(workers[0],{status:'ok',issues:[],plans:[strongerTransferPlan(T)],evaluations:12,pruned:3,baseline,pricingMode:'exact'});
            await settle();
            assert.equal(classCount(doc.transferOut,'transfer-baseline-card'),1);

            T.renderTransfers();
            assert.match(doc.transferStatus.textContent,/reused instantly/);
            assert.equal(workers.length,1,'unchanged cached inputs must not create another worker');
            assert.equal(classCount(doc.transferOut,'transfer-baseline-card'),1);
          });

          test('an ok result without a valid separate baseline remains fail-closed',async()=>{
            for(const baseline of [undefined,{transferCount:1,transfers:[]}]){
              const {T,doc,workers}=openTransfers({trTop:'1'});
              T.renderTransfers();
              await settle();
              const result={status:'ok',issues:[],plans:[strongerTransferPlan(T)],evaluations:12,pruned:3,pricingMode:'exact'};
              if(baseline!==undefined) result.baseline=baseline;
              sendResult(workers[0],result);
              await settle();
              const text=visibleText(doc.transferOut);
              assert.match(text,/No zero-transfer baseline was returned/);
              assert.doesNotMatch(text,/Highest-ranked decision/);
              assert.equal(classCount(doc.transferOut,'transfer-baseline-card'),0);
              assert.equal(T.S.lastOptimiser,null);
            }
          });
          """.replace('\n          ','\n').lstrip())
          PY

      - name: Preliminary full verification
        shell: bash
        run: |
          BUILD_COMMIT=pr72-baseline-preliminary ./run-tests.sh | tee /tmp/pr72-preliminary.log
          TEST_COUNT=$(grep -E '^# tests [0-9]+$' /tmp/pr72-preliminary.log | tail -1 | awk '{print $3}')
          test -n "$TEST_COUNT"
          echo "TEST_COUNT=$TEST_COUNT" >> "$GITHUB_ENV"

      - name: Update canonical documentation and remove temporary workflow
        shell: bash
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path

          count=os.environ['TEST_COUNT']
          retest=("**The corrected search completed on the second physical iPhone Safari test, but the result screen failed because "
                  "the separately returned zero-transfer baseline had fallen outside the Top 8 and the presentation read only "
                  "`result.plans`. The owner-approved PR #72 correction reads `result.baseline` without changing the optimiser "
                  "or its ranked Top 8. A further physical retest remains required.**")

          for name in ['CLAUDE.md','docs/PROJECT_CONTEXT.md','docs/ROADMAP.md','docs/TESTING.md']:
            path=Path(name)
            text=path.read_text()
            text=text.replace('**The corrected search has not yet been physically retested on iPhone Safari.**',retest)
            text=text.replace('609 passed, 0 failed, 0 skipped',f'{count} passed, 0 failed, 0 skipped')
            path.write_text(text)

          testing=Path('docs/TESTING.md')
          text=testing.read_text()
          suite="33. `transfer-baseline-presentation.test.mjs` — Worker-result and cache regressions for a separately returned mandatory zero-transfer baseline when it falls outside the unchanged ranked Top K, plus fail-closed handling of a missing or malformed baseline.\n"
          marker="32. `transfer-exact-correction.test.mjs` — the Track A correction."
          if suite not in text:
            index=text.index(marker)
            line_end=text.index('\n',index)
            text=text[:line_end+1]+suite+text[line_end+1:]
          testing.write_text(text)

          limitations=Path('docs/KNOWN_LIMITATIONS.md')
          text=limitations.read_text()
          old='| TRF-A1 | The first physical iPhone Safari test of the automatic exact Transfers search exhausted the 2,000,000 evaluation ceiling and reported "Exact search did not complete." | The approved corrective search architecture is implemented and automatically verified, and a Node reproduction of the failure shape that previously took 13 minutes 38 seconds now completes in about 1.2 seconds with identical complete top-8 results, but the corrected build has not yet been physically retested | PR #70 physical retest | **Open (acceptance gate)** |'
          new='| TRF-A1 | The first physical iPhone Safari test exhausted the 2,000,000 evaluation ceiling; the second completed the corrected search but exposed a presentation-contract defect when the mandatory baseline ranked outside Top 8 | PR #72 now reads the separately returned `result.baseline` while preserving the optimiser Top K; automated regression coverage is complete, but another physical iPhone retest is required | PR #72 physical retest | **Open (acceptance gate)** |'
          assert old in text, 'TRF-A1 row not found'
          limitations.write_text(text.replace(old,new,1))

          exact=Path('docs/TRANSFERS-EXACT-PERFORMANCE.md')
          text=exact.read_text().replace('609 passed, 0 failed, 0 skipped',f'{count} passed, 0 failed, 0 skipped')
          text=text.replace('passes 609 tests',f'passes {count} tests')
          section=f"""

          ## 2026-08-06 — Second physical iPhone test and baseline presentation correction

          The corrected exact search passed its original device failure point: it completed on Pritesh's live saved-data case rather than exhausting the two-million evaluation ceiling. The result screen nevertheless blocked with *"No zero-transfer baseline was returned."*

          This was a presentation-contract defect. The exact optimiser returns two deliberately different surfaces:

          - `result.plans` is the unchanged ranked Top K and may legally contain only transfer plans when every retained plan ranks above doing nothing;
          - `result.baseline` is the mandatory zero-transfer comparison and remains available even when it falls outside that Top K.

          The renderer had searched only `result.plans`. PR #72 now validates and reads the separate `result.baseline`, keeps `result.plans` untouched, and adds the baseline only to its local presentation/signature view when it is absent from the ranked set. A baseline already present in Top K is replaced by the same authoritative separate object rather than duplicated. Missing or malformed separate baselines still fail closed.

          No projection, score, candidate, transfer depth, affordability, comparator, ranking, result limit, evaluation ceiling or Worker lifecycle behaviour changed. Permanent production-bundle regressions cover Worker results with an evicted baseline, unchanged cached reuse with exactly one baseline card, and genuinely invalid baseline failure.

          Automated verification: **{count} passed, 0 failed, 0 skipped** with deterministic exact-identity builds and root/deployable equality. Physical iPhone Safari must still retest the corrected result screen before Track A can be product-accepted or merged.
          """.replace('\n          ','\n')
          if '## 2026-08-06 — Second physical iPhone test and baseline presentation correction' not in text:
            text=text.rstrip()+section+'\n'
          exact.write_text(text)

          workflow=Path('.github/workflows/pr72-baseline-contract.yml')
          workflow.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/transfer-performance.mjs tests/transfer-baseline-presentation.test.mjs CLAUDE.md docs/PROJECT_CONTEXT.md docs/ROADMAP.md docs/TESTING.md docs/KNOWN_LIMITATIONS.md docs/TRANSFERS-EXACT-PERFORMANCE.md .github/workflows/pr72-baseline-contract.yml
          git commit -m "Fix Transfers baseline presentation contract"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Final full suite and deterministic production build
        shell: bash
        run: |
          BUILD_COMMIT="$SOURCE_SHA" ./run-tests.sh | tee /tmp/pr72-final.log
          FINAL_COUNT=$(grep -E '^# tests [0-9]+$' /tmp/pr72-final.log | tail -1 | awk '{print $3}')
          test "$FINAL_COUNT" = "$TEST_COUNT"

          cp dist/index.html /tmp/pr72-index-a.html
          cp dist/app.bundle.js /tmp/pr72-bundle-a.js
          cp dist/manifest.json /tmp/pr72-manifest-a.json
          BUILD_COMMIT="$SOURCE_SHA" node build.mjs
          cmp /tmp/pr72-index-a.html dist/index.html
          cmp /tmp/pr72-bundle-a.js dist/app.bundle.js
          cmp /tmp/pr72-manifest-a.json dist/manifest.json
          cmp dist/index.html index.html

      - name: Commit verified generated artefacts and push
        shell: bash
        run: |
          git add dist/index.html dist/app.bundle.js dist/manifest.json index.html
          git commit -m "Build PR72 baseline presentation correction"
          git push origin HEAD:agent/transfers-exact-continuation
