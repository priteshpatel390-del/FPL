name: Temporary Team acceptance doc reconciliation

on:
  push:
    branches:
      - agent/team-acceptance-doc-reconciliation

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: agent/team-acceptance-doc-reconciliation
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Reconcile Team acceptance documentation
        run: python3 .github/scripts/team-acceptance-doc-reconcile.py

      - name: Verify documentation-only scope and commit
        run: |
          set -eu
          expected="$(printf '%s\n' \
            CLAUDE.md \
            docs/KNOWN_LIMITATIONS.md \
            docs/PROJECT_CONTEXT.md \
            docs/ROADMAP.md \
            docs/TEAM-UX-T01-T02-IMPLEMENTATION.md \
            docs/TEAM-UX-T01-T02-MERGE-RECORD.md \
            docs/TEAM-UX-T02-UNAVAILABLE-WRAP-FOLLOW-UP.md \
            docs/TESTING.md)"
          actual="$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          test "$actual" = "$expected"
          git add CLAUDE.md docs/KNOWN_LIMITATIONS.md docs/PROJECT_CONTEXT.md docs/ROADMAP.md docs/TEAM-UX-T01-T02-IMPLEMENTATION.md docs/TEAM-UX-T01-T02-MERGE-RECORD.md docs/TEAM-UX-T02-UNAVAILABLE-WRAP-FOLLOW-UP.md docs/TESTING.md
          git commit -m "Reconcile merged Team acceptance status"

      - name: Remove temporary reconciliation machinery and push
        run: |
          git rm .github/scripts/team-acceptance-doc-reconcile.py .github/workflows/team-acceptance-doc-reconcile.yml
          git commit -m "Remove temporary Team acceptance reconciler"
          git push origin HEAD:agent/team-acceptance-doc-reconciliation
