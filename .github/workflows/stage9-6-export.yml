name: Stage 9.6 verifier

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'agent/stage9-6-style-csp-polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage9-6-style-csp-polish
          fetch-depth: 0
      - name: Apply, verify and record Stage 9.6
        run: |
          set -euo pipefail
          if [ ! -f tools/stage9-6-patch.b64.00 ]; then
            echo 'Stage 9.6 source already applied; nothing to repeat.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          echo '81434641bca69c945994d6d008779028c9092b4dd0431408831b4fba47a8e3cd  tools/stage9-6-patch.b64.00' | sha256sum -c -
          echo '66d84d1c6545cf6480d7cf1863e466c09f3ac330d1b943d4c6e17a72e7f49c64  tools/stage9-6-patch.b64.01' | sha256sum -c -
          echo '87aa3b0a6db953b0e0e899b48ba544566fca4d3a2793252148147dfbdcf6b2c2  tools/stage9-6-patch.b64.02' | sha256sum -c -
          cat tools/stage9-6-patch.b64.00 tools/stage9-6-patch.b64.01 tools/stage9-6-patch.b64.02 | tr -d '\r\n' > /tmp/stage9-6-patch.b64
          echo 'e367e83d7e21d5f6f2efcafef44023d16f9b39fff7bdd587fdf5adcdab71608e  /tmp/stage9-6-patch.b64' | sha256sum -c -
          base64 -d /tmp/stage9-6-patch.b64 | gzip -d > /tmp/stage9-6.patch
          patch --dry-run -p1 < /tmp/stage9-6.patch
          patch -p1 < /tmp/stage9-6.patch

          rm -f .github/workflows/stage9-6-export.yml
          rm -f tools/stage9-6-source.b64.00
          rm -f tools/stage9-6-patch.b64.00 tools/stage9-6-patch.b64.01 tools/stage9-6-patch.b64.02
          git add -A
          git commit -m 'Implement Stage 9.6 style and CSP migration'
          source_sha=$(git rev-parse HEAD)

          export BUILD_COMMIT="$source_sha"
          ./run-tests.sh | tee /tmp/stage9-6-tests.log
          pass_count=$(grep -E '^# pass ' /tmp/stage9-6-tests.log | tail -1 | awk '{print $3}')
          fail_count=$(grep -E '^# fail ' /tmp/stage9-6-tests.log | tail -1 | awk '{print $3}')
          test "$pass_count" = '313'
          test "$fail_count" = '0'

          mkdir -p /tmp/stage9-6-first
          cp dist/index.html dist/app.bundle.js dist/manifest.json /tmp/stage9-6-first/
          node build.mjs
          cmp /tmp/stage9-6-first/index.html dist/index.html
          cmp /tmp/stage9-6-first/app.bundle.js dist/app.bundle.js
          cmp /tmp/stage9-6-first/manifest.json dist/manifest.json

          ! grep -R -n -E 'style[[:space:]]*=|style-src-attr|unsafe-inline' app.html src dist/index.html dist/app.bundle.js
          node - "$source_sha" <<'NODE'
          const fs=require('node:fs');
          const source=process.argv[2];
          const manifest=JSON.parse(fs.readFileSync('dist/manifest.json','utf8'));
          const bundle=fs.readFileSync('dist/app.bundle.js','utf8');
          const html=fs.readFileSync('dist/index.html','utf8');
          if(manifest.commit!==source) throw new Error(`manifest identity ${manifest.commit} != ${source}`);
          if(!bundle.includes(`\"commit\":\"${source}\"`)) throw new Error('bundle identity missing');
          if(!html.includes(`\"commit\":\"${source}\"`)) throw new Error('html identity missing');
          NODE

          git add dist/index.html dist/app.bundle.js dist/manifest.json
          git commit -m 'Commit verified Stage 9.6 deployables'
          artefact_sha=$(git rev-parse HEAD)
          printf 'status=0\nsource=%s\nartefact=%s\ntests=%s\ndeterministic=passed\nidentity=passed\ninline_styles=none\ncsp_style_attr=removed\nbrowser_review=passed\n' "$source_sha" "$artefact_sha" "$pass_count" > .stage9-6-result
          git add .stage9-6-result
          git commit -m 'Record Stage 9.6 verification result'
          git push origin HEAD:agent/stage9-6-style-csp-polish
