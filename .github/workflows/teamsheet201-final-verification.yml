name: Teamsheet 2.0.1 final verification

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  verify-final-branch:
    if: github.head_ref == 'teamsheet-2.0.1-navigation-settings'
    runs-on: ubuntu-latest
    steps:
      - name: Check out final branch
        uses: actions/checkout@v4
        with:
          ref: teamsheet-2.0.1-navigation-settings
          fetch-depth: 0

      - name: Use repository baseline Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify tests, build identity and reproducibility
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(node -e "process.stdout.write(require('./dist/manifest.json').commit)")"
          test -n "$SOURCE_COMMIT"
          git cat-file -e "$SOURCE_COMMIT^{commit}"
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD

          BUILD_COMMIT="$SOURCE_COMMIT" ./run-tests.sh | tee /tmp/teamsheet-final-verification.log
          TEST_COUNT="$(awk '/^# tests /{value=$3} END{print value}' /tmp/teamsheet-final-verification.log)"
          PASS_COUNT="$(awk '/^# pass /{value=$3} END{print value}' /tmp/teamsheet-final-verification.log)"
          FAIL_COUNT="$(awk '/^# fail /{value=$3} END{print value}' /tmp/teamsheet-final-verification.log)"
          SKIP_COUNT="$(awk '/^# skipped /{value=$3} END{print value}' /tmp/teamsheet-final-verification.log)"
          test -n "$TEST_COUNT"
          test "$PASS_COUNT" = "$TEST_COUNT"
          test "$FAIL_COUNT" = "0"
          test "$SKIP_COUNT" = "0"

          mkdir -p /tmp/teamsheet-build-one
          cp dist/index.html dist/app.bundle.js dist/manifest.json /tmp/teamsheet-build-one/
          BUILD_COMMIT="$SOURCE_COMMIT" node build.mjs
          cmp /tmp/teamsheet-build-one/index.html dist/index.html
          cmp /tmp/teamsheet-build-one/app.bundle.js dist/app.bundle.js
          cmp /tmp/teamsheet-build-one/manifest.json dist/manifest.json
          cmp index.html dist/index.html
          grep -F '"modelVersion": "2.4.0"' dist/manifest.json
          grep -F '"rulesVersion": "2026-27.3"' dist/manifest.json
          git diff --exit-code -- dist/index.html dist/app.bundle.js dist/manifest.json index.html

          {
            echo '## Teamsheet 2.0.1 final branch verification'
            echo
            echo "- Tests: $TEST_COUNT/$TEST_COUNT"
            echo "- Manifest source commit: $SOURCE_COMMIT"
            echo '- Two exact-identity builds: byte-identical'
            echo '- Root index.html equals dist/index.html'
            echo '- Generated files unchanged by verification'
            echo '- Model/rules unchanged: 2.4.0 / 2026-27.3'
          } >> "$GITHUB_STEP_SUMMARY"
