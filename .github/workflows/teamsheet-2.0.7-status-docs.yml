name: Finalise Teamsheet 2.0.7 status docs

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalise-status:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Correct canonical review status
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          SOURCE = '3baeb8fd51ea68af353c5097b0e5d2d49837dcf6'
          GENERATED = 'db48549fe6c527e235615eb7fd057f8a51de4d7a'
          MAIN = '0f9e6c879859a2584ab8d7b9d4879a84efbfaf5d'

          def replace_required(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'required text not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          def remove_required(path, old):
              replace_required(path, old, '')

          replace_required('CLAUDE.md', 'Last updated: 2026-08-04.', 'Last updated: 2026-08-05.')
          replace_required(
              'CLAUDE.md',
              "Teamsheet 2.0.6 — Research, Evidence and Diagnostics Organisation is complete and merged through PR #65 at merge commit `cd1ad52ea4d13a247a82bc90f80f2db0b6f77aa4`. It adds nested identifier-free Settings routes, explicit evidence/recovery/export/storage mount ownership, consequence-led core-data warnings, complete Help & About guidance, actual build identity presentation, parent-aware history/focus and a mobile Player Explorer card layout. It changed no provider, endpoint, transport, model, expected-minutes, fixture, scoring, squad, captaincy, simulation, transfer optimiser, rank or Mini-League calculation. The verified baseline is **520 passed, 0 failed, 0 skipped** with deterministic exact-identity builds and root `index.html` equal to `dist/index.html`; model remains `2.4.0` and rules remain `2026-27.3`. Physical iPhone Safari acceptance, VoiceOver acceptance and live populated-data acceptance were not performed and remain outstanding limitations. The next formal checkpoint is Teamsheet 2.0.7 — Final Mobile Polish and Acceptance. Begin it with investigation and design only; implementation requires explicit owner approval.",
              f"Teamsheet 2.0.7 — Final Mobile Polish and Acceptance is implemented for review on draft PR #68 from main `{MAIN}`. Approved Scope S-2.0.7 covers presentation, interaction, accessibility, resilience and acceptance preparation only. Verified source `{SOURCE}` passes **530 passed, 0 failed, 0 skipped**; generated deployables are committed at `{GENERATED}`. Two exact-identity production builds were byte-identical, root `index.html` equals `dist/index.html`, model remains `2.4.0` and rules remain `2026-27.3`. Physical iPhone Safari, VoiceOver and live populated-data acceptance remain pending. The checkpoint is not merged or fully accepted; do not merge without Pritesh’s explicit approval."
          )
          remove_required(
              'CLAUDE.md',
              f"\n\n## Teamsheet 2.0.7 current handover\n\nScope S-2.0.7 was approved by Pritesh on 4 August 2026 and implemented on a separate branch from `{MAIN}`. Automated verification is **530 passed, 0 failed, 0 skipped** with deterministic exact-identity builds and root/deployable equality. Model remains `2.4.0`; rules remain `2026-27.3`. Physical iPhone Safari, VoiceOver and live populated-data acceptance remain pending; do not call the checkpoint complete or merge without owner approval.\n"
          )

          replace_required('docs/PROJECT_CONTEXT.md', 'Last updated: 2026-08-04.', 'Last updated: 2026-08-05.')
          old_project_banner = "> **Teamsheet 2.0.6 merged baseline:** Research, Evidence and Diagnostics Organisation is complete and merged through PR #65 at `cd1ad52ea4d13a247a82bc90f80f2db0b6f77aa4`. It adds nested identifier-free Settings routes, explicit evidence/outcome/metric/review/export/recovery/storage hosts, consequence-led core-data warnings, complete Help & About content, actual build identity and a mobile Player Explorer card presentation without changing providers, calculations or persistence. Verification: **520 passed, 0 failed, 0 skipped**, deterministic exact-identity production builds and root `index.html` equal to `dist/index.html`; model remains `2.4.0` and rules remain `2026-27.3`. Physical iPhone Safari, VoiceOver and live populated-data acceptance remain unperformed. The next formal checkpoint is Teamsheet 2.0.7 — Final Mobile Polish and Acceptance, beginning with investigation and design only; implementation requires explicit owner approval."
          new_project_banner = f"> **Teamsheet 2.0.7 review branch:** Scope S-2.0.7 is implemented on draft PR #68 from main `{MAIN}`. Verified source `{SOURCE}` passes **530 passed, 0 failed, 0 skipped**; generated deployables are committed at `{GENERATED}`. Two exact-identity production builds were byte-identical, root `index.html` equals `dist/index.html`, model remains `2.4.0` and rules remain `2026-27.3`. This checkpoint is not merged or fully accepted. Physical iPhone Safari, VoiceOver and live populated-data acceptance remain pending; do not merge without Pritesh’s explicit approval."
          replace_required('docs/PROJECT_CONTEXT.md', old_project_banner, new_project_banner)
          replace_required(
              'docs/PROJECT_CONTEXT.md',
              "Current development item: **Teamsheet 2.0.7 — Final Mobile Polish and Acceptance**. It must begin with investigation and design only after the 2.0.6 post-merge documentation correction is approved, merged and latest `main` is verified. Implementation requires explicit owner approval. No application implementation is authorised by this status correction.",
              "Current development item: **Teamsheet 2.0.7 — Final Mobile Polish and Acceptance** is implemented for review on draft PR #68. Automated repository verification and generated-artifact finalisation are complete. Physical iPhone Safari, VoiceOver and live populated-data acceptance remain outstanding, and merge requires Pritesh’s explicit approval. Do not begin a new product checkpoint."
          )
          remove_required(
              'docs/PROJECT_CONTEXT.md',
              f"\n\n## Teamsheet 2.0.7 current handover\n\nScope S-2.0.7 was approved by Pritesh on 4 August 2026 and implemented on a separate branch from `{MAIN}`. Automated verification is **530 passed, 0 failed, 0 skipped** with deterministic exact-identity builds and root/deployable equality. Model remains `2.4.0`; rules remain `2026-27.3`. Physical iPhone Safari, VoiceOver and live populated-data acceptance remain pending; do not call the checkpoint complete or merge without owner approval.\n"
          )

          replace_required('docs/ROADMAP.md', 'Last updated: 2026-08-04.', 'Last updated: 2026-08-05.')
          old_roadmap_banner = "> **Teamsheet 2.0.6 merged baseline:** Research, Evidence and Diagnostics Organisation is complete and merged through PR #65 at `cd1ad52ea4d13a247a82bc90f80f2db0b6f77aa4`. It adds nested Settings routes, explicit evidence/recovery/export/storage hosts, consequence-led core-data warnings, complete Help & About guidance, real build identity and mobile Player Explorer cards without changing providers, persistence or calculations. Verification established **520 passed, 0 failed, 0 skipped**, deterministic exact-identity production builds and root `index.html` equal to `dist/index.html`; model remains `2.4.0` and rules remain `2026-27.3`. Physical iPhone Safari, VoiceOver and live populated-data acceptance remain unperformed. The next formal checkpoint is Teamsheet 2.0.7 — Final Mobile Polish and Acceptance, beginning with investigation and design only; implementation requires explicit owner approval."
          new_roadmap_banner = f"> **Teamsheet 2.0.7 review branch:** Approved Scope S-2.0.7 is implemented on draft PR #68 from main `{MAIN}`. Verified source `{SOURCE}` passes **530 passed, 0 failed, 0 skipped**; generated deployables are committed at `{GENERATED}`. Two exact-identity builds were byte-identical, root/deployable equality passed, and model `2.4.0` plus rules `2026-27.3` remain unchanged. Physical iPhone Safari, VoiceOver and live populated-data acceptance remain pending. The checkpoint is not merged or fully accepted; do not merge without Pritesh’s explicit approval."
          replace_required('docs/ROADMAP.md', old_roadmap_banner, new_roadmap_banner)
          replace_required(
              'docs/ROADMAP.md',
              "7. **Teamsheet 2.0.7 — Final mobile polish and acceptance** · NEXT FORMAL CHECKPOINT.\n   - Begin with investigation and design only after the documentation correction is approved, merged and latest `main` is verified.\n   - Complete hierarchy, performance, accessibility, full pre-season rehearsal and physical-device acceptance.\n   - Implementation requires explicit owner approval.",
              "7. **Teamsheet 2.0.7 — Final mobile polish and acceptance** · IMPLEMENTED FOR REVIEW.\n   - Approved Scope S-2.0.7 is implemented on draft PR #68 with automated verification and generated-artifact finalisation complete.\n   - Physical iPhone Safari, VoiceOver and live populated-data acceptance remain required before the checkpoint can be fully accepted.\n   - Do not merge without Pritesh’s explicit approval; do not begin a new product checkpoint."
          )
          replace_required(
              'docs/ROADMAP.md',
              "4. Teamsheet 2.0.7 may begin only with investigation and design after the documentation correction merges; implementation requires explicit owner approval.",
              "4. Teamsheet 2.0.7 automated verification is complete, but physical iPhone Safari, VoiceOver and live populated-data acceptance remain open; PR #68 must not merge without explicit owner approval."
          )

          replace_required('docs/KNOWN_LIMITATIONS.md', 'Last updated: 2026-08-04.', 'Last updated: 2026-08-05.')
          replace_required(
              'docs/KNOWN_LIMITATIONS.md',
              "- Teamsheet 2.0.7 must begin with investigation and design only; implementation requires explicit owner approval.",
              "- Teamsheet 2.0.7 is implemented for automated review only; physical iPhone Safari, VoiceOver and live populated-data acceptance remain open, and PR #68 must not merge without explicit owner approval."
          )

          replace_required('docs/TESTING.md', 'Last updated: 2026-08-04.', 'Last updated: 2026-08-05.')
          old_testing_banner = "> **Teamsheet 2.0.6 merged baseline:** `./run-tests.sh` completed **520 passed, 0 failed, 0 skipped** for the implementation merged through PR #65 at `cd1ad52ea4d13a247a82bc90f80f2db0b6f77aa4`. Coverage verifies nested identifier-free Settings routes, nearest-parent fallback, explicit Stage 10 UI hosts, separated export/recovery/deletion controls, consequence-led core-data warnings, Help/About truth, actual build identity, mobile Player Explorer presentation, focus restoration and preservation of all model/provider/evidence/Mini-League contracts. Production builds were deterministic and byte-identical for the exact reviewed identity, and root `index.html` matched `dist/index.html`. Model remains `2.4.0`; rules remain `2026-27.3`. Physical iPhone Safari, VoiceOver and live populated-data acceptance were not performed; automated and headless-browser checks do not prove those conditions. Teamsheet 2.0.7 must begin with investigation and design only; implementation requires explicit owner approval."
          new_testing_banner = f"> **Teamsheet 2.0.7 review verification:** `./run-tests.sh` completed **530 passed, 0 failed, 0 skipped** for reviewed source `{SOURCE}`. Generated commit `{GENERATED}` contains only `dist/app.bundle.js`, `dist/index.html`, `dist/manifest.json` and root `index.html`. Two exact-identity production builds were byte-identical; root `index.html` matched `dist/index.html`; manifest commit identity matched the reviewed source; model remains `2.4.0` and rules remain `2026-27.3`. Repository security suites passed. Physical iPhone Safari, VoiceOver and live populated-data acceptance remain unperformed. PR #68 is draft and must not merge without Pritesh’s explicit approval."
          replace_required('docs/TESTING.md', old_testing_banner, new_testing_banner)
          replace_required(
              'docs/TESTING.md',
              "Teamsheet 2.0.6 merged verification completed **520/520 passing tests**, a successful production build, byte-identical two-build artefact verification, exact build identity and root/deployable equality. The checkpoint changes Settings routes, UI mounting, consequence-led warning presentation, Help/About content and narrow-screen Player Explorer presentation only. Model, provider, evidence-schema, export and Mini-League correctness continue to rely on the preserved suites. The post-merge status correction is documentation-only: it must not modify tests, generated artefacts or application source and does not require an application rebuild.",
              f"Teamsheet 2.0.7 review verification completed **530/530 passing tests**, zero failures and zero skipped for source `{SOURCE}`. Two production builds were byte-identical, root `index.html` matched `dist/index.html`, manifest identity matched the reviewed source, and generated files were committed at `{GENERATED}`. Model `2.4.0`, rules `2026-27.3`, provider boundaries, security boundaries and every football calculation remain unchanged. Subsequent finalisation changes are documentation and pull-request metadata only. Automated evidence does not establish physical iPhone Safari, VoiceOver or live populated-data acceptance."
          )
          PY

          if grep -R -n -E '__TEST_COUNT__|__SOURCE_COMMIT__|__GENERATED_COMMIT__' CLAUDE.md docs; then
            echo 'Unresolved verification placeholder remains.' >&2
            exit 1
          fi

          if grep -R -n -E 'Teamsheet 2\.0\.7 must begin with investigation and design only|Teamsheet 2\.0\.7 may begin only with investigation and design|NEXT FORMAL CHECKPOINT' CLAUDE.md docs/PROJECT_CONTEXT.md docs/ROADMAP.md docs/KNOWN_LIMITATIONS.md docs/TESTING.md; then
            echo 'Stale Teamsheet 2.0.7 status wording remains.' >&2
            exit 1
          fi

          test ! -e scripts/apply-teamsheet-2.0.7.mjs.gz.b64
          test ! -e scripts/teamsheet-2.0.7-run-trigger.txt
          test ! -e .github/workflows/teamsheet-2.0.7-implementation.yml
          test ! -e docs/TEAMSHEET2-ITEM7-TEST-FAILURE.txt

          rm -f .github/workflows/teamsheet-2.0.7-status-docs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CLAUDE.md docs/PROJECT_CONTEXT.md docs/ROADMAP.md docs/KNOWN_LIMITATIONS.md docs/TESTING.md .github/workflows
          git diff --cached --check
          git commit -m 'Finalise Teamsheet 2.0.7 review status'
          git push origin HEAD:${GITHUB_HEAD_REF}
