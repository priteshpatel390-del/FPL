name: Stage 3.4 temporary verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [stage3-item4-provider-health]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Full build and test suite
        id: suite
        continue-on-error: true
        run: |
          set -o pipefail
          ./run-tests.sh 2>&1 | tee test.log
      - name: Deterministic build
        id: deterministic
        continue-on-error: true
        run: |
          cp dist/index.html /tmp/index-first.html
          cp dist/app.bundle.js /tmp/bundle-first.js
          cp dist/manifest.json /tmp/manifest-first.json
          node build.mjs
          cmp /tmp/index-first.html dist/index.html
          cmp /tmp/bundle-first.js dist/app.bundle.js
          cmp /tmp/manifest-first.json dist/manifest.json
      - name: Commit generated deployable files
        if: steps.suite.outcome == 'success' && steps.deterministic.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/index.html dist/app.bundle.js dist/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Build Stage 3 item 4 deployable [skip ci]"
            git push origin HEAD:stage3-item4-provider-health
          fi
      - name: Package repository snapshot
        if: always()
        run: zip -qr teamsheet-stage3-item4-repo.zip . -x '.git/*'
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-item4-evidence
          path: |
            test.log
            teamsheet-stage3-item4-repo.zip
            dist/index.html
            dist/app.bundle.js
            dist/manifest.json
      - name: Fail if verification failed
        if: steps.suite.outcome != 'success' || steps.deterministic.outcome != 'success'
        run: exit 1
