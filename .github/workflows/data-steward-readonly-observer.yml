name: Data Steward Read-Only Observer

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  observe-production-chain:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: data-steward-readonly
      deployment: false
    steps:
      # GitHub echoes each step's resolved environment in that step's log header, and only
      # `secrets.*` values are masked automatically. No steward runtime credential is declared at
      # job level, so no step other than the ones that need a value ever sees it in its header. The
      # account fingerprint is a `vars.*` value, supplied independently of the credential it
      # validates so the identity check stays non-tautological, so its mask is registered here —
      # derived locally from the already-masked account id — before any later step materialises the
      # variable itself. This step makes no network request, writes no GITHUB_ENV/GITHUB_OUTPUT and
      # produces no job output.
      - name: Register Cloudflare account fingerprint mask before any other step
        env:
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID"
          printf '::add-mask::%s\n' "$(printf '%s' "$DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID" | sha256sum | cut -d' ' -f1)"

      - name: Check out observer source
        uses: actions/checkout@v5

      - name: Set up exact Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.19.0

      - name: Execute one read-only observation
        env:
          DATA_STEWARD_GITHUB_TOKEN: ${{ github.token }}
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID }}
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
          DATA_STEWARD_CLOUDFLARE_READ_TOKEN: ${{ secrets.DATA_STEWARD_CLOUDFLARE_READ_TOKEN }}
        run: node workers/data-steward/run-observer.mjs
