name: Temporary T02 nowrap finalizer

on:
  push:
    branches:
      - agent/t02-bench-availability-nowrap

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/t02-bench-availability-nowrap
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add focused regression first
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('tests/team-ux-startup-availability.test.mjs')
          text=path.read_text()
          marker="test('startup gate owns the application shell until the existing ready event',()=>{"
          test_block="""test('unavailable bench badge stays on one centred line on narrow iPhone layouts',()=>{\n  assert.match(APP_SOURCE,/@media\\(max-width:420px\\)\\{[\\s\\S]*?\\.bench-player \\.pitch-availability\\.out\\{[^}]*font-size:8px[^}]*max-width:none[^}]*white-space:nowrap[^}]*overflow-wrap:normal[^}]*\\}/);\n});\n\n"""
          if test_block not in text:
              if marker not in text:
                  raise SystemExit('test insertion marker missing')
              text=text.replace(marker,test_block+marker,1)
              path.write_text(text)
          PY

      - name: Prove regression fails before fix
        run: |
          set +e
          node --test tests/team-ux-startup-availability.test.mjs > /tmp/t02-red.log 2>&1
          status=$?
          set -e
          cat /tmp/t02-red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected the new nowrap regression to fail before the CSS correction."
            exit 1
          fi
          grep -q "unavailable bench badge stays on one centred line" /tmp/t02-red.log

      - name: Apply approved presentation correction and document it
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path('app.html')
          text=app.read_text()
          old=".team-bench{padding:11px 7px}.bench-grid{gap:6px}.bench-player .pitch-copy{min-height:80px;padding:6px 3px}"
          new=old+".bench-player .pitch-availability.out{font-size:8px;padding-left:4px;padding-right:4px;max-width:none;white-space:nowrap;overflow-wrap:normal}"
          if new not in text:
              if old not in text:
                  raise SystemExit('mobile bench CSS marker missing')
              text=text.replace(old,new,1)
              app.write_text(text)
          doc=Path('docs/TEAM-UX-T02-UNAVAILABLE-WRAP-FOLLOW-UP.md')
          doc.write_text("""# T-02 iPhone availability-wrap follow-up\n\n## Outcome\n\nPhysical iPhone Safari review after PR #82 confirmed that the reserve goalkeeper display order and horizontal availability centring were corrected, but the `Unavailable` label wrapped mid-word on the narrow four-column bench.\n\n## Approved scope\n\nPresentation only: keep unavailable/suspended bench badges on one centred line at iPhone widths by reducing their mobile badge typography/padding. The general availability row remains centred, and longer doubtful wording keeps its existing wrapping behaviour.\n\n## Explicit exclusions\n\nNo changes to squad selection, `bestXI()`, bench calculation, projections, expected minutes, captaincy, transfers, fixtures, providers, persistence, Mini Leagues or Worker behaviour.\n\n## Validation\n\nA focused regression is added to require the narrow-mobile `.bench-player .pitch-availability.out` rule to use single-line wrapping. The finalizer proves that regression fails against the pre-fix CSS before applying the correction, then runs the complete test suite and deterministic double build. Physical iPhone acceptance remains required after deployment.\n""")
          PY

      - name: Run complete test suite
        run: ./run-tests.sh

      - name: Commit reviewed source and regression
        run: |
          git add app.html tests/team-ux-startup-availability.test.mjs docs/TEAM-UX-T02-UNAVAILABLE-WRAP-FOLLOW-UP.md
          git commit -m "Keep unavailable bench badge on one line"

      - name: Build twice and verify deterministic outputs
        run: |
          set -eu
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          export BUILD_COMMIT="$SOURCE_COMMIT"
          node build.mjs
          rm -rf /tmp/teamsheet-nowrap-a
          mkdir -p /tmp/teamsheet-nowrap-a/dist
          cp dist/app.bundle.js /tmp/teamsheet-nowrap-a/dist/app.bundle.js
          cp dist/index.html /tmp/teamsheet-nowrap-a/dist/index.html
          cp dist/manifest.json /tmp/teamsheet-nowrap-a/dist/manifest.json
          cp index.html /tmp/teamsheet-nowrap-a/index.html
          node build.mjs
          cmp /tmp/teamsheet-nowrap-a/dist/app.bundle.js dist/app.bundle.js
          cmp /tmp/teamsheet-nowrap-a/dist/index.html dist/index.html
          cmp /tmp/teamsheet-nowrap-a/dist/manifest.json dist/manifest.json
          cmp /tmp/teamsheet-nowrap-a/index.html index.html
          cmp dist/index.html index.html
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const m=JSON.parse(readFileSync('dist/manifest.json','utf8')); if(m.commit!==process.env.BUILD_COMMIT) throw new Error('manifest source commit mismatch'); console.log('Manifest source commit verified:',m.commit);"

      - name: Commit generated deployables
        run: |
          git add dist/app.bundle.js dist/index.html dist/manifest.json index.html
          git commit -m "Build deployables for availability nowrap fix"

      - name: Remove temporary finalizer and push
        run: |
          git rm .github/workflows/t02-nowrap-finalize.yml
          git commit -m "Remove temporary T02 nowrap finalizer"
          git push origin HEAD:agent/t02-bench-availability-nowrap
