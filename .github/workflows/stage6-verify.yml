name: Stage 6 verification
on:
  push:
    branches: [agent/stage6-transfer-optimiser]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Full test suite
        shell: bash
        run: |
          set -o pipefail
          ./run-tests.sh 2>&1 | tee test.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage6-test-log
          path: test.log
      - name: Deterministic build comparison
        shell: bash
        run: |
          set -euo pipefail
          export BUILD_COMMIT="$(git rev-parse HEAD)"
          node build.mjs
          mkdir -p /tmp/build-one
          cp dist/index.html dist/app.bundle.js dist/manifest.json /tmp/build-one/
          node build.mjs
          cmp /tmp/build-one/index.html dist/index.html
          cmp /tmp/build-one/app.bundle.js dist/app.bundle.js
          cmp /tmp/build-one/manifest.json dist/manifest.json
      - name: Upload verified dist
        uses: actions/upload-artifact@v4
        with:
          name: stage6-verified-dist
          path: |
            dist/index.html
            dist/app.bundle.js
            dist/manifest.json
