name: Reconcile GW1-P2C2 canonical docs

on:
  pull_request:
    paths:
      - '.github/workflows/gw1-p2c2-doc-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Insert dated current-state records without rewriting history
        run: |
          python3 - <<'PY'
          from pathlib import Path

          marker = '<!-- GW1-P2C2-CURRENT-2026-08-21 -->'
          records = {
            'CLAUDE.md': '''### Current checkpoint — 21 August 2026: GW1-P2C2 repository preparation\n\n**Supersedes older GW1-P2 text below where it describes the physical cross-site POST as still pending.** The 21 August controlled iPhone Safari diagnostic on the deployed PR #137 CORS remediation reached the evidence Worker with the credentialled OPTIONS request and received HTTP 204, but the subsequent POST never reached the Worker and Teamsheet received no HTTP status. That result proves the earlier missing `Access-Control-Allow-Credentials: true` defect was real and was corrected; it does **not** prove a single browser/Access root cause for the remaining cross-site failure. Option A (`github.io` → `workers.dev`) is therefore exhausted rather than accepted.\n\nThe approved next checkpoint is **GW1-P2C2 — sibling same-site custom-domain transport repository preparation**, implemented only on draft PR #139. The intended browser origins are `https://app.fpltsheet.co.uk` and `https://archive.fpltsheet.co.uk`; they are same-site but remain cross-origin, so exact-origin credentialled CORS remains mandatory. PR #139 selectively carries forward PR #119's durable outbox/browser-delivery semantics, preserves PR #137 as the single credentialled-CORS adapter authority, emits the exact archive ingestion endpoint `https://archive.fpltsheet.co.uk/v1/evidence/predeadline`, and temporarily keeps the existing GitHub Pages origin beside the new app origin in the Official FPL gateway allowlist for rollback.\n\n**No live custom-domain architecture is claimed.** DNS, GitHub Pages custom-domain configuration, Cloudflare Worker Custom Domain/Access configuration, deployment and physical iPhone Safari acceptance are separate future approval gates. `main` remains the operating source of truth until an approved merge. No model, provider, fixture, expected-minutes, scoring, squad, captaincy, transfer, optimiser, simulation, rank or Mini-League calculation changed in GW1-P2C2.\n''',
            'docs/PROJECT_CONTEXT.md': '''## Current transport checkpoint — 21 August 2026\n\nThe previously pending GW1-P2 physical cross-site acceptance has now produced **Outcome B**: on iPhone Safari with normal privacy settings, the PR #137 CORS-remediated credentialled OPTIONS request reached the evidence Worker and returned 204, while the POST did not reach the Worker and exposed no HTTP status to Teamsheet. This closes further Option A (`github.io` → `workers.dev`) tweaking as the chosen path without attributing the remaining failure to one unproven browser or Access mechanism.\n\nGW1-P2C2 is the approved **repository-only** preparation for sibling hosts `app.fpltsheet.co.uk` and `archive.fpltsheet.co.uk`. Draft PR #139 carries the durable browser evidence outbox/delivery semantics forward, changes only the browser/archive transport boundary, retains exact CORS, and leaves recommendation/model/provider behaviour untouched. The custom domains are **not live** in this repository checkpoint; existing production hosting remains authoritative until separately approved infrastructure rollout and physical acceptance.\n''',
            'docs/ARCHITECTURE.md': '''## Current browser evidence topology decision — 21 August 2026\n\nGW1-P2C2 prepares a sibling-subdomain transport: the Teamsheet application at `https://app.fpltsheet.co.uk` and the Access-protected evidence archive at `https://archive.fpltsheet.co.uk/v1/evidence/predeadline`. Sharing `fpltsheet.co.uk` makes the intended topology same-site, but the hosts are different origins; browser delivery therefore continues to use `mode:'cors'`, `credentials:'include'`, an exact `Access-Control-Allow-Origin`, and `Access-Control-Allow-Credentials: true`. Wildcard origin policy is forbidden.\n\nThe browser evidence path remains deliberately one-way and non-authoritative: canonical Stage 10 capture is stored locally first, then the durable outbox retries delivery independently. The recommendation path never reads, waits for or fails because of archive custody. PR #137 remains the single Cloudflare adapter authority for credential permission; GW1-P2C2 does not duplicate that policy into the archive core. During migration, the Official FPL gateway may accept exactly the existing GitHub Pages origin and the new app origin; this is rollback support, not a wildcard or provider-semantic change.\n\nThis section describes the repository candidate architecture, **not deployed state**. DNS, Pages custom-domain routing, Worker Custom Domain/Access routing and physical Safari behaviour require separate live verification.\n''',
            'docs/DECISIONS.md': '''## 21 August 2026 — GW1-P2C2 sibling same-site custom-domain transport\n\n**Decision:** stop iterating the failed `github.io` → `workers.dev` Option A transport after the controlled physical diagnostic in which the corrected OPTIONS preflight reached the Worker and returned 204 but the POST never arrived. Prepare, in the repository only, sibling hosts `app.fpltsheet.co.uk` and `archive.fpltsheet.co.uk`.\n\n**Preserved behaviour:** immutable Stage 10 evidence, content-hash identity, durable local outbox, retry/idempotency/fail-closed retention semantics, Access authentication, exact credentialled CORS, and complete separation from recommendation/model/provider calculations. PR #119 is not merged wholesale; only its transport-independent browser outbox/delivery work is carried forward. PR #137 remains the sole adapter-level credentialled-CORS authority.\n\n**Migration/rollback:** the Official FPL gateway exact allowlist may contain both `https://priteshpatel390-del.github.io` and `https://app.fpltsheet.co.uk` during migration. The production build candidate emits only `https://archive.fpltsheet.co.uk/v1/evidence/predeadline` for archive delivery; the exhausted archive `workers.dev` origin is not retained in generated CSP.\n\n**Not decided or approved here:** live DNS, Pages domain activation, Worker Custom Domain/Access deployment, removal of the rollback origin, physical Safari acceptance, any provider/data-source addition, or any model/calculation change.\n''',
            'docs/ROADMAP.md': '''## Current gate — GW1-P2C2, 21 August 2026\n\nOption A cross-site acceptance is closed as unsuccessful after the 21 August iPhone Safari diagnostic: corrected OPTIONS reached the Worker (204), but POST did not reach it. The next sequence is deliberately gated: **(1)** complete and review draft PR #139 repository preparation; **(2)** obtain explicit approval for live custom-domain rollout; **(3)** configure/verify `app.fpltsheet.co.uk` and `archive.fpltsheet.co.uk` without weakening Access/CORS; **(4)** perform one controlled physical iPhone Safari acceptance under normal privacy settings; **(5)** only then decide whether GW1-P2 is accepted and whether the legacy rollback origin can be removed.\n\nDo not pull post-GW1 provider/model work into this sequence. Local Stage 10 evidence/recovery/export remains the fallback and GW1 recommendation behaviour does not depend on cloud custody.\n''',
            'docs/KNOWN_LIMITATIONS.md': '''## GW1-P2C2 limitations — 21 August 2026\n\nThe sibling-domain repository candidate does **not** prove that the live custom-domain transport works on iPhone Safari. The only controlled physical result so far is the superseded Option A topology: credentialled OPTIONS reached the Worker and returned 204 after PR #137, while POST never reached the Worker. No conclusion about D1/R2 ingestion can be drawn from that missing POST, and no single remaining browser/Access cause has been proven.\n\n`app.fpltsheet.co.uk` and `archive.fpltsheet.co.uk` are repository targets until separately deployed and verified. The existing GitHub Pages origin is intentionally retained in the Official FPL gateway allowlist as a migration rollback path; removing it requires later evidence and approval. Cloud custody remains non-blocking and local evidence/recovery/export remains the operational fallback.\n''',
            'docs/SECURITY.md': '''## GW1-P2C2 transport security boundary — 21 August 2026\n\nThe repository candidate narrows browser archive delivery to the exact endpoint `https://archive.fpltsheet.co.uk/v1/evidence/predeadline` from the intended application origin `https://app.fpltsheet.co.uk`. Sibling hosts are same-site but cross-origin, so the archive must still return the exact approved `Access-Control-Allow-Origin` together with `Access-Control-Allow-Credentials: true`; `*`, preview wildcards and reflective arbitrary origins remain forbidden. Cloudflare Access remains an authentication boundary and its JWTs/cookies, audience values and team-domain details must never be persisted, rendered or logged by Teamsheet.\n\nPR #137's Worker adapter remains the single browser CORS credential authority. GW1-P2C2 does not weaken archive JWT validation, D1/R2 privacy, provider-retention fail-closed behaviour or the separation between cloud custody and recommendations. The dual Official FPL gateway allowlist is temporary exact-origin rollback support, not a trust expansion to arbitrary `fpltsheet.co.uk` subdomains. Live DNS/Access/Custom Domain state is outside repository evidence and requires separate verification.\n''',
            'docs/TESTING.md': '''## GW1-P2C2 candidate evidence — 21 August 2026\n\n`main` retains the canonical **907/907** merged baseline until an approved merge. On the GW1-P2C2 branch, the normal `./run-tests.sh` completed with **918 tests, 918 passed, 0 failed, 0 skipped, 0 cancelled** before generated deployment bytes were committed. Focused coverage pins the exact custom archive endpoint/CSP, the dual exact-origin migration allowlist, credentialled browser delivery semantics and PR #137's single adapter-level credential authority; the carried-forward outbox tests cover deterministic persistence/state-machine behaviour.\n\nThis branch result is repository evidence only. Final PR acceptance still requires the permanent Verify Teamsheet workflow on the exact final head, including committed provenance, the complete suite, two deterministic builds, root/deployable equality, exact build identity and preservation of committed production outputs. No repository test substitutes for the later physical iPhone Safari custom-domain acceptance.\n''',
            'docs/GW1-P2-BROWSER-EVIDENCE-DELIVERY.md': '''## 21 August 2026 superseding physical result and next transport checkpoint\n\nThe controlled PR #137 diagnostic produced **Outcome B** under normal iPhone Safari privacy settings. The credentialled OPTIONS request reached `teamsheet-evidence-archive.fpltsheet.workers.dev` and the remediated Worker returned **204** with the required credentialled-CORS response; the subsequent POST did **not** reach the Worker, and Teamsheet received no HTTP status. Therefore the earlier CORS defect is closed, but the remaining failure cannot legitimately be assigned to one specific browser/Access cause and says nothing about D1/R2 processing because ingestion was never reached.\n\nOption A (`github.io` → `workers.dev`) is exhausted. The approved next repository checkpoint is GW1-P2C2: preserve the durable outbox and exact credentialled-CORS design while preparing `https://app.fpltsheet.co.uk` → `https://archive.fpltsheet.co.uk/v1/evidence/predeadline`. This is same-site but cross-origin. It remains **unaccepted live architecture** until separately deployed and physically retested with normal privacy settings.\n''',
            'workers/README.md': '''## GW1-P2C2 repository target — 21 August 2026\n\nThe next repository candidate uses `https://archive.fpltsheet.co.uk/v1/evidence/predeadline` for browser evidence delivery and `https://app.fpltsheet.co.uk` as the intended application origin. These are planned sibling custom domains only; this repository change does **not** prove DNS, Worker Custom Domain, Cloudflare Access or GitHub Pages configuration has been changed. The existing `workers.dev` deployment remains the historical/live record until a separately approved rollout.\n\nThe Official FPL gateway repository config temporarily retains the current GitHub Pages origin and adds the new app origin as an exact migration/rollback allowlist. The evidence archive still requires exact-origin credentialled CORS and PR #137 remains the adapter-level authority for `Access-Control-Allow-Credentials: true`. Do not add wildcard origins, expose Access secrets, or treat repository configuration as evidence of deployed Cloudflare state.\n'''
          }

          def insert(path, section):
              p=Path(path)
              text=p.read_text()
              if marker in text:
                  return False
              lines=text.splitlines(keepends=True)
              if not lines:
                  raise SystemExit(f'empty file: {path}')
              block='\n'+marker+'\n'+section.rstrip()+'\n\n'
              lines.insert(1, block)
              p.write_text(''.join(lines))
              return True

          changed=[]
          for path, section in records.items():
              if insert(path, section): changed.append(path)

          design=Path('docs/GW1-P2C2-SAME-SITE-CUSTOM-DOMAIN-TRANSPORT.md')
          design.write_text('''# GW1-P2C2 — Same-site custom-domain transport\n\nStatus: **repository implementation candidate only — draft PR #139; no live infrastructure change authorised or claimed.**\n\n## Evidence that forced the decision\n\nOn 21 August 2026, after PR #137 corrected the missing credentialled-CORS response header and that exact Worker revision was deployed, one controlled physical iPhone Safari diagnostic was performed with Prevent Cross-Site Tracking on. The OPTIONS request reached the evidence Worker and returned HTTP 204. The POST never reached the Worker and Teamsheet received no HTTP status. This proves the earlier CORS omission was a real defect and its remediation reached production; it does not prove one remaining browser/Access root cause and provides no evidence against D1/R2 because ingestion was never invoked. Option A (`github.io` → `workers.dev`) is therefore exhausted.\n\n## Repository candidate\n\n- App origin: `https://app.fpltsheet.co.uk`\n- Archive origin: `https://archive.fpltsheet.co.uk`\n- Ingestion endpoint: `https://archive.fpltsheet.co.uk/v1/evidence/predeadline`\n- Browser request: `POST`, `mode: cors`, `credentials: include`, `Content-Type: application/json`\n- Archive response: exact approved `Access-Control-Allow-Origin` plus `Access-Control-Allow-Credentials: true`; never wildcard\n- Authentication: Cloudflare Access remains in front of archive routes\n- Recommendation dependency: none; local Stage 10 capture is authoritative for the client and delivery remains an asynchronous side effect\n\nThe sibling hosts share the same site but are different origins. Same-site status is the reason for changing topology; it is **not** permission to remove CORS.\n\n## Selective carry-forward\n\nPR #119 is not merged wholesale. Only its transport-independent browser evidence outbox/delivery behaviour is carried forward: immutable local canonical record, content-hash idempotency, retry/backoff, Access identity-gap classification, fail-closed provider retention, bounded pinning and generic user-facing status. PR #137 remains the single Cloudflare adapter authority for credentialled-CORS response permission; its header is not duplicated into the archive core.\n\n## Migration and rollback\n\nThe Official FPL gateway repository configuration accepts exactly two application origins during migration: the existing `https://priteshpatel390-del.github.io` origin and the intended `https://app.fpltsheet.co.uk` origin. This is temporary rollback support. It is not a wildcard and does not change Official FPL provider semantics. Removal of the legacy origin requires later live evidence and explicit approval.\n\nThe generated production candidate emits only the custom-domain archive endpoint in its evidence meta configuration and CSP `connect-src`; the exhausted archive `workers.dev` origin is not retained as a browser archive target.\n\n## Security invariants\n\n- no Access token, cookie, JWT, audience, team domain or API secret in browser persistence, UI or logs;\n- no wildcard CORS or preview/version hostname trust;\n- exact ingestion path only, HTTPS only, no URL credentials/query/hash;\n- D1/R2 remain private server-side custody;\n- provider archival rights remain fail-closed;\n- evidence delivery cannot block or alter recommendations;\n- no provider, model or calculation behaviour changes.\n\n## Repository validation\n\nThe source candidate completed the normal `./run-tests.sh` with **918/918 passing** before generated bytes were committed. The exact final PR head must additionally pass the permanent Verify Teamsheet workflow: committed provenance, complete suite, deterministic rebuilds, root/deployable equality, exact build identity and production-output preservation. Repository validation cannot establish live DNS/Access routing or physical Safari behaviour.\n\n## Live rollout gate — not approved by this document\n\nAfter repository review, live work requires separate explicit approval. A future rollout must configure/verify the two custom hosts, preserve Access and exact CORS, deploy the reviewed revisions, and then perform one controlled physical iPhone Safari test with normal privacy settings. Failure must be recorded from observable request/Worker evidence rather than attributed speculatively. No merge or legacy-origin removal is implied by this design record.\n''')
          print('updated:', ', '.join(changed))
          PY
      - name: Commit documentation reconciliation
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CLAUDE.md docs workers/README.md
          git diff --cached --check
          git commit -m 'docs: reconcile GW1-P2C2 same-site transport'
          git push origin "HEAD:${{ github.head_ref }}"
