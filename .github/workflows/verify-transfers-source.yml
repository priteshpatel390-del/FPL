name: Verify exact Transfers source

on:
  push:
    branches:
      - agent/transfers-exact-performance

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalise reviewed source tree
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f TRANSFER_VERIFICATION_FAILURES.txt
          rm -f .github/workflows/verify-transfers-source.yml
          git add -A
          git commit -m "Finalise exact Transfers source"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run complete test suite
        env:
          BUILD_COMMIT: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ./run-tests.sh | tee /tmp/teamsheet-tests.log
          grep -Eq '# pass 594$' /tmp/teamsheet-tests.log
          grep -Eq '# fail 0$' /tmp/teamsheet-tests.log
          grep -Eq '# skipped 0$' /tmp/teamsheet-tests.log

      - name: Verify deterministic production builds
        env:
          BUILD_COMMIT: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/first-build
          cp dist/index.html dist/app.bundle.js dist/manifest.json /tmp/first-build/
          node build.mjs
          cmp /tmp/first-build/index.html dist/index.html
          cmp /tmp/first-build/app.bundle.js dist/app.bundle.js
          cmp /tmp/first-build/manifest.json dist/manifest.json
          cmp index.html dist/index.html
          git diff --check

      - name: Commit generated artefacts and push
        shell: bash
        run: |
          set -euo pipefail
          git add dist/index.html dist/app.bundle.js dist/manifest.json index.html
          if ! git diff --cached --quiet; then
            git commit -m "Build exact Transfers source"
          fi
          git push origin HEAD:agent/transfers-exact-performance
