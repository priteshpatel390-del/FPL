name: UX-A2 dock layering verifier

on:
  push:
    branches:
      - agent/ux-a2-player-detail-dock-layering

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash .github/ux-a2-dock-layering-apply.sh
