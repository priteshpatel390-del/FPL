name: Stage 10.2 post-merge closeout

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: stage10-2-post-merge-closeout
  cancel-in-progress: false

jobs:
  closeout-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/stage10-2-post-merge-closeout

      - name: Apply documentation-only closeout
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(name, old, new):
              path=Path(name)
              text=path.read_text()
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{name}: expected one closeout anchor, found {count}: {old[:90]!r}')
              path.write_text(text.replace(old,new,1))

          replace_once(
              'CLAUDE.md',
              'Stage 10.2 — Official outcome collection is implemented and verified on branch `agent/stage10-2-official-outcomes`, with **376/376 tests passing**, deterministic exact-identity builds and a draft pull-request review gate. Official FPL player, fixture and optional manager outcomes are collected automatically after access, stored as immutable provisional/complete/corrected revisions and linked strictly to eligible Stage 10.1 snapshots. No Stage 10.3 metric or model, provider-blend, calibration, captaincy, squad or optimiser change is included.',
              'Stage 10.2 — Official outcome collection is complete and merged through PR #29 at `4b1b2acf9bda81afb63414dd41b509e80b3945c7` after owner approval. Official FPL player, fixture and optional manager outcomes are collected automatically after access, stored as immutable provisional/complete/corrected revisions and linked strictly to eligible Stage 10.1 snapshots. Verified source `e84e7f1bf05ed1f3e574f78101e4a6e413273306` passes **376/376 tests** with deterministic exact-identity builds; generated artefacts are committed at `9d81210b493ab40a542c50709733b14e448a481c`. The next checkpoint is **Stage 10.3 — Metrics**, at investigation and exact-scope approval only; no Stage 10.3 implementation has begun.'
          )

          replace_once(
              'docs/PROJECT_CONTEXT.md',
              '- Stages 1–9 and Stage 10.1 are complete and merged. The complete Stage 10 design is owner-approved.',
              '- Stages 1–9, Stage 10.1 and Stage 10.2 are complete and merged. The complete Stage 10 design is owner-approved.'
          )
          replace_once(
              'docs/PROJECT_CONTEXT.md',
              '- Stage 10.1 merged through PR #27 at `da76c81f552fd9da5c518e73ccc0fbe966c74444` after physical iPhone acceptance. Startup automatically refreshes and validates the four approved sources before one consistent render; foreground returns repeat the check when due, eligible evidence is captured automatically without delaying access, and recovery imports cannot become official. Verified source `eb3497ec405d6c7b8ce09105614fcb8280abc34b` passes **349/349 tests** with byte-identical builds and exact build identity; generated artefacts are committed at `1259e7b5f7505d3330c772e89c77720251552287`.',
              '- Stage 10.1 merged through PR #27 at `da76c81f552fd9da5c518e73ccc0fbe966c74444` after physical iPhone acceptance. Startup automatically refreshes and validates the four approved sources before one consistent render; foreground returns repeat the check when due, eligible evidence is captured automatically without delaying access, and recovery imports cannot become official. Verified source `eb3497ec405d6c7b8ce09105614fcb8280abc34b` passes **349/349 tests** with byte-identical builds and exact build identity; generated artefacts are committed at `1259e7b5f7505d3330c772e89c77720251552287`.\n- Stage 10.2 merged through PR #29 at `4b1b2acf9bda81afb63414dd41b509e80b3945c7` after owner approval. Automatic Official FPL player, fixture and optional public manager outcomes are immutable, correction-aware, non-blocking and strictly linked to eligible Stage 10.1 snapshots. Verified source `e84e7f1bf05ed1f3e574f78101e4a6e413273306` passes **376/376 tests** with byte-identical exact-identity builds; generated artefacts are committed at `9d81210b493ab40a542c50709733b14e448a481c`.'
          )
          replace_once(
              'docs/PROJECT_CONTEXT.md',
              'Completed: Stage 1 characterisation/audit, SEC-1, Stage 2 modularisation, repository handover, Stage 3 security/provider hardening, Stage 4 expected minutes, Stage 5 scoring corrections, Stage 6 transfer optimiser, Stage 7 walk-forward backtest, Stage 8 uncertainty/squad simulation, all six Stage 9 UI-integration checkpoints and Stage 10.1 deadline-safe snapshot foundation.',
              'Completed: Stage 1 characterisation/audit, SEC-1, Stage 2 modularisation, repository handover, Stage 3 security/provider hardening, Stage 4 expected minutes, Stage 5 scoring corrections, Stage 6 transfer optimiser, Stage 7 walk-forward backtest, Stage 8 uncertainty/squad simulation, all six Stage 9 UI-integration checkpoints, Stage 10.1 deadline-safe snapshot foundation and Stage 10.2 official outcome collection.'
          )
          replace_once(
              'docs/PROJECT_CONTEXT.md',
              'Current: Stage 10.2 — Official outcome collection is implemented and verified on branch `agent/stage10-2-official-outcomes`; draft pull-request review and owner approval remain. The verified baseline is **376/376 tests passing** with deterministic exact-identity builds.\n\nNext: review Stage 10.2 on iPhone, approve or request corrections, and merge only after explicit approval. Stage 10.3 metrics remain a separate investigation/design gate after merge. Formula, provider and calibration changes remain outside scope unless separately evidenced and approved.',
              'Current: Stage 10.3 — Metrics is the next investigation and exact-scope approval checkpoint. No Stage 10.3 implementation has begun.\n\nNext: define the deterministic player, minutes, uncertainty, squad, captaincy, bench and transfer evaluation contracts; document sample safeguards and fallback behaviour; then obtain explicit owner approval before implementation. Formula, provider and calibration changes remain outside scope unless separately evidenced and approved.'
          )

          replace_once(
              'docs/ROADMAP.md',
              '  - Verified source `eb3497ec405d6c7b8ce09105614fcb8280abc34b`: **349/349 tests passed**, successful production build and deterministic build identity; generated artefacts `1259e7b5f7505d3330c772e89c77720251552287`.\n\n## Current',
              '  - Verified source `eb3497ec405d6c7b8ce09105614fcb8280abc34b`: **349/349 tests passed**, successful production build and deterministic build identity; generated artefacts `1259e7b5f7505d3330c772e89c77720251552287`.\n- **Stage 10.2 — Official outcome collection** · DONE and merged through PR #29 at `4b1b2acf9bda81afb63414dd41b509e80b3945c7`.\n  - Automatic Official FPL player, fixture and optional public manager outcomes with immutable provisional/complete/corrected revisions.\n  - Strict snapshot matching, correction monitoring, bounded recovery storage and recovery-only imports.\n  - Verified source `e84e7f1bf05ed1f3e574f78101e4a6e413273306`: **376/376 tests passed**, successful production build and byte-identical exact-identity builds; generated artefacts `9d81210b493ab40a542c50709733b14e448a481c`.\n\n## Current'
          )
          replace_once(
              'docs/ROADMAP.md',
              '- **Stage 10.2 — Official outcome collection** · implemented and verified on branch `agent/stage10-2-official-outcomes`; draft pull-request review and owner approval pending.\n- Official FPL player, fixture and optional public manager outcomes are automatic, immutable, correction-aware and non-blocking.\n- Verified baseline: **376/376 tests passing** with successful production and byte-identical exact-identity builds.\n- No Stage 10.3 metrics or projection, expected-minutes, scoring, fixture, simulation, captaincy, squad, provider-blend or optimiser-objective change.',
              '- **Stage 10.3 — Metrics** · investigation and exact-scope approval only; no implementation has begun.\n- Planned metrics remain descriptive and deterministic: player points, minutes, uncertainty, squad, captaincy, bench and transfers.\n- No composite score, model update, threshold, calibration claim or retrospective recommendation is approved.'
          )
          replace_once(
              'docs/ROADMAP.md',
              '1. Complete owner review and physical iPhone acceptance of Stage 10.2.\n2. Merge Stage 10.2 only after explicit approval.\n3. Begin Stage 10.3 metrics as a separate investigation/design checkpoint after merge.',
              '1. Present the exact Stage 10.3 metric definitions, inputs, exclusions, matching rules, sample safeguards and tests.\n2. Obtain explicit owner approval for the Stage 10.3 implementation scope.\n3. Implement Stage 10.3 on a separate branch without changing production formulas or beginning Stage 10.4.'
          )
          replace_once(
              'docs/ROADMAP.md',
              '1. Stage 10.2 requires owner review and physical iPhone acceptance before merge.\n2. A persistent screenshot-regression suite is absent; future visual changes still need human device checks.\n3. Free historical odds and other missing pre-deadline provider snapshots require prospective 2026/27 logging.\n4. Live-season prospective data requirements begin with GW1 on 21 August 2026.',
              '1. Stage 10.3 exact metric scope and approval are not yet recorded.\n2. A persistent screenshot-regression suite is absent; future visual changes still need human device checks.\n3. Free historical odds and other missing pre-deadline provider snapshots require prospective 2026/27 logging.\n4. Live-season prospective data requirements begin with GW1 on 21 August 2026.'
          )

          replace_once(
              'docs/STAGE10-DESIGN.md',
              'Status: owner-approved on 2026-07-29. Stage 10.1 is complete and merged through PR #27 at `da76c81f552fd9da5c518e73ccc0fbe966c74444`; Stage 10.2 official outcome collection is the next separately scoped checkpoint.',
              'Status: owner-approved on 2026-07-29. Stage 10.1 is complete and merged through PR #27 at `da76c81f552fd9da5c518e73ccc0fbe966c74444`; Stage 10.2 is complete and merged through PR #29 at `4b1b2acf9bda81afb63414dd41b509e80b3945c7`; Stage 10.3 metrics is the next separately scoped investigation and approval checkpoint.'
          )
          replace_once(
              'docs/STAGE10-DESIGN.md',
              'Automatic work starts after the verified main render, never delays app access, checks provisional outcomes every fifteen minutes while visible, checks completed outcomes daily for fourteen days and catches up six missed Gameweeks per trigger. Squad outcomes remain optional and non-blocking. Stage 10.2 records facts only: transfer identities, realised recommendation metrics and every Stage 10.3 evaluation remain excluded.',
              'Automatic work starts after the verified main render, never delays app access, checks provisional outcomes every fifteen minutes while visible, checks completed outcomes daily for fourteen days and catches up six missed Gameweeks per trigger. Squad outcomes remain optional and non-blocking. Stage 10.2 records facts only: transfer identities, realised recommendation metrics and every Stage 10.3 evaluation remain excluded. The implementation was owner-approved and merged through PR #29 at `4b1b2acf9bda81afb63414dd41b509e80b3945c7`; verified source `e84e7f1bf05ed1f3e574f78101e4a6e413273306` passes **376/376 tests** with generated artefacts at `9d81210b493ab40a542c50709733b14e448a481c`.'
          )

          replace_once(
              'docs/STAGE10-ITEM2.md',
              'Status: **implemented and verified on branch `agent/stage10-2-official-outcomes`; draft pull request and owner review pending.** Approved 29 July 2026.',
              'Status: **complete and merged through PR #29 at `4b1b2acf9bda81afb63414dd41b509e80b3945c7` after owner approval.** Approved and accepted 29 July 2026.'
          )
          replace_once(
              'docs/STAGE10-ITEM2.md',
              '- Existing tests were not weakened or regenerated.',
              '- Existing tests were not weakened or regenerated.\n- Verified source: `e84e7f1bf05ed1f3e574f78101e4a6e413273306`; generated artefacts: `9d81210b493ab40a542c50709733b14e448a481c`.\n- Merged through PR #29 at `4b1b2acf9bda81afb63414dd41b509e80b3945c7` after owner approval.'
          )

          replace_once(
              'docs/CHANGELOG.md',
              '## [Stage 10.2] — 2026-07-29 — Official outcome collection (draft review)',
              '## [Stage 10.2] — 2026-07-29 — Official outcome collection'
          )
          replace_once(
              'docs/CHANGELOG.md',
              '### Unchanged\n- No model formula, calibration, provider blend, captaincy, squad, optimiser or Stage 10.3 metric change.\n\n\n## [Stage 10.1]',
              '### Unchanged\n- No model formula, calibration, provider blend, captaincy, squad, optimiser or Stage 10.3 metric change.\n### Status\n- Merged through PR #29 at `4b1b2acf9bda81afb63414dd41b509e80b3945c7` after owner approval; verified source `e84e7f1bf05ed1f3e574f78101e4a6e413273306`, generated artefacts `9d81210b493ab40a542c50709733b14e448a481c`.\n\n\n## [Stage 10.1]'
          )

          replace_once(
              'docs/STAGE_HISTORY.md',
              '## Stage 10.2 — Official outcome collection (DRAFT REVIEW 2026-07-29)',
              '## Stage 10.2 — Official outcome collection (MERGED 2026-07-29)'
          )
          replace_once(
              'docs/STAGE_HISTORY.md',
              'The full suite passes **376/376** with deterministic exact-identity builds. No Stage 10.3 metric, model formula, provider, authentication, backend or FPL write action is included. The branch remains under owner review and must not merge without explicit approval.',
              'The full suite passes **376/376** with deterministic exact-identity builds. No Stage 10.3 metric, model formula, provider, authentication, backend or FPL write action is included. Pritesh approved the completed item on 29 July 2026; verified source `e84e7f1bf05ed1f3e574f78101e4a6e413273306` and generated artefacts `9d81210b493ab40a542c50709733b14e448a481c` merged through PR #29 at `4b1b2acf9bda81afb63414dd41b509e80b3945c7`.'
          )

          replace_once(
              'docs/TESTING.md',
              'Stage 10.1 verified source `eb3497ec405d6c7b8ce09105614fcb8280abc34b`: **349/349 passing tests**, successful production build, byte-identical two-build artefact verification and exact build identity. Physical iPhone acceptance passed and PR #27 merged at `da76c81f552fd9da5c518e73ccc0fbe966c74444` with generated artefacts `1259e7b5f7505d3330c772e89c77720251552287`. The previous merged Stage 9 baseline was 313/313 at source `4a4b14c1d0f422088c080e714ee259efbd7cc39d`.',
              'Stage 10.2 verified source `e84e7f1bf05ed1f3e574f78101e4a6e413273306`: **376/376 passing tests**, successful production build, byte-identical two-build artefact verification and exact build identity. Owner approval passed and PR #29 merged at `4b1b2acf9bda81afb63414dd41b509e80b3945c7` with generated artefacts `9d81210b493ab40a542c50709733b14e448a481c`. The previous Stage 10.1 baseline was 349/349 at source `eb3497ec405d6c7b8ce09105614fcb8280abc34b`.'
          )
          replace_once(
              'docs/TESTING.md',
              'Verified baseline: **376/376 passing tests**, successful production build, byte-identical two-build comparison, exact build identity and root/deployable equality. Outcome tests cover strict player/fixture identity, blank and double Gameweeks, postponed fixtures, delayed bonus/data checking, provisional-to-complete and corrected revisions, snapshot matching boundaries, no-snapshot collection, manager availability, recovery imports, tamper detection, bounded storage, quota/interruption recovery, automatic startup/foreground checks and non-blocking access. Existing tests and goldens remain unchanged.',
              'Verified baseline: **376/376 passing tests**, successful production build, byte-identical two-build comparison, exact build identity and root/deployable equality. Outcome tests cover strict player/fixture identity, blank and double Gameweeks, postponed fixtures, delayed bonus/data checking, provisional-to-complete and corrected revisions, snapshot matching boundaries, no-snapshot collection, manager availability, recovery imports, tamper detection, bounded storage, quota/interruption recovery, automatic startup/foreground checks and non-blocking access. Existing tests and goldens remain unchanged. The verified item merged through PR #29 at `4b1b2acf9bda81afb63414dd41b509e80b3945c7`.'
          )

          for name in [
              'CLAUDE.md','docs/PROJECT_CONTEXT.md','docs/ROADMAP.md','docs/STAGE10-DESIGN.md',
              'docs/STAGE10-ITEM2.md','docs/CHANGELOG.md','docs/STAGE_HISTORY.md','docs/TESTING.md'
          ]:
              path=Path(name)
              path.write_text(path.read_text().rstrip()+'\n')
          PY
          rm -f .github/workflows/stage10-2-closeout.yml
          git diff --check
          EXPECTED=$(printf '%s\n' CLAUDE.md docs/CHANGELOG.md docs/PROJECT_CONTEXT.md docs/ROADMAP.md docs/STAGE10-DESIGN.md docs/STAGE10-ITEM2.md docs/STAGE_HISTORY.md docs/TESTING.md)
          ACTUAL=$(git diff --name-only | sort)
          test "$ACTUAL" = "$EXPECTED"

      - name: Verify unchanged application baseline
        run: |
          set -euo pipefail
          BUILD_COMMIT=e84e7f1bf05ed1f3e574f78101e4a6e413273306 ./run-tests.sh | tee /tmp/stage10-2-closeout.log
          TEST_COUNT=$(awk '/^# tests /{print $3}' /tmp/stage10-2-closeout.log | tail -1)
          FAIL_COUNT=$(awk '/^# fail /{print $3}' /tmp/stage10-2-closeout.log | tail -1)
          test "$TEST_COUNT" = "376"
          test "$FAIL_COUNT" = "0"
          git diff --exit-code -- app.html build.mjs src tests dist index.html
          git diff --check

      - name: Commit documentation closeout
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CLAUDE.md docs/PROJECT_CONTEXT.md docs/ROADMAP.md docs/STAGE10-DESIGN.md docs/STAGE10-ITEM2.md docs/CHANGELOG.md docs/STAGE_HISTORY.md docs/TESTING.md .github/workflows/stage10-2-closeout.yml
          git diff --cached --check
          git commit -m "Record Stage 10.2 post-merge closeout"
          git push origin HEAD
          echo "Closeout commit: $(git rev-parse HEAD)"
          echo "Tests: 376/376"
