# DORMANT and owner-gated. Diagnostic GETs of the existing Version only.
# A merge does not authorise dispatch. No upload, Deployment, Worker, D1 or API-Football capability.
name: API-Football Corrected Version Annotation Proof
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  checks: read
concurrency:
  group: api-football-corrected-version-annotation-proof
  cancel-in-progress: false
jobs:
  annotation-readonly:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: data-steward-readonly
      deployment: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
      - name: Verify fresh main and successful exact-head CI
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$EVENT_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          test "$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)" = "$EVENT_SHA"
          gh api "repos/priteshpatel390-del/FPL/commits/$EVENT_SHA/check-runs" > "$RUNNER_TEMP/check-runs.json"
          node --input-type=module - "$RUNNER_TEMP/check-runs.json" <<'NODE'
          import fs from 'node:fs';
          const response=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!(response.check_runs??[]).some(x=>x.name==='Tests and deterministic build'&&
            x.status==='completed'&&x.conclusion==='success'&&x.head_sha===process.env.EVENT_SHA))
            throw new Error('ANNOTATION_PROBE_EXACT_MAIN_VERIFY_REQUIRED');
          NODE
      - name: Download original immutable upload evidence only
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          name: corrected-version-execution
          run-id: 37841681952
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/corrected-original
      - name: Validate source evidence before any Cloudflare GET
        env:
          REPORT: ${{ runner.temp }}/corrected-original/corrected-execution.json
        run: |
          set -euo pipefail
          test "$(sha256sum "$REPORT" | cut -d' ' -f1)" = dfac83bfc4bd67baa5dad7b59a8c51bc6f9d29ba474a0afe1c6513fa66629e43
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync(process.env.REPORT,'utf8'));
          if(r.version!=='api-football-corrected-r1-r2-version-execution-v1'||
            r.approvedSha!=='073ac6a53d09f004e5ada5b94fb1cea6df3ef228'||
            r.identity?.creationSha!==r.approvedSha||r.identity?.moduleCount!==17||
            r.versionId!=='509f5a98-38fc-4e58-8a26-1b8fc4c9c787'||
            r.outcome!=='CREATED'||r.versionUploadAttempts!==1||r.productionMutations!==1||
            r.retryAuthorized!==false||r.deploymentMutations!==0||r.d1Mutations!==0||
            r.apiFootballRequests!==0||r.workerInvocations!==0)
            throw new Error('ANNOTATION_PROBE_ORIGINAL_EVIDENCE_INVALID');
          NODE
      - name: Read existing stable and beta Version metadata; emit bounded booleans only
        env:
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID }}
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
          DATA_STEWARD_CLOUDFLARE_READ_TOKEN: ${{ secrets.DATA_STEWARD_CLOUDFLARE_READ_TOKEN }}
          ANNOTATION_PROBE_REPORT_PATH: ${{ runner.temp }}/corrected-annotation-proof.json
        run: node workers/api-football-collector/corrected-version-annotation-probe.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: corrected-version-annotation-proof
          path: ${{ runner.temp }}/corrected-annotation-proof.json
          if-no-files-found: ignore
          retention-days: 7
