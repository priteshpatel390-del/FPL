name: Temporary Stage 10 source verifier

on:
  push:
    branches:
      - agent/stage10-1-deadline-snapshot

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect complete payload
        id: payload
        shell: bash
        run: |
          if [[ -f .stage10-source.ready ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply source payload
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          cat .stage10-source.part-* | base64 --decode > /tmp/stage10-source.tar.xz
          tar -xJf /tmp/stage10-source.tar.xz
          rm -f .stage10-source.part-* .stage10-source.ready .stage10-export-trigger
          rm -f .github/workflows/stage10-workspace-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Stage 10.1 deadline-safe snapshots"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify source and deterministic artefacts
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          for path in [Path('CLAUDE.md'), *Path('docs').glob('*.md')]:
              text = path.read_text()
              if '__SOURCE_SHA__' in text:
                  path.write_text(text.replace('__SOURCE_SHA__', source))
          PY
          BUILD_COMMIT="$SOURCE_SHA" ./run-tests.sh | tee /tmp/stage10-tests.log
          cp -a dist /tmp/stage10-dist-first
          BUILD_COMMIT="$SOURCE_SHA" node build.mjs
          cmp -s /tmp/stage10-dist-first/app.bundle.js dist/app.bundle.js
          cmp -s /tmp/stage10-dist-first/index.html dist/index.html
          cmp -s /tmp/stage10-dist-first/manifest.json dist/manifest.json
          node --check dist/app.bundle.js
          node -e "const m=require('./dist/manifest.json'); if(m.commit!==process.env.SOURCE_SHA) throw new Error('build identity mismatch')"
          grep -q '# pass 337' /tmp/stage10-tests.log
          grep -q '# fail 0' /tmp/stage10-tests.log
      - name: Commit verified artefacts
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          git add CLAUDE.md docs dist
          git commit -m "Verify Stage 10.1 build artefacts"
          git push origin HEAD:agent/stage10-1-deadline-snapshot
