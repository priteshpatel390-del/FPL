name: Temporary Stage 10 workspace export

on:
  push:
    branches:
      - agent/stage10-1-deadline-snapshot

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: zip -r stage10-workspace.zip . -x '.git/*' 'stage10-workspace.zip'
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: stage10-workspace
          path: stage10-workspace.zip
          if-no-files-found: error
          retention-days: 1
