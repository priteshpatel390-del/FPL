name: Stage 10.4 implementation verification

on:
  push:
    branches:
      - agent/stage10-4-operating-review-export
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: read

jobs:
  implement:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[stage10-4-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/stage10-4-operating-review-export

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply approved Stage 10.4 scope
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.stage10-4-payload-* | base64 --decode | gzip --decompress > /tmp/stage10-4-apply.py
          python /tmp/stage10-4-apply.py
          git config user.name "teamsheet-stage10-bot"
          git config user.email "actions@users.noreply.github.com"
          git add CLAUDE.md build.mjs src tests docs
          git commit -m "Stage 10.4 operating review and export"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run complete test suite
        shell: bash
        run: |
          set -euo pipefail
          sh ./run-tests.sh 2>&1 | tee /tmp/stage10-4-tests.log
          TESTS=$(awk '/^# tests /{v=$3} END{print v}' /tmp/stage10-4-tests.log)
          PASS=$(awk '/^# pass /{v=$3} END{print v}' /tmp/stage10-4-tests.log)
          FAIL=$(awk '/^# fail /{v=$3} END{print v}' /tmp/stage10-4-tests.log)
          test -n "$TESTS"
          test "$FAIL" = "0"
          test "$TESTS" = "$PASS"
          echo "TEST_RESULT=$PASS/$TESTS" >> "$GITHUB_ENV"

      - name: Verify exact-identity deterministic builds
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/stage10-4-build-a
          BUILD_COMMIT="$SOURCE_COMMIT" node build.mjs
          mkdir -p /tmp/stage10-4-build-a/dist
          cp dist/index.html dist/app.bundle.js dist/manifest.json /tmp/stage10-4-build-a/dist/
          cp index.html /tmp/stage10-4-build-a/index.html
          BUILD_COMMIT="$SOURCE_COMMIT" node build.mjs
          cmp /tmp/stage10-4-build-a/dist/index.html dist/index.html
          cmp /tmp/stage10-4-build-a/dist/app.bundle.js dist/app.bundle.js
          cmp /tmp/stage10-4-build-a/dist/manifest.json dist/manifest.json
          cmp /tmp/stage10-4-build-a/index.html index.html
          cmp dist/index.html index.html
          git add dist index.html
          git commit -m "Stage 10.4 generated artefacts [stage10-4-bot]"
          echo "GENERATED_ARTEFACTS=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Record verification and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os

          replacements = {
              '__VERIFIED_SOURCE__': os.environ['SOURCE_COMMIT'],
              '__GENERATED_ARTEFACTS__': os.environ['GENERATED_ARTEFACTS'],
              '__TEST_RESULT__': os.environ['TEST_RESULT'],
          }
          for path in [Path('CLAUDE.md'), *Path('docs').glob('*.md')]:
              text = path.read_text()
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          rm -f scripts/.stage10-4-payload-* .github/workflows/stage10-4-implement.yml
          git add -A
          git commit -m "Stage 10.4 verification closeout [stage10-4-bot]"
          git push origin HEAD:agent/stage10-4-operating-review-export
