name: Record PR 80 physical acceptance

on:
  push:
    branches:
      - agent/team-ux-startup-availability

permissions:
  contents: write

jobs:
  record:
    if: github.actor == 'priteshpatel390-del'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/team-ux-startup-availability
          fetch-depth: 0

      - name: Record physical acceptance evidence
        run: |
          set -eu
          python3 <<'PY'
          from pathlib import Path

          p=Path('docs/TEAM-UX-T01-T02-IMPLEMENTATION.md')
          t=p.read_text()
          t=t.replace(
            'Status: **Implementation and verification complete. Approved to merge after final repository hygiene. Not yet merged.**',
            'Status: **Implementation, automated verification and physical T-01 acceptance complete. Owner approved to merge. Not yet merged.**'
          )
          old='The required visual condition is that an iPhone-sized first paint shows only the startup/loading experience with no header, application content or fixed navigation dock visible above or through it. The corrected production build passed a 390x844 first-paint browser rendering with script execution disabled: the startup gate remained visible while header, main and the fixed navigation computed hidden, and no fixed dock or application content was visible. This is an iPhone-sized browser simulation, not a claim of physical iPhone Safari testing.'
          new='The required visual condition is that an iPhone first paint shows only the startup/loading experience with no header, application content or fixed navigation dock visible above or through it. After the corrected build also passed a 390x844 browser first-paint simulation, Pritesh physically tested the exact PR #80 preview on iPhone Safari on 7 August 2026. The startup screen showed only the Teamsheet loading experience and **no bottom navigation dock**; T-01 therefore passed physical acceptance. T-02 could not be visually exercised on the owner\'s current squad because no player was flagged at the time of review. That is recorded as an unperformed physical T-02 presentation check, not a pass; the explicit starting/bench availability wording and accessibility labels remain protected by focused automated regressions.'
          if old not in t:
              raise SystemExit('TEAM UX visual acceptance paragraph not found')
          t=t.replace(old,new)
          old_gate='Pritesh has approved merge after documentation updates and successful visual acceptance. Automated verification and the corrected mobile first-paint visual check have passed. Final repository hygiene commits the generated deployables before merge.'
          new_gate='Pritesh approved merge after documentation updates and successful T-01 visual acceptance. Those conditions are now satisfied: automated verification is green, generated deployables are current, and physical iPhone Safari T-01 acceptance passed. T-02 physical presentation was not observable because the current squad had no flagged player; automated T-02 coverage remains green. PR #80 is ready to merge under the existing owner approval.'
          if old_gate not in t:
              raise SystemExit('TEAM UX review gate paragraph not found')
          p.write_text(t.replace(old_gate,new_gate))

          p=Path('docs/TESTING.md')
          t=p.read_text()
          old='A 390x844 first-paint mobile rendering with script execution disabled showed only the startup gate; header, main and the fixed dock were hidden. This is browser-rendered mobile evidence, not a claim of physical iPhone Safari testing.'
          new='A 390x844 first-paint mobile rendering with script execution disabled showed only the startup gate; header, main and the fixed dock were hidden. **Physical iPhone Safari T-01 acceptance subsequently passed on 7 August 2026** against the corrected PR #80 preview: the startup experience owned the viewport and no bottom navigation dock was visible during loading. T-02 could not be physically exercised on the owner\'s current squad because no player was flagged; that visual check is unperformed rather than claimed, while its starting/bench availability and accessibility wording remain covered by focused automated regressions.'
          if old not in t:
              raise SystemExit('TESTING PR80 evidence sentence not found')
          p.write_text(t.replace(old,new))
          PY

      - name: Re-run completion gate
        run: |
          set -eu
          ./run-tests.sh
          node build.mjs
          rm -rf /tmp/pr80-acceptance-build
          mkdir -p /tmp/pr80-acceptance-build/dist
          cp dist/app.bundle.js /tmp/pr80-acceptance-build/dist/app.bundle.js
          cp dist/index.html /tmp/pr80-acceptance-build/dist/index.html
          cp dist/manifest.json /tmp/pr80-acceptance-build/dist/manifest.json
          cp index.html /tmp/pr80-acceptance-build/index.html
          node build.mjs
          cmp /tmp/pr80-acceptance-build/dist/app.bundle.js dist/app.bundle.js
          cmp /tmp/pr80-acceptance-build/dist/index.html dist/index.html
          cmp /tmp/pr80-acceptance-build/dist/manifest.json dist/manifest.json
          cmp /tmp/pr80-acceptance-build/index.html index.html
          cmp dist/index.html index.html

      - name: Commit acceptance record and remove one-time workflow
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/TESTING.md docs/TEAM-UX-T01-T02-IMPLEMENTATION.md
          git rm .github/workflows/record-pr80-acceptance.yml
          git commit -m "Record PR 80 iPhone acceptance [skip ci]"
          git push origin HEAD:agent/team-ux-startup-availability
