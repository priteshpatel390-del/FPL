name: Final Track A documentation cleanup

on:
  push:
    branches:
      - agent/track-a-post-merge-docs
    paths:
      - .github/workflows/track-a-doc-cleanup.yml

permissions:
  contents: write

jobs:
  clean-current-status:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: agent/track-a-post-merge-docs
          fetch-depth: 0

      - name: Apply current-status cleanup
        shell: bash
        run: |
          python -m py_compile .github/scripts/track_a_doc_cleanup.py
          python .github/scripts/track_a_doc_cleanup.py

      - name: Verify documentation-only result
        shell: bash
        run: |
          git diff --check
          CHANGED="$(git diff --name-only)"
          printf '%s\n' "$CHANGED"
          test -n "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -Ev '^(CLAUDE\.md|docs/(PROJECT_CONTEXT|ROADMAP|KNOWN_LIMITATIONS)\.md)$'; then
            echo 'Unexpected file changed.' >&2
            exit 1
          fi
          git diff --quiet -- src dist index.html build.mjs tests
          ! grep -F 'Track A remains draft/unmerged' CLAUDE.md docs/PROJECT_CONTEXT.md docs/ROADMAP.md docs/KNOWN_LIMITATIONS.md
          ! grep -F 'PR #68 must not merge' CLAUDE.md docs/PROJECT_CONTEXT.md docs/ROADMAP.md docs/KNOWN_LIMITATIONS.md
          ! grep -F 'live bootstrap transport on draft PR #69' CLAUDE.md docs/PROJECT_CONTEXT.md docs/ROADMAP.md docs/KNOWN_LIMITATIONS.md
          ! grep -F 'Physical iPhone Safari retest remains required' CLAUDE.md docs/PROJECT_CONTEXT.md docs/ROADMAP.md docs/KNOWN_LIMITATIONS.md
          grep -F 'No new implementation item is approved' docs/ROADMAP.md
          grep -F '613-test gate' docs/ROADMAP.md
          grep -F 'CLOSED and merged 2026-08-06 through PR #72' docs/KNOWN_LIMITATIONS.md

      - name: Commit final status cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CLAUDE.md docs/PROJECT_CONTEXT.md docs/ROADMAP.md docs/KNOWN_LIMITATIONS.md
          git diff --cached --check
          git commit -m 'Remove obsolete Track A pending status'
          git push origin HEAD:agent/track-a-post-merge-docs
