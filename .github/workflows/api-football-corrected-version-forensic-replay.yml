# DORMANT, READ-ONLY — review an ALREADY-CREATED corrected Version; never upload or promote.
# Repository merge does NOT authorize dispatch. The original upload run is permanently consumed.
name: API-Football Corrected Version Forensic Replay
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  checks: read
concurrency:
  group: api-football-corrected-version-forensic-replay
  cancel-in-progress: false
jobs:
  forensic-readonly:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: data-steward-readonly
      deployment: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
      - name: Verify fresh main and successful exact-head CI before any live read
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$EVENT_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          test "$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)" = "$EVENT_SHA"
          gh api "repos/priteshpatel390-del/FPL/commits/$EVENT_SHA/check-runs" > "$RUNNER_TEMP/check-runs.json"
          node --input-type=module - "$RUNNER_TEMP/check-runs.json" <<'NODE'
          import fs from 'node:fs';
          const result=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const sha=process.env.EVENT_SHA;
          if(!(result.check_runs??[]).some(x=>x.name==='Tests and deterministic build'&&
            x.status==='completed'&&x.conclusion==='success'&&x.head_sha===sha))
            throw new Error('FORENSIC_EXACT_MAIN_VERIFY_REQUIRED');
          NODE
      - name: Download ORIGINAL execution evidence only (no workflow rerun)
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          name: corrected-version-execution
          run-id: 37841681952
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/corrected-original
      - name: Verify byte-pinned execution evidence and immutable creation identity
        env:
          REPORT: ${{ runner.temp }}/corrected-original/corrected-execution.json
        run: |
          set -euo pipefail
          test "$(sha256sum "$REPORT" | cut -d' ' -f1)" = dfac83bfc4bd67baa5dad7b59a8c51bc6f9d29ba474a0afe1c6513fa66629e43
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const v=JSON.parse(fs.readFileSync(process.env.REPORT,'utf8'));
          if(v.version!=='api-football-corrected-r1-r2-version-execution-v1'||
            v.approvedSha!=='073ac6a53d09f004e5ada5b94fb1cea6df3ef228'||
            v.identity?.creationSha!==v.approvedSha||v.identity?.moduleCount!==17||
            v.versionId!=='509f5a98-38fc-4e58-8a26-1b8fc4c9c787'||
            v.outcome!=='CREATED'||v.versionUploadAttempts!==1||
            v.productionMutations!==1||v.retryAuthorized!==false||
            v.deploymentMutations!==0||v.d1Mutations!==0||v.apiFootballRequests!==0||
            v.workerInvocations!==0)throw new Error('FORENSIC_ORIGINAL_EVIDENCE_INVALID');
          NODE
      - name: Replay independent reconciliation using existing SELECT-only and GET-only readers
        env:
          APPROVED_SHA: 073ac6a53d09f004e5ada5b94fb1cea6df3ef228
          API_FOOTBALL_CORRECTED_MODE: RECONCILIATION
          API_FOOTBALL_CORRECTED_EXECUTION_PATH: ${{ runner.temp }}/corrected-original/corrected-execution.json
          API_FOOTBALL_CORRECTED_REPORT_PATH: ${{ runner.temp }}/corrected-forensic-replay.json
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID }}
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
          DATA_STEWARD_CLOUDFLARE_READ_TOKEN: ${{ secrets.DATA_STEWARD_CLOUDFLARE_READ_TOKEN }}
          CLOUDFLARE_TOPOLOGY_READ_TOKEN: ${{ secrets.CLOUDFLARE_REPLACEMENT_TOPOLOGY_READ_TOKEN }}
        run: node workers/api-football-collector/corrected-version-readonly.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: corrected-version-forensic-replay
          path: ${{ runner.temp }}/corrected-forensic-replay.json
          if-no-files-found: ignore
          retention-days: 7
