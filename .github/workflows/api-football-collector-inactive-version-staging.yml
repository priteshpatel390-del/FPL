# Manual-only dormant staging path for the first API-Football collector Worker shell and inactive Version.
# Repository presence does not authorize dispatch. Live execution remains a separate owner gate.

name: API-Football Collector Inactive Version Staging

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: api-football-collector-inactive-version-staging
  cancel-in-progress: false

jobs:
  repository-gate:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      approved_sha: ${{ steps.identity.outputs.approved_sha }}
    steps:
      - name: Validate dispatch identity before checkout
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = workflow_dispatch
          test "$EVENT_RUN_ATTEMPT" = 1
          test "$EVENT_REF" = refs/heads/main
          test "$EVENT_REPOSITORY" = priteshpatel390-del/FPL
          printf '%s' "$EVENT_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - name: Check out exact dispatch revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Gate exact current main and clean tree
        id: identity
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          remote_main="$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)"
          test -n "$remote_main"
          test "$remote_main" = "$EVENT_SHA"
          test -z "$(git status --porcelain)"
          echo "approved_sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"

      - name: Require exact-head Verify Teamsheet success
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ steps.identity.outputs.approved_sha }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/check-runs.json"
          http="$(curl --silent --output "$response" --write-out '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/priteshpatel390-del/FPL/commits/$APPROVED_SHA/check-runs")"
          test "$http" = 200
          node --input-type=module - "$response" <<'EOF'
          import fs from 'node:fs';
          const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const matches=(body.check_runs??[]).filter(row=>
            row.name==='Tests and deterministic build'&&row.status==='completed'&&row.conclusion==='success'&&
            row.head_sha===process.env.APPROVED_SHA&&row.app?.slug==='github-actions'&&
            row.details_url?.startsWith('https://github.com/priteshpatel390-del/FPL/actions/runs/')
          );
          if(matches.length<1)throw new Error('exact-head Verify Teamsheet success is absent');
          EOF
          rm -f "$response"
          test -z "$(git status --porcelain)"

      - name: Set up exact Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          check-latest: false

      - name: Run focused inactive-staging tests before any protected credential
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          node --test \
            tests/api-football-collector-activation-live-preflight.test.mjs \
            tests/api-football-collector-inactive-version-staging.test.mjs \
            tests/api-football-collector-inactive-version-postflight.test.mjs
          test -z "$(git status --porcelain)"

  fresh-readonly-admission:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    needs: repository-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: data-steward-readonly
      deployment: false
    steps:
      - name: Check out gated exact main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.repository-gate.outputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reconfirm exact current main after read-only environment admission
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          remote_main="$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)"
          test -n "$remote_main"
          test "$remote_main" = "$APPROVED_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up exact Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          check-latest: false

      - name: Run accepted fresh activation read-only admission
        env:
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID }}
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
          DATA_STEWARD_CLOUDFLARE_READ_TOKEN: ${{ secrets.DATA_STEWARD_CLOUDFLARE_READ_TOKEN }}
          API_FOOTBALL_ACTIVATION_PREFLIGHT_REPORT_PATH: ${{ runner.temp }}/api-football-collector-activation-preflight.json
        run: |
          set -euo pipefail
          node workers/api-football-collector/activation-live-preflight.mjs
          node --input-type=module - "$API_FOOTBALL_ACTIVATION_PREFLIGHT_REPORT_PATH" <<'EOF'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(report.ok!==true||report.classification!=='READY_FOR_REPOSITORY_INFRASTRUCTURE_STAGING')throw new Error('fresh repository infrastructure staging admission absent');
          if(report.evidence?.productionMutations!==0||report.evidence?.apiFootballRequests!==0||report.evidence?.secretValuesRead!==0)throw new Error('fresh read-only admission accounting drift');
          EOF

      - name: Upload sanitized fresh admission evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: api-football-collector-inactive-staging-admission
          path: ${{ runner.temp }}/api-football-collector-activation-preflight.json
          if-no-files-found: error
          retention-days: 7

  inactive-staging:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    needs: [repository-gate, fresh-readonly-admission]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    environment:
      name: api-football-collector-version-upload
    outputs:
      worker_id: ${{ steps.stage.outputs.worker_id }}
      version_id: ${{ steps.stage.outputs.version_id }}
      graph_sha256: ${{ steps.stage.outputs.graph_sha256 }}
      metadata_sha256: ${{ steps.stage.outputs.metadata_sha256 }}
    steps:
      - name: Check out gated exact main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.repository-gate.outputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reconfirm exact current main after upload environment admission
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          remote_main="$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)"
          test -n "$remote_main"
          test "$remote_main" = "$APPROVED_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up exact Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          check-latest: false

      - name: Create inert shell then upload exactly one inactive Version
        id: stage
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
          CLOUDFLARE_COLLECTOR_WORKER_UPLOAD_TOKEN: ${{ secrets.CLOUDFLARE_COLLECTOR_WORKER_UPLOAD_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.CLOUDFLARE_ACCOUNT_FINGERPRINT }}
          API_FOOTBALL_INACTIVE_STAGING_REPORT_PATH: ${{ runner.temp }}/api-football-collector-inactive-staging.json
        run: |
          set -euo pipefail
          node workers/api-football-collector/inactive-version-staging.mjs
          node --input-type=module - "$API_FOOTBALL_INACTIVE_STAGING_REPORT_PATH" "$GITHUB_OUTPUT" <<'EOF'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(report.ok!==true||report.mutations?.workerShellCreates!==1||report.mutations?.versionUploads!==1)throw new Error('inactive staging report invalid');
          for(const key of ['deployments','cronMutations','secretMutations','d1Mutations','routeMutations','providerRequests'])if(report.mutations?.[key]!==0)throw new Error('forbidden mutation accounting drift');
          fs.appendFileSync(process.argv[3],[
            'worker_id='+report.workerId,
            'version_id='+report.versionId,
            'graph_sha256='+report.identity.graphSha256,
            'metadata_sha256='+report.identity.metadataSha256
          ].join('\n')+'\n');
          EOF
          test -z "$(git status --porcelain)"

      - name: Upload sanitized inactive staging evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: api-football-collector-inactive-staging
          path: ${{ runner.temp }}/api-football-collector-inactive-staging.json
          if-no-files-found: error
          retention-days: 7

  independent-readonly-postflight:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    needs: [repository-gate, inactive-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: data-steward-readonly
      deployment: false
    steps:
      - name: Check out gated exact main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.repository-gate.outputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reconfirm exact current main after postflight environment admission
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          remote_main="$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)"
          test -n "$remote_main"
          test "$remote_main" = "$APPROVED_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up exact Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          check-latest: false

      - name: Run focused postflight test before read credential introduction
        run: |
          set -euo pipefail
          node --test tests/api-football-collector-inactive-version-postflight.test.mjs
          test -z "$(git status --porcelain)"

      - name: Execute independent read-only inactive Version postflight
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
          STAGED_WORKER_ID: ${{ needs.inactive-staging.outputs.worker_id }}
          STAGED_VERSION_ID: ${{ needs.inactive-staging.outputs.version_id }}
          STAGED_GRAPH_SHA256: ${{ needs.inactive-staging.outputs.graph_sha256 }}
          STAGED_METADATA_SHA256: ${{ needs.inactive-staging.outputs.metadata_sha256 }}
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID }}
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
          DATA_STEWARD_CLOUDFLARE_READ_TOKEN: ${{ secrets.DATA_STEWARD_CLOUDFLARE_READ_TOKEN }}
          API_FOOTBALL_INACTIVE_POSTFLIGHT_REPORT_PATH: ${{ runner.temp }}/api-football-collector-inactive-postflight.json
        run: |
          set -euo pipefail
          node workers/api-football-collector/inactive-version-postflight.mjs
          test -z "$(git status --porcelain)"

      - name: Upload sanitized independent postflight evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: api-football-collector-inactive-staging-postflight
          path: ${{ runner.temp }}/api-football-collector-inactive-postflight.json
          if-no-files-found: error
          retention-days: 7
