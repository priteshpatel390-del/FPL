# Dormant manual-only API-Football collector infrastructure staging.
# Repository presence does not authorize dispatch. Live execution remains a separate owner gate.
name: API-Football Collector Inactive Version Staging

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact current main SHA separately approved for one inert shell plus one inactive Version
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: api-football-collector-inactive-version-staging
  cancel-in-progress: false

jobs:
  repository-gate:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      approved_sha: ${{ steps.identity.outputs.approved_sha }}
    steps:
      - name: Validate dispatch identity before checkout
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = workflow_dispatch
          test "$EVENT_RUN_ATTEMPT" = 1
          test "$EVENT_REF" = refs/heads/main
          test "$EVENT_REPOSITORY" = priteshpatel390-del/FPL
          printf '%s' "$APPROVED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$EVENT_SHA" = "$APPROVED_SHA"

      - name: Check out exact approved revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Gate exact current main and clean tree
        id: identity
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          remote_main="$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)"
          test -n "$remote_main"
          test "$remote_main" = "$APPROVED_SHA"
          test -z "$(git status --porcelain)"
          echo "approved_sha=$APPROVED_SHA" >> "$GITHUB_OUTPUT"

      - name: Require exact-head Verify Teamsheet success
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ steps.identity.outputs.approved_sha }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/check-runs.json"
          http="$(curl --silent --output "$response" --write-out '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/priteshpatel390-del/FPL/commits/$APPROVED_SHA/check-runs")"
          test "$http" = 200
          node --input-type=module - "$response" <<'NODE'
          import fs from 'node:fs';
          const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const matches=(body.check_runs??[]).filter(row=>
            row.name==='Tests and deterministic build'&&row.status==='completed'&&row.conclusion==='success'&&
            row.head_sha===process.env.APPROVED_SHA&&row.app?.slug==='github-actions'&&
            row.details_url?.startsWith('https://github.com/priteshpatel390-del/FPL/actions/runs/')
          );
          if(matches.length<1)throw new Error('exact-head Verify Teamsheet success is absent');
          NODE
          rm -f "$response"
          test -z "$(git status --porcelain)"

      - name: Set up exact Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          check-latest: false

      - name: Run focused inactive-staging tests before protected environments
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          node --test tests/api-football-collector-inactive-version-staging.test.mjs tests/api-football-collector-activation-live-preflight.test.mjs
          test -z "$(git status --porcelain)"

  fresh-readonly-admission:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    needs: repository-gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    environment:
      name: data-steward-readonly
      deployment: false
    outputs:
      classification: ${{ steps.admission.outputs.classification }}
    steps:
      - name: Check out gated exact main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.repository-gate.outputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          check-latest: false
      - name: Reconfirm exact current main before read-only credentials
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          remote_main="$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)"
          test "$remote_main" = "$APPROVED_SHA"
          test -z "$(git status --porcelain)"
      - name: Execute fresh bounded read-only admission
        env:
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID }}
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
          DATA_STEWARD_CLOUDFLARE_READ_TOKEN: ${{ secrets.DATA_STEWARD_CLOUDFLARE_READ_TOKEN }}
          API_FOOTBALL_ACTIVATION_PREFLIGHT_REPORT_PATH: ${{ runner.temp }}/api-football-collector-activation-preflight.json
        run: |
          set -euo pipefail
          node workers/api-football-collector/activation-live-preflight.mjs
      - name: Require exact staging admission
        id: admission
        env:
          REPORT: ${{ runner.temp }}/api-football-collector-activation-preflight.json
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync(process.env.REPORT,'utf8'));
          if(report.ok!==true||report.classification!=='READY_FOR_REPOSITORY_INFRASTRUCTURE_STAGING')throw new Error('fresh staging admission not granted');
          if(report.evidence?.productionMutations!==0||report.evidence?.apiFootballRequests!==0||report.evidence?.secretValuesRead!==0)throw new Error('read-only evidence contract violated');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'classification=READY_FOR_REPOSITORY_INFRASTRUCTURE_STAGING\n');
          NODE
      - name: Upload sanitized admission evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: api-football-collector-inactive-staging-admission
          path: ${{ runner.temp }}/api-football-collector-activation-preflight.json
          if-no-files-found: error
          retention-days: 7

  protected-inactive-staging:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && needs.fresh-readonly-admission.outputs.classification == 'READY_FOR_REPOSITORY_INFRASTRUCTURE_STAGING'
    needs: [repository-gate, fresh-readonly-admission]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    environment:
      name: api-football-collector-version-upload
      deployment: false
    outputs:
      candidate_version_id: ${{ steps.candidate.outputs.candidate_version_id }}
    steps:
      - name: Check out gated exact main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.repository-gate.outputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          check-latest: false
      - name: Reconfirm exact current main after protected admission
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          remote_main="$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)"
          test "$remote_main" = "$APPROVED_SHA"
          test -z "$(git status --porcelain)"
          node --test tests/api-football-collector-inactive-version-staging.test.mjs
      - name: Create inert shell then upload one inactive Version
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
          CLOUDFLARE_COLLECTOR_WORKER_UPLOAD_TOKEN: ${{ secrets.CLOUDFLARE_COLLECTOR_WORKER_UPLOAD_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.CLOUDFLARE_ACCOUNT_FINGERPRINT }}
          API_FOOTBALL_STAGING_REPORT_PATH: ${{ runner.temp }}/api-football-inactive-version-staging.json
        run: |
          set -euo pipefail
          node workers/api-football-collector/stage-inactive-version.mjs
          test -z "$(git status --porcelain)"
      - name: Export sanitized candidate identity
        id: candidate
        env:
          REPORT: ${{ runner.temp }}/api-football-inactive-version-staging.json
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync(process.env.REPORT,'utf8'));
          if(report.outcome!=='PASS'||report.cloudflareMutationPrimitives!==2||report.d1Mutations!==0||report.apiFootballRequests!==0)throw new Error('staging report invalid');
          if(report.secretBindingCount!==0||report.deploymentCount!==0||report.cronCount!==0||report.routeCount!==0||report.customDomainCount!==0)throw new Error('staging isolation violated');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'candidate_version_id='+report.candidateVersionId+'\n');
          NODE
      - name: Upload sanitized staging evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: api-football-collector-inactive-version-staging
          path: ${{ runner.temp }}/api-football-inactive-version-staging.json
          if-no-files-found: error
          retention-days: 7

  final-readonly-closeout:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    needs: [repository-gate, protected-inactive-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    environment:
      name: data-steward-readonly
      deployment: false
    steps:
      - name: Check out gated exact main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.repository-gate.outputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
          check-latest: false
      - name: Reconfirm exact current main before independent closeout
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          remote_main="$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)"
          test "$remote_main" = "$APPROVED_SHA"
          test -z "$(git status --porcelain)"
      - name: Re-run bounded D1 and runtime observation after staging
        env:
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID }}
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
          DATA_STEWARD_CLOUDFLARE_READ_TOKEN: ${{ secrets.DATA_STEWARD_CLOUDFLARE_READ_TOKEN }}
          API_FOOTBALL_ACTIVATION_PREFLIGHT_REPORT_PATH: ${{ runner.temp }}/api-football-collector-inactive-closeout.json
        run: |
          set -euo pipefail
          set +e
          node workers/api-football-collector/activation-live-preflight.mjs
          status=$?
          set -e
          test "$status" = 1
          test -f "$API_FOOTBALL_ACTIVATION_PREFLIGHT_REPORT_PATH"
      - name: Require unchanged D1 runtime and zero-history evidence
        env:
          REPORT: ${{ runner.temp }}/api-football-collector-inactive-closeout.json
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {validateReadOnlyCloseoutReport} from './workers/api-football-collector/stage-inactive-version.mjs';
          validateReadOnlyCloseoutReport(JSON.parse(fs.readFileSync(process.env.REPORT,'utf8')));
          NODE
      - name: Upload sanitized closeout evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: api-football-collector-inactive-staging-closeout
          path: ${{ runner.temp }}/api-football-collector-inactive-closeout.json
          if-no-files-found: error
          retention-days: 7
