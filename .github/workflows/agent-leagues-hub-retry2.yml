name: Temporary Leagues Hub Retry 2

on:
  push:
    branches:
      - agent/leagues-hub-first
    paths:
      - .agent/leagues-hub-retry2

permissions:
  contents: write

jobs:
  apply-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/leagues-hub-first
          fetch-depth: 0

      - name: Apply approved Leagues hub edits and correct test slice
        run: |
          set -eu
          python .agent/leagues-hub-edit.py
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/mini-leagues-ui.test.mjs')
          text=path.read_text(encoding='utf-8')
          old="const hubStart=view.indexOf('function renderMiniLeagueHub(){');"
          new="const hubStart=view.indexOf('function miniLeagueHubCategory(league){');"
          if text.count(old)!=1:
              raise SystemExit(f'expected one hubStart test anchor, found {text.count(old)}')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          rm -f .agent/leagues-hub-edit.py .agent/leagues-hub-run .agent/leagues-hub-retry .agent/leagues-hub-retry2
          rm -f .github/workflows/agent-leagues-hub.yml .github/workflows/agent-leagues-hub-retry.yml .github/workflows/agent-leagues-hub-retry2.yml

      - name: Run complete suite
        run: |
          set -eu
          ./run-tests.sh

      - name: Verify deterministic production build
        run: |
          set -eu
          node build.mjs
          rm -rf /tmp/teamsheet-build-a
          mkdir -p /tmp/teamsheet-build-a/dist
          cp dist/app.bundle.js /tmp/teamsheet-build-a/dist/app.bundle.js
          cp dist/index.html /tmp/teamsheet-build-a/dist/index.html
          cp dist/manifest.json /tmp/teamsheet-build-a/dist/manifest.json
          cp index.html /tmp/teamsheet-build-a/index.html
          node build.mjs
          cmp /tmp/teamsheet-build-a/dist/app.bundle.js dist/app.bundle.js
          cmp /tmp/teamsheet-build-a/dist/index.html dist/index.html
          cmp /tmp/teamsheet-build-a/dist/manifest.json dist/manifest.json
          cmp /tmp/teamsheet-build-a/index.html index.html
          cmp dist/index.html index.html

      - name: Commit approved source, tests, docs and generated outputs
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add all-league hub before league detail'
          git push origin HEAD:agent/leagues-hub-first
