name: Stage 5 verification
on:
  push:
    branches: [agent/stage5-scoring-corrections]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage5-scoring-corrections
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Full test suite against committed goldens
        shell: bash
        run: |
          set -euo pipefail
          ./run-tests.sh | tee /tmp/stage5-tests.log
      - name: Deterministic two-build comparison
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          BUILD_COMMIT=${GITHUB_SHA} node build.mjs
          mkdir -p /tmp/stage5-build
          cp dist/index.html dist/app.bundle.js dist/manifest.json /tmp/stage5-build/
          rm -rf dist
          BUILD_COMMIT=${GITHUB_SHA} node build.mjs
          cmp dist/index.html /tmp/stage5-build/index.html
          cmp dist/app.bundle.js /tmp/stage5-build/app.bundle.js
          cmp dist/manifest.json /tmp/stage5-build/manifest.json
      - name: Independent CSP verification
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const html = readFileSync('dist/index.html','utf8');
          const script = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)][0][1];
          const style = [...html.matchAll(/<style(?:\s[^>]*)?>([\s\S]*?)<\/style>/g)][0][1];
          const csp = /<meta\s+http-equiv="Content-Security-Policy"\s+content="([^"]+)">/.exec(html)[1];
          const hash = value => 'sha256-' + createHash('sha256').update(value,'utf8').digest('base64');
          if(!csp.includes(`script-src '${hash(script)}'`)) throw new Error('script CSP mismatch');
          if(!csp.includes(`style-src-elem '${hash(style)}'`)) throw new Error('style CSP mismatch');
          NODE
      - name: Record verified artefacts
        shell: bash
        run: |
          set -euo pipefail
          tests=$(awk '/^# tests /{print $3}' /tmp/stage5-tests.log | tail -1)
          pass=$(awk '/^# pass /{print $3}' /tmp/stage5-tests.log | tail -1)
          fail=$(awk '/^# fail /{print $3}' /tmp/stage5-tests.log | tail -1)
          mkdir -p docs
          cat > docs/STAGE5-VERIFICATION.md <<EOF
          # Stage 5 verification record

          Generated by the temporary branch-only verification workflow.

          - Source commit checked: ${GITHUB_SHA}
          - Full test suite against committed goldens: ${pass}/${tests} passing; ${fail} failing
          - Deterministic two-build comparison: passed for dist/index.html, dist/app.bundle.js and dist/manifest.json
          - Independent CSP hash recomputation: passed
          - Build identity used for deterministic comparison: ${GITHUB_SHA}
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist/app.bundle.js dist/index.html dist/manifest.json docs/STAGE5-VERIFICATION.md
          if git diff --cached --quiet; then
            echo 'No verification artefact changes to commit.'
          else
            git commit -m 'Record clean Stage 5 verification'
            git push origin HEAD:agent/stage5-scoring-corrections
          fi
