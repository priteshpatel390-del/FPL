name: Apply VoiceOver decision

on:
  push:
    branches:
      - agent/ux-a1-team-resources-bench-clarity

permissions:
  contents: write

jobs:
  update-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/ux-a1-team-resources-bench-clarity
          fetch-depth: 0

      - name: Apply owner decision and verify branch
        env:
          BASE_SHA: 231bf8ef50321721d0b8cc7d452c44ce579212d4
        run: |
          set -euo pipefail
          git reset --hard "$BASE_SHA"

          python3 - <<'PY'
          from pathlib import Path

          marker = "VOICEOVER-DECISION-2026-08-06"
          decision = "VoiceOver testing is not required for Teamsheet and is not an acceptance gate. Standard accessibility safeguards—including semantic controls, labels, focus behaviour, reduced motion, contrast, touch targets and keyboard behaviour—remain required where applicable."

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def insert_after_title(path, block):
              text = read(path)
              if marker in text:
                  return
              first_break = text.find("\n")
              text = text[:first_break + 1] + "\n" + block + "\n" + text[first_break + 1:]
              write(path, text)

          block = f"<!-- {marker} -->\n> **Owner decision — 6 August 2026:** {decision}\n"
          for path in [
              "CLAUDE.md",
              "docs/PROJECT_CONTEXT.md",
              "docs/ROADMAP.md",
              "docs/KNOWN_LIMITATIONS.md",
              "docs/TESTING.md",
              "docs/TEAMSHEET2-PRODUCT-BLUEPRINT.md",
          ]:
              insert_after_title(path, block)

          replacements = {
              "Physical populated iPhone Safari acceptance is owner-pending; VoiceOver was not tested and must not be claimed.": "Physical populated iPhone Safari acceptance passed on 6 August 2026.",
              "Populated physical iPhone Safari review remains owner-pending; VoiceOver was deliberately not tested.": "Populated physical iPhone Safari review passed on 6 August 2026.",
              "Physical populated iPhone Safari acceptance remains pending; VoiceOver was not tested.": "Physical populated iPhone Safari acceptance passed on 6 August 2026.",
              "Physical populated iPhone Safari acceptance remains owner-pending; VoiceOver was deliberately not tested.": "Physical populated iPhone Safari acceptance passed on 6 August 2026.",
              "VoiceOver was deliberately not tested and must not be claimed as physically verified.": "VoiceOver testing is not a project acceptance requirement.",
              "VoiceOver was not tested and must not be claimed as physically verified.": "VoiceOver testing is not a project acceptance requirement.",
              "VoiceOver was not tested and is not claimed.": "VoiceOver testing is not a project acceptance requirement.",
              "VoiceOver was not tested.": "VoiceOver testing is not a project acceptance requirement.",
              "VoiceOver remains accepted-unverified.": "VoiceOver testing is not a project acceptance requirement.",
              "VoiceOver remains accepted-unverified": "VoiceOver testing is not a project acceptance requirement",
              "VoiceOver is outside this UX-A1 device script and must remain recorded as not tested unless separately performed.": "VoiceOver testing is outside the project acceptance requirements.",
              "UX-A1 Team resources and bench clarity has not yet received populated physical iPhone Safari acceptance": "UX-A1 Team resources and bench clarity passed populated physical iPhone Safari acceptance on 6 August 2026",
              "Open (acceptance gate)": "CLOSED — owner accepted 2026-08-06",
              "draft PR and populated iPhone Safari owner acceptance pending": "draft PR; populated iPhone Safari owner acceptance passed 2026-08-06",
          }

          for path in [
              "CLAUDE.md",
              "docs/PROJECT_CONTEXT.md",
              "docs/ROADMAP.md",
              "docs/KNOWN_LIMITATIONS.md",
              "docs/TESTING.md",
              "docs/TEAMSHEET2-PRODUCT-BLUEPRINT.md",
          ]:
              text = read(path)
              for old, new in replacements.items():
                  text = text.replace(old, new)
              write(path, text)

          decisions = Path("docs/DECISIONS.md")
          text = decisions.read_text(encoding="utf-8")
          if marker not in text:
              text += f"\n\n## 2026-08-06 — VoiceOver is not a project acceptance requirement\n\n<!-- {marker} -->\n\n**Decision:** {decision}\n\n**Reason:** Pritesh confirmed that VoiceOver testing is not required for this project. It must not be listed as an outstanding limitation, acceptance gate or definition-of-done item. This does not remove the existing automated and manual accessibility safeguards for semantic controls, labels, focus, contrast, reduced motion, touch targets and keyboard behaviour.\n"
              decisions.write_text(text, encoding="utf-8")
          PY

          git config user.name "Teamsheet UX-A1 Agent"
          git config user.email "actions@users.noreply.github.com"
          git add CLAUDE.md docs/
          git commit -m "Record VoiceOver acceptance decision"
          SOURCE_SHA=$(git rev-parse HEAD)

          ./run-tests.sh

          rm -rf /tmp/voiceover-build-a /tmp/voiceover-build-b
          mkdir -p /tmp/voiceover-build-a /tmp/voiceover-build-b
          BUILD_COMMIT="$SOURCE_SHA" node build.mjs
          cp dist/app.bundle.js /tmp/voiceover-build-a/app.bundle.js
          cp dist/index.html /tmp/voiceover-build-a/dist-index.html
          cp dist/manifest.json /tmp/voiceover-build-a/manifest.json
          cp index.html /tmp/voiceover-build-a/root-index.html

          BUILD_COMMIT="$SOURCE_SHA" node build.mjs
          cp dist/app.bundle.js /tmp/voiceover-build-b/app.bundle.js
          cp dist/index.html /tmp/voiceover-build-b/dist-index.html
          cp dist/manifest.json /tmp/voiceover-build-b/manifest.json
          cp index.html /tmp/voiceover-build-b/root-index.html

          cmp /tmp/voiceover-build-a/app.bundle.js /tmp/voiceover-build-b/app.bundle.js
          cmp /tmp/voiceover-build-a/dist-index.html /tmp/voiceover-build-b/dist-index.html
          cmp /tmp/voiceover-build-a/manifest.json /tmp/voiceover-build-b/manifest.json
          cmp /tmp/voiceover-build-a/root-index.html /tmp/voiceover-build-b/root-index.html
          cmp dist/index.html index.html

          git add dist/app.bundle.js dist/index.html dist/manifest.json index.html
          git commit -m "Build after VoiceOver acceptance decision"
          git push --force origin HEAD:agent/ux-a1-team-resources-bench-clarity
