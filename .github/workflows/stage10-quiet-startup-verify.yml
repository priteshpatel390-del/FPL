name: Temporary Stage 10.1 quiet startup verifier

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage10-1-deadline-snapshot
          fetch-depth: 0

      - name: Apply quiet startup refinement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              file.write_text(text.replace(old, new, 1))

          replace_once('app.html',
          ".startup-card{width:min(100%,360px);display:grid;justify-items:center;gap:12px}\n"
          ".startup-wordmark{font-family:'Bricolage Grotesque','Public Sans',sans-serif;font-size:34px;font-weight:800;letter-spacing:-.035em}\n"
          ".startup-sub{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#B9C9BF}\n"
          ".startup-pitch{position:relative;width:84px;height:54px;border:1px solid rgba(255,255,255,.42);border-radius:8px;margin:8px 0 4px;overflow:hidden}\n"
          ".startup-pitch:before{content:\"\";position:absolute;left:50%;top:0;bottom:0;border-left:1px solid rgba(255,255,255,.34)}\n"
          ".startup-pitch:after{content:\"\";position:absolute;width:20px;height:20px;border:1px solid rgba(255,255,255,.34);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}\n"
          ".startup-ball{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--amber);left:14px;top:23px;animation:startup-scan 1.7s ease-in-out infinite alternate}\n"
          ".startup-title{font-family:'Bricolage Grotesque','Public Sans',sans-serif;font-size:19px;font-weight:800;margin-top:4px}\n"
          ".startup-detail{max-width:310px;color:#C9D6CE;font-size:12px;line-height:1.5;min-height:36px}\n"
          ".startup-note{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#8FA79A;margin-top:8px}\n",
          ".startup-card{width:min(100%,360px);display:grid;justify-items:center;gap:14px}\n"
          ".startup-wordmark{font-family:'Bricolage Grotesque','Public Sans',sans-serif;font-size:34px;font-weight:800;letter-spacing:-.035em}\n"
          ".startup-sub{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#B9C9BF}\n"
          ".startup-pitch{position:relative;width:84px;height:54px;border:1px solid rgba(255,255,255,.42);border-radius:8px;margin:10px 0 0;overflow:hidden}\n"
          ".startup-pitch:before{content:\"\";position:absolute;left:50%;top:0;bottom:0;border-left:1px solid rgba(255,255,255,.34)}\n"
          ".startup-pitch:after{content:\"\";position:absolute;width:20px;height:20px;border:1px solid rgba(255,255,255,.34);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}\n"
          ".startup-ball{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--amber);left:14px;top:23px;animation:startup-scan 1.7s ease-in-out infinite alternate}\n")

          replace_once('app.html',
          '<section class="startup-gate" id="startupGate" role="status" aria-live="polite" aria-labelledby="startupTitle">\n'
          '  <div class="startup-card">\n'
          '    <div class="startup-wordmark">TEAMSHEET</div>\n'
          '    <div class="startup-sub">FPL decision desk</div>\n'
          '    <div class="startup-pitch" aria-hidden="true"><span class="startup-ball"></span></div>\n'
          '    <div class="startup-title" id="startupTitle">Loading verified data</div>\n'
          '    <div class="startup-detail" id="startupDetail">Preparing the last accepted dataset as a safe fallback.</div>\n'
          '    <div class="startup-note">Approved sources · automatic checks · one consistent update</div>\n'
          '  </div>\n'
          '</section>',
          '<section class="startup-gate" id="startupGate" role="status" aria-label="Opening Teamsheet">\n'
          '  <div class="startup-card">\n'
          '    <div class="startup-wordmark">TEAMSHEET</div>\n'
          '    <div class="startup-sub">FPL decision desk</div>\n'
          '    <div class="startup-pitch" aria-hidden="true"><span class="startup-ball"></span></div>\n'
          '  </div>\n'
          '</section>')

          replace_once('src/main.mjs',
          "function setStartupPhase(key){\n"
          "  if(typeof document==='undefined') return;\n"
          "  const copy=STARTUP_PHASE_COPY[key]||STARTUP_PHASE_COPY.cache;\n"
          "  const title=$('startupTitle'), detail=$('startupDetail');\n"
          "  if(title) title.textContent=copy[0];\n"
          "  if(detail) detail.textContent=copy[1];\n"
          "}",
          "function setStartupPhase(key){\n"
          "  return STARTUP_PHASE_COPY[key]||STARTUP_PHASE_COPY.cache;\n"
          "}")

          replace_once('src/main.mjs',
          "      if(report.criticalReady){\n"
          "        lastVerifiedRefreshAt=nowFn();\n"
          "        setStartupPhase('evidence');\n"
          "        await dispatchVerifiedData({reason,verifiedAt:lastVerifiedRefreshAt,source:report.source});\n"
          "        setStartupPhase('ready');\n"
          "        document.body?.classList?.remove('data-restricted');\n",
          "      if(report.criticalReady){\n"
          "        lastVerifiedRefreshAt=nowFn();\n"
          "        document.body?.classList?.remove('data-restricted');\n"
          "        void dispatchVerifiedData({reason,verifiedAt:lastVerifiedRefreshAt,source:report.source});\n")

          replace_once('tests/startup-refresh.test.mjs',
          "  VERIFIED_REFRESH_MIN_AGE_MS,\n  STARTUP_PHASE_COPY,\n  shouldRefreshVerifiedData,",
          "  VERIFIED_REFRESH_MIN_AGE_MS,\n  shouldRefreshVerifiedData,")

          replace_once('tests/startup-refresh.test.mjs',
          "test('startup gate is minimalist, visible by default and carries honest verification phases',()=>{\n"
          "  assert.match(APP_HTML,/<body class=\"startup-pending\" aria-busy=\"true\">/);\n"
          "  assert.match(APP_HTML,/id=\"startupGate\"[^>]*role=\"status\"/);\n"
          "  assert.match(APP_HTML,/id=\"startupTitle\">Loading verified data/);\n"
          "  assert.match(APP_HTML,/Approved sources · automatic checks · one consistent update/);\n"
          "  assert.deepEqual(STARTUP_PHASE_COPY.ready,['Ready','Latest verified data available.']);\n"
          "  assert.match(STARTUP_PHASE_COPY.restricted[1],/recommendations remain unavailable/);\n"
          "});",
          "test('startup gate is silent, minimalist and visible by default',()=>{\n"
          "  assert.match(APP_HTML,/<body class=\"startup-pending\" aria-busy=\"true\">/);\n"
          "  assert.match(APP_HTML,/id=\"startupGate\"[^>]*role=\"status\"[^>]*aria-label=\"Opening Teamsheet\"/);\n"
          "  assert.match(APP_HTML,/class=\"startup-wordmark\">TEAMSHEET/);\n"
          "  assert.match(APP_HTML,/class=\"startup-pitch\"/);\n"
          "  assert.doesNotMatch(APP_HTML,/startupTitle|startupDetail|startup-note/);\n"
          "  assert.doesNotMatch(APP_HTML,/Loading verified data|Checking official FPL|Approved sources · automatic checks/);\n"
          "});")

          replace_once('tests/startup-refresh.test.mjs',
          "test('verified-data event waits for automatic evidence work before startup completes',async()=>{\n",
          "test('automatic evidence is dispatched without extending startup loading',async()=>{\n"
          "  assert.match(MAIN_SOURCE,/void dispatchVerifiedData\\(\\{reason,verifiedAt:lastVerifiedRefreshAt,source:report\\.source\\}\\)/);\n"
          "  assert.doesNotMatch(MAIN_SOURCE,/await dispatchVerifiedData/);\n")

          replace_once('docs/STAGE10-ITEM1.md',
          '- Minimalist startup verification gate with plain-English phases; the app opens only after Official FPL and approved optional providers resolve to a verified live/cache/fallback/disabled state.',
          '- Silent minimalist startup gate showing only the Teamsheet identity and restrained loader; provider and update details remain off-screen unless a genuine failure blocks safe use.')
          replace_once('docs/STAGE10-ITEM1.md',
          '- Automatic eligible evidence capture after verification, with duplicate suppression across open, due-soon, ideal and final windows.',
          '- Automatic eligible evidence capture is dispatched after verification without extending the startup gate, with duplicate suppression across open, due-soon, ideal and final windows.')
          replace_once('docs/STAGE10-ITEM1.md',
          'Open the review deployment on Pritesh’s iPhone and verify: status readability, capture progress, no unacceptable interaction lock, JSON download, JSON re-import, local delete/reset and no console-visible error. Stage 10.1 must remain draft until this check is reported.',
          'Open the review deployment on Pritesh’s iPhone and verify: the silent loader is visually clean and brief, the app opens without waiting for evidence capture, foreground refresh causes no unacceptable interaction lock, recovery controls work and no console-visible error occurs. Stage 10.1 must remain draft until this check is reported.')

          replace_once('docs/CHANGELOG.md',
          '- Minimalist startup verification screen, automatic app-open/foreground refresh, one-shot verified rendering and automatic eligible evidence capture.',
          '- Silent minimalist startup verification screen, automatic app-open/foreground refresh, one-shot verified rendering and automatic eligible evidence capture.')
          replace_once('docs/CHANGELOG.md',
          '- Startup and foreground refresh now await every approved provider state before one final render; no intermediate mixed dataset is exposed.\n',
          '- Startup and foreground refresh now await every approved provider state before one final render; no intermediate mixed dataset is exposed.\n- Eligible evidence capture starts automatically after verified data is ready but no longer holds the startup screen open.\n')

          replace_once('docs/TESTING.md',
          '20. `startup-refresh.test.mjs` — minimalist startup gate, refresh-age rule, shared startup/foreground orchestration, deferred provider settlement, awaited automatic evidence and recovery-only UI wiring.',
          '20. `startup-refresh.test.mjs` — silent startup gate, refresh-age rule, shared startup/foreground orchestration, deferred provider settlement, non-blocking automatic evidence and recovery-only UI wiring.')
          PY
          rm .stage10-quiet-startup.patch
          rm .github/workflows/stage10-quiet-startup-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add -A
          git commit -m "Refine Stage 10.1 startup experience"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Record exact source identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          old = '73cdca817f7070a745fb642e1070d77a6bdaca9b'
          new = os.environ['SOURCE_SHA']
          paths = [*Path('.').glob('*.md'), *Path('docs').glob('*.md')]
          for path in paths:
              text = path.read_text()
              if old in text:
                  path.write_text(text.replace(old, new))
          remaining = [str(path) for path in paths if old in path.read_text()]
          if remaining:
              raise SystemExit(f'stale source identity remains: {remaining}')
          PY

      - name: Run full verification
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          BUILD_COMMIT="$SOURCE_SHA" ./run-tests.sh | tee /tmp/stage10-tests.log
          cp -a dist /tmp/stage10-dist-first
          cp index.html /tmp/stage10-root-first.html
          BUILD_COMMIT="$SOURCE_SHA" node build.mjs
          cmp -s /tmp/stage10-dist-first/app.bundle.js dist/app.bundle.js
          cmp -s /tmp/stage10-dist-first/index.html dist/index.html
          cmp -s /tmp/stage10-dist-first/manifest.json dist/manifest.json
          cmp -s /tmp/stage10-root-first.html index.html
          cmp -s index.html dist/index.html
          node --check dist/app.bundle.js
          node -e "const m=require('./dist/manifest.json'); if(m.commit!==process.env.SOURCE_SHA) throw new Error('build identity mismatch')"
          grep -q '# tests 349' /tmp/stage10-tests.log
          grep -q '# pass 349' /tmp/stage10-tests.log
          grep -q '# fail 0' /tmp/stage10-tests.log
          grep -q 'aria-label="Opening Teamsheet"' app.html
          ! grep -q 'id="startupTitle"' app.html
          ! grep -q 'await dispatchVerifiedData' src/main.mjs
          git diff --check

      - name: Commit verified artefacts
        shell: bash
        run: |
          set -euo pipefail
          git add CLAUDE.md README-BUILD.md docs dist index.html
          git commit -m "Verify Stage 10.1 quiet startup artefacts"
          git push origin HEAD:agent/stage10-1-deadline-snapshot
