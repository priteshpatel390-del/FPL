name: Apply Teamsheet 2.0.6 source

on:
  push:
    branches:
      - agent/teamsheet-2.0.6-settings-organisation

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct approved source patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/65/comments" > /tmp/comments.json
          python - <<'PY'
          import base64, gzip, json, re
          from pathlib import Path

          comments = json.loads(Path('/tmp/comments.json').read_text())
          chunks = {}
          pattern = re.compile(r'^TS206_PATCH_(\d{3})_OF_011\n([A-Za-z0-9+/=]+)\s*$')
          for item in comments:
              match = pattern.match(item.get('body', ''))
              if match:
                  chunks[int(match.group(1))] = match.group(2)
          expected = list(range(1, 12))
          if sorted(chunks) != expected:
              raise SystemExit(f'Patch chunks incomplete: found {sorted(chunks)}')
          packed = base64.b64decode(''.join(chunks[index] for index in expected))
          Path('/tmp/teamsheet.patch').write_bytes(gzip.decompress(packed))
          PY
          git apply --index /tmp/teamsheet.patch
          rm .github/workflows/apply-teamsheet-2.0.6.yml
          git add -A
          git diff --cached --check

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./run-tests.sh
          ./run-tests.sh
          git checkout -- index.html dist/
          git add -A
          git diff --cached --check

      - name: Commit approved implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement Teamsheet 2.0.6 settings organisation'
          git push origin HEAD:${GITHUB_REF_NAME}
