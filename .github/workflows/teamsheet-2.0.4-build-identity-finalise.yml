name: Finalise Teamsheet 2.0.4 build identity

on:
  push:
    branches:
      - agent/teamsheet-2.0.4-mini-leagues
    paths:
      - .github/workflows/teamsheet-2.0.4-build-identity-finalise.yml

permissions:
  contents: write

jobs:
  finalise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/teamsheet-2.0.4-mini-leagues
          fetch-depth: 0

      - name: Build exact verified source twice
        shell: bash
        env:
          SOURCE_COMMIT: 70d70055775fb92a47d42f0dd513980fd879a404
        run: |
          BUILD_COMMIT="$SOURCE_COMMIT" node build.mjs
          mkdir -p /tmp/build-one/dist
          cp index.html /tmp/build-one/index.html
          cp dist/index.html /tmp/build-one/dist/index.html
          cp dist/app.bundle.js /tmp/build-one/dist/app.bundle.js
          cp dist/manifest.json /tmp/build-one/dist/manifest.json
          BUILD_COMMIT="$SOURCE_COMMIT" node build.mjs
          cmp /tmp/build-one/index.html index.html
          cmp /tmp/build-one/dist/index.html dist/index.html
          cmp /tmp/build-one/dist/app.bundle.js dist/app.bundle.js
          cmp /tmp/build-one/dist/manifest.json dist/manifest.json
          cmp index.html dist/index.html
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('dist/manifest.json','utf8'));
          if(m.commit!=='70d70055775fb92a47d42f0dd513980fd879a404') throw new Error(`Wrong build commit: ${m.commit}`);
          if(m.modelVersion!=='2.4.0'||m.rulesVersion!=='2026-27.3') throw new Error('Model/rules changed');
          NODE
          git diff --check

      - name: Record hashes, remove workflow and push
        shell: bash
        env:
          SOURCE_COMMIT: 70d70055775fb92a47d42f0dd513980fd879a404
        run: |
          ROOT_HTML_SHA=$(sha256sum index.html | awk '{print $1}')
          BUNDLE_SHA=$(sha256sum dist/app.bundle.js | awk '{print $1}')
          MANIFEST_SHA=$(sha256sum dist/manifest.json | awk '{print $1}')
          SOURCE_HASH=$(node -e "console.log(JSON.parse(require('fs').readFileSync('dist/manifest.json','utf8')).sourceHash)")
          python - "$SOURCE_COMMIT" "$SOURCE_HASH" "$ROOT_HTML_SHA" "$BUNDLE_SHA" "$MANIFEST_SHA" <<'PY'
          from pathlib import Path
          import re,sys
          source,source_hash,html_hash,bundle_hash,manifest_hash=sys.argv[1:]
          path=Path('docs/TEAMSHEET2-ITEM4.md')
          text=path.read_text()
          replacement=(f'- Verified source `{source}` completed 493/493 tests. Two exact-identity builds were byte-identical and root `index.html` equalled `dist/index.html`. '
                       f'Source hash `{source_hash}`; root/dist HTML SHA-256 `{html_hash}`; bundle SHA-256 `{bundle_hash}`; manifest SHA-256 `{manifest_hash}`.')
          text,count=re.subn(r'- Verified source `[^`]+` completed 493/493 tests\..*',replacement,text,count=1)
          if count!=1: raise SystemExit(f'verification line count: {count}')
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/teamsheet-2.0.4-build-identity-finalise.yml
          git add -A
          git diff --cached --check
          git commit -m "Correct Mini Leagues build identity [build-identity-finalised]"
          git push origin HEAD:agent/teamsheet-2.0.4-mini-leagues
