name: Teamsheet 2.0 Blueprint Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Allow cleanup commit
        run: sleep 90
      - name: Check out final branch head
        uses: actions/checkout@v4
        with:
          ref: agent/teamsheet2-blueprint-integration
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Confirm final documentation-only diff
        run: |
          git fetch origin main
          unexpected="$(git diff --name-only origin/main...HEAD | grep -Ev '^(CLAUDE\.md|docs/.*\.md)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected non-documentation files changed:"
            echo "$unexpected"
            exit 1
          fi
          echo "Documentation-only diff confirmed."
          git diff --name-only origin/main...HEAD
      - name: Run complete test suite
        run: ./run-tests.sh
      - name: Verify deterministic exact-identity builds
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          first_dir="$(mktemp -d)"
          BUILD_COMMIT="$source_sha" node build.mjs
          cp dist/index.html "$first_dir/dist-index.html"
          cp dist/app.bundle.js "$first_dir/app.bundle.js"
          cp dist/manifest.json "$first_dir/manifest.json"
          cp index.html "$first_dir/root-index.html"
          BUILD_COMMIT="$source_sha" node build.mjs
          cmp "$first_dir/dist-index.html" dist/index.html
          cmp "$first_dir/app.bundle.js" dist/app.bundle.js
          cmp "$first_dir/manifest.json" dist/manifest.json
          cmp "$first_dir/root-index.html" index.html
          cmp index.html dist/index.html
          grep -F "$source_sha" dist/manifest.json
          echo "VERIFIED_SOURCE_SHA=$source_sha"
          sha256sum dist/index.html dist/app.bundle.js dist/manifest.json index.html
          echo "Deterministic exact-identity builds and root/deployable equality confirmed."
