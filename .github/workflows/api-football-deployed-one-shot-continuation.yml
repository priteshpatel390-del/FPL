# CONSUMED (run 37511401491, attempt 1): DO NOT DISPATCH AGAIN. Provider attempt 1 is permanently TRANSPORT_UNKNOWN.
# Its pristine-history admission no longer holds and it selects the superseded old Version 04d79556-3070-429f-9944-b5b53d799842.
# Gate C uses a distinct, separately owner-gated workflow and corrected promoted Version; historical continuation is never retry authority.
# Dormant owner-gated CONTINUATION of the deployed one-shot API-Football shadow collection on the ORIGINAL collector.
# Run 37505586273 (consumed, never rerun) submitted the single Deployment POST; independent readback proved Deployment
# 2417a3e0-15db-4e45-a3c8-00b148a300f4 exists and selects the reviewed attended Version at 100%, with production inert.
# This workflow REUSES that Deployment: it contains no Deployment mutation (ceiling 0), no Version upload, no Preview,
# Cron, route or domain change. It enables workers.dev only temporarily, sends exactly one trigger, always cleans up
# (collection disable, workers.dev disable) and independently reconciles.
# Repository presence and merge authorize nothing live. Dispatch requires a separate explicit owner approval.
name: API-Football Deployed One-Shot Continuation

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact current main SHA separately approved for the deployed one-shot continuation
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: api-football-collector-attended-acceptance
  cancel-in-progress: false

jobs:
  repository-gate:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      approved_sha: ${{ steps.identity.outputs.approved_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = workflow_dispatch
          test "$EVENT_RUN_ATTEMPT" = 1
          test "$EVENT_REF" = refs/heads/main
          test "$EVENT_REPOSITORY" = priteshpatel390-del/FPL
          printf '%s' "$APPROVED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$EVENT_SHA" = "$APPROVED_SHA"
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)" = "$APPROVED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "approved_sha=$APPROVED_SHA" >> "$GITHUB_OUTPUT"
      - name: Require exact-head Verify Teamsheet success
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ steps.identity.outputs.approved_sha }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/check-runs.json"
          gh api "repos/${{ github.repository }}/commits/$APPROVED_SHA/check-runs" > "$response"
          node --input-type=module - "$response" <<'NODE'
          import fs from 'node:fs';
          const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!(body.check_runs??[]).some(row=>row.name==='Tests and deterministic build'&&row.status==='completed'&&row.conclusion==='success'&&row.head_sha===process.env.APPROVED_SHA&&row.app?.slug==='github-actions'&&row.details_url?.startsWith('https://github.com/priteshpatel390-del/FPL/actions/runs/')))throw new Error('exact-head Verify Teamsheet success is absent');
          NODE
          rm -f "$response"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
      - name: Run focused continuation tests
        run: |
          node --test tests/api-football-deployed-one-shot-continuation.test.mjs tests/api-football-deployed-one-shot.test.mjs tests/api-football-collector-activation-live-preflight.test.mjs
          test -z "$(git status --porcelain --untracked-files=all)"

  fresh-readonly-admission:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    needs: repository-gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: data-steward-readonly
      deployment: false
    outputs:
      classification: ${{ steps.handoff.outputs.classification }}
      artifact_sha256: ${{ steps.handoff.outputs.artifact_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.repository-gate.outputs.approved_sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
      - name: Reconfirm exact protected main after read-only environment admission
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)" = "$APPROVED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Prove exact existing inert Deployment, inert topology, pristine history and foundational D1 state
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
          API_FOOTBALL_DEPLOYED_ONE_SHOT_MODE: ADMISSION
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID }}
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
          DATA_STEWARD_CLOUDFLARE_READ_TOKEN: ${{ secrets.DATA_STEWARD_CLOUDFLARE_READ_TOKEN }}
          CLOUDFLARE_TOPOLOGY_READ_TOKEN: ${{ secrets.CLOUDFLARE_REPLACEMENT_TOPOLOGY_READ_TOKEN }}
          API_FOOTBALL_DEPLOYED_ONE_SHOT_REPORT_PATH: ${{ runner.temp }}/deployed-one-shot-continuation-admission.json
        run: node workers/api-football-collector/deployed-one-shot-continuation-readonly.mjs
      - name: Bind sanitized admission handoff
        id: handoff
        env:
          REPORT: ${{ runner.temp }}/deployed-one-shot-continuation-admission.json
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const bytes=fs.readFileSync(process.env.REPORT),report=JSON.parse(bytes);
          if(report.version!=='api-football-deployed-one-shot-continuation-admission-v1'||report.ok!==true||report.approvedSha!==process.env.APPROVED_SHA||report.classification!=='READY_FOR_DEPLOYED_ONE_SHOT_CONTINUATION'||report.retryAuthorized!==false)throw new Error('deployed one-shot admission handoff invalid');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`classification=${report.classification}\nartifact_sha256=${createHash('sha256').update(bytes).digest('hex')}\n`);
          NODE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: api-football-deployed-one-shot-continuation-admission
          path: ${{ runner.temp }}/deployed-one-shot-continuation-admission.json
          if-no-files-found: error
          retention-days: 7

  protected-one-shot-execution:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && needs.fresh-readonly-admission.outputs.classification == 'READY_FOR_DEPLOYED_ONE_SHOT_CONTINUATION'
    needs: [repository-gate, fresh-readonly-admission]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: api-football-attended-acceptance
      deployment: false
    outputs:
      execution_artifact_sha256: ${{ steps.execution-handoff.outputs.execution_artifact_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.repository-gate.outputs.approved_sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
      - name: Reconfirm exact protected main after mutation environment admission
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)" = "$APPROVED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          name: api-football-deployed-one-shot-continuation-admission
          path: ${{ runner.temp }}/deployed-one-shot-continuation-admission
      - name: Recheck state, Deployment and zone routes, enable workers.dev, trigger once, cleanup inside executor regardless of outcome
        id: execute
        continue-on-error: true
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
          API_FOOTBALL_ATTENDED_TRIGGER_SECRET: ${{ secrets.API_FOOTBALL_ATTENDED_TRIGGER_SECRET }}
          API_FOOTBALL_DEPLOYED_ONE_SHOT_ADMISSION_PATH: ${{ runner.temp }}/deployed-one-shot-continuation-admission/deployed-one-shot-continuation-admission.json
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.CLOUDFLARE_ACCOUNT_FINGERPRINT }}
          CLOUDFLARE_ATTENDED_READ_TOKEN: ${{ secrets.CLOUDFLARE_ATTENDED_READ_TOKEN }}
          CLOUDFLARE_ATTENDED_MUTATION_TOKEN: ${{ secrets.CLOUDFLARE_ATTENDED_MUTATION_TOKEN }}
          # Read-only Zone Read + Workers Routes Read; used only for the final pre-mutation route scan.
          CLOUDFLARE_TOPOLOGY_READ_TOKEN: ${{ secrets.CLOUDFLARE_REPLACEMENT_TOPOLOGY_READ_TOKEN }}
          EXPECTED_ARTIFACT_SHA256: ${{ needs.fresh-readonly-admission.outputs.artifact_sha256 }}
          API_FOOTBALL_DEPLOYED_ONE_SHOT_EXECUTION_REPORT_PATH: ${{ runner.temp }}/deployed-one-shot-continuation-execution.json
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)" = "$APPROVED_SHA"
          test "$(sha256sum "$API_FOOTBALL_DEPLOYED_ONE_SHOT_ADMISSION_PATH" | cut -d' ' -f1)" = "$EXPECTED_ARTIFACT_SHA256"
          test -z "$(git status --porcelain --untracked-files=all)"
          node workers/api-football-collector/run-deployed-one-shot-continuation.mjs
      - name: Bind sanitized execution evidence
        id: execution-handoff
        if: always()
        env:
          REPORT: ${{ runner.temp }}/deployed-one-shot-continuation-execution.json
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
        run: |
          set -euo pipefail
          test -f "$REPORT"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const bytes=fs.readFileSync(process.env.REPORT),report=JSON.parse(bytes);
          if(report.version!=='api-football-deployed-one-shot-continuation-execution-v1'||report.approvedSha!==process.env.APPROVED_SHA||report.retryAuthorized!==false||![0,1].includes(report.triggerRequests)||report.mutations?.createDeployment!==0)throw new Error('deployed one-shot execution evidence invalid');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`execution_artifact_sha256=${createHash('sha256').update(bytes).digest('hex')}\n`);
          NODE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: api-football-deployed-one-shot-continuation-execution
          path: ${{ runner.temp }}/deployed-one-shot-continuation-execution.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve protected execution outcome
        if: steps.execute.outcome != 'success'
        run: exit 1

  final-readonly-reconciliation:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && needs.repository-gate.result == 'success' }}
    needs: [repository-gate, fresh-readonly-admission, protected-one-shot-execution]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: data-steward-readonly
      deployment: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.repository-gate.outputs.approved_sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
      - name: Reconfirm exact protected main before independent closeout
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)" = "$APPROVED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        if: needs.protected-one-shot-execution.outputs.execution_artifact_sha256 != ''
        with:
          name: api-football-deployed-one-shot-continuation-execution
          path: ${{ runner.temp }}/deployed-one-shot-continuation-execution
      - name: Verify sanitized execution handoff
        if: needs.protected-one-shot-execution.outputs.execution_artifact_sha256 != ''
        env:
          REPORT: ${{ runner.temp }}/deployed-one-shot-continuation-execution/deployed-one-shot-continuation-execution.json
          EXPECTED_SHA256: ${{ needs.protected-one-shot-execution.outputs.execution_artifact_sha256 }}
        run: |
          set -euo pipefail
          test "$(sha256sum "$REPORT" | cut -d' ' -f1)" = "$EXPECTED_SHA256"
      - name: Independently reconcile collection, topology and retained Deployment state
        id: reconcile
        continue-on-error: true
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
          API_FOOTBALL_DEPLOYED_ONE_SHOT_MODE: RECONCILIATION
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID }}
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
          DATA_STEWARD_CLOUDFLARE_READ_TOKEN: ${{ secrets.DATA_STEWARD_CLOUDFLARE_READ_TOKEN }}
          CLOUDFLARE_TOPOLOGY_READ_TOKEN: ${{ secrets.CLOUDFLARE_REPLACEMENT_TOPOLOGY_READ_TOKEN }}
          API_FOOTBALL_DEPLOYED_ONE_SHOT_REPORT_PATH: ${{ runner.temp }}/deployed-one-shot-continuation-reconciliation.json
          API_FOOTBALL_DEPLOYED_ONE_SHOT_EXECUTION_PATH: ${{ needs.protected-one-shot-execution.outputs.execution_artifact_sha256 != '' && format('{0}/deployed-one-shot-continuation-execution/deployed-one-shot-continuation-execution.json', runner.temp) || '' }}
        run: node workers/api-football-collector/deployed-one-shot-continuation-readonly.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: api-football-deployed-one-shot-continuation-reconciliation
          path: ${{ runner.temp }}/deployed-one-shot-continuation-reconciliation.json
          if-no-files-found: error
          retention-days: 7
      - name: Require independently reconciled success
        if: steps.reconcile.outcome != 'success'
        run: exit 1
