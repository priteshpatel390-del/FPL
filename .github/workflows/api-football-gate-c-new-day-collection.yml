# Gate C — DORMANT owner-gated NEW-DAY shadow discovery with the Gate B corrected Deployment.
# Repository presence, green CI and merge do NOT authorise live execution. Separate explicit live approval required.
# Exactly one trigger, at most five provider attempts; NO Deployment or Version mutations, Preview, Cron, routes or domains.
# Historical runs 37505586273, 37511401491, 37680114065 and 37688525299 are CONSUMED, never rerun.
# Inert topology must be restored on all paths; unknown outcomes stop without retry/rollback.
name: API-Football Gate C New-Day Shadow Collection

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact main SHA for a separately approved one-time live Gate C (not authorised by merge)
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: api-football-collector-attended-acceptance
  cancel-in-progress: false

jobs:
  repository-gate:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      approved_sha: ${{ steps.identity.outputs.approved_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = workflow_dispatch
          test "$EVENT_RUN_ATTEMPT" = 1
          test "$EVENT_REF" = refs/heads/main
          test "$EVENT_REPOSITORY" = priteshpatel390-del/FPL
          printf '%s' "$APPROVED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$EVENT_SHA" = "$APPROVED_SHA"
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)" = "$APPROVED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "approved_sha=$APPROVED_SHA" >> "$GITHUB_OUTPUT"
      - name: Refuse every second Gate C workflow dispatch, including earlier pre-egress stops
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/actions/workflows/api-football-gate-c-new-day-collection.yml/runs?event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/gate-c-dispatch-history.json"
          node --input-type=module - "$RUNNER_TEMP/gate-c-dispatch-history.json" <<'NODE'
          import fs from 'node:fs';
          const result=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!Number.isInteger(result.total_count)||result.total_count!==1||
              result.workflow_runs?.length!==1||String(result.workflow_runs[0].id)!==process.env.CURRENT_RUN_ID)
            throw new Error('GATE_C_DISPATCH_ALREADY_CONSUMED_OR_UNPROVEN');
          NODE
          rm -f "$RUNNER_TEMP/gate-c-dispatch-history.json"
      - name: Require exact-head Verify Teamsheet success
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ steps.identity.outputs.approved_sha }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/check-runs.json"
          gh api "repos/${{ github.repository }}/commits/$APPROVED_SHA/check-runs" > "$response"
          node --input-type=module - "$response" <<'NODE'
          import fs from 'node:fs';
          const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!(body.check_runs??[]).some(row=>row.name==='Tests and deterministic build'&&row.status==='completed'&&row.conclusion==='success'&&row.head_sha===process.env.APPROVED_SHA&&row.app?.slug==='github-actions'&&row.details_url?.startsWith('https://github.com/priteshpatel390-del/FPL/actions/runs/')))throw new Error('exact-head Verify Teamsheet success is absent');
          NODE
          rm -f "$response"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
      - name: Run focused Gate C and historical guard tests
        run: |
          node --test tests/api-football-gate-c.test.mjs tests/api-football-deployed-one-shot-continuation.test.mjs tests/api-football-transport-remediated-deployment-promotion.test.mjs tests/api-football-collector-activation-live-preflight.test.mjs
          test -z "$(git status --porcelain --untracked-files=all)"

  fresh-readonly-admission:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    needs: repository-gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: data-steward-readonly
      deployment: false
    outputs:
      classification: ${{ steps.handoff.outputs.classification }}
      artifact_sha256: ${{ steps.handoff.outputs.artifact_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.repository-gate.outputs.approved_sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
      - name: Reconfirm exact protected main after read-only environment admission
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)" = "$APPROVED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Prove exact existing inert Deployment, inert topology, pristine history and foundational D1 state
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
          API_FOOTBALL_GATE_C_MODE: ADMISSION
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID }}
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
          DATA_STEWARD_CLOUDFLARE_READ_TOKEN: ${{ secrets.DATA_STEWARD_CLOUDFLARE_READ_TOKEN }}
          CLOUDFLARE_TOPOLOGY_READ_TOKEN: ${{ secrets.CLOUDFLARE_REPLACEMENT_TOPOLOGY_READ_TOKEN }}
          API_FOOTBALL_GATE_C_REPORT_PATH: ${{ runner.temp }}/gate-c-admission.json
        run: node workers/api-football-collector/gate-c-readonly.mjs
      - name: Bind sanitized admission handoff
        id: handoff
        env:
          REPORT: ${{ runner.temp }}/gate-c-admission.json
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const bytes=fs.readFileSync(process.env.REPORT),report=JSON.parse(bytes);
          if(report.version!=='api-football-gate-c-admission-v1'||report.ok!==true||report.approvedSha!==process.env.APPROVED_SHA||report.classification!=='READY_FOR_GATE_C_NEW_DAY_COLLECTION'||report.retryAuthorized!==false)throw new Error('Gate C admission handoff invalid');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`classification=${report.classification}\nartifact_sha256=${createHash('sha256').update(bytes).digest('hex')}\n`);
          NODE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: api-football-gate-c-admission
          path: ${{ runner.temp }}/gate-c-admission.json
          if-no-files-found: error
          retention-days: 7

  protected-one-shot-execution:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && needs.fresh-readonly-admission.outputs.classification == 'READY_FOR_GATE_C_NEW_DAY_COLLECTION'
    needs: [repository-gate, fresh-readonly-admission]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: api-football-attended-acceptance
      deployment: false
    outputs:
      execution_artifact_sha256: ${{ steps.execution-handoff.outputs.execution_artifact_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.repository-gate.outputs.approved_sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
      - name: Reconfirm exact protected main after mutation environment admission
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)" = "$APPROVED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          name: api-football-gate-c-admission
          path: ${{ runner.temp }}/gate-c-admission
      - name: Recheck state, Deployment and zone routes, enable workers.dev, trigger once, cleanup inside executor regardless of outcome
        id: execute
        continue-on-error: true
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
          API_FOOTBALL_ATTENDED_TRIGGER_SECRET: ${{ secrets.API_FOOTBALL_ATTENDED_TRIGGER_SECRET }}
          API_FOOTBALL_GATE_C_ADMISSION_PATH: ${{ runner.temp }}/gate-c-admission/gate-c-admission.json
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.CLOUDFLARE_ACCOUNT_FINGERPRINT }}
          CLOUDFLARE_ATTENDED_READ_TOKEN: ${{ secrets.CLOUDFLARE_ATTENDED_READ_TOKEN }}
          CLOUDFLARE_ATTENDED_MUTATION_TOKEN: ${{ secrets.CLOUDFLARE_ATTENDED_MUTATION_TOKEN }}
          # Read-only Zone Read + Workers Routes Read; used only for the final pre-mutation route scan.
          CLOUDFLARE_TOPOLOGY_READ_TOKEN: ${{ secrets.CLOUDFLARE_REPLACEMENT_TOPOLOGY_READ_TOKEN }}
          EXPECTED_ARTIFACT_SHA256: ${{ needs.fresh-readonly-admission.outputs.artifact_sha256 }}
          API_FOOTBALL_GATE_C_EXECUTION_REPORT_PATH: ${{ runner.temp }}/gate-c-execution.json
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)" = "$APPROVED_SHA"
          test "$(sha256sum "$API_FOOTBALL_GATE_C_ADMISSION_PATH" | cut -d' ' -f1)" = "$EXPECTED_ARTIFACT_SHA256"
          test -z "$(git status --porcelain --untracked-files=all)"
          node workers/api-football-collector/run-gate-c.mjs
      - name: Bind sanitized execution evidence
        id: execution-handoff
        if: always()
        env:
          REPORT: ${{ runner.temp }}/gate-c-execution.json
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
        run: |
          set -euo pipefail
          test -f "$REPORT"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const bytes=fs.readFileSync(process.env.REPORT),report=JSON.parse(bytes);
          if(report.version!=='api-football-gate-c-execution-v1'||report.approvedSha!==process.env.APPROVED_SHA||
 report.retryAuthorized!==false||![0,1].includes(report.triggerRequests)||report.mutations?.createDeployment!==0||
 report.versionId!=='4171f3cf-953e-452e-9e5f-068df9a3ca47'||report.evidence?.apiFootballRequestsByExecutor!==0||
 report.evidence?.secretValuesSerialized!==0);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`execution_artifact_sha256=${createHash('sha256').update(bytes).digest('hex')}\n`);
          NODE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: api-football-gate-c-execution
          path: ${{ runner.temp }}/gate-c-execution.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve protected execution outcome
        if: steps.execute.outcome != 'success'
        run: exit 1

  final-readonly-reconciliation:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && needs.repository-gate.result == 'success' }}
    needs: [repository-gate, fresh-readonly-admission, protected-one-shot-execution]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: data-steward-readonly
      deployment: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.repository-gate.outputs.approved_sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0
      - name: Reconfirm exact protected main before independent closeout
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)" = "$APPROVED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        if: needs.protected-one-shot-execution.outputs.execution_artifact_sha256 != ''
        with:
          name: api-football-gate-c-execution
          path: ${{ runner.temp }}/gate-c-execution
      - name: Verify sanitized execution handoff
        if: needs.protected-one-shot-execution.outputs.execution_artifact_sha256 != ''
        env:
          REPORT: ${{ runner.temp }}/gate-c-execution/gate-c-execution.json
          EXPECTED_SHA256: ${{ needs.protected-one-shot-execution.outputs.execution_artifact_sha256 }}
        run: |
          set -euo pipefail
          test "$(sha256sum "$REPORT" | cut -d' ' -f1)" = "$EXPECTED_SHA256"
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        if: needs.fresh-readonly-admission.outputs.classification == 'READY_FOR_GATE_C_NEW_DAY_COLLECTION'
        with:
          name: api-football-gate-c-admission
          path: ${{ runner.temp }}/gate-c-admission
      - name: Verify Gate C admission handoff in independent reconciliation
        if: needs.fresh-readonly-admission.outputs.classification == 'READY_FOR_GATE_C_NEW_DAY_COLLECTION'
        env:
          REPORT: ${{ runner.temp }}/gate-c-admission/gate-c-admission.json
          EXPECTED_SHA256: ${{ needs.fresh-readonly-admission.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          test "$(sha256sum "$REPORT" | cut -d' ' -f1)" = "$EXPECTED_SHA256"
      - name: Independently reconcile collection, topology and retained Deployment state
        id: reconcile
        continue-on-error: true
        env:
          APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
          API_FOOTBALL_GATE_C_MODE: RECONCILIATION
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DATA_STEWARD_CLOUDFLARE_ACCOUNT_ID }}
          DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT: ${{ vars.DATA_STEWARD_CLOUDFLARE_ACCOUNT_FINGERPRINT }}
          DATA_STEWARD_CLOUDFLARE_READ_TOKEN: ${{ secrets.DATA_STEWARD_CLOUDFLARE_READ_TOKEN }}
          CLOUDFLARE_TOPOLOGY_READ_TOKEN: ${{ secrets.CLOUDFLARE_REPLACEMENT_TOPOLOGY_READ_TOKEN }}
          API_FOOTBALL_GATE_C_REPORT_PATH: ${{ runner.temp }}/gate-c-reconciliation.json
          API_FOOTBALL_GATE_C_EXECUTION_PATH: ${{ needs.protected-one-shot-execution.outputs.execution_artifact_sha256 != '' && format('{0}/gate-c-execution/gate-c-execution.json', runner.temp) || '' }}
          API_FOOTBALL_GATE_C_ADMISSION_PATH: ${{ runner.temp }}/gate-c-admission/gate-c-admission.json
        run: node workers/api-football-collector/gate-c-readonly.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: api-football-gate-c-reconciliation
          path: ${{ runner.temp }}/gate-c-reconciliation.json
          if-no-files-found: error
          retention-days: 7
      - name: Require independently reconciled success
        if: steps.reconcile.outcome != 'success'
        run: exit 1
