name: One-time Leagues deploy sync

on:
  push:
    branches:
      - agent/leagues-preseason-deploy-sync

permissions:
  contents: write

jobs:
  sync-generated-output:
    name: Regenerate committed deployable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out deployment-sync branch
        uses: actions/checkout@v4
        with:
          ref: agent/leagues-preseason-deploy-sync
          fetch-depth: 0

      - name: Build exact source revision
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          set -eu
          node build.mjs
          cmp dist/index.html index.html

      - name: Commit generated outputs and remove one-time workflow
        run: |
          set -eu
          rm .github/workflows/one-time-leagues-deploy-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dist/app.bundle.js dist/index.html dist/manifest.json .github/workflows/one-time-leagues-deploy-sync.yml
          git diff --cached --quiet && { echo "No generated changes to commit"; exit 1; }
          git commit -m "Regenerate deployable for pre-season league rank fix"
          git push origin HEAD:agent/leagues-preseason-deploy-sync
