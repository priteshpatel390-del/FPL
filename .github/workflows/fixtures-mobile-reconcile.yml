name: Fixtures mobile presentation reconciliation

on:
  push:
    branches:
      - agent/fixtures-mobile-scroll-presentation

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out exact branch revision
        uses: actions/checkout@v4
        with:
          ref: agent/fixtures-mobile-scroll-presentation
          fetch-depth: 0

      - name: Apply approved source, regression and documentation changes
        run: |
          set -euo pipefail
          python .github/fixtures-mobile-reconcile.py

      - name: Run complete suite and record exact branch count
        run: |
          set -euo pipefail
          ./run-tests.sh | tee /tmp/fixtures-tests-first.log
          tests=$(awk '$1=="#" && $2=="tests" {v=$3} END {print v}' /tmp/fixtures-tests-first.log)
          pass=$(awk '$1=="#" && $2=="pass" {v=$3} END {print v}' /tmp/fixtures-tests-first.log)
          fail=$(awk '$1=="#" && $2=="fail" {v=$3} END {print v}' /tmp/fixtures-tests-first.log)
          skipped=$(awk '$1=="#" && $2=="skipped" {v=$3} END {print v}' /tmp/fixtures-tests-first.log)
          cancelled=$(awk '$1=="#" && $2=="cancelled" {v=$3} END {print v}' /tmp/fixtures-tests-first.log)
          test -n "$tests" && test -n "$pass" && test -n "$fail" && test -n "$skipped" && test -n "$cancelled"
          test "$tests" = "$pass"
          test "$fail" = "0"
          summary="**Branch verification:** ${pass} passed, ${fail} failed, ${skipped} skipped, ${cancelled} cancelled."
          python - "$summary" <<'PY'
          from pathlib import Path
          import sys
          summary=sys.argv[1]
          for name in ['docs/FIXTURES-MOBILE-SCROLL-FOLLOW-UP.md','docs/TESTING.md']:
              p=Path(name)
              text=p.read_text()
              count=text.count('__VERIFICATION__')
              if count != 1:
                  raise SystemExit(f'{name}: expected one verification placeholder, found {count}')
              p.write_text(text.replace('__VERIFICATION__',summary))
          PY

      - name: Re-run complete suite on final source and documentation tree
        run: |
          set -euo pipefail
          ./run-tests.sh | tee /tmp/fixtures-tests-final.log
          tests=$(awk '$1=="#" && $2=="tests" {v=$3} END {print v}' /tmp/fixtures-tests-final.log)
          pass=$(awk '$1=="#" && $2=="pass" {v=$3} END {print v}' /tmp/fixtures-tests-final.log)
          fail=$(awk '$1=="#" && $2=="fail" {v=$3} END {print v}' /tmp/fixtures-tests-final.log)
          skipped=$(awk '$1=="#" && $2=="skipped" {v=$3} END {print v}' /tmp/fixtures-tests-final.log)
          cancelled=$(awk '$1=="#" && $2=="cancelled" {v=$3} END {print v}' /tmp/fixtures-tests-final.log)
          test -n "$tests" && test "$tests" = "$pass"
          test "$fail" = "0" && test "$skipped" = "0" && test "$cancelled" = "0"

      - name: Verify deterministic production builds
        run: |
          set -euo pipefail
          node build.mjs
          rm -rf /tmp/fixtures-build-a
          mkdir -p /tmp/fixtures-build-a/dist
          cp dist/app.bundle.js /tmp/fixtures-build-a/dist/app.bundle.js
          cp dist/index.html /tmp/fixtures-build-a/dist/index.html
          cp dist/manifest.json /tmp/fixtures-build-a/dist/manifest.json
          cp index.html /tmp/fixtures-build-a/index.html
          node build.mjs
          cmp /tmp/fixtures-build-a/dist/app.bundle.js dist/app.bundle.js
          cmp /tmp/fixtures-build-a/dist/index.html dist/index.html
          cmp /tmp/fixtures-build-a/dist/manifest.json dist/manifest.json
          cmp /tmp/fixtures-build-a/index.html index.html
          cmp dist/index.html index.html

      - name: Commit only approved final branch files and self-remove tooling
        run: |
          set -euo pipefail
          rm -f .github/fixtures-mobile-reconcile.py .github/workflows/fixtures-mobile-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --name-only | sort > /tmp/fixtures-files.txt
          cat > /tmp/fixtures-allowed.txt <<'EOF'
          CLAUDE.md
          app.html
          dist/app.bundle.js
          dist/index.html
          dist/manifest.json
          docs/FIXTURES-MOBILE-SCROLL-FOLLOW-UP.md
          docs/KNOWN_LIMITATIONS.md
          docs/ROADMAP.md
          docs/TESTING.md
          index.html
          src/ui/views.mjs
          tests/fixtures-mobile-presentation.test.mjs
          EOF
          sort -o /tmp/fixtures-allowed.txt /tmp/fixtures-allowed.txt
          diff -u /tmp/fixtures-allowed.txt /tmp/fixtures-files.txt
          git commit -m 'Fix Fixtures mobile horizontal scroll presentation'
          git push origin HEAD:agent/fixtures-mobile-scroll-presentation
