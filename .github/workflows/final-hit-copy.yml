name: Final transfer copy verification

on:
  push:
    branches:
      - agent/transfers-exact-continuation
    paths:
      - .github/workflows/final-hit-copy.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out approved PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/transfers-exact-continuation
          fetch-depth: 0

      - name: Apply approved copy, tests and records
        shell: bash
        run: |
          python -m py_compile .github/scripts/final_hit_copy.py
          python .github/scripts/final_hit_copy.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui/transfer-optimiser-view.mjs tests/transfer-baseline-presentation.test.mjs CLAUDE.md docs/DECISIONS.md docs/TESTING.md docs/PROJECT_CONTEXT.md docs/ROADMAP.md docs/KNOWN_LIMITATIONS.md docs/CHANGELOG.md docs/TRANSFERS-EXACT-PERFORMANCE.md
          git diff --cached --check
          git commit -m 'Clarify zero-hit transfer copy'
          git push origin HEAD:agent/transfers-exact-continuation
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run complete repository gate
        shell: bash
        run: |
          BUILD_COMMIT="$SOURCE_COMMIT" ./run-tests.sh 2>&1 | tee /tmp/final-copy-tests.log
          TEST_COUNT=$(awk '/^# tests /{value=$3} END{print value}' /tmp/final-copy-tests.log)
          test "$TEST_COUNT" = "613"
          test "$(awk '/^# pass /{value=$3} END{print value}' /tmp/final-copy-tests.log)" = "613"
          test "$(awk '/^# fail /{value=$3} END{print value}' /tmp/final-copy-tests.log)" = "0"
          test "$(awk '/^# skipped /{value=$3} END{print value}' /tmp/final-copy-tests.log)" = "0"
          cmp dist/index.html index.html

      - name: Verify deterministic production builds
        shell: bash
        run: |
          mkdir -p /tmp/build-one/dist
          cp dist/index.html dist/app.bundle.js dist/manifest.json /tmp/build-one/dist/
          cp index.html /tmp/build-one/index.html
          BUILD_COMMIT="$SOURCE_COMMIT" node build.mjs
          cmp /tmp/build-one/dist/index.html dist/index.html
          cmp /tmp/build-one/dist/app.bundle.js dist/app.bundle.js
          cmp /tmp/build-one/dist/manifest.json dist/manifest.json
          cmp /tmp/build-one/index.html index.html
          cmp dist/index.html index.html
          sha256sum dist/index.html dist/app.bundle.js dist/manifest.json index.html

      - name: Commit verified generated files
        shell: bash
        run: |
          git add dist/index.html dist/app.bundle.js dist/manifest.json index.html
          git diff --cached --check
          git commit -m 'Build verified zero-hit transfer copy'
          git push origin HEAD:agent/transfers-exact-continuation
          echo "FINAL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report verified commits
        shell: bash
        run: |
          echo "Source commit: $SOURCE_COMMIT"
          echo "Generated head: $FINAL_COMMIT"
