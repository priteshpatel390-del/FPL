name: Fixtures GW38 horizon reconciliation

on:
  push:
    branches:
      - agent/fixtures-gw38-horizon

permissions:
  contents: write

concurrency:
  group: fixtures-gw38-horizon-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fixtures-gw38-horizon
          fetch-depth: 0

      - name: Confirm approved baseline
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 01c16588b63bf41b099adc64b6a1c9044eba9eec HEAD
          test "$(git branch --show-current)" = "agent/fixtures-gw38-horizon"

      - name: Apply approved source and test changes
        run: |
          set -euo pipefail
          python3 .github/fixtures-gw38-reconcile.py apply
          git diff --check

      - name: Run complete test suite
        run: |
          set -euo pipefail
          ./run-tests.sh 2>&1 | tee /tmp/fixtures-gw38-tests.txt
          grep -E '^# fail 0$' /tmp/fixtures-gw38-tests.txt
          grep -E '^# cancelled 0$' /tmp/fixtures-gw38-tests.txt
          grep -E '^# skipped 0$' /tmp/fixtures-gw38-tests.txt

      - name: Record verified documentation
        run: |
          set -euo pipefail
          TESTS="$(awk '/^# tests /{v=$3} END{print v}' /tmp/fixtures-gw38-tests.txt)"
          PASS="$(awk '/^# pass /{v=$3} END{print v}' /tmp/fixtures-gw38-tests.txt)"
          test -n "$TESTS"
          test "$TESTS" = "$PASS"
          export TESTS PASS
          python3 .github/fixtures-gw38-reconcile.py docs
          git diff --check

      - name: Verify deterministic production build
        run: |
          set -euo pipefail
          node build.mjs
          rm -rf /tmp/fixtures-gw38-build-a
          mkdir -p /tmp/fixtures-gw38-build-a/dist
          cp dist/app.bundle.js /tmp/fixtures-gw38-build-a/dist/app.bundle.js
          cp dist/index.html /tmp/fixtures-gw38-build-a/dist/index.html
          cp dist/manifest.json /tmp/fixtures-gw38-build-a/dist/manifest.json
          cp index.html /tmp/fixtures-gw38-build-a/index.html
          node build.mjs
          cmp /tmp/fixtures-gw38-build-a/dist/app.bundle.js dist/app.bundle.js
          cmp /tmp/fixtures-gw38-build-a/dist/index.html dist/index.html
          cmp /tmp/fixtures-gw38-build-a/dist/manifest.json dist/manifest.json
          cmp /tmp/fixtures-gw38-build-a/index.html index.html
          cmp dist/index.html index.html
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const m=JSON.parse(readFileSync('dist/manifest.json','utf8')); if(m.commit!==process.env.BUILD_COMMIT) throw new Error('manifest commit mismatch before reconciliation commit');"

      - name: Guard approved scope and commit
        run: |
          set -euo pipefail
          git rm .github/workflows/fixtures-gw38-reconcile.yml .github/fixtures-gw38-reconcile.py
          python3 - <<'PY'
          import subprocess
          allowed = {
            '.github/workflows/fixtures-gw38-reconcile.yml', '.github/fixtures-gw38-reconcile.py',
            'CLAUDE.md', 'app.html', 'src/ui/views.mjs',
            'tests/unit.test.mjs', 'tests/fixtures-mobile-presentation.test.mjs',
            'docs/FIXTURES-MOBILE-SCROLL-FOLLOW-UP.md', 'docs/TESTING.md', 'docs/ROADMAP.md',
            'docs/KNOWN_LIMITATIONS.md', 'docs/PROJECTION_MODEL.md',
            'dist/app.bundle.js', 'dist/index.html', 'dist/manifest.json', 'index.html'
          }
          changed = {line.strip() for line in subprocess.check_output(['git','diff','--name-only','HEAD']).decode().splitlines() if line.strip()}
          unexpected = changed - allowed
          required = {'app.html','src/ui/views.mjs','tests/unit.test.mjs','tests/fixtures-mobile-presentation.test.mjs','dist/app.bundle.js','dist/index.html','dist/manifest.json','index.html'}
          missing = required - changed
          if unexpected:
              raise SystemExit('unexpected changed paths: ' + ', '.join(sorted(unexpected)))
          if missing:
              raise SystemExit('required changed paths missing: ' + ', '.join(sorted(missing)))
          print('Approved changed paths:')
          for path in sorted(changed):
              print('-', path)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Extend Fixtures horizon through GW38'
          git push origin HEAD:agent/fixtures-gw38-horizon
