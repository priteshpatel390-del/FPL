name: Stage 9.2 implement

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage9-2-pitch-shirts
          fetch-depth: 0
      - name: Apply approved Stage 9.2 implementation
        run: |
          if [ -f src/ui/team-pitch.mjs ]; then
            echo 'Stage 9.2 source already present; no mutation required.'
            exit 0
          fi

          cat > src/ui/team-pitch.mjs <<'EOF'
          // Stage 9.2 — visual-only pitch layout and repository-owned shirt palettes.
          // No squad selection, projection or captaincy rule lives in this module.

          const TEAM_PITCH_VISUAL_ORDER = Object.freeze([4, 3, 2, 1]);
          const TEAM_PITCH_PATTERNS = Object.freeze(['solid','sleeves','stripes','halves','hoops','sash','pinstripes']);
          const TEAM_PITCH_PRESETS = Object.freeze({
            ARS:{primary:'#D71920',secondary:'#FFFFFF',accent:'#162A4C',ink:'#FFFFFF',pattern:'sleeves'},
            AVL:{primary:'#6A1735',secondary:'#9ED8F5',accent:'#F5D36A',ink:'#FFFFFF',pattern:'sleeves'},
            BOU:{primary:'#D71920',secondary:'#121212',accent:'#FFFFFF',ink:'#FFFFFF',pattern:'stripes'},
            BRE:{primary:'#D71920',secondary:'#FFFFFF',accent:'#111111',ink:'#111111',pattern:'stripes'},
            BHA:{primary:'#1764B0',secondary:'#FFFFFF',accent:'#F4D35E',ink:'#111111',pattern:'stripes'},
            BUR:{primary:'#6A1735',secondary:'#9ED8F5',accent:'#FFFFFF',ink:'#FFFFFF',pattern:'sleeves'},
            CHE:{primary:'#1746A2',secondary:'#1746A2',accent:'#FFFFFF',ink:'#FFFFFF',pattern:'solid'},
            CRY:{primary:'#D71920',secondary:'#1746A2',accent:'#F4D35E',ink:'#FFFFFF',pattern:'stripes'},
            EVE:{primary:'#1746A2',secondary:'#FFFFFF',accent:'#102B5C',ink:'#FFFFFF',pattern:'solid'},
            FUL:{primary:'#FFFFFF',secondary:'#111111',accent:'#D71920',ink:'#111111',pattern:'solid'},
            LEE:{primary:'#FFFFFF',secondary:'#1746A2',accent:'#F4D35E',ink:'#111111',pattern:'solid'},
            LIV:{primary:'#B30D2F',secondary:'#B30D2F',accent:'#F4D35E',ink:'#FFFFFF',pattern:'solid'},
            MCI:{primary:'#7CC7EC',secondary:'#7CC7EC',accent:'#162A4C',ink:'#162A4C',pattern:'solid'},
            MUN:{primary:'#D71920',secondary:'#111111',accent:'#FFFFFF',ink:'#FFFFFF',pattern:'solid'},
            NEW:{primary:'#111111',secondary:'#FFFFFF',accent:'#3D7DB8',ink:'#FFFFFF',pattern:'stripes'},
            NFO:{primary:'#D71920',secondary:'#D71920',accent:'#FFFFFF',ink:'#FFFFFF',pattern:'solid'},
            SUN:{primary:'#D71920',secondary:'#FFFFFF',accent:'#111111',ink:'#111111',pattern:'stripes'},
            TOT:{primary:'#FFFFFF',secondary:'#162A4C',accent:'#F4D35E',ink:'#162A4C',pattern:'solid'},
            WHU:{primary:'#6A1735',secondary:'#9ED8F5',accent:'#FFFFFF',ink:'#FFFFFF',pattern:'sleeves'},
            WOL:{primary:'#F2A900',secondary:'#111111',accent:'#FFFFFF',ink:'#111111',pattern:'solid'},
            LEI:{primary:'#1746A2',secondary:'#FFFFFF',accent:'#F4D35E',ink:'#FFFFFF',pattern:'solid'},
            IPS:{primary:'#1746A2',secondary:'#FFFFFF',accent:'#D71920',ink:'#FFFFFF',pattern:'stripes'},
            SOU:{primary:'#D71920',secondary:'#FFFFFF',accent:'#111111',ink:'#111111',pattern:'stripes'}
          });
          const TEAM_PITCH_FALLBACKS = Object.freeze([
            {primary:'#315C8C',secondary:'#FFFFFF',accent:'#E6B84A',ink:'#FFFFFF',pattern:'solid'},
            {primary:'#7A1E38',secondary:'#D8EEF8',accent:'#FFFFFF',ink:'#FFFFFF',pattern:'sleeves'},
            {primary:'#1F5C3A',secondary:'#FFFFFF',accent:'#E6B84A',ink:'#FFFFFF',pattern:'halves'},
            {primary:'#20262B',secondary:'#F0C24B',accent:'#FFFFFF',ink:'#FFFFFF',pattern:'sash'},
            {primary:'#6C4BA6',secondary:'#FFFFFF',accent:'#A7E0D1',ink:'#FFFFFF',pattern:'pinstripes'},
            {primary:'#A13A2A',secondary:'#F5E7D4',accent:'#152A40',ink:'#FFFFFF',pattern:'hoops'}
          ]);

          function teamPitchNormaliseCode(team){
            return String(team?.short_name || team?.name || '')
              .toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,3) || 'CLB';
          }

          function teamPitchPalette(team){
            const code = teamPitchNormaliseCode(team);
            const preset = TEAM_PITCH_PRESETS[code];
            if(preset) return {code, ...preset};
            let seed = Number(team?.id) || 0;
            for(const ch of code) seed = ((seed * 31) + ch.charCodeAt(0)) >>> 0;
            return {code, ...TEAM_PITCH_FALLBACKS[seed % TEAM_PITCH_FALLBACKS.length]};
          }

          function teamPitchLines(starters){
            const source = Array.isArray(starters) ? starters : [];
            return TEAM_PITCH_VISUAL_ORDER.map(position => ({
              position,
              players: source.filter(slot => Number(slot?.p?.element_type) === position)
            })).filter(line => line.players.length);
          }

          function teamPitchCaptaincy(ranked){
            const ids = [];
            for(const item of Array.isArray(ranked) ? ranked : []){
              const id = item?.s?.p?.id;
              if(id != null && !ids.includes(id)) ids.push(id);
              if(ids.length === 2) break;
            }
            return {captainId:ids[0] ?? null, viceId:ids[1] ?? null};
          }

          export { TEAM_PITCH_PATTERNS, teamPitchNormaliseCode, teamPitchPalette, teamPitchLines, teamPitchCaptaincy };
          EOF

          cat > tests/team-pitch.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { TEAM_PITCH_PATTERNS, teamPitchPalette, teamPitchLines, teamPitchCaptaincy } from '../src/ui/team-pitch.mjs';

          test('pitch lines preserve every starter once in football visual order', () => {
            const starters = [
              {p:{id:1,element_type:1}}, {p:{id:2,element_type:2}}, {p:{id:3,element_type:2}},
              {p:{id:4,element_type:3}}, {p:{id:5,element_type:3}}, {p:{id:6,element_type:4}}
            ];
            const lines = teamPitchLines(starters);
            assert.deepEqual(lines.map(line => line.position), [4,3,2,1]);
            assert.deepEqual(lines.flatMap(line => line.players.map(slot => slot.p.id)).sort((a,b)=>a-b), [1,2,3,4,5,6]);
          });

          test('captaincy uses the first two distinct ranked starters', () => {
            const ranked = [
              {s:{p:{id:10}}}, {s:{p:{id:10}}}, {s:{p:{id:11}}}, {s:{p:{id:12}}}
            ];
            assert.deepEqual(teamPitchCaptaincy(ranked), {captainId:10, viceId:11});
          });

          test('known club palette is repository owned and stable', () => {
            assert.deepEqual(teamPitchPalette({id:1,short_name:'ARS'}), {
              code:'ARS', primary:'#D71920', secondary:'#FFFFFF', accent:'#162A4C', ink:'#FFFFFF', pattern:'sleeves'
            });
          });

          test('unknown club palette falls back deterministically to an approved pattern', () => {
            const a = teamPitchPalette({id:77,short_name:'XYZ'});
            const b = teamPitchPalette({id:77,short_name:'XYZ'});
            assert.deepEqual(a,b);
            assert.ok(TEAM_PITCH_PATTERNS.includes(a.pattern));
            assert.match(a.primary,/^#[0-9A-F]{6}$/i);
          });
          EOF

          python - <<'PY'
          from pathlib import Path
          import re

          build = Path('build.mjs')
          text = build.read_text()
          old = "'src/ui/app-shell.mjs', 'src/ui/views.mjs', 'src/ui/transfer-optimiser-view.mjs'"
          new = "'src/ui/app-shell.mjs', 'src/ui/team-pitch.mjs', 'src/ui/views.mjs', 'src/ui/transfer-optimiser-view.mjs'"
          assert old in text
          build.write_text(text.replace(old,new))

          app = Path('app.html')
          html = app.read_text()
          old_css = """/* squad pitch */
          .pitchrow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
          .pcard{border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:82px;text-align:center;background:#fff;font-size:11.5px}
          .pcard.cap{border-color:var(--pitch);border-width:2px}
          .pcard.warn{border-color:var(--claret);background:#FCF4F5}
          .pcard b{display:block;font-size:12px}
          .pcard .x{font-family:'IBM Plex Mono',monospace;color:var(--pitch);font-weight:600}
          .benchband{background:#F2F4EF;border-radius:8px;padding:8px;margin-top:6px}
          """
          new_css = """/* team pitch */
          .team-summary{display:grid;grid-template-columns:minmax(116px,.9fr) 1.7fr;gap:8px;margin-bottom:12px}
          .team-score{background:var(--ink);color:#fff;border-radius:16px;padding:13px 14px;display:flex;flex-direction:column;justify-content:center}
          .team-score .label,.team-fact .label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
          .team-score .value{font-family:'Bricolage Grotesque',sans-serif;font-size:31px;font-weight:800;line-height:1;margin-top:4px}
          .team-score .unit{font-size:11px;color:#B9C9BF;margin-top:3px}
          .team-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
          .team-fact{background:#F7F9F5;border:1px solid var(--line);border-radius:12px;padding:10px 8px;min-width:0}
          .team-fact .label{display:block;color:var(--ink-soft);opacity:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .team-fact .value{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:16px;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .team-entry{margin:0 0 10px}
          .team-stage{max-width:640px;margin:14px auto 0}
          .team-pitch{position:relative;isolation:isolate;overflow:hidden;height:clamp(500px,135vw,680px);border-radius:22px;padding:22px 8px 18px;background:linear-gradient(90deg,rgba(255,255,255,.035) 0 50%,rgba(0,0,0,.025) 50% 100%),linear-gradient(#2E7A4D,#1F6540);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 16px 34px -24px rgba(20,38,28,.7)}
          .team-pitch:before{content:"";position:absolute;inset:12px;border:1px solid rgba(255,255,255,.48);border-radius:13px;pointer-events:none}
          .team-pitch:after{content:"";position:absolute;left:12px;right:12px;top:50%;border-top:1px solid rgba(255,255,255,.42);pointer-events:none}
          .pitch-mark{position:absolute;border:1px solid rgba(255,255,255,.42);pointer-events:none}
          .pitch-centre-circle{width:92px;height:92px;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
          .pitch-box{left:27%;right:27%;height:78px}
          .pitch-box-top{top:12px;border-top:0}
          .pitch-box-bottom{bottom:12px;border-bottom:0}
          .pitch-formation{position:relative;z-index:2;height:100%;display:grid;grid-template-rows:repeat(4,minmax(0,1fr));align-items:center;gap:4px}
          .pitch-line{display:flex;justify-content:space-evenly;align-items:center;gap:3px;padding:0 2px;min-width:0}
          .pitch-player{position:relative;display:flex;flex:1 1 0;min-width:0;max-width:82px;flex-direction:column;align-items:center;text-align:center}
          .shirt-wrap{position:relative;height:44px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:-2px;z-index:2}
          .club-shirt{--shirt-primary:#315C8C;--shirt-secondary:#FFFFFF;--shirt-accent:#E6B84A;--shirt-ink:#FFFFFF;position:relative;display:block;width:34px;height:39px;border-radius:8px 8px 10px 10px;background:var(--shirt-primary);box-shadow:inset 0 5px 0 -3px var(--shirt-accent),0 5px 9px rgba(7,27,17,.25)}
          .club-shirt:before,.club-shirt:after{content:"";position:absolute;top:3px;width:11px;height:16px;background:var(--shirt-primary);z-index:-1}
          .club-shirt:before{left:-7px;border-radius:7px 2px 4px 5px;transform:skewY(15deg)}
          .club-shirt:after{right:-7px;border-radius:2px 7px 5px 4px;transform:skewY(-15deg)}
          .club-shirt.pattern-sleeves:before,.club-shirt.pattern-sleeves:after{background:var(--shirt-secondary)}
          .club-shirt.pattern-stripes{background:repeating-linear-gradient(90deg,var(--shirt-primary) 0 7px,var(--shirt-secondary) 7px 14px)}
          .club-shirt.pattern-halves{background:linear-gradient(90deg,var(--shirt-primary) 0 50%,var(--shirt-secondary) 50%)}
          .club-shirt.pattern-hoops{background:repeating-linear-gradient(0deg,var(--shirt-primary) 0 7px,var(--shirt-secondary) 7px 14px)}
          .club-shirt.pattern-sash{background:linear-gradient(130deg,var(--shirt-primary) 0 40%,var(--shirt-secondary) 40% 58%,var(--shirt-primary) 58%)}
          .club-shirt.pattern-pinstripes{background:repeating-linear-gradient(90deg,var(--shirt-primary) 0 5px,var(--shirt-secondary) 5px 7px)}
          .club-shirt-code{position:absolute;left:3px;right:3px;bottom:7px;overflow:hidden;color:var(--shirt-ink);font-family:'IBM Plex Mono',monospace;font-size:7px;font-weight:600;line-height:1;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.35)}
          .captain-badge{position:absolute;top:-3px;right:-13px;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;border:2px solid #fff;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;box-shadow:0 3px 8px rgba(7,27,17,.3)}
          .captain-badge.vice{background:#fff;color:var(--ink);border-color:var(--ink)}
          .pitch-copy{position:relative;width:100%;min-width:0;background:rgba(255,255,255,.95);color:var(--ink);border-radius:8px;padding:4px 3px 5px;box-shadow:0 4px 10px rgba(7,27,17,.18)}
          .pitch-name{font-size:10px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .pitch-meta{font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--ink-soft);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
          .pitch-xp{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--pitch);font-weight:600;line-height:1.2;margin-top:2px}
          .pitch-player.warn .club-shirt{outline:2px solid #FFD3D9;outline-offset:2px}
          .pitch-player.warn .pitch-copy{box-shadow:0 0 0 2px #F0AEB9,0 4px 10px rgba(7,27,17,.18)}
          .team-bench{background:#F7F9F5;border:1px solid var(--line);border-radius:16px;padding:10px;margin-top:10px}
          .bench-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
          .bench-head strong{font-family:'Bricolage Grotesque',sans-serif;font-size:14px}
          .bench-head span{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
          .bench-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
          .bench-player{max-width:none}
          .bench-player .shirt-wrap{height:38px;transform:scale(.88);transform-origin:center bottom}
          .bench-player .pitch-copy{box-shadow:none;border:1px solid var(--line);background:#fff}
          .section-title{margin:18px 0 7px}
          @media(max-width:380px){
            .team-summary{grid-template-columns:106px 1fr}.team-score{padding:11px}.team-score .value{font-size:27px}
            .team-fact{padding:8px 5px}.team-fact .label{font-size:8px}.team-fact .value{font-size:14px}
            .team-pitch{height:500px;padding-left:5px;padding-right:5px}.pitch-player{max-width:66px}.club-shirt{width:31px;height:36px}
            .shirt-wrap{height:40px}.pitch-name{font-size:9px}.pitch-meta{font-size:7.5px}.pitch-xp{font-size:8.5px}
          }
          @media(min-width:720px){
            .team-pitch{height:680px;padding:30px 16px 24px}.pitch-player{max-width:96px}.club-shirt{width:42px;height:48px}
            .shirt-wrap{height:54px}.pitch-name{font-size:11px}.pitch-meta{font-size:9px}.pitch-xp{font-size:10px}
          }
          """
          assert old_css in html
          html = html.replace(old_css,new_css)
          old_header = """    <span class="eyebrow">Your 15</span>
              <h2>Squad review</h2>
              <p class="hint">Availability, price moves, best XI by projected points and the captain call.</p>"""
          new_header = """    <span class="eyebrow">Gameweek plan</span>
              <h2>Team</h2>
              <p class="hint">Your model-selected XI, captaincy and bench on one decision-first pitch.</p>"""
          assert old_header in html
          app.write_text(html.replace(old_header,new_header))

          views = Path('src/ui/views.mjs')
          js = views.read_text()
          pattern = re.compile(r"function renderSquad\(\)\{.*?\n\}\n\n/\* ---------------------------------------------------------------------\n   VIEW — TRANSFER PLANNER", re.S)
          replacement = r'''function renderSquad(){
            const out = $('squadOut'), squad = mySquad();
            if(!squad.length){
              setChildren(out,elNode('div',{class:'empty'},elNode('strong',{},'No squad yet'),
                S.entry ? ['Team found: ',elNode('b',{},S.entry.name),'. FPL only publishes picks once a gameweek is under way — until then, build your 15 by hand below and everything still works.']
                  : 'Add your team ID above, or build your 15 by hand below.'));
              return;
            }
            const gw=S.nextGW, xi=bestXI(squad,gw), nodes=[];
            nodes.push(elNode('div',{class:'team-summary'},
              elNode('div',{class:'team-score'},elNode('span',{class:'label'},`Projected GW${gw}`),elNode('span',{class:'value'},fmt1(xi.tot)),elNode('span',{class:'unit'},'expected points')),
              elNode('div',{class:'team-facts'},
                elNode('div',{class:'team-fact'},elNode('span',{class:'label'},'Shape'),elNode('span',{class:'value'},xi.shape)),
                elNode('div',{class:'team-fact'},elNode('span',{class:'label'},'Value'),elNode('span',{class:'value'},`£${fmt1(squad.reduce((a,s)=>a+s.p.now_cost,0)/10)}m`)),
                elNode('div',{class:'team-fact'},elNode('span',{class:'label'},'Free transfers'),elNode('span',{class:'value'},num($('ftCount').value))))));
            if(S.entry) nodes.push(elNode('p',{class:'status team-entry'},`${S.entry.name} · ${S.entry.player_first_name||''} ${S.entry.player_last_name||''} · OR ${(S.entry.summary_overall_rank||0).toLocaleString('en-GB')}`));

            const problems=[];
            squad.forEach(({p})=>{
              let tail=null;
              if(['i','u','s','n'].includes(p.status)) tail=[' unavailable'];
              else if(p.status==='d') tail=[` doubtful ${p.chance_of_playing_next_round ?? '?'}%`];
              else if(priceMomentum(p)==='falling') tail=[' is being sold heavily — a price fall looks likely'];
              if(tail){ if(p.news) tail.push(` — ${p.news} `,elNode('span',{class:'flag dark'},newsAge(p))); problems.push([elNode('b',{},p.web_name),tail]); }
            });
            const blanks=squad.filter(({p})=>(teamFixtures(p.team,gw,1)[0]||[]).length===0);
            if(blanks.length) problems.push([elNode('b',{},blanks.map(b=>b.p.web_name).join(', ')),` ${blanks.length>1?'have':'has'} no fixture in GW${gw}`]);
            if(problems.length){ const n=noteNode('bad',elNode('b',{},'Needs attention')); problems.forEach(p=>n.append(elNode('br'),...p)); nodes.push(n); }
            else nodes.push(noteNode('good','No injuries, suspensions, blanks or price falls in your 15. Nothing forces a transfer this week.'));

            const capRank=xi.xi.map(s=>({s,x:xpOf(s.p,gw,1).total,own:num(s.p.selected_by_percent)})).sort((a,b)=>b.x-a.x);
            const captaincy=teamPitchCaptaincy(capRank);
            const fixtureLabel=p=>{
              const games=teamFixtures(p.team,gw,1)[0]||[];
              return games.length ? games.map(g=>`${g.opp.short_name} ${g.home?'H':'A'}`).join(' + ') : 'Blank';
            };
            const playerNode=(slot,benchIndex=null)=>{
              const p=slot.p, team=S.teams[p.team], palette=teamPitchPalette(team);
              const role=p.id===captaincy.captainId?'captain':p.id===captaincy.viceId?'vice':null;
              const bad=availability(p)<1;
              const fixture=fixtureLabel(p), projected=fmt1(xpOf(p,gw,1).total);
              const label=benchIndex==null?p.web_name:`${benchIndex}. ${p.web_name}`;
              const style=`--shirt-primary:${palette.primary};--shirt-secondary:${palette.secondary};--shirt-accent:${palette.accent};--shirt-ink:${palette.ink}`;
              return elNode('div',{class:`pitch-player${benchIndex==null?'':' bench-player'}${bad?' warn':''}`,
                'aria-label':`${label}, ${fixture}, ${projected} expected points${role==='captain'?', captain':role==='vice'?', vice-captain':''}`},
                elNode('div',{class:'shirt-wrap'},
                  elNode('span',{class:`club-shirt pattern-${palette.pattern}`,style,'aria-hidden':'true'},elNode('span',{class:'club-shirt-code'},palette.code)),
                  role?elNode('span',{class:`captain-badge${role==='vice'?' vice':''}`},role==='captain'?'C':'VC'):null),
                elNode('div',{class:'pitch-copy'},elNode('div',{class:'pitch-name'},label),elNode('div',{class:'pitch-meta'},fixture),elNode('div',{class:'pitch-xp'},`${projected} xP`)));
            };
            const formation=elNode('div',{class:'pitch-formation'},teamPitchLines(xi.xi).map(line=>
              elNode('div',{class:`pitch-line position-${line.position}`},line.players.map(slot=>playerNode(slot)))));
            const pitch=elNode('section',{class:'team-pitch','aria-label':`Model-selected starting eleven for Gameweek ${gw}`},
              elNode('span',{class:'pitch-mark pitch-centre-circle','aria-hidden':'true'}),
              elNode('span',{class:'pitch-mark pitch-box pitch-box-top','aria-hidden':'true'}),
              elNode('span',{class:'pitch-mark pitch-box pitch-box-bottom','aria-hidden':'true'}),formation);
            const bench=elNode('section',{class:'team-bench','aria-label':'Bench order'},
              elNode('div',{class:'bench-head'},elNode('strong',{},'Bench'),elNode('span',{},'Auto-sub order')),
              elNode('div',{class:'bench-grid'},xi.bench.map((slot,index)=>playerNode(slot,index+1))));
            nodes.push(elNode('div',{class:'team-stage'},pitch,bench));

            if(capRank.length){
              const c1=capRank[0], c2=capRank[1], grid=elNode('div',{class:'capgrid'});
              nodes.push(elNode('h3',{class:'section-title'},'Captaincy ranking'),grid);
              capRank.slice(0,4).forEach((c,i)=>{
                const games=teamFixtures(c.s.p.team,gw,1)[0]||[];
                const why=games.length?games.map(g=>`${g.home?'vs':'away to'} ${g.opp.short_name}`).join(' + ')+` · ${fmt1(c.x)} xP · ${c.own}% owned`:'no fixture';
                grid.appendChild(elNode('div',{class:`capcard ${i===0?'top':''}`},elNode('div',{class:'rank'},i+1),
