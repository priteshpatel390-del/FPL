name: Stage 9.3 closeout

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage9-3-player-detail-uncertainty-v2
          fetch-depth: 0
      - name: Record Stage 9.3 and remove temporary tooling
        run: |
          bash tools/stage9-3-run.sh
          bash tools/stage9-3-closeout.sh
