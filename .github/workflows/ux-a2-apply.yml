name: UX-A2 apply and verify

on:
  push:
    branches:
      - agent/ux-a2-player-detail-scroll-rotation

permissions:
  contents: write

jobs:
  apply-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out approved branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/ux-a2-player-detail-scroll-rotation

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Execute approved UX-A2 payload
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import subprocess
          from pathlib import Path

          source=Path('.github/ux-a2-payload.yml').read_text().splitlines()
          blocks=[]
          index=0
          while index < len(source):
              if source[index] == '        run: |':
                  index += 1
                  body=[]
                  while index < len(source):
                      line=source[index]
                      if line and not line.startswith('          '):
                          break
                      body.append(line[10:] if line.startswith('          ') else '')
                      index += 1
                  blocks.append('\n'.join(body).rstrip()+'\n')
                  continue
              index += 1

          if len(blocks) != 8:
              raise SystemExit(f'Expected eight verifier run blocks, found {len(blocks)}')

          for number, block in enumerate(blocks, start=1):
              if 'rm .github/workflows/ux-a2-apply.yml' in block:
                  block=block.replace(
                      'rm .github/workflows/ux-a2-apply.yml',
                      'rm .github/workflows/ux-a2-apply.yml\nrm .github/ux-a2-payload.yml'
                  )
                  block=block.replace(
                      'git add -u .github/workflows/ux-a2-apply.yml',
                      'git add -u .github/workflows/ux-a2-apply.yml .github/ux-a2-payload.yml'
                  )
              print(f'--- verifier block {number} ---', flush=True)
              subprocess.run(['bash','-euo','pipefail','-c',block],check=True,env=os.environ.copy())
              env_path=os.environ.get('GITHUB_ENV')
              if env_path and Path(env_path).exists():
                  for line in Path(env_path).read_text().splitlines():
                      if '=' in line and not line.startswith(' '):
                          key,value=line.split('=',1)
                          os.environ[key]=value
          PY
