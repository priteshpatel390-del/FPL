name: Guarded A3 persistence correction publisher

on:
  push:
    branches:
      - agent/a3-cache-persistence-resilience

permissions:
  contents: write

jobs:
  verify-and-publish:
    if: github.repository == 'priteshpatel390-del/FPL' && github.ref == 'refs/heads/agent/a3-cache-persistence-resilience' && github.event.head_commit.message != 'regenerate A3 persistence correction build'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_COMMIT: fede8749881681e5102c3eb79e176bab1fab0663
    steps:
      - name: Check out guarded candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard source identity and workflow-only wrapper
        run: |
          set -eu
          git cat-file -e "$SOURCE_COMMIT^{commit}"
          test "$(git diff --name-only "$SOURCE_COMMIT" HEAD)" = ".github/workflows/a3-persistence-correction-publish.yml"

      - name: Run complete test suite
        run: |
          set -eu
          ./run-tests.sh

      - name: Build exact source identity twice
        run: |
          set -eu
          BUILD_COMMIT="$SOURCE_COMMIT" node build.mjs
          rm -rf /tmp/a3-build-a
          mkdir -p /tmp/a3-build-a/dist
          cp dist/app.bundle.js /tmp/a3-build-a/dist/app.bundle.js
          cp dist/index.html /tmp/a3-build-a/dist/index.html
          cp dist/manifest.json /tmp/a3-build-a/dist/manifest.json
          cp index.html /tmp/a3-build-a/index.html
          BUILD_COMMIT="$SOURCE_COMMIT" node build.mjs
          cmp /tmp/a3-build-a/dist/app.bundle.js dist/app.bundle.js
          cmp /tmp/a3-build-a/dist/index.html dist/index.html
          cmp /tmp/a3-build-a/dist/manifest.json dist/manifest.json
          cmp /tmp/a3-build-a/index.html index.html
          cmp dist/index.html index.html
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const m=JSON.parse(readFileSync('dist/manifest.json','utf8')); if(m.commit!==process.env.SOURCE_COMMIT) throw new Error('manifest source mismatch');"

      - name: Commit generated outputs only
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/app.bundle.js dist/index.html dist/manifest.json index.html
          changed="$(git diff --cached --name-only)"
          expected="$(printf '%s\n' dist/app.bundle.js dist/index.html dist/manifest.json index.html)"
          test "$changed" = "$expected"
          git commit -m 'regenerate A3 persistence correction build'
          git push origin HEAD:agent/a3-cache-persistence-resilience
