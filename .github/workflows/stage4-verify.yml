name: Stage 4 verification
on:
  push:
    branches: [stage4-expected-minutes]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Full test suite
        id: tests
        continue-on-error: true
        shell: bash
        run: ./run-tests.sh > test.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage4-test-log
          path: test.log
      - name: Fail if tests failed
        if: steps.tests.outcome != 'success'
        run: exit 1
      - name: Deterministic build comparison
        shell: bash
        run: |
          export BUILD_COMMIT="$(git log -1 --format=%H -- src build.mjs app.html)"
          node build.mjs
          mkdir -p /tmp/build-one
          cp dist/index.html dist/app.bundle.js dist/manifest.json /tmp/build-one/
          node build.mjs
          cmp /tmp/build-one/index.html dist/index.html
          cmp /tmp/build-one/app.bundle.js dist/app.bundle.js
          cmp /tmp/build-one/manifest.json dist/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage4-dist
          path: dist/
      - name: Commit generated artefacts
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- dist; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist
          git commit -m "Build Stage 4 deployable"
          git push
