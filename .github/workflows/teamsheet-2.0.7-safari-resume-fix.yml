name: Teamsheet 2.0.7 Safari resume correction

on:
  push:
    branches:
      - agent/teamsheet-2.0.7-final-mobile-polish
    paths:
      - .github/workflows/teamsheet-2.0.7-safari-resume-fix.yml

permissions:
  contents: write

jobs:
  correct-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: agent/teamsheet-2.0.7-final-mobile-polish
          fetch-depth: 0

      - name: Configure repository identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply approved source correction
        run: |
          python3 scripts/apply-safari-resume-fix.py source
          git add src/main.mjs tests/startup-refresh.test.mjs
          git commit -m "Fix Safari foreground resume refresh"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run full tests and deterministic builds
        run: |
          export BUILD_COMMIT="$SOURCE_COMMIT"
          ./run-tests.sh | tee /tmp/teamsheet-tests.log
          PASS_COUNT=$(grep -E '^# pass ' /tmp/teamsheet-tests.log | tail -1 | awk '{print $3}')
          FAIL_COUNT=$(grep -E '^# fail ' /tmp/teamsheet-tests.log | tail -1 | awk '{print $3}')
          SKIP_COUNT=$(grep -E '^# skipped ' /tmp/teamsheet-tests.log | tail -1 | awk '{print $3}')
          test -n "$PASS_COUNT"
          test "${FAIL_COUNT:-0}" = "0"
          test "${SKIP_COUNT:-0}" = "0"
          echo "PASS_COUNT=$PASS_COUNT" >> "$GITHUB_ENV"

          cp dist/app.bundle.js /tmp/app.bundle.first.js
          cp dist/index.html /tmp/dist-index.first.html
          cp dist/manifest.json /tmp/manifest.first.json
          cp index.html /tmp/root-index.first.html

          BUILD_COMMIT="$SOURCE_COMMIT" node build.mjs
          cmp /tmp/app.bundle.first.js dist/app.bundle.js
          cmp /tmp/dist-index.first.html dist/index.html
          cmp /tmp/manifest.first.json dist/manifest.json
          cmp /tmp/root-index.first.html index.html
          cmp dist/index.html index.html
          grep -F "\"commit\": \"$SOURCE_COMMIT\"" dist/manifest.json

      - name: Commit generated files and acceptance records
        run: |
          python3 scripts/apply-safari-resume-fix.py docs
          git add \
            CLAUDE.md \
            docs/ARCHITECTURE.md \
            docs/CHANGELOG.md \
            docs/DECISIONS.md \
            docs/KNOWN_LIMITATIONS.md \
            docs/PROJECT_CONTEXT.md \
            docs/ROADMAP.md \
            docs/TEAMSHEET2-ITEM7.md \
            docs/TESTING.md \
            dist/app.bundle.js \
            dist/index.html \
            dist/manifest.json \
            index.html
          git commit -m "Build and document Safari resume correction"
          echo "GENERATED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Finalise identities and remove temporary machinery
        run: |
          python3 scripts/apply-safari-resume-fix.py final
          git rm \
            .github/workflows/teamsheet-2.0.7-safari-resume-fix.yml \
            scripts/apply-safari-resume-fix.py
          git add CLAUDE.md docs/PROJECT_CONTEXT.md docs/ROADMAP.md docs/TESTING.md docs/TEAMSHEET2-ITEM7.md
          git commit -m "Finalise Safari resume acceptance records"
          git push origin HEAD:agent/teamsheet-2.0.7-final-mobile-polish
