name: Transfers exact correction finalisation

on:
  push:
    branches:
      - agent/transfers-exact-performance

permissions:
  contents: write

jobs:
  finalise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: agent/transfers-exact-performance
          fetch-depth: 0

      - name: Update canonical documentation
        shell: bash
        run: |
          python .github/scripts/finalise_transfers_docs.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CLAUDE.md docs
          git commit -m 'Record Transfers physical-test correction'
          git push origin HEAD:agent/transfers-exact-performance
          echo "REVIEW_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run complete repository gate
        shell: bash
        run: |
          BUILD_COMMIT="$REVIEW_COMMIT" ./run-tests.sh 2>&1 | tee /tmp/final-gate.log
          TEST_COUNT=$(awk '/^# tests /{value=$3} END{print value}' /tmp/final-gate.log)
          test "$TEST_COUNT" = "597"

      - name: Verify deterministic production builds
        shell: bash
        run: |
          mkdir -p /tmp/build-one
          cp dist/index.html dist/app.bundle.js dist/manifest.json index.html /tmp/build-one/
          BUILD_COMMIT="$REVIEW_COMMIT" node build.mjs
          cmp /tmp/build-one/index.html dist/index.html
          cmp /tmp/build-one/app.bundle.js dist/app.bundle.js
          cmp /tmp/build-one/manifest.json dist/manifest.json
          cmp /tmp/build-one/index.html index.html
          cmp dist/index.html index.html

      - name: Commit verified generated artefacts and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/transfers-exact-correction.yml .github/scripts/finalise_transfers_docs.py
          git add dist/index.html dist/app.bundle.js dist/manifest.json index.html .github/workflows/transfers-exact-correction.yml .github/scripts/finalise_transfers_docs.py
          git commit -m 'Build verified Transfers exact correction'
          git push origin HEAD:agent/transfers-exact-performance
