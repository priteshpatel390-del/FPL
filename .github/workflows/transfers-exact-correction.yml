name: Transfers exact correction verification

on:
  push:
    branches:
      - agent/transfers-exact-performance

permissions:
  contents: write

jobs:
  verify-source-correction:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: agent/transfers-exact-performance
          fetch-depth: 0

      - name: Align tie-heavy regression with its exactness purpose
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/transfer-exact-scale.test.mjs')
          text=path.read_text()
          old="""  assert.deepEqual(transferResultSummary(prepared),transferResultSummary(oracle));
  assert.ok(prepared.profile.identityBoundPruned>0);
});"""
          new="""  assert.deepEqual(transferResultSummary(prepared),transferResultSummary(oracle));
  assert.ok(prepared.profile.boundPruned>0);
});"""
          if text.count(old)!=1:
              raise SystemExit(f'expected one tie-heavy assertion block, found {text.count(old)}')
          path.write_text(text.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/transfer-exact-scale.test.mjs
          git commit -m 'Refine exact tie-bound regression'
          git push origin HEAD:agent/transfers-exact-performance
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run focused exactness and scale tests
        shell: bash
        run: node --test tests/transfer-exact-performance.test.mjs tests/transfer-exact-scale.test.mjs

      - name: Run official-scale synthetic benchmark
        shell: bash
        run: |
          node --input-type=module <<'NODE' | tee /tmp/benchmark.txt
          import { performance } from 'node:perf_hooks';
          import { optimiseTransfers } from './src/model/transfers.mjs';
          import { buildTransferScaleCase } from './tests/fixtures/transfer-scale-fixture.mjs';
          const args=buildTransferScaleCase({counts:{1:70,2:220,3:250,4:110},tieHeavy:true});
          const started=performance.now();
          const result=optimiseTransfers(args);
          const elapsed=performance.now()-started;
          if(result.status!=='ok') throw new Error(`scale benchmark failed: ${result.status} at ${result.evaluations}`);
          console.log(`650-candidate six-GW search completed in ${elapsed.toFixed(1)} ms with ${result.evaluations.toLocaleString('en-GB')} exact leaf evaluations, ${result.profile.identityBoundPruned.toLocaleString('en-GB')} identity-bound prunes and ${result.profile.materialisedPlans.toLocaleString('en-GB')} materialised contenders`);
          NODE

      - name: Run complete repository gate
        shell: bash
        run: |
          BUILD_COMMIT="$SOURCE_COMMIT" ./run-tests.sh 2>&1 | tee /tmp/full-source.log
          TEST_COUNT=$(awk '/^# tests /{value=$3} END{print value}' /tmp/full-source.log)
          test -n "$TEST_COUNT"
          echo "Verified $TEST_COUNT tests at $SOURCE_COMMIT"
          tail -n 1 /tmp/benchmark.txt
