name: Transfers exact correction verification

on:
  push:
    branches:
      - agent/transfers-exact-performance

permissions:
  contents: write

jobs:
  verify-and-finalise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: agent/transfers-exact-performance
          fetch-depth: 0

      - name: Decode corrective patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/track_a_patch.py
          python -m py_compile /tmp/track_a_patch.py

      - name: Apply exact-search correction and regression coverage
        shell: bash
        run: |
          python /tmp/track_a_patch.py source
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/model/transfers.mjs tests/fixtures/transfer-scale-fixture.mjs tests/transfer-exact-scale.test.mjs
          git commit -m 'Strengthen exact transfer branch bounds'
          git push origin HEAD:agent/transfers-exact-performance
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run focused exactness and scale tests
        shell: bash
        run: node --test tests/transfer-exact-performance.test.mjs tests/transfer-exact-scale.test.mjs

      - name: Run official-scale synthetic benchmark
        shell: bash
        run: |
          node --input-type=module <<'NODE' | tee /tmp/benchmark.txt
          import { performance } from 'node:perf_hooks';
          import { optimiseTransfers } from './src/model/transfers.mjs';
          import { buildTransferScaleCase } from './tests/fixtures/transfer-scale-fixture.mjs';
          const args=buildTransferScaleCase({counts:{1:70,2:220,3:250,4:110},tieHeavy:true});
          const started=performance.now();
          const result=optimiseTransfers(args);
          const elapsed=performance.now()-started;
          if(result.status!=='ok') throw new Error(`scale benchmark failed: ${result.status} at ${result.evaluations}`);
          const line=`650-candidate six-GW search completed in ${elapsed.toFixed(1)} ms with ${result.evaluations.toLocaleString('en-GB')} exact leaf evaluations, ${result.profile.identityBoundPruned.toLocaleString('en-GB')} identity-bound prunes and ${result.profile.materialisedPlans.toLocaleString('en-GB')} materialised contenders`;
          console.log(line);
          NODE

      - name: Run complete repository gate before documentation
        shell: bash
        run: |
          BUILD_COMMIT="$SOURCE_COMMIT" ./run-tests.sh 2>&1 | tee /tmp/full-source.log
          TEST_COUNT=$(awk '/^# tests /{value=$3} END{print value}' /tmp/full-source.log)
          test -n "$TEST_COUNT"
          echo "TEST_COUNT=$TEST_COUNT" >> "$GITHUB_ENV"

      - name: Record failed physical gate and corrective evidence
        shell: bash
        run: |
          BENCHMARK=$(tail -n 1 /tmp/benchmark.txt)
          python /tmp/track_a_patch.py docs "$TEST_COUNT" "$BENCHMARK"
          git add CLAUDE.md docs
          git commit -m 'Record Transfers physical-test correction'
          git push origin HEAD:agent/transfers-exact-performance
          echo "REVIEW_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run final complete repository gate
        shell: bash
        run: BUILD_COMMIT="$REVIEW_COMMIT" ./run-tests.sh

      - name: Verify deterministic production builds
        shell: bash
        run: |
          mkdir -p /tmp/build-one
          cp dist/index.html dist/app.bundle.js dist/manifest.json index.html /tmp/build-one/
          BUILD_COMMIT="$REVIEW_COMMIT" node build.mjs
          cmp /tmp/build-one/index.html dist/index.html
          cmp /tmp/build-one/app.bundle.js dist/app.bundle.js
          cmp /tmp/build-one/manifest.json dist/manifest.json
          cmp /tmp/build-one/index.html index.html
          cmp dist/index.html index.html

      - name: Commit verified generated artefacts and remove workflow
        shell: bash
        run: |
          rm .github/workflows/transfers-exact-correction.yml
          git add dist/index.html dist/app.bundle.js dist/manifest.json index.html .github/workflows/transfers-exact-correction.yml
          git commit -m 'Build verified Transfers exact correction'
          git push origin HEAD:agent/transfers-exact-performance
