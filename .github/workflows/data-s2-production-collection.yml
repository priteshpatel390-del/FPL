# DATA-S2 — dedicated, manual-only normal Official FPL production collection via direct D1 REST.
#
# This workflow can do exactly one thing: perform one normal collection cycle for the single
# deterministic collection identity this dispatch fixes. It accepts no identity, timestamp,
# season, database, endpoint, SQL or statement input; the endpoints, season, database id, schema
# and every resource ceiling are repository constants. It never applies a migration, never resumes
# an unresolved run, never repairs state, never retries a mutation and never changes a schedule,
# Cron trigger, Worker version, deployment, route, domain, Access policy or secret. Every
# repository and CI gate completes in a job that has no protected environment and no Cloudflare
# credentials, before the credentialled job can start.
#
# Recurring collection stays disabled: there is deliberately no `schedule:` trigger here, and the
# dormant repository constant FUTURE_PRODUCTION_COLLECTION_SCHEDULE is not wired to anything.
name: DATA-S2 Production Collection via D1 REST

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact current main commit approved for one DATA-S2 production collection only
        required: true
        type: string

permissions:
  contents: read
  checks: read

# Shares the production collection group so a collection can never run beside a resume, a
# reconciliation read, a migration or a live acceptance read.
concurrency:
  group: data-s2-production-collection
  cancel-in-progress: false

jobs:
  repository-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      approved_sha: ${{ steps.identity.outputs.approved_sha }}
    steps:
      - name: Validate approved SHA before checkout
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = workflow_dispatch
          test "$EVENT_REF" = refs/heads/main
          test "$EVENT_REPOSITORY" = priteshpatel390-del/FPL
          printf '%s' "$APPROVED_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - name: Check out exact approved revision
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Gate exact current main and clean tree
        id: identity
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          remote_main="$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)"
          test -n "$remote_main"
          test "$remote_main" = "$APPROVED_SHA"
          test -z "$(git status --porcelain)"
          echo "approved_sha=$APPROVED_SHA" >> "$GITHUB_OUTPUT"

      - name: Require exact-head Verify Teamsheet success
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/check-runs.json"
          http="$(curl --silent --output "$response" --write-out '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/priteshpatel390-del/FPL/commits/$APPROVED_SHA/check-runs")"
          test "$http" = 200
          node --input-type=module - "$response" <<'EOF'
          import fs from 'node:fs';
          const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const matches=(body.check_runs??[]).filter(row=>row.name==='Tests and deterministic build'&&row.status==='completed'&&row.conclusion==='success'&&row.head_sha===process.env.APPROVED_SHA&&row.app?.slug==='github-actions'&&row.details_url?.startsWith('https://github.com/priteshpatel390-del/FPL/actions/runs/'));
          if(matches.length<1)throw new Error('exact-head Verify Teamsheet success is absent');
          EOF
          rm -f "$response"
          test -z "$(git status --porcelain)"

  collect:
    needs: repository-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: data-s2-production-collection
    env:
      APPROVED_SHA: ${{ needs.repository-gate.outputs.approved_sha }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
      DATA_S2_SEASON: '2026-27'
    steps:
      # GitHub echoes each step's resolved environment in that step's log header, and only
      # `secrets.*` values are masked automatically. The account fingerprint is a `vars.*` value,
      # so its mask is registered here — derived from the already-masked account credential —
      # before any step materialises the variable itself. The production database id is a
      # reviewed repository constant and is not carried in the environment at all.
      - name: Register production identifier masks before any other step
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          printf '::add-mask::%s\n' "$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | sha256sum | cut -d' ' -f1)"

      - name: Check out gated approved revision
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.repository-gate.outputs.approved_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.19.0

      # The repository gate proved remote main before this job existed, but protected-environment
      # admission can wait indefinitely and main may advance in that window. This step therefore
      # resolves remote main again, from the remote and not from any value carried out of the gate
      # job, in the same shell and immediately before the production entry point. No Cloudflare
      # request is made before it.
      #
      # This one attempt's collection identity is also fixed here, once, from the runner clock and
      # never from a workflow input, so no earlier or later mutable stage can establish production
      # identity. It is derived before the remote-main recheck so that recheck stays the last thing
      # to happen before the runner, and it reaches only the local clock.
      - name: Reconfirm identity and remote main, then collect Official FPL to D1 REST
        env:
          CLOUDFLARE_PRODUCTION_ACCOUNT_FINGERPRINT: ${{ vars.CLOUDFLARE_PRODUCTION_ACCOUNT_FINGERPRINT }}
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test -z "$(git status --porcelain)"
          rm -f node_modules/.bin/wrangler
          rm -rf node_modules/wrangler node_modules/.wrangler-*
          COLLECTION_SCHEDULED_AT="$(date -u +%Y-%m-%dT%H:%M:00.000Z)"
          export COLLECTION_SCHEDULED_AT
          test -n "$COLLECTION_SCHEDULED_AT"
          remote_main="$(git ls-remote https://github.com/priteshpatel390-del/FPL.git refs/heads/main | cut -f1)"
          test -n "$remote_main"
          test "$remote_main" = "$APPROVED_SHA"
          node workers/data-platform/run-production-collection.mjs
