name: DATA-S2 Production Collection via D1 REST

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-s2-production-collection
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: data-s2-production-collection
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
      DATA_S2_SEASON: '2026-27'
    steps:
      # GitHub echoes each step's resolved environment in that step's log header, and only
      # `secrets.*` values are masked automatically. The account fingerprint is a `vars.*` value,
      # so its mask is registered here — derived from the already-masked account credential —
      # before any step materialises the variable itself. The production database id is a
      # reviewed repository constant and is not carried in the environment at all.
      - name: Register production identifier masks before any other step
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          printf '::add-mask::%s\n' "$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | sha256sum | cut -d' ' -f1)"

      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
      - name: Fix this one attempt's collection identity
        run: echo "COLLECTION_SCHEDULED_AT=$(date -u +%Y-%m-%dT%H:%M:00.000Z)" >> "$GITHUB_ENV"
      - name: Collect Official FPL directly to D1 REST
        env:
          CLOUDFLARE_PRODUCTION_ACCOUNT_FINGERPRINT: ${{ vars.CLOUDFLARE_PRODUCTION_ACCOUNT_FINGERPRINT }}
        run: node workers/data-platform/run-production-collection.mjs
